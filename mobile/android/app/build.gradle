apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// D-08 — 업로드 키스토어 경로·비밀번호는 저장소 밖 android.env 에서 env 로만 읽는다(native:release:android 래퍼가 source)
// D-07 — weekly-wine 의 평문 비밀번호 기본값 결함을 따르지 않는다: 비밀번호에는 어떤 기본값·리터럴도 두지 않는다
def ghtradeUploadStoreFile = System.getenv("GHTRADE_UPLOAD_STORE_FILE")

android {
    namespace = "com.ghtrade.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ghtrade.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // D-09 · D-09a — fastlane 이 -PghtradeVersionCode 로 넘긴다 · 로컬 디버그는 1 · 이 파일에 번호를 쓰지 않는다
        versionCode((project.findProperty("ghtradeVersionCode") ?: "1") as Integer)
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // D-08 — Play 앱 서명 + 업로드 키. env 가 있을 때만 채운다(디버그 빌드는 env 없이 그대로)
    signingConfigs {
        release {
            if (ghtradeUploadStoreFile) {
                storeFile file(ghtradeUploadStoreFile)
                storePassword System.getenv("GHTRADE_UPLOAD_STORE_PASSWORD")
                keyAlias System.getenv("GHTRADE_UPLOAD_KEY_ALIAS")
                keyPassword System.getenv("GHTRADE_UPLOAD_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (ghtradeUploadStoreFile) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // capacitor.build.gradle 의 compileOptions(Java 21) 와 같은 값
    kotlinOptions {
        jvmTarget = '21'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:$androidxSwipeRefreshLayoutVersion"
    // Custom Tabs(D-28 · 21-17 Task 1 선택 a) — capgo social-login 이 이미 APK 에 싣는 1.9.0 과 같은 좌표
    implementation "androidx.browser:browser:$androidxBrowserVersion"
    // WR-03 — capacitor-android 가 이미 싣는 1.14.0 과 같은 변수(WebMessageListener · 21-25 답 a · 런타임 의존 집합 불변)
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// D-08 — 서명 없는 릴리스 AAB/APK 가 만들어지는 경로를 막는다. native:build:android(assembleDebug)는 영향 없음
gradle.taskGraph.whenReady { graph ->
    if (!ghtradeUploadStoreFile && graph.allTasks.any { it.name in ["bundleRelease", "assembleRelease"] }) {
        throw new GradleException("GHTRADE_UPLOAD_STORE_FILE 없음 — 릴리스 APK·AAB 는 native:release:android(:aab·:play) 로만 만든다 (D-08 · D-14)")
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
