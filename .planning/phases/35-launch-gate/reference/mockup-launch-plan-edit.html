<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #0c0c0f; color: #ddd; font-family: -apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif; }
#nav { position: sticky; top: 0; z-index: 50; background: #0c0c0f; border-bottom: 1px solid #26262c; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 13px; }
#nav .g { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
#nav .l { color: #777; font-size: 12px; margin-right: 4px; }
#nav button { font: inherit; background: #1b1b20; color: #bbb; border: 1px solid #2a2a31; border-radius: 7px; padding: 5px 10px; cursor: pointer; }
#nav button.on { background: #f2f2f2; color: #111; border-color: #f2f2f2; font-weight: 700; }
#desc { flex-basis: 100%; color: #9a9aa2; font-size: 12.5px; line-height: 1.6; }
#desc b { color: #eee; }
#stage { display: flex; justify-content: center; padding: 20px 12px 60px; overflow-x: auto; }

/* ── globals.css 토큰 (라이트 / 다크) ── */
.f {

  --border: #f2f4f6; --border-subtle: #e5e8eb; --card: #ffffff; --band: #f7f8fa; --primary: #3182f6;
  --up: #f04452; --down: #3182f6; --up-bg: #ffeeee; --down-bg: #e8f3ff;
  --ok: #1f8a5b; --ok-bg: #cfeedd; --bad: #c8402f; --bad-bg: #f6d6d1; --gate: #b7791f; --gate-bg: #f8e7c2; --other: #8a93a2; --grid: #eceff4;
  --font: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif;
  position: relative; flex: none; background: var(--bg); color: var(--fg-2); font-family: var(--font);
  -webkit-font-smoothing: antialiased; word-break: keep-all; font-variant-numeric: tabular-nums;
  box-shadow: 0 0 0 1px #2a2a30, 0 30px 80px rgba(0,0,0,.5); display: flex; border-radius: 12px; overflow: hidden;
}
.f.dark {

  --border: rgba(255,255,255,.06); --border-subtle: #3d3d3d; --card: #151515; --band: #101013; --primary: #3485fa;
  --up: #f04251; --down: #3485fa; --up-bg: rgba(240,66,81,.16); --down-bg: rgba(52,133,250,.16);
  --ok: #3fbf86; --ok-bg: #173a2b; --bad: #ec6a57; --bad-bg: #41221e; --gate: #e9b44a; --gate-bg: #3b3020; --other: #7d8695; --grid: #262a31;
}
.f.phone { width: 390px; min-height: 844px; border-radius: 30px; }
.f.desktop { width: 1280px; min-height: 900px; }
.side { display: none; }
.f.desktop .side { display: flex; flex-direction: column; gap: 2px; width: 232px; flex: none; padding: 18px 12px; background: var(--band); }
.side .brand { font-weight: 700; font-size: 17px; padding: 4px 10px 16px; color: var(--fg); }
.side a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; color: var(--muted-fg); font-size: 15px; font-weight: 500; text-decoration: none; }
.side a.grp.on { color: var(--fg); font-weight: 600; }
.side a.sub { padding: 7px 10px 7px 38px; font-size: 14px; color: var(--fg-2); }
.side a.sub.cur { background: var(--muted); color: var(--fg); font-weight: 600; }
.side a.sub.new::after { content: '추가'; font-size: 10px; font-weight: 700; color: var(--gate); background: var(--gate-bg); border-radius: 5px; padding: 1px 5px; margin-left: auto; }
.col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.main { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.f.desktop .main { padding: 24px 32px; max-width: 1120px; width: 100%; margin: 0 auto; }
.phead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.phead h1 { margin: 0; font-size: 22px; font-weight: 700; color: var(--fg); }
.phead .sub { font-size: 12.5px; color: var(--muted-fg); flex-basis: 100%; }
.f.desktop .phead .sub { flex-basis: auto; }
.tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--border-subtle); font-size: 15px; font-weight: 600; }
.tabs span { padding: 8px 2px 10px; color: var(--muted-fg); }
.tabs span.on { color: var(--fg); box-shadow: inset 0 -2px 0 var(--fg); }
.ctl { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ctl .sp { flex: 1; }
.seg { display: inline-flex; background: var(--muted); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { font: inherit; border: 0; background: none; color: var(--muted-fg); font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 8px; cursor: pointer; }
.seg button.on { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.f.dark .seg button.on { background: #3a3a3a; }
.chips { display: inline-flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; height: 26px; padding: 0 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--muted); color: var(--fg-2); }
.chip.on { background: var(--fg); color: var(--bg); }
.range { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--fg); }
.range .d { background: var(--muted); border-radius: 8px; padding: 5px 10px; display: inline-flex; gap: 6px; align-items: center; }
.range .d small { color: var(--muted-fg); font-weight: 500; }
.rangetxt { font-size: 12.5px; color: var(--muted-fg); }
.src { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted-fg); background: var(--muted); border-radius: 6px; padding: 2px 7px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted-fg); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.sw.ok { background: var(--ok); } .sw.bad { background: var(--bad); } .sw.oth { background: transparent; border: 2px solid var(--other); width: 8px; height: 8px; }
.sw.gate { border-radius: 2px; background: var(--gate-bg); border: 1px solid var(--gate); width: 16px; }
.sw.next { border-radius: 0; width: 2px; height: 14px; background: var(--primary); }
.sw.sell { border-radius: 0; width: 9px; height: 9px; background: var(--down); transform: rotate(45deg); }

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.f.phone .kpis { grid-template-columns: repeat(2, 1fr); }
.kpi { background: var(--card); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.f:not(.dark) .kpi { background: var(--muted); }
.kpi .k { font-size: 12px; color: var(--muted-fg); font-weight: 600; }
.kpi .row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted-fg); }
.kpi .row b { font-weight: 600; } .kpi .ok { color: var(--ok); } .kpi .bad { color: var(--bad); } .kpi .acc { color: var(--primary); }

.panels { display: flex; flex-direction: column; gap: 14px; }
.panel { background: var(--card); border-radius: 16px; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.f:not(.dark) .panel { box-shadow: inset 0 0 0 1px var(--border-subtle); }
.ph { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; }
.ph h2 { margin: 0; font-size: 15px; font-weight: 700; color: var(--fg); }
.ph .tag { font-size: 12px; color: var(--muted-fg); }
.chartbox { overflow-x: auto; }
svg { display: block; height: auto; }
.f.phone svg { width: 640px; }
.f.desktop svg { width: 100%; }
svg text { fill: var(--muted-fg); font-family: var(--font); font-size: 11px; font-variant-numeric: tabular-nums; }
svg .lbl { fill: var(--fg); font-size: 11.5px; font-weight: 600; }
details summary { cursor: pointer; color: var(--primary); font-size: 12.5px; font-weight: 600; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; white-space: nowrap; margin-top: 6px; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--border-subtle); text-align: left; }
th { font-size: 11.5px; font-weight: 600; color: var(--muted-fg); }
td.n { text-align: right; }
.pill { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }

.tbl { overflow-x: auto; }
.foot { font-size: 12px; color: var(--muted-fg); padding: 2px 4px; line-height: 1.6; }
.empty { background: var(--card); border-radius: 16px; padding: 28px; text-align: center; color: var(--muted-fg); font-size: 13.5px; }

.tabs span.new::after, .side a.sub.new2::after { content: '추가'; font-size: 10px; font-weight: 700; color: var(--gate); background: var(--gate-bg); border-radius: 5px; padding: 1px 5px; margin-left: 6px; }
.side a.sub.new2::after { margin-left: auto; }

.f.phone .egrid { grid-template-columns: 1fr; }

.lnk { color: var(--primary); font-size: 12.5px; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
.erow { display: flex; align-items: center; gap: 12px; font-size: 13px; flex-wrap: wrap; }
.el { color: var(--muted-fg); font-size: 12.5px; font-weight: 600; min-width: 52px; }

.step b { min-width: 28px; text-align: center; color: var(--fg); font-size: 14px; }
.plist { display: flex; flex-wrap: wrap; gap: 8px; }
.pi { display: inline-flex; align-items: center; gap: 6px; background: var(--muted); border-radius: 10px; padding: 0 10px; height: 36px; }
.pi span { font-size: 11.5px; color: var(--muted-fg); font-weight: 700; }
.pi input { font: inherit; width: 60px; border: 0; background: none; color: var(--fg); font-size: 14px; font-weight: 600; text-align: right; outline: none; font-variant-numeric: tabular-nums; }
.pi small { font-size: 11.5px; color: var(--muted-fg); }
.eact { display: flex; justify-content: flex-end; gap: 8px; }
.btn { font: inherit; border: 0; border-radius: 9px; padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
.btn.pri { background: var(--primary); color: #fff; }
.btn.sec { background: var(--muted); color: var(--fg-2); }
.btn.sm { padding: 4px 10px; font-size: 12px; }

.pstrip { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted-fg); }

.pstrip .sp { flex: 1; }
.sech { margin: 8px 0 0; font-size: 16px; font-weight: 700; color: var(--fg); }
.phead .lnk { margin-left: auto; }

function group(b,m){

    if(d.lo!==null&&d.hi!==null){ const a=Math.min(x(d.lo),x(d.hi)), w=Math.max(Math.abs(x(d.hi)-x(d.lo)),2); el("rect",{x:a,y:cy-9,width:w,height:18,rx:3,fill:css("--gate-bg"),stroke:css("--gate"),"stroke-width":1},svg); }
    else if(d.lo!==null){ el("rect",{x:x(d.lo),y:cy-9,width:Math.max(W-R-x(d.lo),0),height:18,rx:3,fill:css("--bad-bg"),opacity:.7},svg); const t=el("text",{x:W-R-4,y:cy+4,"text-anchor":"end"},svg); t.textContent="경계는 이보다 뒤 →"; t.setAttribute("fill",css("--bad")); }
    else if(d.hi!==null){ el("rect",{x:L,y:cy-9,width:Math.max(x(d.hi)-L,0),height:18,rx:3,fill:css("--ok-bg"),opacity:.7},svg); }
    const seen={};
    d.ps.forEach(q=>{
      const k=q.rel; seen[k]=(seen[k]||0)+1; const n=seen[k]-1; const dy=n===0?0:(n%2?-1:1)*Math.ceil(n/2)*4; const cx=x(q.rel)+(n?((n%2)?1.5:-1.5):0);
      const fill = q.res==="접수"?css("--ok"):(q.res==="101"||q.res==="515")?css("--bad"):"none";
      const stroke = q.res==="접수"||q.res==="101"||q.res==="515"?css("--card"):css("--other");
      let node;
      if(q.side==="매도"){ node=el("rect",{x:cx-4.4,y:cy+dy-4.4,width:8.8,height:8.8,fill,stroke,"stroke-width":fill==="none"?1.6:1,transform:`rotate(45 ${cx} ${cy+dy})`},svg); }
      else node=el("circle",{cx,cy:cy+dy,r:fill==="none"?3.8:4.6,fill,stroke,"stroke-width":fill==="none"?1.6:1},svg);
      const tt=el("title",{},node); tt.textContent=`${d.d} ${q.rel}µs · wire ${q.wire} · ${q.side} · ${q.res}`;
    });
  });
  if(ribbon){
    const ry=T+days.length*RH+gapR, n=days.length;
    const lab2=el("text",{x:L-10,y:ry+ribbonH/2+4,"text-anchor":"end",class:"lbl"},svg); lab2.textContent="쐈다면";
    const head=el("text",{x:L,y:ry-8},svg); head.textContent="이 시각에 첫 조각을 쐈다면 — 확실히 접수(초록) · 모름(회색) · 확실히 거부(빨강), 날 수 비율";
    const stepR = span>100?1:0.2;
    for(let v=xmin; v<xmax; v+=stepR){
      let ok=0,bad=0; for(const d of days){ if(d.hi!==null&&v>=d.hi) ok++; else if(d.lo!==null&&v<=d.lo) bad++; }
      const unk=n-ok-bad, x0=x(v), w=x(v+stepR)-x(v)+0.4, hOk=ribbonH*ok/n, hBad=ribbonH*bad/n, hUnk=ribbonH-hOk-hBad;
      el("rect",{x:x0,y:ry,width:w,height:hOk,fill:css("--ok")},svg); el("rect",{x:x0,y:ry+hOk,width:w,height:hUnk,fill:css("--grid")},svg); el("rect",{x:x0,y:ry+hOk+hUnk,width:w,height:hBad,fill:css("--bad")},svg);
    }
    el("rect",{x:L,y:ry,width:W-L-R,height:ribbonH,fill:"none",stroke:css("--border-subtle")},svg);
    linesFor(b,m).forEach(nx=>el("line",{x1:x(nx),x2:x(nx),y1:ry-2,y2:ry+ribbonH+2,stroke:css("--primary"),"stroke-width":1.5,"stroke-dasharray":"4 3"},svg));
    for(let v=xmin; v<=xmax; v+=step){ const t=el("text",{x:x(v),y:ry+ribbonH+16,"text-anchor":"middle"},svg); t.textContent=v; }
  } else {
    for(let v=xmin; v<=xmax; v+=step){ const t=el("text",{x:x(v),y:T+days.length*RH+16,"text-anchor":"middle"},svg); t.textContent=v; }
  }
  const det=document.createElement("details"); det.innerHTML=`<summary>날짜별 표 보기</summary>`;
  const tw=document.createElement("div"); tw.className="tbl";
  const rows=days.map(d=>{ const pill=d.kind==="경계"?'<span class="pill gate">경계</span>':d.kind==="전부 접수"?'<span class="pill ok">전부 접수</span>':d.kind==="전부 거부"?'<span class="pill bad">전부 거부</span>':'<span class="pill oth">판단 불가</span>';
    const gate=d.lo!==null&&d.hi!==null?`${d.lo} ~ ${d.hi}`:d.lo!==null?`${d.lo} 보다 뒤`:d.hi!==null?`${d.hi} 보다 앞`:"—";
    return `<tr><td>${d.d.replace("-","/")}</td><td class="n">${d.first}</td><td>${pill}</td><td class="n">${d.hi??"—"}</td><td class="n">${gate}</td><td class="n">${d.ps.length}</td></tr>`; }).join("");
  tw.innerHTML=`<table><thead><tr><th>날짜</th><th class="n">첫 조각 µs</th><th>결과</th><th class="n">처음 접수 µs</th><th class="n">경계 µs</th><th class="n">조각</th></tr></thead><tbody>${rows}</tbody></table>`;
  det.appendChild(tw); p.appendChild(det);
  return p;
}



// ── 발사 계획(목업 값 · 16:00 은 인박스 예시 KB120 코스닥 −350/−345/−325 를 축으로 합성 · 09:00:30 은 인박스 초깃값) ──
const PLAN = {
  q16: {"KB|코스닥":[-350,-345,-325],"KB|코스피":[-290,-280],"교보|코스닥":[-530,-520,-500],"교보|코스피":[-405,-395]},
  n:   {"KB|코스닥":-245,"KB|코스피":-245,"교보|코스닥":-200,"교보|코스피":-200},
};
const SRV = {KB:'KB120', 교보:'KYOBO119'};
function linesFor(b,m){ const k=b+'|'+m; return state.p==='q16' ? PLAN.q16[k] : [NEXT_N[k]]; }
function planText(b,m){ const k=b+'|'+m; if(state.p!=='q16') return `${PLAN.n[k]}µs`; const xs=PLAN.q16[k]; return `${xs.length}조각 ${xs.join(' · ')}µs`; }

const CHIP_OK='background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)';
const CHIP_ERR='background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)';
function chip(txt,st){ return `<span style="display:inline-block;border-radius:5px;padding:2px 6px;font-size:11px;font-weight:600;${st}">${txt}</span>`; }
function pin(i,v,bad){ return `<label class="pi"${bad?' style="box-shadow:inset 0 0 0 1.5px var(--bad)"':''}>${i!==null?`<span>${i}</span>`:''}<input value="${v}" inputmode="numeric"><small>µs</small></label>`; }
function editor(b,m,{compact=true, fire=state.p}={}){
  const k=b+'|'+m, isQ=fire==='q16', e=state.e, st=state.s;
  const xs=PLAN.q16[k].slice();
  const err = st==='err';
  let body='', errLine='';
  if(!isQ){
    body=`<div class="erow"><span class="el">발사 시각</span>${pin(null,PLAN.n[k],false)}<span style="font-size:12px;color:var(--muted-fg)">코스피 · 코스닥 각각 한 값 — 이 시장 주문 전부가 이 시각에 붙어서 나가요</span></div>`;
  } else if(e==='A' || e==='C'){
    const vals = err ? [xs[0], xs[0]-10, xs[2]] : xs;
    body=`<div class="erow"><span class="el">조각 수</span><span class="step"><button>−</button><b>${vals.length}</b><button>+</button></span><span style="font-size:12px;color:var(--muted-fg)">1 ~ 10</span></div><div class="erow"><span class="el">조각 시각</span><div class="plist">${vals.map((v,i)=>pin(i+1,v,err&&i===1)).join('')}</div></div>`;
    if(e==='C') body+=`<div class="erow"><span class="el">고르게 채우기</span><span style="font-size:12.5px;color:var(--muted-fg)">첫</span>${pin(null,xs[0],false)}<span style="font-size:12.5px;color:var(--muted-fg)">간격</span>${pin(null,'+10',false)}<button class="btn sec sm">채우기</button></div>`;
    if(err) errLine=`조각 시각은 앞 조각과 같거나 늦어야 해요 — 2번 ${xs[0]-10}µs 가 1번 ${xs[0]}µs 보다 이릅니다.`;
  } else {
    const gaps = err ? [0,-10,25] : xs.map(v=>v-xs[0]);
    const vals = gaps.map(g=>xs[0]+g);
    body=`<div class="erow"><span class="el">첫 조각</span>${pin(null,xs[0],false)}</div><div class="erow"><span class="el">간격</span><div class="plist">${gaps.map((g,i)=>pin(i+1,i===0?'0':(g>0?'+'+g:g),err&&i===1)).join('')}</div><span class="step"><button>−</button><b>${gaps.length}</b><button>+</button></span></div><div class="erow"><span class="el">결과</span><b style="color:var(--primary);font-size:13px">${vals.join(' · ')}µs</b></div>`;
    if(err) errLine='간격은 앞 조각보다 같거나 커야 해요 — 2번 간격이 −10µs 입니다.';
  }
  let res='';
  if(st==='saved') res=`${chip(SRV[b],CHIP_OK)}<span style="font-size:12.5px;color:var(--muted-fg)">저장됨 · 22:41 · 다음 ${isQ?'16:00':'09:00:30'} 발사부터</span>`;
  if(st==='fail') res=`${chip(SRV[b]+' · 실패',CHIP_ERR)}<span role="alert" style="font-size:12.5px;color:var(--bad)">${SRV[b]} 실패: 서버 미지원 · 알 수 없는 명령입니다 — 서버 업데이트 뒤 다시 저장</span>`;
  const errHtml = errLine?`<div role="alert" style="font-size:12.5px;color:var(--bad)">${errLine}</div>`:'';
  return `<div class="ecard">${body}${errHtml}<div class="eact" style="align-items:center">${res}<span style="flex:1"></span><button class="btn sec">되돌리기</button><button class="btn pri"${err?' disabled style="opacity:.45"':''}>저장</button></div></div>`;
}
function anote(fire){ return `<div class="anote">저장하면 서버 재기동 없이 다음 발사부터 적용돼요. 발사 1초 전(${fire==='q16'?'15:59:59':'09:00:29'}) 이후에 저장하면 그다음 발사부터 적용돼요.</div>`; }
function seg(isQ){ return `<div class="seg"><button class="${isQ?'on':''}">16:00 예약</button><button class="${isQ?'':'on'}">09:00:30 개장차익</button></div>`; }

function render(){
  const isQ = state.p==='q16';
  fEl = document.createElement('div'); fEl.className = `f ${state.w} ${state.t}`;
  const side = `<nav class="side"><div class="brand">gh-radar</div><a class="grp">📈 트레이딩</a><a class="grp">📊 분석</a><a class="grp on">🛡 Admin</a><a class="sub">사용자</a><a class="sub">서버</a><a class="sub cur">발사</a><a class="grp">👤 My page</a></nav>`;
  const legend = `<div class="legend"><span><i class="sw ok"></i>접수</span><span><i class="sw bad"></i>${isQ?'101 거부(너무 이름)':'101·515 거부'}</span><span><i class="sw oth"></i>기타 거부</span>${isQ?'':'<span><i class="sw sell"></i>A 매도(마름모) · 동그라미 = N 매수</span>'}<span><i class="sw gate"></i>그날 경계</span><span><i class="sw next"></i>다음 발사 계획(서버 현재 값)</span></div>`;
  const main = `<div class="phead"><h1>발사</h1><span class="sub">${isQ?'16:00:00 기준 송신 시각(µs) — 왼쪽일수록 이름':'09:00:30 NXT 기준 송신 시각(µs)'}</span></div><div class="tabs"><span>주문 내역</span><span class="on">경계 지도</span></div>
      <div class="ctl"><div class="chips"><span class="chip on">${isQ?'최근 10일':'최근 1일'}</span><span class="chip">20일</span><span class="chip">전체</span></div><span class="rangetxt">${isQ?'10/12 ~ 10/26 · 11거래일':'10/26 · 1거래일'}</span><span class="sp"></span>${seg(isQ)}</div>
      ${legend}${anote(state.p)}<div class="panels" id="pn"></div>`;
  fEl.innerHTML = `${side}<div class="col"><div class="main">${main}</div></div>`;
  const st=document.getElementById('stage'); st.innerHTML=''; st.appendChild(fEl);
  const pn=fEl.querySelector('#pn');
  ORDER.slice(0,2).forEach(([b,m],i)=>{
    const p=drawPanel(b,m,group(b,m)); const open=i===0;
    p.querySelector('.ph').insertAdjacentHTML('afterend', `<div class="pstrip"><span>다음 발사 계획</span><b>${planText(b,m)}</b><span class="sp"></span><button class="btn sec sm">${open?'닫기':'계획 고치기'}</button></div>${open?editor(b,m):''}`);
    pn.appendChild(p);
  });
  const D = {
    A: '<b>A 조각마다 직접 입력</b> — 조각 수 −/+ 로 칸을 늘리고 줄인 뒤 칸마다 µs. 인박스 예시(−350 · −345 · −325)를 그대로 적는 방식.',
    B: '<b>B 첫 시각 + 간격</b> — 첫 조각 µs 하나 + 조각마다 「첫 조각에서 얼마 뒤」. 지금 로그의 「조각 간격 0/+10/+20」 읽기와 같다. 결과 줄에 실제 시각이 보인다.',
    C: '<b>C 직접 입력 + 고르게 채우기</b> — A 에 「첫 · 간격 → 채우기」 도우미 한 줄. 채운 뒤 칸마다 손으로 고칠 수 있다.',
  };
  document.getElementById('desc').innerHTML = D[state.e] + ' 저장 단위 = 이 패널(서버 × 시장 × 발사) 1칸. 「상태」 버튼으로 순서 오류 · 저장됨 · 서버 거부(구 서버 code 1) 모습을 본다. 09:00:30 은 세 변형 모두 시각 한 칸.';
}
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>{ const k=Object.keys(b.dataset)[0]; state[k]=b.dataset[k]; b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); render(); }));
render();
</script>
