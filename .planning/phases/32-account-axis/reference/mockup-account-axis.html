  <div class="g"><span class="l">화면</span>

  <div class="g" id="ag"><span class="l">계좌</span><button data-acct="0" class="on">1234 KB</button><button data-acct="1">8765 교보</button><button data-acct="2">5555 KB (빈 계좌)</button></div>
  <div class="g"><span class="l">폭</span><button data-w="phone" class="on">폰 390</button><button data-w="desktop">데스크톱 1080</button></div>
  <div class="g"><span class="l">테마</span><button data-t="dark" class="on">다크</button><button data-t="light">라이트</button></div>
  <div class="g"><span class="l">상태</span><button data-r="ok" class="on">정상</button><button data-r="down">주문 끊김</button></div>
  <div id="desc"></div>
</div>
<div id="stage"></div>
<script>
const ACCTS = [
  { no: '1234-5678', nm: '김알렉스', sk: 'KB120', strategies: [ { n: '삼성전자', led: [1,1,0] }, { n: '에코프로비엠 · NXT', led: [1,0,1] } ], vi: 'KRX',
    unf: [['삼성전자','매수','71,200','300'],['에코프로비엠','매도','182,000','50']],
    hold: [['삼성전자','1,000','70,800','+400,000','+0.6%'],['에코프로비엠','200','180,500','+300,000','+0.8%'],['한미반도체','100','98,000','-210,000','-2.1%']],
    orders: [['09:02:11','삼성전자','b','1,000'],['09:05:40','삼성전자','s','1,000'],['10:21:03','에코프로비엠','b','200'],['13:40:55','에코프로비엠','s','200']] },
  { no: '8765-4321', nm: '교보 종합', sk: 'KYOBO119', strategies: [ { n: '한화오션', led: [1,0,0] } ], vi: null,
    unf: [], hold: [['한화오션','3,000','41,500','+1,500,000','+1.2%']], orders: [['09:31:02','한화오션','b','3,000']] },
  { no: '5555-0001', nm: '김알렉스 2', sk: 'KB120', strategies: [], vi: null, unf: [], hold: [], orders: [] },
];
const SERVERS = { KB120: { got: true }, KYOBO119: { got: false } };
const SEL = 0;

  } else if (S.tab === 'accounts') {
    const unf = a.unf.length ? a.unf.map(r => `<div class="urow"><div class="c1"><div class="n1">${r[0]} <span class="sd ${r[1]==='매수'?'b':'s'}" style="font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:4px;background:${r[1]==='매수'?'var(--upbg)':'var(--dnbg)'};color:${r[1]==='매수'?'var(--up)':'var(--down)'}">${r[1]}</span></div><div class="sub">주문가 ${r[2]}</div></div><div class="c2">미체결 ${r[3]}주</div><button class="btn ghost sm">취소</button></div>`).join('') : `<div class="empty">미체결 없음</div>`;
    const hold = a.hold.length ? a.hold.map(r => `<div class="urow"><div class="c1"><div class="n1">${r[0]}</div><div class="sub">${r[1]}주 · 평단 ${r[2]}</div></div><div class="c2 ${r[3][0]==='+'?'pl':'mi'}">${r[3]}<div class="sub ${r[3][0]==='+'?'pl':'mi'}">${r[4]}</div></div></div>`).join('') : `<div class="empty">보유 종목 없음</div>`;
    body = `<div class="mcard"><div class="tt">미체결 <span class="sp"></span><span class="chip ${a.unf.length?'ok':'mute'}">${a.unf.length}건</span></div><div style="margin-top:6px">${unf}</div></div>
      <div class="mcard"><div class="tt">잔고 <span class="sp"></span><span class="chip ${a.hold.length?'ok':'mute'}">${a.hold.length}종목</span></div><div style="margin-top:6px">${hold}</div></div>`;
  } else if (S.tab === 'orders') {
    const otherN = others.reduce((n,x) => n + x.orders.length, 0);
    const rows = a.orders.length ? a.orders.map(r => `<div class="orow"><span class="tm">${r[0]}</span><span class="n1">${r[1]}</span><span class="sd ${r[2]}">${r[2]==='b'?'매수':'매도'}</span><span class="q">${r[3]}주</span></div>`).join('')
      : `<div class="empty" style="padding:16px"><div style="font-size:13px;color:var(--fg);font-weight:600">이 계좌의 오늘 주문이 없어요</div>${otherN ? `<div style="margin-top:4px">다른 계좌에 오늘 주문 ${otherN}건이 있어요 · 위에서 계좌를 바꿔 보세요</div>` : ''}</div>`;
    body = `<div class="mcard"><div class="tt">오늘 주문 <span class="sp"></span><span class="chip ${a.orders.length?'ok':'mute'}">${a.orders.length}건</span></div><div style="margin-top:6px">${rows}</div></div>`;
  } else {
    const got = SERVERS[a.sk].got;
    const same = ACCTS.filter((x,i) => i!==sel && x.sk===a.sk);
    const rows = (dim) => `<div class="col2 ${dim?'dim':''}">
      <div><div class="gh">매수 금액</div><div class="vrow">선매수 금액<span class="v">500<u>만</u></span></div><div class="vrow">줄매수 금액<span class="v">300<u>만</u></span></div>
        <div class="gh">선매수</div><div class="vrow">매도잔량<span class="v">0<u>만</u></span></div><div class="vrow">줄매수도 같이 켜기<span class="sw on"></span></div>
        <div class="gh">후매수</div><div class="vrow">후매수 최소<span class="v">100<u>만</u></span></div></div>
      <div><div class="gh">매도</div><div class="vrow">매도 방법<span class="v">잔량추적</span></div><div class="vrow">매도 비율<span class="v">50<u>%</u></span></div>
        <div class="gh">자동매도</div><div class="vrow">매도 주기<span class="v">3<u>초</u></span></div><div class="vrow">동시호가 비율<span class="v">30<u>%</u></span></div></div></div>`;
    const cap = got
      ? `이 계좌의 서버 <b style="color:var(--fg)">${a.sk}</b> 에 저장돼요.${same.length ? ` 같은 서버의 ${same.map(x=>x.no).join(' · ')} 계좌도 이 설정을 함께 써요.` : ''}`
      : `${a.sk} 서버 설정(84)을 아직 받지 못했어요 · 그 서버 세션이 준비되면 불러와요`;
    body = `<div class="mcard"><div class="tt">상따 기본설정 <span class="sk" style="height:20px;font-size:11px">${a.sk}</span><span class="sp"></span><span class="chip ${got?'ok':'warn'}">${got?'서버값':'아직 못 받음'}</span></div>
      <div class="cap">${cap}</div>${rows(!got)}</div>
      <div class="mcard"><div class="tt">이 기기</div><div class="cap">이 브라우저(기기)에만 저장돼요. 계좌와 무관해요.</div><div class="vrow">돌파 알림음<span class="sw on"></span></div></div>`;
  }
  return `<div class="main"><div class="scroll"><div class="pad" style="padding-bottom:0"><div class="h1">My page</div></div>
    <div style="height:12px"></div>${head}${tabBar}<div style="padding-top:12px">${body}</div></div></div>`;
}

function render() {
  const vs = VARIANTS[S.screen];
  if (!vs.includes(S.variant)) S.variant = vs[0];
  document.querySelectorAll('#vg button').forEach(b => { b.style.display = vs.includes(b.dataset.variant) ? '' : 'none'; });
  const desktop = S.w === 'desktop';
  let inner;
  if (S.screen === 'top') inner = (desktop ? sidebar('trading') : '') + topBar();
  else if (S.screen === 'side') inner = desktop ? sidebar('trading') + `<div class="main"><div class="pad"><div class="h1">트레이딩</div><div class="bar" style="margin-top:8px">${acctPill(false)} ${quoteOrder()}</div></div></div>` : `<div class="main" style="flex-direction:row"><div style="width:280px;display:flex">${sidebar('trading')}</div><div style="flex:1;background:var(--scrim)"></div></div>`;
  else if (S.screen === 'status') inner = (desktop ? sidebar('me') : '') + meStatus();
  else if (S.screen === 'orders') inner = (desktop ? sidebar('me') : '') + meOrders();
  else if (S.screen === 'settings') inner = (desktop ? sidebar('me') : '') + meSettings();
  else inner = (desktop ? sidebar('me') : '') + meAxis();
  document.getElementById('tg').style.display = S.screen === 'me' ? '' : 'none';
  document.getElementById('ag').style.display = S.screen === 'me' ? '' : 'none';
  document.getElementById('stage').innerHTML = `<div class="f ${S.w} ${S.t}">${inner}</div>`;
  document.getElementById('desc').innerHTML = DESC[S.screen][S.variant] || '';
  document.querySelectorAll('#nav button').forEach(b => { const k = Object.keys(b.dataset)[0]; b.classList.toggle('on', String(S[k]) === b.dataset[k]); });
}
document.getElementById('nav').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const k = Object.keys(b.dataset)[0]; S[k] = b.dataset[k]; render();
});
document.getElementById('stage').addEventListener('click', (e) => {
  const b = e.target.closest('[data-acct]'); if (!b) return;
  S.acct = b.dataset.acct; render();
});
render();
</script>
</body>
</html>
