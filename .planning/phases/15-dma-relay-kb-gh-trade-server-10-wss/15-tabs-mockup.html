<!doctype html>
<html lang="ko" class="">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Phase 15 — 종목상세 상단 탭 목업 (모바일 기준)</title>
<style>
/* gh-radar globals.css 토큰 인라인 — Phase 3 lock, 신규 토큰 없음 */
:root {
  --bg:#FFFFFF; --fg:oklch(0.18 0 0);
  --muted:oklch(0.96 0 0); --muted-fg:oklch(0.50 0 0);
  --border:oklch(0.92 0 0); --border-subtle:oklch(0.18 0 0 / 0.06);
  --input:oklch(0.92 0 0); --ring:oklch(0.63 0.18 250);
  --card:#FFFFFF; --card-fg:oklch(0.18 0 0);
  --popover:#FFFFFF; --popover-fg:oklch(0.18 0 0);
  --primary:oklch(0.63 0.18 250); --primary-fg:#FFFFFF;
  --secondary:oklch(0.96 0 0); --secondary-fg:oklch(0.18 0 0);
  --accent:oklch(0.95 0.03 250); --accent-fg:oklch(0.35 0.12 250);
  --destructive:oklch(0.66 0.20 22); --destructive-fg:#FFFFFF;
  --up:oklch(0.66 0.20 22); --down:oklch(0.63 0.18 250); --flat:oklch(0.55 0 0);
  --up-bg:oklch(0.97 0.03 22); --down-bg:oklch(0.97 0.03 250);
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px;
  --r-sm:4px; --r:6px; --r-md:8px; --r-lg:12px;
  --t-caption:12px; --t-sm:14px; --t-base:16px; --t-lg:18px;
  --t-h4:18px; --t-h3:20px; --t-h2:24px; --t-h1:30px;
  --lh-tight:1.2; --lh-normal:1.5;
  --row-h:36px; --cell-pad-x:12px; --cell-pad-y:8px;
  --font-sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',system-ui,sans-serif;
  --font-mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
.dark {
  --bg:oklch(0.08 0 0); --fg:oklch(0.96 0 0);
  --muted:oklch(0.18 0 0); --muted-fg:oklch(0.65 0 0);
  --border:oklch(0.24 0 0); --border-subtle:oklch(1 0 0 / 0.06);
  --input:oklch(0.24 0 0); --ring:oklch(0.72 0.16 250);
  --card:oklch(0.12 0 0); --card-fg:oklch(0.96 0 0);
  --popover:oklch(0.14 0 0); --popover-fg:oklch(0.96 0 0);
  --primary:oklch(0.72 0.16 250); --primary-fg:oklch(0.10 0 0);
  --secondary:oklch(0.18 0 0); --secondary-fg:oklch(0.96 0 0);
  --accent:oklch(0.22 0.05 250); --accent-fg:oklch(0.85 0.10 250);
  --destructive:oklch(0.72 0.19 22); --destructive-fg:oklch(0.10 0 0);
  --up:oklch(0.72 0.19 22); --down:oklch(0.72 0.16 250); --flat:oklch(0.65 0 0);
  --up-bg:oklch(0.22 0.06 22); --down-bg:oklch(0.22 0.05 250);
}
[data-density="compact"] { --row-h:32px; --cell-pad-y:6px; }

* { box-sizing:border-box; }
body { margin:0; font-family:var(--font-sans); background:var(--bg); color:var(--fg);
  font-size:var(--t-base); line-height:var(--lh-normal); font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased; }
html[lang="ko"] { word-break:keep-all; overflow-wrap:break-word; letter-spacing:-0.01em; }
.mono { font-family:var(--font-mono); font-variant-numeric:tabular-nums slashed-zero; letter-spacing:-0.01em; }
.num { text-align:right; font-variant-numeric:tabular-nums; }
.sr { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.hidden{display:none !important}
*:focus-visible { outline:2px solid var(--ring); outline-offset:3px; }

/* 툴바 */
.toolbar { position:sticky; top:0; z-index:300; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  padding:10px 20px; background:color-mix(in oklch,var(--bg) 92%,transparent);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--border); }
.toolbar h1 { font-size:var(--t-sm); font-weight:600; margin:0; margin-right:auto; }
.grp { display:flex; align-items:center; gap:6px; padding:3px 8px; border:1px solid var(--border); border-radius:var(--r); }
.grp > .lb { font-size:11px; font-weight:600; color:var(--muted-fg); }
.tbtn { height:26px; padding:0 9px; border-radius:var(--r-sm); border:1px solid var(--border);
  background:var(--secondary); color:var(--secondary-fg); font-size:11px; font-weight:600;
  cursor:pointer; font-family:inherit; }
.tbtn[aria-pressed="true"] { background:var(--accent); color:var(--accent-fg); border-color:transparent; }

.stage { padding:20px; }
.info { border:1px solid var(--border); border-left:3px solid var(--fg); border-radius:var(--r-md);
  background:var(--muted); padding:12px 14px; margin:0 0 20px; max-width:1000px; font-size:var(--t-sm); }
.info div + div { margin-top:6px; }
.info b { font-weight:600; }

/* 프레임 */
.frames { display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap; }
.frame-wrap .cap { font-size:var(--t-caption); font-weight:600; color:var(--muted-fg); margin-bottom:8px; }
.frame { border:1px solid var(--border); border-radius:var(--r-lg); overflow:hidden; background:var(--bg); }
.urlbar { display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--muted);
  border-bottom:1px solid var(--border); font-size:11px; color:var(--muted-fg); }
.urlbar .dots { display:flex; gap:4px; }
.urlbar .dots i { width:8px; height:8px; border-radius:9999px; background:var(--border); display:block; }
.urlbar .url { flex:1; background:var(--card); border:1px solid var(--border); border-radius:9999px;
  padding:3px 10px; font-family:var(--font-mono); color:var(--fg); overflow:hidden; white-space:nowrap; }
.scroll { overflow-y:auto; overflow-x:hidden; position:relative; }
.frame.mobile .scroll { width:390px; height:760px; }
.frame.desktop .scroll { width:1280px; height:760px; }

/* 히어로 */
.hero { padding:16px; }
.frame.desktop .hero { max-width:896px; margin:0 auto; padding:24px; }
.hero .nm-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.hero h1 { font-size:var(--t-h2); font-weight:600; margin:0; letter-spacing:-0.01em; }
.hero .code { font-size:var(--t-sm); color:var(--muted-fg); }
.hero .badge-o { font-size:11px; font-weight:600; padding:1px 6px; border-radius:var(--r-sm);
  border:1px solid var(--border); color:var(--muted-fg); }
.hero .px-row { display:flex; align-items:baseline; gap:10px; margin-top:12px; flex-wrap:wrap; }
.hero .px { font-size:var(--t-h1); font-weight:600; }
.hero .chg { font-size:var(--t-sm); font-weight:600; }
.hero .ts { font-size:11px; color:var(--muted-fg); margin-left:auto; }

/* 탭바 (sticky) */
.tabbar-wrap { position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--border); }
.tabbar { display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; }
.tabbar::-webkit-scrollbar { display:none; }
.frame.desktop .tabbar { max-width:896px; margin:0 auto; padding:0 24px; }
.frame.mobile .tabbar { padding:0 8px; }
.tabbar button { height:46px; padding:0 14px; border:none; background:transparent; color:var(--muted-fg);
  font-size:var(--t-sm); font-weight:600; cursor:pointer; font-family:inherit; white-space:nowrap;
  border-bottom:2px solid transparent; }
.tabbar button[aria-selected="true"] { color:var(--fg); border-bottom-color:var(--fg); }

/* 패널 */
.panel { padding:16px; display:flex; flex-direction:column; gap:24px; }
.frame.desktop .panel { max-width:896px; margin:0 auto; padding:24px; gap:32px; }
.frame.desktop .panel.wide { max-width:none; margin:0; padding:24px; }
.panel.wide { gap:0; }

/* 섹션 플레이스홀더 */
.card { border:1px solid var(--border); border-radius:var(--r-lg); background:var(--card); }
.sec-h { font-size:var(--t-h4); font-weight:600; margin:0 0 12px; }
.chart-tool { display:flex; align-items:center; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
.chart-tool .chip { height:26px; padding:0 12px; border-radius:var(--r-sm); background:var(--muted);
  color:var(--muted-fg); font-size:var(--t-caption); display:inline-flex; align-items:center; }
.chart-tool .chip.on { background:var(--accent); color:var(--accent-fg); font-weight:600; }
.candles { display:flex; align-items:flex-end; gap:2px; padding:8px 0; }
.frame.mobile .candles { height:240px; }
.frame.desktop .candles { height:340px; }
.candles i { flex:1; border-radius:1px; display:block; }
.gauge { height:14px; border-radius:7px; background:linear-gradient(90deg,var(--down-bg),var(--muted),var(--up-bg)); position:relative; margin:20px 0; }
.gauge b { position:absolute; top:50%; left:64%; width:18px; height:18px; border-radius:9999px;
  border:3px solid var(--fg); background:var(--card); transform:translate(-50%,-50%); }
.g3 { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; border-top:1px solid var(--border-subtle); padding-top:14px; margin-top:20px; }
.g3 .k { font-size:11px; color:var(--muted-fg); font-weight:600; }
.g3 .v { font-size:var(--t-sm); font-weight:600; }
.statcards { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:16px; }
.frame.desktop .statcards { grid-template-columns:repeat(3,1fr); gap:20px; }
.statcards .card { padding:14px; }
.statcards .k { font-size:11px; color:var(--muted-fg); font-weight:600; }
.statcards .v { font-size:var(--t-lg); font-weight:600; margin-top:4px; }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip-t { height:30px; padding:0 12px; border-radius:9999px; border:1px solid var(--border);
  background:var(--card); font-size:var(--t-caption); display:inline-flex; align-items:center; gap:6px; }
.chip-t i { width:6px; height:6px; border-radius:9999px; background:var(--flat); display:block; }
.histo { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; height:96px; align-items:end; }
.histo i { border-radius:2px 2px 0 0; display:block; background:color-mix(in oklch,var(--up) 55%,transparent); }
.histo-lbl { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; border-top:1px solid var(--border-subtle);
  padding-top:7px; font-size:11px; color:var(--muted-fg); text-align:center; }
.evrow { height:38px; display:flex; align-items:center; gap:10px; border-top:1px solid var(--border-subtle); font-size:var(--t-caption); }
.evrow:first-child { border-top:none; }
.evrow .d { color:var(--muted-fg); font-family:var(--font-mono); }
.evrow .sp { margin-left:auto; font-family:var(--font-mono); font-weight:600; }
.cm-row { display:flex; align-items:center; gap:10px; padding:12px; border:1px solid var(--border);
  border-radius:var(--r-md); font-size:var(--t-caption); }
.cm-row + .cm-row { margin-top:8px; }
.cm-row .sp { margin-left:auto; font-family:var(--font-mono); font-weight:600; }
.news-it { padding:14px 0; border-top:1px solid var(--border-subtle); }
.news-it:first-child { border-top:none; padding-top:0; }
.news-it .t { font-size:var(--t-sm); font-weight:500; }
.news-it .m { font-size:11px; color:var(--muted-fg); margin-top:4px; }
.btn-o { height:36px; padding:0 14px; border-radius:var(--r); border:1px solid var(--border);
  background:transparent; color:var(--fg); font-size:var(--t-sm); font-weight:500; font-family:inherit; cursor:pointer; }

/* ── 호가창 (채택안 L1=B / L2=A / L3=A) ── */
.ob-root { border:1px solid var(--border); border-radius:var(--r-lg); background:var(--card); overflow:hidden; }
.ob-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 14px; border-bottom:1px solid var(--border); }
.ob-head .src { font-size:11px; color:var(--muted-fg); padding:1px 6px; border-radius:var(--r-sm); background:var(--muted); }
.ob-head .spacer { margin-left:auto; }
.statusbar { border-bottom:1px solid var(--border); background:var(--muted); }
.statusbar .row1 { display:flex; align-items:center; gap:10px; padding:8px 14px; flex-wrap:wrap; }
.statusbar .msg { font-size:var(--t-sm); }
.statusbar .msg .sub { color:var(--muted-fg); font-size:var(--t-caption); display:block; }
.badge { display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 10px; border-radius:9999px;
  font-size:var(--t-caption); font-weight:600; white-space:nowrap; border:1px solid var(--border);
  background:var(--muted); color:var(--fg); }
.badge .dot { width:7px; height:7px; border-radius:9999px; background:currentColor; flex:none; }
.alerts { border-top:1px solid var(--border-subtle); padding:6px 14px 10px; display:flex; flex-direction:column; gap:4px; }
.alert-row { display:flex; align-items:baseline; gap:8px; font-size:var(--t-caption); }
.alert-row .tm { color:var(--muted-fg); font-family:var(--font-mono); flex:none; }
.alert-row .lv { font-weight:600; flex:none; padding:0 5px; border-radius:var(--r-sm); background:var(--card); border:1px solid var(--border); }

.ob-body { display:grid; gap:1px; background:var(--border); }
.ob-body > * { background:var(--card); min-width:0; }
.ob-body.two-axis { grid-template-areas:"book tape order" "book tape acct"; }
.pane-book{grid-area:book} .pane-tape{grid-area:tape} .pane-order{grid-area:order} .pane-acct{grid-area:acct}
.pane-hd { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--border-subtle);
  font-size:var(--t-caption); font-weight:600; color:var(--muted-fg); }
.pane-hd .spacer { margin-left:auto; }
.ex-toggle { display:inline-flex; border:1px solid var(--border); border-radius:var(--r-sm); overflow:hidden; }
.ex-toggle button { height:24px; padding:0 10px; border:none; background:transparent; color:var(--muted-fg);
  font-size:11px; font-weight:600; cursor:pointer; font-family:inherit; }
.ex-toggle button[aria-pressed="true"] { background:var(--accent); color:var(--accent-fg); }

.ladder { width:100%; border-collapse:collapse; table-layout:fixed; }
.ladder thead th { font-size:11px; font-weight:600; color:var(--muted-fg); text-align:center;
  padding:6px 8px; background:var(--muted); border-bottom:1px solid var(--border); }
.ladder th, .ladder td { height:var(--row-h); padding:0 8px; vertical-align:middle; font-size:var(--t-caption); }
.ladder tbody tr + tr > * { border-top:1px solid var(--border-subtle); }
.ladder .px { text-align:center; font-family:var(--font-mono); font-size:var(--t-sm); font-weight:600;
  font-variant-numeric:tabular-nums slashed-zero; position:relative; cursor:pointer; }
.ladder .q { position:relative; overflow:hidden; }
.ladder .q .v { position:relative; z-index:1; display:block; font-family:var(--font-mono); font-variant-numeric:tabular-nums slashed-zero; }
.ladder .q.qa .v { text-align:left; } .ladder .q.qb .v { text-align:right; }
.ladder .q .bar { position:absolute; top:4px; bottom:4px; z-index:0; border-radius:2px; }
.ladder .q.qa .bar { right:0; background:color-mix(in oklch,var(--down) 16%,transparent); }
.ladder .q.qb .bar { left:0; background:color-mix(in oklch,var(--up) 16%,transparent); }
tr.ask > * { background:color-mix(in oklch,var(--down-bg) 65%,transparent); }
tr.bid > * { background:color-mix(in oklch,var(--up-bg) 65%,transparent); }
tr.now .px { box-shadow:inset 3px 0 0 var(--fg); }
.px .step { font-size:11px; font-weight:600; color:var(--muted-fg); position:absolute; left:4px; top:50%; transform:translateY(-50%); }
.nowchip { font-size:11px; font-weight:600; color:var(--muted-fg); margin-left:4px; vertical-align:1px; }
tr.spread > td { text-align:center; font-size:11px; color:var(--muted-fg); background:var(--card);
  border-top:1px solid var(--border) !important; border-bottom:1px solid var(--border); height:26px; }
.ladder tfoot td { background:var(--muted); font-size:11px; font-weight:600; border-top:1px solid var(--border); height:28px; }
.ladder tfoot .q { text-align:center; font-family:var(--font-mono); }
.ladder tfoot .px { font-size:11px; color:var(--muted-fg); font-weight:600; }
.ladder-more { width:100%; height:34px; border:none; border-top:1px solid var(--border-subtle);
  background:var(--muted); color:var(--muted-fg); font-size:11px; font-weight:600; cursor:pointer; font-family:inherit; }

.tape-scroll { overflow-y:auto; }
.frame.desktop .tape-scroll { max-height:658px; }
.tape { width:100%; border-collapse:collapse; table-layout:fixed; }
.tape thead th { font-size:11px; font-weight:600; color:var(--muted-fg); background:var(--muted);
  padding:6px 8px; border-bottom:1px solid var(--border); text-align:right; }
.tape thead th:first-child { text-align:left; }
.tape td { height:var(--row-h); padding:0 8px; font-size:11px; font-family:var(--font-mono);
  font-variant-numeric:tabular-nums slashed-zero; }
.tape tbody tr + tr > td { border-top:1px solid var(--border-subtle); }
.tape .tm { color:var(--muted-fg); }
.tape .pz,.tape .qz { text-align:right; }
.tape .sd { text-align:right; font-weight:600; font-family:var(--font-sans); font-size:11px; }
.tape .sd.buy{color:var(--up)} .tape .sd.sell{color:var(--down)}

.order { padding:12px; display:flex; flex-direction:column; gap:10px; }
.side-tabs { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.side-tabs button { height:38px; border-radius:var(--r); border:1px solid var(--border); background:var(--card);
  color:var(--muted-fg); font-size:var(--t-sm); font-weight:600; cursor:pointer; font-family:inherit; }
.side-tabs button[aria-selected="true"][data-side="B"] { background:var(--up-bg); color:var(--up); border-color:var(--up); }
.side-tabs button[aria-selected="true"][data-side="S"] { background:var(--down-bg); color:var(--down); border-color:var(--down); }
.frm-row { display:flex; align-items:center; gap:8px; }
.frm-row > label { width:56px; flex:none; font-size:var(--t-caption); color:var(--muted-fg); font-weight:600; }
.ipt { flex:1; height:38px; border-radius:var(--r); border:1px solid var(--input); background:var(--bg);
  color:var(--fg); padding:0 10px; font-size:var(--t-sm); font-family:var(--font-mono); text-align:right; min-width:0; }
select.ipt { text-align:left; font-family:var(--font-sans); }
.fixed-chip { display:inline-flex; align-items:center; height:26px; padding:0 8px; border-radius:var(--r-sm);
  background:var(--muted); color:var(--muted-fg); font-size:11px; font-weight:600; }
.amt { display:flex; justify-content:space-between; align-items:baseline; padding:8px 10px; border-radius:var(--r); background:var(--muted); }
.amt .k { font-size:var(--t-caption); color:var(--muted-fg); font-weight:600; }
.amt .v { font-size:var(--t-base); font-weight:600; font-family:var(--font-mono); }
.submit { height:44px; border-radius:var(--r); border:none; font-size:var(--t-base); font-weight:600;
  cursor:pointer; color:var(--primary-fg); font-family:inherit; background:var(--up); }
.order .hint { font-size:11px; color:var(--muted-fg); text-align:center; }

.acct-sel-row { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--border-subtle); }
.acct-sel-row select { flex:1; height:34px; border-radius:var(--r); border:1px solid var(--input);
  background:var(--bg); color:var(--fg); font-size:var(--t-caption); font-family:inherit; padding:0 8px; }
.acct-tabs { display:flex; gap:4px; padding:8px 12px 0; }
.acct-tabs button { height:28px; padding:0 10px; border-radius:var(--r-sm) var(--r-sm) 0 0; border:1px solid transparent;
  background:transparent; color:var(--muted-fg); font-size:var(--t-caption); font-weight:600; cursor:pointer; font-family:inherit; }
.acct-tabs button[aria-selected="true"] { background:var(--muted); color:var(--fg); }
.tbl { width:100%; border-collapse:collapse; }
.tbl thead th { background:var(--muted); color:var(--muted-fg); font-size:11px; font-weight:600; text-align:left;
  padding:6px 12px; border-bottom:1px solid var(--border); white-space:nowrap; }
.tbl thead th.num, .tbl td.num { text-align:right; }
.tbl tbody td { height:36px; padding:0 12px; font-size:var(--t-caption); white-space:nowrap; }
.tbl tbody tr + tr > td { border-top:1px solid var(--border-subtle); }
.side-tag { font-weight:600; font-size:11px; }
.side-tag.buy{color:var(--up)} .side-tag.sell{color:var(--down)}
.btn-cancel { height:26px; padding:0 10px; border-radius:var(--r-sm); border:1px solid var(--destructive);
  background:transparent; color:var(--destructive); font-size:11px; font-weight:600; cursor:pointer; font-family:inherit; }

      + '<td class="q qb"></td></tr>';

function heroHTML(){
  return '<section class="hero" aria-label="종목 개요">'
    + '<div class="nm-row"><span style="font-size:var(--t-h2);color:var(--muted-fg)">←</span>'
    + '<h1>삼성전자</h1><span class="code mono">005930</span>'
    + '<span class="badge-o">KOSPI</span><span class="badge-o">☆ 관심</span></div>'
    + '<div class="px-row"><span class="px mono up">73,900</span>'
    + '<span class="chg mono up">+300</span><span class="chg mono up">+0.41%</span>'
    + '<span class="ts mono">갱신 13:42:08 KST</span></div></section>';
}

function render(frame, isMobile){
  const tabs = tabsOf();
  if (!tabs.some(t => t.slug === TAB)) TAB = tabs[0].slug;
  const cur = tabs.find(t => t.slug === TAB);

  $('[data-url]', frame).textContent = 'gh-radar.vercel.app/stocks/005930?tab=' + TAB;

  const tabbar = '<div class="tabbar-wrap"><div class="tabbar" role="tablist" aria-label="종목 정보 탭">'
    + tabs.map(t => '<button role="tab" data-tab="'+t.slug+'" aria-selected="'+(t.slug===TAB)+'">'+t.label+'</button>').join('')
    + '</div></div>';

  let panel;
  if (cur.orderbook) {
    panel = '<div class="panel wide">' + (isMobile ? orderbookMobile() : orderbookDesktop()) + '</div>';
  } else {
    panel = '<div class="panel">' + cur.secs.map(k => SEC[k]()).join('') + '</div>';
  }

  $('[data-body]', frame).innerHTML = heroHTML() + tabbar + panel;
}

function renderAll(){
  render($('#fMobile'), true);
  render($('#fDesktop'), false);
}

/* ── 결선 ─────────────────────────────────────────────────── */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if (t) { TAB = t.dataset.tab; renderAll(); return; }        // 두 프레임 연동
  const m = e.target.closest('.ladder-more');
  if (m) {
    const tbl = m.previousElementSibling;
    const on = m.getAttribute('aria-expanded') !== 'true';
    $$('.lv-far', tbl).forEach(r => r.classList.toggle('hidden', !on));
    m.setAttribute('aria-expanded', String(on));
    m.textContent = on ? '5단만 보기' : '10단 전체 보기';
    return;
  }
  const s = e.target.closest('.side-tabs button');
  if (s) {
    const wrap = s.closest('.side-tabs');
    $$('button', wrap).forEach(b => b.setAttribute('aria-selected', String(b === s)));
    const btn = $('.submit', s.closest('.order'));
    const buy = s.dataset.side === 'B';
    btn.textContent = buy ? '매수 주문' : '매도 주문';
    btn.style.background = buy ? 'var(--up)' : 'var(--down)';
    return;
  }
  const ex = e.target.closest('.ex-toggle button');
  if (ex) { $$('button', ex.parentElement).forEach(b => b.setAttribute('aria-pressed', String(b === ex))); return; }
  const at = e.target.closest('.acct-tabs button');
  if (at) { $$('button', at.parentElement).forEach(b => b.setAttribute('aria-selected', String(b === at))); return; }
});

$('#themeBtn').onclick = e => {
  const d = document.documentElement.classList.toggle('dark');
  e.currentTarget.textContent = d ? '☀️ 라이트' : '🌙 다크';
  e.currentTarget.setAttribute('aria-pressed', String(d));
};

renderAll();
</script>
</body>
</html>
