<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>틱뷰어 봉 차트 — 제목 줄 조작(접힘 · 이동평균 더하기 · 봉 단위 메뉴)</title>
<style>
  :root {
    --bg: #ffffff; --fg: #191f28; --fg-2: #333d4b; --muted: #f2f4f6; --muted-fg: #6b7684; --faint: #b0b8c1;
    --border-subtle: #e5e8eb; --border: #e5e8eb; --card: #ffffff; --popover: #ffffff; --raised-2: #e5e8eb;
    --primary: #3182f6; --primary-fg: #ffffff; --destructive: #f04452;
    --up: #f04452; --down: #3182f6; --team: #a234c7; --vi: #d97706; --mine: #0f9d8a; --mine-fg: #0b7d6e;
    --seg-on-bg: #ffffff; --seg-on-fg: #191f28; --seg-on-shadow: 0 1px 3px rgba(0,0,0,.1);
    --accum-shade: rgba(107,118,132,.10); --vi-bg: rgba(217,119,6,.16); --page: #f2f4f6;
    --ma-1: #1f9d45; --ma-2: #8b5a2b; --ma-3: #c2367f; --ma-4: #6b7a00; --ma-5: #4f46e5; --ma-6: #0e7490;
    --scrim: rgba(0,0,0,.4); --pop-shadow: 0 6px 24px rgba(0,0,0,.14), 0 0 0 1px rgba(0,0,0,.04);
  }
  :root[data-theme="dark"] {
    --bg: #0a0a0a; --fg: #ffffff; --fg-2: #e4e4e4; --muted: #2d2d2d; --muted-fg: #9e9e9e; --faint: #636363;
    --border-subtle: #3d3d3d; --border: #3d3d3d; --card: #151515; --popover: #2d2d2d; --raised-2: #3d3d3d;
    --primary: #3485fa; --destructive: #f04251;
    --up: #f04251; --down: #3485fa; --team: #c353e5; --vi: #ffb020; --mine: #2fd3bb; --mine-fg: #2fd3bb;
    --seg-on-bg: #4e4e4e; --seg-on-fg: #ffffff; --seg-on-shadow: 0 0 #0000;
    --accum-shade: rgba(255,255,255,.07); --vi-bg: rgba(255,176,32,.18); --page: #0a0a0a;
    --ma-1: #4cc38a; --ma-2: #c8956a; --ma-3: #f17ab5; --ma-4: #b5c42e; --ma-5: #8b8cf8; --ma-6: #4fc3e0;
    --scrim: rgba(0,0,0,.6); --pop-shadow: 0 6px 24px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.08);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--fg); font: 14px/1.45 Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  button { font: inherit; color: inherit; }
  .mono { font-family: ui-monospace, "SF Mono", monospace; font-variant-numeric: tabular-nums; }

  /* ── 목업 바깥(설명 · 안 고르기) ── */
  .bar { position: sticky; top: 0; z-index: 50; display: flex; gap: 8px 14px; align-items: center; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--border-subtle); flex-wrap: wrap; font-size: 12.5px; }
  .bar b { margin-right: 4px; font-size: 14px; }
  .seg { display: inline-flex; background: var(--muted); border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: transparent; color: var(--muted-fg); padding: 4px 11px; border-radius: 999px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .seg button.on { background: var(--seg-on-bg); color: var(--seg-on-fg); font-weight: 600; box-shadow: var(--seg-on-shadow); }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
  .sec { margin: 18px 0 0; font-size: 17px; font-weight: 700; }
  .vdesc { background: var(--card); border-radius: 14px; padding: 12px 16px; display: grid; gap: 6px; }
  .vdesc .vrow { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .vdesc .vt { font-weight: 700; font-size: 14px; }
  .vdesc .vd { color: var(--muted-fg); font-size: 12.5px; margin: 0; line-height: 1.6; }
  .frames { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
  .fcol { display: grid; gap: 8px; }
  .cap { font-size: 12.5px; color: var(--muted-fg); max-width: 390px; line-height: 1.5; }
  .cap b { color: var(--fg); font-weight: 700; margin-right: 4px; }
  .scrollx { overflow-x: auto; padding-bottom: 6px; }

  /* ── 기기 틀 ── */
  .ph { width: 390px; position: relative; overflow: hidden; background: var(--page); border: 1px solid var(--border-subtle); border-radius: 28px; padding: 12px; }
  .ph.tall { height: 720px; }
  .ph .stub { display: flex; align-items: baseline; gap: 6px; padding: 6px 4px 10px; }
  .ph .stub b { font-size: 16px; } .ph .stub span { font-size: 12px; color: var(--muted-fg); }
  .dk { width: 1120px; position: relative; background: var(--page); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 16px; }
  .dk.tall { min-height: 560px; }

  /* ── 화면: 차트 카드 ── */
  .card { background: var(--card); border: 1px solid var(--border-subtle); border-radius: 16px; overflow: hidden; }
  .chd { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; border-bottom: 1px solid var(--border-subtle); padding: 7px 12px; }
  .chd h2 { margin: 0; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .chd .grow { margin-left: auto; }
  /* 선 차트 | 봉 차트 */
  .sw { display: inline-flex; background: var(--muted); border-radius: 999px; padding: 2px; }
  .sw button { border: 0; background: transparent; color: var(--muted-fg); height: 20px; padding: 0 8px; border-radius: 999px; font-size: 11px; cursor: pointer; white-space: nowrap; }
  .sw button.on { background: var(--seg-on-bg); color: var(--seg-on-fg); font-weight: 600; box-shadow: var(--seg-on-shadow); }
  /* 봉 단위 버튼 */
  .unit { display: inline-flex; align-items: center; gap: 2px; height: 24px; border: 0; background: var(--muted); color: var(--fg); font-size: 11px; font-weight: 600; padding: 0 4px 0 8px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .unit svg { width: 12px; height: 12px; }
  .unit.open { background: var(--raised-2); }
  select.unit { appearance: none; -webkit-appearance: none; padding-right: 22px; background-image: linear-gradient(45deg, transparent 50%, var(--muted-fg) 50%), linear-gradient(135deg, var(--muted-fg) 50%, transparent 50%); background-position: calc(100% - 12px) 50%, calc(100% - 8px) 50%; background-size: 4px 4px; background-repeat: no-repeat; }
  /* 이동평균 칩 */
  .mas { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .mas .pre { font-size: 11px; color: var(--muted-fg); margin-right: 2px; white-space: nowrap; }
  .chip { display: inline-flex; align-items: stretch; height: 24px; border-radius: 999px; background: var(--muted); color: var(--fg); white-space: nowrap; }
  .chip .t { display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; padding: 0 2px 0 8px; font-size: 11px; font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums; }
  .chip .t i { width: 8px; height: 2px; border-radius: 1px; display: inline-block; }
  .chip .x { border: 0; background: transparent; color: var(--muted-fg); width: 20px; padding: 0 6px 0 0; font-size: 12px; cursor: pointer; }
  .chip.off { background: transparent; box-shadow: inset 0 0 0 1px var(--border-subtle); color: var(--muted-fg); }
  .chip.off .t { font-weight: 400; }
  .chip.off .t i { opacity: .35; }
  .plus { height: 24px; min-width: 24px; border: 0; border-radius: 999px; background: transparent; box-shadow: inset 0 0 0 1px var(--border-subtle); color: var(--fg-2); font-size: 11px; font-weight: 600; padding: 0 8px; cursor: pointer; white-space: nowrap; }
  .plus.open { background: var(--raised-2); box-shadow: none; }
  .plus:disabled { opacity: .4; cursor: not-allowed; }
  .own { display: inline-flex; gap: 8px; font-size: 11px; color: var(--mine-fg); white-space: nowrap; }
  .own i.d { width: 7px; height: 7px; background: var(--mine); transform: rotate(45deg); display: inline-block; border-radius: 1px; margin-right: 4px; }
  .own i.o { width: 8px; height: 8px; border: 1.5px solid var(--mine); border-radius: 50%; display: inline-block; margin-right: 4px; }
  .tools { display: inline-flex; align-items: center; gap: 2px; font-size: 11px; color: var(--muted-fg); }
  .tools .span { font-family: ui-monospace, monospace; padding: 0 6px; white-space: nowrap; }
  .tools button { border: 0; background: transparent; color: var(--fg-2); font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; cursor: pointer; }

  /* 폰 제목 줄 — 두 줄(B) / 줄바꿈(A) · 조작 높이 32 */
  .chd.p { display: grid; gap: 4px; padding: 8px 12px; }
  .chd.p .l1 { display: flex; align-items: center; gap: 8px; }
  .chd.p .l2 { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .chd.p.fa .l2 { gap: 4px 4px; }
  .chd.p.fa .l2 { flex-wrap: wrap; }
  .chd.p .sw button { height: 28px; padding: 0 8px; font-size: 12px; }
  .chd.p .unit { height: 32px; font-size: 12px; padding: 0 8px 0 12px; }
  .chd.p .chip { height: 32px; }
  .chd.p .chip .t { font-size: 12px; padding: 0 2px 0 12px; }
  .chd.p .chip .x { width: 28px; font-size: 13px; padding: 0 8px 0 0; }
  .chd.p .plus { height: 32px; min-width: 32px; font-size: 12px; padding: 0 8px; }
  .chd.p .tools { gap: 0; margin-left: auto; }
  .chd.p .tools button { height: 32px; min-width: 28px; padding: 0 4px; font-size: 12px; }
  .chd.p .scr { flex: 1; min-width: 0; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 18px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 18px), transparent); }
  .chd.p .scr::-webkit-scrollbar { display: none; }
  .chd.p .scr.nofade { -webkit-mask-image: none; mask-image: none; }

  /* 값 띠(A 4칸) — 데스크톱 88 · 폰 84 + 52 */
  .band { display: grid; border-bottom: 1px solid var(--border-subtle); font-size: 11.5px; line-height: 14px; font-variant-numeric: tabular-nums; }
  .band.d { height: 88px; grid-template-columns: 1.5fr 1.6fr 1fr 1.1fr; }
  .band.p { height: 137px; grid-template-columns: 1fr 1fr; grid-template-rows: 84px 52px; }
  .band > div { min-width: 0; overflow: hidden; padding: 5px 12px; border-left: 1px solid var(--border-subtle); }
  .band.p > div { padding: 3px 12px; }
  .band > div:first-child { border-left: 0; }
  .band.p > div:nth-child(3) { border-left: 0; }
  .band.p > div:nth-child(n+3) { border-top: 1px solid var(--border-subtle); }
  .band .hd { display: flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700; color: var(--muted-fg); white-space: nowrap; }
  .band .hd i { width: 7px; height: 7px; border-radius: 2px; display: inline-block; flex-shrink: 0; }
  .band .hd em { font-style: normal; font-weight: 400; margin-left: auto; font-family: ui-monospace, monospace; }
  .band .hd .live { color: var(--fg); }
  .band .rw { margin-top: 2px; display: flex; gap: 0 10px; white-space: nowrap; overflow: hidden; }
  .band .rw.ma { flex-wrap: wrap; height: 32px; }
  .band.p .rw.ma { height: 32px; }
  .band .rw span { color: var(--muted-fg); font-size: 10.5px; margin-right: 3px; }
  .band .rw b { font-family: ui-monospace, "SF Mono", monospace; font-size: 11px; font-weight: 600; }
  .band .rw b.big { font-size: 12px; color: var(--fg); }
  .band .rw i.dash { width: 8px; height: 2px; display: inline-block; vertical-align: middle; margin-right: 3px; border-radius: 1px; }
  .up { color: var(--up); } .down { color: var(--down); } .team { color: var(--team); } .mf { color: var(--muted-fg); }
  .cw { padding: 4px 0; }
  .cw svg { display: block; font-variant-numeric: tabular-nums; }
  .foot { border-top: 1px solid var(--border-subtle); padding: 6px 12px 8px; font-size: 11px; color: var(--muted-fg); display: flex; flex-wrap: wrap; gap: 2px 10px; }

  /* 팝오버 · 메뉴 · 시트 */
  .pop { position: absolute; z-index: 30; background: var(--popover); border-radius: 14px; box-shadow: var(--pop-shadow); }
  .pform { width: 272px; padding: 12px 12px 10px; }
  .pt { font-size: 14px; font-weight: 600; margin: 0 2px 10px; }
  .fr { display: grid; grid-template-columns: 40px 1fr; align-items: center; gap: 8px; margin-bottom: 8px; }
  .fr > label { font-size: 12px; color: var(--muted-fg); }
  .fs { display: inline-flex; background: var(--muted); border-radius: 10px; padding: 2px; width: 100%; }
  .fs button { flex: 1; border: 0; background: transparent; color: var(--muted-fg); height: 28px; border-radius: 8px; font-size: 12px; cursor: pointer; }
  .fs button.on { background: var(--seg-on-bg); color: var(--seg-on-fg); font-weight: 600; box-shadow: var(--seg-on-shadow); }
  .fs button:disabled { opacity: .4; cursor: not-allowed; }
  .fi { display: flex; align-items: center; gap: 8px; }
  .fi .box { display: inline-flex; align-items: center; height: 32px; width: 96px; border-radius: 8px; background: var(--muted); padding: 0 8px; box-shadow: inset 0 0 0 1px transparent; }
  .fi .box.bad { box-shadow: inset 0 0 0 1px var(--destructive); }
  .fi input { width: 100%; border: 0; background: transparent; color: var(--fg); font: 600 14px ui-monospace, "SF Mono", monospace; outline: none; text-align: right; padding: 0; }
  .fi .box em { font-style: normal; font-size: 12px; color: var(--muted-fg); margin-left: 4px; }
  .fi small { font-size: 12px; color: var(--muted-fg); }
  .help { font-size: 12px; color: var(--muted-fg); margin: -4px 0 8px 48px; }
  .err { font-size: 12px; color: var(--destructive); margin: -4px 0 8px 48px; }
  .fa2 { display: flex; justify-content: flex-end; gap: 6px; margin-top: 4px; }
  .btn { height: 32px; border: 0; border-radius: 8px; padding: 0 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--fg-2); }
  .btn.pri { background: var(--primary); color: var(--primary-fg); }
  .btn.pri:disabled { opacity: .4; cursor: not-allowed; }
  .psub { font-size: 12px; color: var(--muted-fg); margin: 0 2px 6px; }
  .pch { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
  .pch button { height: 28px; border: 0; border-radius: 999px; background: var(--muted); color: var(--fg); font-size: 12px; font-weight: 600; padding: 0 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .pch button:disabled { background: transparent; box-shadow: inset 0 0 0 1px var(--border-subtle); color: var(--muted-fg); font-weight: 400; cursor: default; }
  .dtog { display: flex; align-items: center; gap: 4px; border: 0; background: transparent; color: var(--fg-2); font-size: 12px; font-weight: 600; padding: 4px 2px; margin-bottom: 6px; cursor: pointer; }
  .menu { width: 184px; padding: 4px; }
  .mi { display: flex; align-items: center; gap: 4px; width: 100%; height: 32px; border: 0; background: transparent; border-radius: 8px; padding: 0 8px 0 4px; font-size: 12px; color: var(--fg); cursor: pointer; text-align: left; }
  .mi .ck { width: 16px; color: var(--fg); font-size: 12px; text-align: center; flex-shrink: 0; }
  .mi.on { font-weight: 600; }
  .mi:hover { background: var(--muted); }
  .mi small { color: var(--muted-fg); font-size: 11px; font-weight: 400; margin-left: 2px; }
  .mi em { margin-left: auto; font-style: normal; font-size: 11px; font-weight: 600; color: var(--muted-fg); background: var(--muted); border-radius: 999px; padding: 0 6px; line-height: 18px; }
  .mi.auto { height: auto; min-height: 40px; padding-top: 4px; padding-bottom: 4px; align-items: flex-start; }
  .mi.auto .col { display: grid; }
  .msep { height: 1px; background: var(--border-subtle); margin: 4px 6px; }
  .ph .menu { width: 200px; } .ph .mi { height: 40px; font-size: 14px; } .ph .mi .ck { font-size: 14px; } .ph .mi small { font-size: 12px; } .ph .mi em { font-size: 12px; line-height: 20px; } .ph .mi.auto { min-height: 48px; }
  .scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 25; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--card); border-radius: 22px 22px 0 0; padding: 10px 16px 24px; }
  .sheet .grab { width: 36px; height: 4px; border-radius: 999px; background: var(--raised-2); margin: 0 auto 10px; }
  .sheet .pt { font-size: 16px; font-weight: 700; margin: 0 4px 14px; }
  .sheet .fr { grid-template-columns: 48px 1fr; gap: 12px; margin-bottom: 12px; }
  .sheet .fr > label { font-size: 14px; }
  .sheet .fs button { height: 36px; font-size: 14px; }
  .sheet .fi .box { height: 40px; width: 120px; padding: 0 12px; }
  .sheet .fi input { font-size: 16px; }
  .sheet .fi .box em, .sheet .fi small { font-size: 14px; }
  .sheet .help, .sheet .err { margin-left: 60px; margin-top: -4px; margin-bottom: 12px; }
  .sheet .btn.pri { width: 100%; height: 44px; font-size: 14px; border-radius: 12px; margin-top: 6px; }
  .sheet .psub { font-size: 12px; }
  .sheet .pch button { height: 36px; font-size: 14px; padding: 0 12px; }
  .sheet .dtog { font-size: 14px; }
</style>
</head>
<body>
<div class="bar">
  <b>틱뷰어 봉 차트 — 제목 줄 조작</b>
  <span class="seg" id="theme"><button class="on" data-v="light">라이트</button><button data-v="dark">다크</button></span>
</div>

<div class="wrap">
  <h2 class="sec">① 폰 390 — 제목 줄 접힘</h2>
  <div class="vdesc">
    <div class="vrow"><span class="seg" id="v-fold"><button data-v="A">A 줄바꿈</button><button class="on" data-v="B">B 둘째 줄 가로 밀기</button></span></div>
    <p class="vd" id="d-fold"></p>
  </div>
  <div class="frames" id="f-fold"></div>

  <h2 class="sec">② 폰 390 — 이동평균 더하기(「＋」 → 아래에서 올라오는 시트)</h2>
  <div class="vdesc">
    <div class="vrow"><span class="seg" id="v-add"><button class="on" data-v="A">A 한 장 양식</button><button data-v="B">B 자주 쓰는 선 + 직접 넣기</button></span></div>
    <p class="vd" id="d-add"></p>
  </div>
  <div class="frames" id="f-add"></div>

  <h2 class="sec">③ 폰 390 — 봉 단위 메뉴</h2>
  <div class="vdesc">
    <div class="vrow"><span class="seg" id="v-unit"><button class="on" data-v="A">A 펼침 목록</button><button data-v="B">B 기기 기본 고르기 창</button></span></div>
    <p class="vd" id="d-unit"></p>
  </div>
  <div class="frames" id="f-unit"></div>

  <h2 class="sec">④ 데스크톱 ≈1120 — 같은 세 가지(위 A/B 고르기를 따른다)</h2>
  <div class="frames" id="f-desk" style="display:grid;gap:20px"></div>
</div>

<script>
// ── 표기 ───────────────────────────────────────────────────────────────
const MINUS = '−';
const INT = new Intl.NumberFormat('ko-KR', { maximumFractionDigits: 0 });
const p2 = (n) => String(n).padStart(2, '0');
const hm = (min) => `${p2(Math.floor(min / 60))}:${p2(min % 60)}`;
const f1 = (v) => v.toFixed(1);
const pct1 = (v) => `${v > 0 ? '+' : v < 0 ? MINUS : ''}${Math.abs(v).toFixed(1)}%`;

// ── 가짜 5분봉(09:00 부터 36개) ─────────────────────────────────────────
let seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const B5 = (() => {
  let p = 13400; const out = [];
  for (let i = 0; i < 36; i++) {
    const o = p, drift = i < 16 ? 16 : i < 25 ? -3 : -12;
    let h = o, l = o, c = o;
    for (let k = 0; k < 6; k++) { c = Math.round((c + drift / 6 + (rnd() - 0.5) * 44) / 10) * 10; h = Math.max(h, c); l = Math.min(l, c); }
    h += Math.round(rnd() * 3) * 10; l -= Math.round(rnd() * 3) * 10;
    out.push({ o, h, l, c, a: (0.5 + rnd() * 1.5) * (i > 6 && i < 18 ? 2.2 : 1) * 1e8 });
    p = c;
  }
  return out;
})();
function agg(bars, k) {
  const out = [];
  for (let i = 0; i < bars.length; i += k) {
    const g = bars.slice(i, i + k);
    out.push({ o: g[0].o, c: g[g.length - 1].c, h: Math.max(...g.map((b) => b.h)), l: Math.min(...g.map((b) => b.l)), a: g.reduce((s, b) => s + b.a, 0) });
  }
  return out;
}
const B15 = agg(B5, 3);
const LO = Math.min(...B5.map((b) => b.l)), HI = Math.max(...B5.map((b) => b.h)), RG = HI - LO;

// ── 값 띠(A 4칸) ────────────────────────────────────────────────────────

// ── 겹쳐 뜨는 것 ─────────────────────────────────────────────────────────
// st: ok | range | dup | day
function formRows(st, sheet) {

  return `<div class="fr"><label>기준</label><span class="fs"><button class="${base === 'bar' ? 'on' : ''}">봉</button><button class="${base === 'day' ? 'on' : ''}">일</button></span></div>
    <div class="fr"><label>기간</label><span class="fi"><span class="box${err && st === 'range' ? ' bad' : ''}"><input value="${val}" inputmode="numeric" aria-invalid="${st === 'range'}"><em>${unitTxt}</em></span><small>2 ~ 240</small></span></div>
    ${err ? `<p class="err" role="alert">${err}</p>` : ''}

    ${base === 'day' ? '<p class="help">일 기준은 단순 평균만 있어요</p>' : ''}

}

  const open = st !== 'ok';

}
function addOverlay(st, sheet, variant, set) {
  const body = variant === 'B' ? presetBody(st, sheet, set) : formRows(st, sheet);
  if (sheet) return `<div class="scrim"></div><div class="sheet" role="dialog" aria-label="이동평균 더하기"><div class="grab"></div><p class="pt">이동평균 더하기</p>${body}</div>`;
  return `<div class="pop pform" data-at="plus" role="dialog" aria-label="이동평균 더하기"><p class="pt">이동평균 더하기</p>${body}</div>`;
}
function unitMenu(unit) {
  const auto = unit !== 15;
  const items = [1, 5, 10, 15, 30, 60].map((u) => {
    const on = !auto && u === unit, now = auto && u === 5;
    return `<button class="mi${on ? ' on' : ''}" role="radio" aria-checked="${on}"><span class="ck">${on ? '✓' : ''}</span>${u}분봉${now ? '<em>지금</em>' : ''}</button>`;
  }).join('');
  return `<div class="pop menu" data-at="unit" role="radiogroup" aria-label="봉 단위"><button class="mi auto${auto ? ' on' : ''}" role="radio" aria-checked="${auto}"><span class="ck">${auto ? '✓' : ''}</span><span class="col">자동<small>보기 창에 맞춰 바뀌어요</small></span></button><div class="msep"></div>${items}</div>`;
}

// ── 기기 틀 ─────────────────────────────────────────────────────────────
function phoneFrame(o) {
  const tall = !!o.overlay;
  const inner = `<div class="stub"><b>에스텍</b><span class="mono">069510 · 11.11(화) · KRX</span></div>
    <section class="card">${titleRow({ ...o, phone: true })}${band(true, o.set, o.unit)}<div class="cw">${chartSvg(364, true, o.set, o.unit)}</div>
    <div class="foot"><span style="color:var(--mine-fg)">◆ 우리 체결 · ○ 조건 근거</span><span>누적 = 매집감지 보고서 값 · 우리 체결 제외</span></div></section>`;
  return `<div class="ph${tall ? ' tall' : ''}">${inner}${o.overlay || ''}</div>`;
}
function deskFrame(o) {
  const inner = `<section class="card">${titleRow({ ...o, phone: false })}${band(false, o.set, o.unit)}<div class="cw">${chartSvg(1086, false, o.set, o.unit)}</div>
    <div class="foot"><span>누적 = 매집감지 보고서 값 · 우리 체결 제외</span></div></section>`;
  return `<div class="dk${o.overlay ? ' tall' : ''}">${inner}${o.overlay || ''}</div>`;
}
const col = (cap, html) => `<div class="fcol"><div class="cap">${cap}</div>${html}</div>`;

// ── 그리기 ──────────────────────────────────────────────────────────────
const S = { fold: 'B', add: 'A', unit: 'A' };
const DESC = {
  fold: {
    A: 'A · 줄바꿈 — 둘째 줄의 봉 단위 · 칩 · 「＋」 가 폭이 모자라면 아래 줄로 넘어간다. 칩이 다 보이지만 6개면 제목 줄이 4줄이 되어 차트가 그만큼 내려간다.',
    B: 'B · 둘째 줄 가로 밀기 — 제목 줄은 언제나 두 줄. 봉 단위는 왼쪽 · 「＋」 는 오른쪽에 고정되고, 그 사이 칩만 옆으로 밀어서 본다(넘치면 오른쪽 끝이 흐려진다).',
  },
  add: {
    A: 'A · 한 장 양식 — 기준(봉 | 일) · 기간(숫자) · 종류(단순 | 지수)를 한 번에 보고 「단순 20 더하기」 로 끝낸다. 입력이 틀리면 칸 바로 아래에 이유가 나온다.',
    B: 'B · 자주 쓰는 선 + 직접 넣기 — 많이 쓰는 기간을 한 번 눌러 바로 더하고, 그 밖의 기간은 「직접 넣기」 를 펼쳐 A 와 같은 양식으로 넣는다. 이미 있는 선은 ✓ 로 흐려진다.',
  },
  unit: {
    A: 'A · 펼침 목록 — 버튼 아래로 7줄 목록이 펼쳐진다. 자동일 때 지금 쓰는 단위 옆에 「지금」 이 붙고, 고른 줄에 ✓.',
    B: 'B · 기기 기본 고르기 창 — 버튼이 기기 기본 고르기(아이폰 휠 · 안드로이드 목록 · PC 드롭다운)를 연다. 모양은 기기마다 다르고 「지금」 표시는 「자동 (지금 5분봉)」 글자로만 들어간다.',
  },
};
function render() {
  for (const k of ['fold', 'add', 'unit']) document.getElementById(`d-${k}`).textContent = DESC[k][S[k]];
  const base = { fold: S.fold, unitV: S.unit, unit: 5 };
  document.getElementById('f-fold').innerHTML = [
    col('<b>P1 · 처음 상태</b>칩 2개(단순 5 · 단순 20)', phoneFrame({ ...base, set: SETS.two })),
    col('<b>P2 · 칩 6개 = 상한</b>「＋」 꺼짐 · 「일 20」 은 눌러서 꺼 둔 칩(테두리만 · 선 안 그림)', phoneFrame({ ...base, set: SETS.six })),
    col('<b>P3 · 칩을 다 지운 뒤</b>「＋ 이동평균」 만 남는다', phoneFrame({ ...base, set: SETS.zero })),
  ].join('');
  const sh = (st) => addOverlay(st, true, S.add, SETS.three);
  document.getElementById('f-add').innerHTML = [
    col('<b>P4 · 열림</b>봉 · 20 · 단순', phoneFrame({ ...base, set: SETS.three, open: 'plus', overlay: sh('ok') })),
    col('<b>P5 · 기간 범위 밖</b>300 을 넣음', phoneFrame({ ...base, set: SETS.three, open: 'plus', overlay: sh('range') })),
    col('<b>P6 · 이미 있는 선</b>봉 · 5 · 단순', phoneFrame({ ...base, set: SETS.three, open: 'plus', overlay: sh('dup') })),
    col('<b>P7 · 일 기준</b>지수는 고를 수 없음', phoneFrame({ ...base, set: SETS.three, open: 'plus', overlay: sh('day') })),
  ].join('');
  const um = (u) => (S.unit === 'A' ? unitMenu(u) : '');
  document.getElementById('f-unit').innerHTML = [
    col(`<b>P8 · 자동</b>${S.unit === 'A' ? '목록 열림 · 지금 5분봉' : '버튼 글자 「자동 (지금 5분봉)」'}`, phoneFrame({ ...base, set: SETS.three, open: 'unit', overlay: um(5) })),
    col(`<b>P9 · 15분봉 고정</b>${S.unit === 'A' ? '목록 열림 · ✓ 15분봉' : '버튼 글자 「15분봉」'}`, phoneFrame({ ...base, unit: 15, set: SETS.three, open: 'unit', overlay: um(15) })),
  ].join('');
  const dk = (cap, o) => col(cap, `<div class="scrollx">${deskFrame(o)}</div>`);
  const dbase = { fold: S.fold, unitV: S.unit, unit: 5 };
  document.getElementById('f-desk').innerHTML = [
    dk('<b>D1 · 기본</b>칩 3개 · 「일 20」 꺼짐 · 한 줄', { ...dbase, set: SETS.three }),
    dk('<b>D2 · 이동평균 더하기 열림</b>「＋」 아래 작은 창', { ...dbase, set: SETS.three, open: 'plus', overlay: addOverlay('ok', false, S.add, SETS.three) }),
    dk('<b>D3 · 기간 범위 밖</b>', { ...dbase, set: SETS.three, open: 'plus', overlay: addOverlay('range', false, S.add, SETS.three) }),
    dk(`<b>D4 · 봉 단위 — 자동</b>${S.unit === 'A' ? '목록 열림' : '기기 기본 드롭다운(눌러 보기)'}`, { ...dbase, set: SETS.three, open: 'unit', overlay: S.unit === 'A' ? unitMenu(5) : '' }),
    dk(`<b>D5 · 봉 단위 — 15분봉 고정</b>${S.unit === 'A' ? '목록 열림' : ''}`, { ...dbase, unit: 15, set: SETS.three, open: 'unit', overlay: S.unit === 'A' ? unitMenu(15) : '' }),
    dk('<b>D6 · 칩 6개 = 상한</b>「＋」 꺼짐 · 넘치면 우리 범례 · 확대 버튼이 다음 줄로', { ...dbase, set: SETS.six }),
  ].join('');
  placeOverlays();
}
// 팝오버를 그 버튼 바로 아래에 붙인다(틀 안 좌표).
function placeOverlays() {
  document.querySelectorAll('.ph, .dk').forEach((fr) => {
    fr.querySelectorAll('.pop[data-at]').forEach((pop) => {
      const anchor = fr.querySelector(`[data-anchor="${pop.dataset.at}"]`);
      if (!anchor) return;
      const fb = fr.getBoundingClientRect(), ab = anchor.getBoundingClientRect();
      const left = Math.max(8, Math.min(ab.left - fb.left, fb.width - pop.offsetWidth - 8));
      pop.style.left = `${left}px`;
      pop.style.top = `${ab.bottom - fb.top + 6}px`;
    });
  });
}
function seg(id, fn) {
  const el = document.getElementById(id);
  el.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    el.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
    fn(b.dataset.v); render();
  });
}
seg('theme', (v) => { document.documentElement.dataset.theme = v; });
seg('v-fold', (v) => { S.fold = v; });
seg('v-add', (v) => { S.add = v; });
seg('v-unit', (v) => { S.unit = v; });
(function init() {
  const dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  if (dark) { document.documentElement.dataset.theme = 'dark'; document.querySelectorAll('#theme button').forEach((x) => x.classList.toggle('on', x.dataset.v === 'dark')); }
})();
window.addEventListener('resize', placeOverlays);
render();
</script>
</body>
</html>
