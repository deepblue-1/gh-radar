<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phase 29 목업 — /admin/users 목록→편집 (A 시트 / B 상세 페이지 / C 아코디언)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #0c0c0f; color: #ddd; font-family: -apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif; }
#nav { position: sticky; top: 0; z-index: 50; background: #0c0c0f; border-bottom: 1px solid #26262c; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 13px; }
#nav .g { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
#nav .l { color: #777; font-size: 12px; margin-right: 4px; }
#nav button { font: inherit; background: #1b1b20; color: #bbb; border: 1px solid #2a2a31; border-radius: 7px; padding: 5px 10px; cursor: pointer; }
#nav button.on { background: #f2f2f2; color: #111; border-color: #f2f2f2; font-weight: 700; }
#desc { flex-basis: 100%; color: #9a9aa2; font-size: 12.5px; line-height: 1.6; }
#desc b { color: #eee; }
#stage { display: flex; justify-content: center; gap: 24px; padding: 20px 12px 60px; overflow-x: auto; }
.f { --bg: #ffffff; --surface: #f2f4f6; --fg: #191f28; --fg2: #333d4b; --muted: #f2f4f6; --mfg: #6b7684; --faint: #b0b8c1; --hair: #e5e8eb; --up: #f04452; --down: #3182f6; --upbg: #ffeeee; --dnbg: #e8f3ff; --okbg: #e6f7ee; --ok: #1c8f4e; --warnbg: #fff4e0; --warn: #b26a00; --pill-bg: #ffffff; --pill-fg: #191f28; --sheet: #ffffff; --scrim: rgba(0,0,0,.35);
  --font: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif; }
.f.dark { --bg: #17171c; --surface: #0f0f12; --fg: #ffffff; --fg2: #e4e4e4; --muted: #2a2a31; --mfg: #9e9e9e; --faint: #636363; --hair: #33333a; --up: #f04251; --down: #3485fa; --upbg: rgba(240,66,81,.16); --dnbg: rgba(52,133,250,.16); --okbg: rgba(46,184,106,.18); --ok: #4cd38a; --warnbg: rgba(255,170,0,.16); --warn: #ffbf47; --pill-bg: #4e4e4e; --pill-fg: #ffffff; --sheet: #202026; --scrim: rgba(0,0,0,.55); }
.f { position: relative; flex: none; overflow: hidden; background: var(--bg); color: var(--fg2); font-family: var(--font); -webkit-font-smoothing: antialiased; word-break: keep-all; font-variant-numeric: tabular-nums; box-shadow: 0 0 0 1px #2a2a31; display: flex; flex-direction: column; }
.f.phone { width: 390px; height: 844px; border-radius: 30px; }
.f.desktop { width: 1080px; height: 720px; border-radius: 16px; flex-direction: row; }
.side { width: 200px; border-right: 1px solid var(--hair); padding: 18px 12px; font-size: 14px; color: var(--mfg); background: var(--surface); }
.side .it { padding: 8px 10px; border-radius: 8px; }
.side .it.on { background: var(--muted); color: var(--fg); font-weight: 600; }
.side .sub { padding: 6px 10px 6px 26px; font-size: 13px; }
.side .sub.on { color: var(--fg); font-weight: 600; }
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
.hd { padding: 16px 20px 0; display: flex; align-items: center; gap: 10px; }
.f.phone .hd { padding: 14px 16px 0; }
.hd .nm { font-size: 20px; font-weight: 700; color: var(--fg); }
.hd .ex { font-size: 12.5px; color: var(--mfg); }
.hd .sp { flex: 1; }
.btn { font: inherit; font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 9px; border: 0; cursor: pointer; background: var(--muted); color: var(--fg); }
.btn.pri { background: var(--down); color: #fff; }
.btn.danger { background: var(--upbg); color: var(--up); }
.btn.sm { font-size: 12px; padding: 5px 9px; }
.scroll { flex: 1; overflow-y: auto; }
.sec { padding: 14px 20px 6px; font-size: 12.5px; font-weight: 600; color: var(--mfg); display: flex; align-items: center; gap: 8px; }
.f.phone .sec { padding: 14px 16px 6px; }
.sec .n { background: var(--muted); border-radius: 999px; padding: 1px 7px; font-size: 11px; }
.row { display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--hair); cursor: pointer; }
.f.phone .row { padding: 12px 16px; }
.row:hover { background: var(--surface); }
.row.sel { background: var(--surface); box-shadow: inset 3px 0 0 var(--down); }
.row .av { width: 36px; height: 36px; border-radius: 50%; background: var(--muted); display: grid; place-items: center; font-weight: 700; color: var(--fg); font-size: 14px; flex: none; }
.row .c1 { flex: 1; min-width: 0; }
.row .em { font-size: 14px; font-weight: 600; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .m { font-size: 12.5px; color: var(--mfg); margin-top: 2px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.row .chev { color: var(--faint); font-size: 18px; }
.ch { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 5px; white-space: nowrap; line-height: 1.4; }
.ch.role { background: var(--muted); color: var(--fg2); }
.ch.admin { background: var(--dnbg); color: var(--down); }
.ch.ok { background: var(--okbg); color: var(--ok); }
.ch.warn { background: var(--warnbg); color: var(--warn); }
.ch.err { background: var(--upbg); color: var(--up); }
.ch.dim { background: transparent; color: var(--faint); border: 1px dashed var(--hair); }
.ch.pend { background: var(--warnbg); color: var(--warn); }
.srv { display: inline-flex; gap: 4px; }
/* 편집 본문 */
.ed { padding: 0 20px 24px; }
.f.phone .ed { padding: 0 16px 24px; }
.ed .ttl { display: flex; align-items: center; gap: 10px; padding: 16px 0 6px; }
.ed .ttl .em { font-size: 17px; font-weight: 700; color: var(--fg); }
.ed .ttl .x { margin-left: auto; color: var(--mfg); font-size: 20px; cursor: pointer; }
.fld { padding: 12px 0; border-bottom: 1px solid var(--hair); }
.fld .lb { font-size: 12px; color: var(--mfg); margin-bottom: 6px; }
.fld .v { font-size: 15px; color: var(--fg); display: flex; align-items: center; gap: 8px; }
.fld .v .sp { flex: 1; }
.seg { display: inline-flex; background: var(--muted); border-radius: 10px; padding: 2px; gap: 2px; }
.seg span { font-size: 13px; font-weight: 500; color: var(--mfg); padding: 5px 12px; border-radius: 8px; cursor: pointer; }
.seg span.on { background: var(--pill-bg); color: var(--pill-fg); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.acct { border: 1px solid var(--hair); border-radius: 12px; padding: 12px 14px; margin-top: 10px; }
.acct .t { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--fg); }
.acct .t .bk { font-size: 11px; background: var(--muted); padding: 2px 6px; border-radius: 5px; color: var(--fg2); font-weight: 600; }
.acct .t .sp { flex: 1; }
.acct .srvs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.sv { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 5px 9px; border-radius: 999px; border: 1px solid var(--hair); color: var(--fg2); }
.sv i { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--faint); display: grid; place-items: center; font-size: 10px; color: #fff; }
.sv.on i { background: var(--down); border-color: var(--down); } .sv.on i::after { content: '✓'; }
.sv .st { font-size: 10.5px; font-weight: 600; padding: 1px 5px; border-radius: 4px; }
.sv .st.ok { background: var(--okbg); color: var(--ok); } .sv .st.warn { background: var(--warnbg); color: var(--warn); } .sv .st.err { background: var(--upbg); color: var(--up); }
.foot { display: flex; gap: 8px; padding-top: 16px; }
.foot .sp { flex: 1; }
.note { font-size: 12px; color: var(--mfg); line-height: 1.5; margin-top: 6px; }
/* A: 시트 */
.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 5; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; top: 56px; background: var(--sheet); border-radius: 22px 22px 0 0; z-index: 6; display: flex; flex-direction: column; overflow: hidden; }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--faint); margin: 10px auto 0; }
.sheet .scroll { padding-bottom: 20px; }
.panel { position: absolute; top: 0; bottom: 0; right: 0; width: 440px; background: var(--sheet); border-left: 1px solid var(--hair); z-index: 6; display: flex; flex-direction: column; overflow: hidden; box-shadow: -8px 0 24px rgba(0,0,0,.08); }
/* B: 페이지 */
.back { font-size: 14px; color: var(--mfg); padding: 14px 20px 0; cursor: pointer; }
.f.phone .back { padding: 14px 16px 0; }
/* C: 아코디언 */
.acc { border-bottom: 1px solid var(--hair); background: var(--surface); }
.acc .ed { padding-top: 4px; }
.sticky-bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + 18px); background: var(--bg); border-top: 1px solid var(--hair); display: flex; gap: 8px; }
.sticky-bar .sp { flex: 1; }
.tabbar { position: absolute; left: 50%; transform: translateX(-50%); bottom: 14px; display: flex; gap: 22px; padding: 10px 22px; border-radius: 999px; background: var(--fg); color: var(--bg); font-size: 16px; }
</style>
</head>
<body>
<div id="nav">
  <div class="g"><span class="l">목록→편집</span><button data-v="A" class="on">A 행 탭 → 시트(폰 바텀시트 · 데스크톱 우측 패널)</button><button data-v="B">B 행 탭 → 상세 페이지 /admin/users/[id]</button><button data-v="C">C 행 펼침(아코디언) 인라인 편집</button></div>
  <div class="g"><span class="l">폭</span><button data-w="phone" class="on">폰 390</button><button data-w="desktop">데스크톱 1080</button></div>
  <div class="g"><span class="l">테마</span><button data-t="dark" class="on">다크</button><button data-t="light">라이트</button></div>
  <div class="g"><span class="l">편집 열림</span><button data-o="1" class="on">열림 (kim@…)</button><button data-o="0">닫힘(목록만)</button></div>
  <div id="desc"></div>
</div>
<div id="stage"></div>
<script>
const DESC = {
  A: '<b>A · 행 탭 → 시트(권장)</b> — 폰은 바텀시트가 거의 전체 높이로 올라오고, 데스크톱은 우측 패널(440px)이 열려 목록이 왼쪽에 남는다. 시트 안에 역할 · DMA id · 비밀번호 변경 · 계좌 목록(등록 서버 체크 + 서버별 반영 칩) · 삭제. 호가주문 바텀시트(스케치 002) 패턴 재사용. 목록이 남아 유저 간 이동이 빠르다. 저장은 필드별 즉시(상따 기본설정 D-13 동형) 또는 하단 버튼 — 다음 질문.',
  B: '<b>B · 행 탭 → 상세 페이지</b> — <code>/admin/users/[id]</code> 라우트. 편집 폭이 넓고 링크·뒤로가기가 자연스럽다. 폰은 전체 화면, 데스크톱은 본문 폭 그대로. 다른 유저로 가려면 목록으로 돌아간다. 사이드바 「Admin › 사용자」 는 상세에서도 켜진 채.',
  C: '<b>C · 행 펼침(아코디언)</b> — 행을 누르면 그 자리에서 편집 본문이 펼쳐진다. 한 화면에서 여러 유저를 비교하기 좋지만 폰에서는 길어지고 저장 버튼이 스크롤 밖으로 간다(하단 고정 바 필요). 라우트 변화 없음.',
};
let S = { v: 'A', w: 'phone', t: 'dark', o: 1 };
const SRV = ['KB120','KB121','KYOBO119','KYOBO127'];
const USERS = [
  { em: 'alex@jx1.io', role: 'admin', dma: 'alexjx', st: {KB120:'ok',KB121:'ok',KYOBO119:'ok',KYOBO127:'warn'}, accts: 2 },
  { em: 'kim.trader@gmail.com', role: 'trader', dma: 'kimtr', st: {KB120:'ok',KB121:'err',KYOBO119:'ok'}, accts: 2, sel: true },
  { em: 'park.view@gmail.com', role: 'viewer', dma: null, st: {}, accts: 0 },
  { em: 'smok95 (서버에만 있음)', role: null, dma: 'smok95', st: {KYOBO119:'only'}, accts: 1, only: true },
];
const PENDING = [ { em: 'lee.new@gmail.com', at: '오늘 09:12 가입' } ];
const STL = { ok: '반영됨', warn: '미반영', err: '실패 · BUSY', only: '서버에만 있음' };
function srvChips(st) {
  return `<span class="srv">${Object.entries(st).map(([k,v]) => `<span class="ch ${v==='only'?'dim':v}">${k}${v==='ok'?'':' · '+STL[v]}</span>`).join('')}</span>`;
}
function row(u, i) {
  const ini = u.em[0].toUpperCase();
  const role = u.only ? `<span class="ch dim">웹 유저 없음</span>` : `<span class="ch role ${u.role}">${u.role}</span>`;
  const dma = u.dma ? `DMA <b style="color:var(--fg)">${u.dma}</b>` : '<span style="color:var(--faint)">DMA 연결 없음</span>';
  const sel = (S.o && u.sel && S.v !== 'B') ? ' sel' : '';
  return `<div class="row${sel}" data-i="${i}"><div class="av">${ini}</div><div class="c1"><div class="em">${u.em}</div><div class="m">${role} <span>${dma}</span> ${u.accts?`<span>· 계좌 ${u.accts}</span>`:''} ${srvChips(u.st)}</div></div><span class="chev">›</span></div>`;
}
function pendRow(p) {
  return `<div class="row"><div class="av" style="background:var(--warnbg);color:var(--warn)">!</div><div class="c1"><div class="em">${p.em}</div><div class="m"><span class="ch pend">승인 대기</span><span>${p.at}</span></div></div><button class="btn sm pri">승인</button></div>`;
}
function list() {
  return `<div class="sec">승인 대기 <span class="n">${PENDING.length}</span></div>${PENDING.map(pendRow).join('')}
  <div class="sec">사용자 <span class="n">${USERS.length}</span><span style="flex:1"></span><span style="font-weight:500">서버 칩 = 그 서버 users.toml 반영 상태</span></div>${USERS.map(row).join('')}
  <div class="note" style="padding:12px 20px 80px">사전 등록: 「+ 사용자」 로 gmail 만 먼저 넣어 두면 가입 즉시 열린다. 「서버에만 있음」 행은 편집 불가 — 보기만.</div>`;
}
function editor(closeIcon) {
  const u = USERS[1];
  const acct = (bk, no, name, on, st) => `<div class="acct"><div class="t"><span class="bk">${bk}</span>${no}<span style="color:var(--mfg);font-weight:500">${name}</span><span class="sp"></span><button class="btn sm">제거</button></div>
    <div class="srvs">${SRV.filter(s => s.startsWith(bk)).map(s => `<span class="sv ${on.includes(s)?'on':''}"><i></i>${s}${st[s]?` <span class="st ${st[s]}">${STL[st[s]]}</span>`:''}</span>`).join('')}</div></div>`;
  return `<div class="ed">
    <div class="ttl"><span class="em">${u.em}</span><span class="ch role">trader</span>${closeIcon?'<span class="x">×</span>':''}</div>
    <div class="fld"><div class="lb">역할</div><div class="v"><span class="seg"><span>viewer</span><span class="on">trader</span><span>admin</span></span></div><div class="note">viewer 로 내리면 열린 트레이딩 화면이 다음 요청부터 막히고 relay 연결이 끊긴다.</div></div>
    <div class="fld"><div class="lb">DMA 사용자 id (모든 서버 공통)</div><div class="v"><b>kimtr</b><span class="sp"></span><button class="btn sm">비밀번호 변경</button></div><div class="note">비밀번호는 저장 뒤 다시 볼 수 없다. 변경해도 열린 세션은 유지되고 다음 로그인부터 적용.</div></div>
    <div class="fld"><div class="lb">계좌 · 등록 서버</div>
      ${acct('KB', '123-45-678901', '위탁', ['KB120','KB121'], {KB120:'ok', KB121:'err'})}
      ${acct('KYOBO', '98765432-01', '위탁', ['KYOBO119'], {KYOBO119:'ok'})}
      <div style="margin-top:10px"><button class="btn sm">+ 계좌 추가</button></div>
      <div class="note">KB121 실패 · BUSY: 그 서버에 미체결·전략이 있어 서버가 거부했다. 정리 뒤 「다시 반영」. 마지막 계좌 제거는 유저 삭제로 이어진다.</div></div>
    <div class="foot"><button class="btn danger">사용자 삭제</button><span class="sp"></span><button class="btn">다시 반영</button><button class="btn pri">저장</button></div>
  </div>`;
}
function frame(w) {
  const phone = w === 'phone';
  const cls = `f ${w} ${S.t}`;
  let body = '';
  const hd = (title, ex, plus) => `<div class="hd"><span class="nm">${title}</span><span class="ex">${ex}</span><span class="sp"></span>${plus?'<button class="btn sm">+ 사용자</button>':''}</div>`;
  if (S.v === 'A') {
    body = `${hd('사용자', '허용 gmail · 역할 · DMA 연결', true)}<div class="scroll">${list()}</div>`;
    if (S.o) body += phone
      ? `<div class="scrim"></div><div class="sheet"><div class="grab"></div><div class="scroll">${editor(true)}</div></div>`
      : `<div class="panel"><div class="scroll">${editor(true)}</div></div>`;
  } else if (S.v === 'B') {
    body = S.o
      ? `<div class="back">‹ 사용자</div><div class="scroll">${editor(false)}</div>`
      : `${hd('사용자', '허용 gmail · 역할 · DMA 연결', true)}<div class="scroll">${list()}</div>`;
  } else {
    const rows = USERS.map((u, i) => row(u, i) + ((S.o && u.sel) ? `<div class="acc">${editor(false)}</div>` : '')).join('');
    body = `${hd('사용자', '허용 gmail · 역할 · DMA 연결', true)}<div class="scroll"><div class="sec">승인 대기 <span class="n">1</span></div>${PENDING.map(pendRow).join('')}<div class="sec">사용자 <span class="n">4</span></div>${rows}<div style="height:90px"></div></div>`;
    if (S.o && phone) body += `<div class="sticky-bar"><button class="btn danger sm">삭제</button><span class="sp"></span><button class="btn sm">다시 반영</button><button class="btn pri sm">저장</button></div>`;
  }
  if (phone) {
    body += S.o && S.v === 'A' ? '' : `<div class="tabbar">⌂ ⚡ ◔ ✦ ☰</div>`;
    return `<div class="${cls}"><div class="main">${body}</div></div>`;
  }
  const side = `<div class="side"><div class="it">트레이딩</div><div class="it">분석</div><div class="sub">상한가 보고서</div><div class="it on">Admin</div><div class="sub on">사용자</div><div class="sub">서버</div><div class="it">My page</div><div class="it">AI 애널리스트</div></div>`;
  return `<div class="${cls}">${side}<div class="main">${body}</div></div>`;
}
function render() {
  document.getElementById('desc').innerHTML = DESC[S.v];
  document.getElementById('stage').innerHTML = frame(S.w);
  document.querySelectorAll('#nav button').forEach(b => {
    const k = Object.keys(b.dataset)[0]; const val = b.dataset[k];
    b.classList.toggle('on', String(S[k]) === val);
  });
}
document.getElementById('nav').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const k = Object.keys(b.dataset)[0]; let v = b.dataset[k];
  if (k === 'o') v = Number(v);
  S[k] = v; render();
});
document.getElementById('stage').addEventListener('click', e => {
  const r = e.target.closest('.row[data-i]'); if (!r) return;
  USERS.forEach((u, i) => u.sel = i === Number(r.dataset.i)); S.o = 1; render();
});
render();
</script>
</body>
</html>
