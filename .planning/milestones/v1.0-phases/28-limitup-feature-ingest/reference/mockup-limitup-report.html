<style>
* { box-sizing: border-box; }

body { background: #0c0c0f; color: #ddd; font-family: -apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif; }

  --font: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif; }

  --up: #f04251; --down: #3485fa; --flat: #9e9e9e; --upbg: rgba(240,66,81,.16); --dnbg: rgba(52,133,250,.16); --nav-on-bg: #2d2d2d; --nav-on-fg: #ffffff; --line: #ffffff; --shade: rgba(255,255,255,.10); --base: #ffb13d; --side: #0a0a0a; }

.kpi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.f.desktop .kpi { grid-template-columns: repeat(5, 1fr); }

.sec { background: var(--card); border-radius: 16px; padding: 14px 14px 8px; margin-bottom: 12px; }

.src { font-size: 10.5px; font-weight: 600; padding: 1px 5px; border-radius: 4px; background: var(--muted); color: var(--mfg); vertical-align: middle; }
/* B 격자 행 */
.grow { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--hair); cursor: pointer; }
.grow:last-child { border-bottom: 0; }

.grow .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 12px; color: var(--mfg); }

.f.desktop .grow .meta span:nth-child(1) { order: 3; } .f.desktop .grow .meta span:nth-child(2) { order: 4; } .f.desktop .grow .meta span:nth-child(3) { order: 5; } .f.desktop .grow .meta span:nth-child(4) { order: 6; } .f.desktop .grow .meta span:nth-child(6) { order: 8; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }

.hidden { display: none !important; }

<div id="nav">
  <div class="g"><span class="l">탐색 구조</span><button data-v="A" class="on">A 한 페이지 세로 흐름 ★채택</button><button data-v="B">B 날짜 → 종목 상세 2단계</button><button data-v="C">C 상단 탭 하루|사건|창구</button></div>
  <div class="g"><span class="l">폭</span><button data-w="phone" class="on">폰 390</button><button data-w="desktop">데스크톱 1280</button></div>

  <div id="desc"></div>
</div>

<script>
const DESC = {
  A: '<b>A · 한 페이지 세로 흐름(D-20 순서 그대로 · 2026-10-05 채택, 곡선 중립색)</b> — 상단 날짜 ‹ 10/02 › → KPI → <b>하루 격자</b>(종목 행: 잔량 곡선·잠김 음영·깨짐 ●·기준선 10억) → 행을 누르면 아래 <b>사건 카드</b>로 스크롤 → <b>창구 지문표</b> → <b>어제 결과</b>. 긴 스크롤 한 장, URL 은 날짜 하나(`?d=20261002`). 폰에서 가장 적은 탭 수.',
  B: '<b>B · 날짜 → 종목 상세 2단계</b> — 날짜 페이지 = KPI + 하루 격자 + 어제 결과 + 창구 지문표(접힘). 종목 행을 누르면 <b>종목 상세 페이지</b>(`/analytics/limitup/20261002/KR7006140003`)로 이동해 사건 카드·사실 문장·창구 막대를 본다. 뒤로가기로 목록. 종목별 공유 링크가 생긴다.',
  C: '<b>C · 상단 탭 하루 | 사건 | 창구</b>(gh-trade 목업 A/B/C 탭 동형) — 하루 탭 = KPI + 격자 + 어제 결과, 사건 탭 = 종목 칩으로 고르는 카드, 창구 탭 = 지문표 + 창구별 사건 목록. 날짜는 탭 위 공통. 스크롤이 짧고 표가 각자 자리.',
};
let S = { v: 'A', w: 'phone', t: 'light', tab: 'day', pick: 2, detail: false };
const ROWS = [
  ['머큐리', '100590', '09:08:31', 3, '62.7억', '4%', 'hold', '유지', '키움 · 신한', 'M0,28 L26,28 L28,4 L30,8 L34,20 L36,28 L40,28 L42,22 L46,20 L48,28 L52,28 L54,12 L80,12 L120,11 L200,11 L260,11', [[26,10],[40,12],[52,208]], [[36,28],[48,28]]],
  ['티엠씨', '217590', '10:19:53', 12, '80.3억', '7%', 'hold', '유지', '신한 · KB', 'M0,28 L12,27 L20,28 L30,26 L40,28 L48,27 L52,28 L54,14 L90,13 L150,12 L260,12', [[52,208]], [[14,27],[31,26]]],
  ['피제이전자', '006140', '13:57:08', 2, '17.3억', '37%', 'both', '깨짐→유지', '키움 · 신한', 'M0,28 L198,28 L200,10 L206,12 L214,20 L222,26 L226,28 L228,28 L230,17 L260,17', [[198,28],[228,32]], [[226,28]]],
  ['아이비젼웍스', '469750', '09:04:11', 7, '7.9억', '14%', 'broke', '깨짐', '한국 · 키움', 'M0,28 L14,28 L16,22 L30,21 L50,24 L66,27 L70,28 L260,28', [[14,56]], [[70,28]]],
  ['덕우전자', '263600', '09:06:01', 1, '27.0억', '—', 'broke', '깨짐 10초', '—', 'M0,28 L12,28 L13,8 L15,28 L260,28', [[12,3]], [[15,28]]],
  ['엑시온그룹', '069920', '14:45:27', 1, '1.7억', '7%', 'hold', '유지', '—', 'M0,28 L230,28 L232,27 L240,26 L260,26', [[230,30]], []],
];
const spark = r => `<svg viewBox="0 0 260 34" preserveAspectRatio="none">${r[10].map(([x, w]) => `<rect x="${x}" y="2" width="${w}" height="28" fill="var(--shade)"/>`).join('')}<line x1="0" y1="20" x2="260" y2="20" stroke="var(--base)" stroke-dasharray="2 3" stroke-width="1"/><path d="${r[9]}" fill="none" stroke="var(--line)" stroke-width="1.4" vector-effect="non-scaling-stroke"/>${r[11].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.6" fill="var(--up)"/>`).join('')}</svg>`;
const resTag = r => r[6] === 'both' ? `<span class="tag broke">깨짐</span> <span class="tag hold">유지</span>` : `<span class="tag ${r[6]}">${r[7]}</span>`;
function kpi() {
  return `<div class="kpi"><div><b>8</b><small>탐지 종목</small></div><div><b>12</b><small>잠김(3초↑)</small></div><div><b>5 / 12</b><small>종가까지 유지</small></div><div><b>4</b><small>25%↑ 미도달</small></div><div><b>+0.9%</b><small>어제 D+1<span class="mdl">모형</span></small></div></div>`;
}
function gridSec(title) {
  return `<div class="sec"><h3>${title ?? '하루 격자'} <small>상한가 매수잔량 금액 · 09:00~15:30</small></h3>
    <div class="ghead"><span>종목</span><span>잔량 곡선</span><span>첫 잠김</span><span>잠김</span><span>최대 잔량</span><span>+60초 매도</span><span>결과</span><span>진입 매수 창구</span></div>
    ${ROWS.map((r, i) => `<div class="grow" data-row="${i}"><span class="nm">${r[0]}<small>${r[1]}</small></span><span class="res">${resTag(r)}</span>${spark(r)}<div class="meta"><span><small>첫 잠김 </small><b>${r[2]}</b></span><span><small>잠김 </small><b>${r[3]}</b></span><span><small>최대 </small><b>${r[4]}</b></span><span><small>+60초 매도 </small><b>${r[5]}</b></span><span class="hidden"></span><span><small>창구 </small><b>${r[8]}</b> <span class="src">추정</span></span></div></div>`).join('')}
  </div>`;
}
function eventCard(i) {
  const r = ROWS[2]; // 표본 카드는 피제이전자 고정(목업)
  return `<div class="sec ev" id="ev"><h3>${r[0]} <span class="cd">${r[1]} · 상한가 5,690</span> <span class="tag broke">잠김 ③ 43분 뒤 깨짐</span><span class="tag hold">④ 종가 유지</span></h3>
    <div class="cols"><div>
    <div class="lane">진입 10분 · 13:50~14:00 — 가격(위) · 상한가까지 남은 매도벽 금액(아래)</div>
    <svg viewBox="0 0 640 200"><line x1="40" y1="14" x2="620" y2="14" stroke="var(--hair)" stroke-dasharray="3 3"/><text x="562" y="11" font-size="10" fill="var(--mfg)">상한가 5,690</text>
      <line x1="40" y1="62" x2="620" y2="62" stroke="var(--base)" stroke-dasharray="2 4"/><text x="44" y="58" font-size="10" fill="var(--base)">등락률 25%</text>
      <polyline fill="none" stroke="var(--fg)" stroke-width="1.6" points="40,108 100,100 150,90 210,62 270,54 330,50 390,44 440,40 452,36 456,28 460,14 620,14"/>
      <circle cx="210" cy="62" r="3.5" fill="var(--base)"/><circle cx="456" cy="28" r="4" fill="var(--up)"/><circle cx="460" cy="14" r="4" fill="var(--down)"/>
      <text x="214" y="76" font-size="10" fill="var(--mfg)">① 25% 도달</text><text x="330" y="32" font-size="10" fill="var(--mfg)">② 매도벽 소진 → ③ 첫 상한가 체결</text>
      <text x="4" y="134" font-size="10" fill="var(--mfg)">매도벽</text>
      <path d="M40,140 L200,146 L320,156 L420,166 L454,170 L456,190 L620,190" fill="var(--shade)" stroke="var(--up)" stroke-width="1.3"/>
      <text x="40" y="199" font-size="10" fill="var(--mfg)">13:50</text><text x="300" y="199" font-size="10" fill="var(--mfg)">13:55</text><text x="440" y="199" font-size="10" fill="var(--mfg)">13:57</text><text x="596" y="199" font-size="10" fill="var(--mfg)">14:00</text></svg>
    <div class="lane">잠김 전 구간 · 13:57~15:30 — 상한가 매수잔량 금액 · 큰 매도 ▼ · 취소 ✕ · 깨짐 ●</div>
    <svg viewBox="0 0 640 150"><rect x="40" y="10" width="297" height="118" fill="var(--shade)"/><rect x="345" y="10" width="275" height="118" fill="var(--shade)"/>
      <line x1="40" y1="70" x2="620" y2="70" stroke="var(--base)" stroke-dasharray="2 4"/><text x="44" y="66" font-size="10" fill="var(--base)">기준 10억</text>
      <polyline fill="none" stroke="var(--line)" stroke-width="1.6" points="40,128 44,60 50,32 56,30 70,34 90,50 130,66 170,80 210,90 270,102 320,118 334,126 337,128 345,128 349,74 400,72 480,73 560,72 620,72"/>
      <circle cx="56" cy="30" r="3.5" fill="var(--line)"/><text x="62" y="27" font-size="10" fill="var(--mfg)">최대 17.3억 @13:57:47</text>
      <text x="86" y="52" fill="var(--down)" font-size="11">▼▼</text><text x="104" y="50" font-size="10" fill="var(--mfg)">14:02 매도 15,003주 ×2</text>
      <text x="186" y="84" fill="var(--base)" font-size="12">✕</text><text x="198" y="82" font-size="10" fill="var(--mfg)">취소 −2.1억</text>
      <circle cx="337" cy="128" r="4.5" fill="var(--up)"/><text x="262" y="122" font-size="10" fill="var(--up)">깨짐 14:40:07</text>
      <text x="40" y="146" font-size="10" fill="var(--mfg)">13:57</text><text x="200" y="146" font-size="10" fill="var(--mfg)">14:20</text><text x="337" y="146" font-size="10" fill="var(--mfg)">14:40</text><text x="596" y="146" font-size="10" fill="var(--mfg)">15:30</text></svg>
    </div><div>
    <h3 style="margin-top:10px">사실 문장 <small>배치 생성 · 해석 없음</small></h3>
    <ul class="facts">
      <li><span class="t">13:57:06.657</span><span>매수 30,003주 버스트(9건·2ms)가 5,610→5,680 매도벽 소진 <span class="src">실측</span></span></li>
      <li><span class="t">13:57:08.020</span><span>첫 상한가 체결 1,177주 → 잠김 ③ 시작 <span class="src">실측</span></span></li>
      <li><span class="t">13:57:47</span><span>상한가 잔량 최대 304,735주 = 17.3억 <span class="src">실측</span></span></li>
      <li><span class="t">+60초</span><span>잔량 17.3억 · 매도 비중 37% · 취소/신규 0.19 <span class="src">실측</span></span></li>
      <li><span class="t">14:40:07</span><span>5,680 체결 → 잠김 ③ 깨짐(43분) <span class="src">실측</span></span></li>
    </ul>
    <h3 style="margin-top:12px">창구 비중 <small>B9 1분 증분 배분</small> <span class="src">추정(분 단위)</span></h3>
    <div class="lane">진입 1분 매수</div>
    <div class="bars"><span>키움</span><div class="b"><span style="width:41%"></span></div><span class="k">41%</span><span>신한</span><div class="b"><span style="width:27%"></span></div><span class="k">27%</span><span>미래에셋</span><div class="b"><span style="width:12%"></span></div><span class="k">12%</span></div>
    <div class="lane" style="margin-top:8px">깨짐 전 1분 매도</div>
    <div class="bars"><span>신한</span><div class="b sell"><span style="width:38%"></span></div><span class="k">38%</span><span>키움</span><div class="b sell"><span style="width:22%"></span></div><span class="k">22%</span><span>KB</span><div class="b sell"><span style="width:15%"></span></div><span class="k">15%</span></div>
    </div></div></div>`;
}
function fingerSec() {
  return `<div class="sec"><h3>창구 지문표 <small>사건 10건 미만은 관찰 중</small></h3><div class="xs"><table><thead><tr><th>창구</th><th>사건</th><th>진입 1분 매수</th><th>잠김 중 매수</th><th>깨짐 전 1분 매도</th><th>매도 선행</th><th>유지율</th><th>상태</th></tr></thead><tbody>
    <tr class="obs"><td>키움 00050</td><td>9</td><td>33%</td><td>29%</td><td>18%</td><td>2/5</td><td>4/9</td><td><span class="tag obs">관찰 중</span></td></tr>
    <tr class="obs"><td>신한 00002</td><td>7</td><td>24%</td><td>12%</td><td>41%</td><td>4/4</td><td>2/7</td><td><span class="tag obs">관찰 중</span></td></tr>
    <tr class="obs"><td>미래에셋 00003</td><td>6</td><td>15%</td><td>22%</td><td>9%</td><td>0/3</td><td>5/6</td><td><span class="tag obs">관찰 중</span></td></tr>
    <tr class="obs"><td>KB 00001</td><td>5</td><td>11%</td><td>8%</td><td>15%</td><td>1/3</td><td>2/5</td><td><span class="tag obs">관찰 중</span></td></tr>
  </tbody></table></div></div>`;
}
function ydaySec() {
  return `<div class="sec"><h3>어제 결과 <small>10/01 잠김 → D+1 시가</small></h3><div class="xs"><table><thead><tr><th>종목</th><th>상한가</th><th>D+1 시가</th><th>손익</th></tr></thead><tbody>
    <tr><td>원일티엔아이</td><td>14,100</td><td>14,450</td><td style="color:var(--up)">+2.5%</td></tr><tr><td>덕우전자</td><td>5,730</td><td>5,640</td><td style="color:var(--down)">−1.6%</td></tr></tbody></table></div></div>`;
}
function content() {
  if (S.v === 'A') return kpi() + gridSec() + eventCard(S.pick) + fingerSec() + ydaySec();
  if (S.v === 'B') return S.detail ? `<div class="back" data-back>‹ 10/02 하루 격자</div>` + eventCard(S.pick) : kpi() + gridSec() + ydaySec() + `<div class="sec"><h3>창구 지문표 <small>접힘 · 펼치기 ›</small></h3></div>`;
  const tabs = `<div class="tabs3"><span class="${S.tab === 'day' ? 'on' : ''}" data-tab="day">하루</span><span class="${S.tab === 'ev' ? 'on' : ''}" data-tab="ev">사건</span><span class="${S.tab === 'mem' ? 'on' : ''}" data-tab="mem">창구</span></div>`;
  if (S.tab === 'day') return tabs + kpi() + gridSec() + ydaySec();
  if (S.tab === 'ev') return tabs + `<div class="chips">${ROWS.map((r, i) => `<span class="${S.pick === i ? 'on' : ''}" data-pick="${i}">${r[0]}</span>`).join('')}</div>` + eventCard(S.pick);
  return tabs + fingerSec() + `<div class="sec"><h3>창구별 사건 목록 <small>신한 7건</small></h3><div class="xs"><table><thead><tr><th>날짜</th><th>종목</th><th>진입 매수</th><th>깨짐 전 매도</th><th>결과</th></tr></thead><tbody><tr><td>10/02</td><td>피제이전자 ③</td><td>27%</td><td>38%</td><td><span class="tag broke">깨짐</span></td></tr><tr><td>10/02</td><td>머큐리 ①</td><td>19%</td><td>52%</td><td><span class="tag broke">깨짐</span></td></tr></tbody></table></div></div>`;
}
function frame() {
  return `<div class="f ${S.w} ${S.t === 'dark' ? 'dark' : ''}">
    <aside class="side"><div class="brand">gh-radar</div><a>홈</a><a>검색</a><a>트레이딩</a><a class="on">분석</a><div class="sub"><a class="on">상한가 보고서</a></div><a>AI 애널리스트</a><a>My page</a></aside>
    <div class="main">
      <div class="top"><span class="ham">☰</span><span class="ttl">상한가 보고서</span><span class="sp"></span><span class="date"><span>‹</span>10/02 (목)<span>›</span></span></div>
      <div class="scroll">${content()}</div>
      <div class="tabbar"><i></i><i></i><i></i><i class="on"></i><i></i></div>
    </div></div>`;
}
function render() {
  document.getElementById('stage').innerHTML = frame();
  document.getElementById('desc').innerHTML = DESC[S.v];
  for (const k of ['v', 'w', 't']) document.querySelectorAll(`#nav [data-${k}]`).forEach(b => b.classList.toggle('on', b.dataset[k] === S[k]));
}
document.getElementById('nav').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.v) { S.v = b.dataset.v; S.detail = false; S.tab = 'day'; } if (b.dataset.w) S.w = b.dataset.w; if (b.dataset.t) S.t = b.dataset.t;
  render();
});
document.getElementById('stage').addEventListener('click', e => {
  const row = e.target.closest('[data-row]'); if (row) { S.pick = +row.dataset.row; if (S.v === 'B') S.detail = true; if (S.v === 'C') S.tab = 'ev'; render(); if (S.v === 'A') document.getElementById('ev')?.scrollIntoView({ behavior: 'smooth' }); return; }
  if (e.target.closest('[data-back]')) { S.detail = false; return render(); }
  const tb = e.target.closest('[data-tab]'); if (tb) { S.tab = tb.dataset.tab; return render(); }
  const pk = e.target.closest('[data-pick]'); if (pk) { S.pick = +pk.dataset.pick; return render(); }
});
render();
</script>
</body>
