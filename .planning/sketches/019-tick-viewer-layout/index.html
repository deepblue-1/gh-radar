<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sketch 019 — 틱 전문 뷰어 배치</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #0c0c0f; color: #ddd; font-family: -apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif; }
#nav { position: sticky; top: 0; z-index: 50; background: #0c0c0f; border-bottom: 1px solid #26262c; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 13px; }
#nav .g { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
#nav .l { color: #777; font-size: 12px; margin-right: 4px; }
#nav button { font: inherit; background: #1b1b20; color: #bbb; border: 1px solid #2a2a31; border-radius: 7px; padding: 5px 10px; cursor: pointer; }
#nav button.on { background: #f2f2f2; color: #111; border-color: #f2f2f2; font-weight: 700; }
#desc { flex-basis: 100%; color: #9a9aa2; font-size: 12.5px; line-height: 1.6; }
#desc b { color: #eee; }
#stage { display: flex; justify-content: center; padding: 20px 12px 60px; overflow-x: auto; }

/* gh-radar globals.css 실제 토큰 (라이트 / 다크) — 018 과 같은 사본 */
.f {
  --bg:#ffffff; --surface:#f2f4f6; --card:#ffffff; --muted:#f2f4f6; --raised-2:#e5e8eb; --fg:#191f28; --fg-2:#333d4b; --muted-fg:#6b7684; --faint:#b0b8c1;
  --border-subtle:#e5e8eb; --up:#f04452; --down:#3182f6; --up-bg:#ffeeee; --down-bg:#e8f1ff; --flat:#6b7684; --team:#a234c7; --team-bg:#f9f0fc;
  --vi:#d97706; --vi-bg:#fff4e6; --new-bg:#fff6d9; --new-bd:#ffd257; --pill-on-bg:#e8f3ff; --pill-on-fg:#1b64da; --primary:#3182f6; --primary-fg:#fff;
  --font:'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif;
  background: var(--surface); color: var(--fg); font-family: var(--font); -webkit-font-smoothing: antialiased;
  border-radius: 14px; box-shadow: 0 0 0 1px #2a2a30, 0 30px 80px rgba(0,0,0,.5); flex: none; overflow: hidden; display: flex; flex-direction: column;
}
.f.dark { --bg:#0a0a0a; --surface:#0a0a0a; --card:#151515; --muted:#2d2d2d; --raised-2:#3d3d3d; --fg:#ffffff; --fg-2:#e4e4e4; --muted-fg:#9e9e9e; --faint:#636363;
  --border-subtle:#3d3d3d; --up:#f04251; --down:#3485fa; --up-bg:rgba(240,66,81,.16); --down-bg:rgba(52,133,250,.16); --flat:#9e9e9e; --team:#c353e5; --team-bg:rgba(174,61,209,.16);
  --vi:#ffb020; --vi-bg:rgba(255,176,32,.16); --new-bg:#3a3014; --new-bd:#6d5a1d; --pill-on-bg:#4e4e4e; --pill-on-fg:#fff; --primary:#3485fa; }
.f.phone { width: 390px; height: 800px; }
.f.desktop { width: 1280px; height: 800px; }
.mono { font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--flat); } .mf { color: var(--muted-fg); } .team-c { color: var(--team); }
.num { font-variant-numeric: tabular-nums; }

/* ── 공통: 머리 ── */
.hdr { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 16px 8px; }
.phone .hdr { padding: 10px 12px 6px; gap: 6px 10px; }
.hdr h1 { margin: 0; font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.phone .hdr h1 { font-size: 15px; }
.src { display: inline-flex; align-items: center; background: var(--muted); color: var(--muted-fg); border-radius: 6px; padding: 2px 8px; font-size: 11px; white-space: nowrap; font-weight: 500; }
.src.live { background: var(--up-bg); color: var(--up); }
.sel { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pill { font: inherit; font-size: 12.5px; font-weight: 600; background: var(--card); color: var(--fg); border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.pill small { color: var(--muted-fg); font-weight: 500; margin-left: 4px; }
.seg { display: inline-flex; background: var(--muted); border-radius: 999px; padding: 2px; }
.seg button { font: inherit; font-size: 11.5px; font-weight: 600; border: 0; background: transparent; color: var(--fg-2); border-radius: 999px; padding: 4px 10px; cursor: pointer; transition: all .15s; }
.seg button.on { background: var(--pill-on-bg); color: var(--pill-on-fg); }
.clock { margin-left: auto; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.phone .clock { margin-left: 0; flex-basis: 100%; }
.clock b { font-size: 22px; font-weight: 700; letter-spacing: -.2px; }
.phone .clock b { font-size: 19px; }
.clock span { font-size: 11.5px; color: var(--muted-fg); }

/* ── 공통: 트랜스포트(슬라이더) ── */
.tr { display: flex; align-items: center; gap: 10px; padding: 8px 16px 10px; background: var(--card); border-top: 1px solid var(--border-subtle); flex-wrap: wrap; }
.phone .tr { padding: 8px 12px 10px; gap: 8px; }
.ib { font: inherit; width: 32px; height: 32px; border-radius: 10px; border: 0; background: var(--muted); color: var(--fg); cursor: pointer; font-size: 15px; font-weight: 700; transition: all .15s; }
.ib:hover { background: var(--raised-2); }
.ib.on { background: var(--primary); color: var(--primary-fg); }
.sl { position: relative; flex: 1 1 260px; height: 38px; min-width: 0; }
.sl svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.sl input { position: absolute; left: 0; right: 0; bottom: 2px; width: 100%; margin: 0; -webkit-appearance: none; appearance: none; background: transparent; height: 20px; cursor: pointer; }
.sl input::-webkit-slider-runnable-track { height: 3px; background: var(--raised-2); border-radius: 2px; }
.sl input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--fg); margin-top: -5.5px; box-shadow: 0 0 0 3px var(--card); }
.ax { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; font-size: 9.5px; color: var(--faint); pointer-events: none; }
.tin { font: inherit; font-size: 12.5px; width: 118px; height: 32px; border-radius: 10px; border: 1px solid var(--border-subtle); background: var(--bg); color: var(--fg); padding: 0 10px; font-variant-numeric: tabular-nums; }
.tin:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
.tb { font: inherit; font-size: 12px; font-weight: 600; height: 32px; border-radius: 10px; border: 0; background: var(--muted); color: var(--fg); padding: 0 12px; cursor: pointer; }
.kb { font-size: 10.5px; color: var(--faint); white-space: nowrap; }
.phone .kb { display: none; }

/* ── 패널 공통 ── */
.body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.panel { background: var(--card); border-radius: 14px; display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.ph { display: flex; align-items: center; gap: 8px; padding: 9px 12px; font-size: 12.5px; font-weight: 700; border-bottom: 1px solid var(--border-subtle); flex: none; }
.ph small { font-weight: 500; color: var(--muted-fg); font-size: 11px; }
.ph .seg { margin-left: auto; }
.ph .seg button { padding: 3px 9px; font-size: 11px; }
.pb { flex: 1; min-height: 0; overflow: auto; }
.empty { padding: 20px; color: var(--muted-fg); font-size: 12px; text-align: center; }

/* 호가 사다리 (components/orderbook 규칙: 매도행 --down-bg 65% · 매수행 --up-bg 65% · 바 16% · 숫자 --fg) */
table.lad { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
.lad th { font-size: 10.5px; font-weight: 600; color: var(--muted-fg); background: var(--muted); padding: 5px 6px; text-align: center; position: sticky; top: 0; }
.lad td { height: 26px; padding: 0 6px; white-space: nowrap; position: relative; border-top: 1px solid var(--border-subtle); }
.lad tr.ask td { background: color-mix(in oklab, var(--down-bg) 65%, transparent); }
.lad tr.bid td { background: color-mix(in oklab, var(--up-bg) 65%, transparent); }
.lad td.q i { position: absolute; top: 3px; bottom: 3px; border-radius: 5px; }
.lad tr.ask td.q i { right: 0; background: color-mix(in oklab, var(--down) 16%, transparent); }
.lad tr.bid td.q i { left: 0; background: color-mix(in oklab, var(--up) 16%, transparent); }
.lad td.q span { position: relative; z-index: 1; color: var(--fg); }
.lad tr.ask td.q { text-align: left; } .lad tr.bid td.q { text-align: right; }
.lad td.p { text-align: center; font-weight: 600; }
.lad td.p .hit { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--fg); margin-left: 5px; vertical-align: 1px; }
.lad tr.cur td.p { box-shadow: inset 0 0 0 1.5px var(--fg); border-radius: 4px; }
.lad tr.tot td { background: var(--muted); font-size: 11px; font-weight: 600; text-align: center; color: var(--muted-fg); height: 24px; }
.lad tr.tot td.n { color: var(--fg); }

/* 전문 목록 (ATMParser 식 행 = 전문 하나) */
table.msg { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.msg th { font-size: 10.5px; font-weight: 600; color: var(--muted-fg); background: var(--muted); padding: 5px 8px; text-align: left; position: sticky; top: 0; white-space: nowrap; z-index: 1; }
.msg td { height: 28px; padding: 0 8px; white-space: nowrap; border-top: 1px solid var(--border-subtle); cursor: pointer; }
.msg tr:hover td { background: color-mix(in oklab, var(--muted) 70%, transparent); }
.msg tr.sel td { background: color-mix(in oklab, var(--fg) 12%, transparent); }
.msg tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--fg); }
.msg tr.runb td { background: color-mix(in oklab, var(--team) 8%, transparent); }
.msg tr.runb.sel td { background: color-mix(in oklab, var(--fg) 12%, transparent); }
.msg td.t { color: var(--muted-fg); font-size: 11px; }
.msg td.t b { color: var(--fg); font-weight: 600; }
.msg td.s { color: var(--muted-fg); font-size: 10.5px; }
.msg td.d { overflow: hidden; text-overflow: ellipsis; max-width: 0; width: 100%; }
.badge { display: inline-flex; align-items: center; height: 17px; border-radius: 4px; padding: 0 5px; font-size: 9.5px; font-weight: 700; border: 1px solid transparent; vertical-align: middle; }
.bA3 { background: var(--muted); color: var(--fg); }
.bB6 { background: transparent; color: var(--muted-fg); border-color: var(--border-subtle); }
.bB9 { background: var(--team-bg); color: var(--team); }
.bR8 { background: var(--vi-bg); color: var(--vi); }
.bC3 { background: var(--pill-on-bg); color: var(--pill-on-fg); }
.chip { display: inline-flex; align-items: center; height: 16px; border-radius: 4px; padding: 0 5px; font-size: 9.5px; font-weight: 700; margin-left: 6px; vertical-align: middle; }
.chip.team { background: var(--team-bg); color: var(--team); }
.chip.norm { background: var(--muted); color: var(--muted-fg); }
.chip.auct { background: var(--vi-bg); color: var(--vi); }
.inv { color: var(--vi); font-size: 10px; margin-left: 4px; }
.buy { color: var(--up); font-weight: 600; } .sellc { color: var(--down); font-weight: 600; }
.tm { box-shadow: inset 2px 0 0 var(--team); }

/* 카드류 */
.card { padding: 12px; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
.kv .k { font-size: 10.5px; color: var(--muted-fg); }
.kv .v { font-size: 15px; font-weight: 700; line-height: 1.25; }
.kv .v small { font-size: 11px; color: var(--muted-fg); font-weight: 500; }
.kv .v.lg { font-size: 20px; }
.big { font-size: 24px; font-weight: 700; letter-spacing: -.3px; line-height: 1.1; }
.big small { font-size: 12px; color: var(--muted-fg); font-weight: 500; margin-left: 4px; }
.bar { height: 6px; border-radius: 3px; background: var(--down-bg); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--up); }
.sub { font-size: 11px; color: var(--muted-fg); line-height: 1.5; margin-top: 8px; }
.shape { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; }
.shape .chip { margin-left: 0; height: 18px; font-size: 10.5px; }
table.rl { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 8px; }
.rl th { font-size: 10px; color: var(--muted-fg); font-weight: 600; text-align: right; padding: 3px 6px; border-bottom: 1px solid var(--border-subtle); }
.rl th:first-child, .rl td:first-child { text-align: left; }
.rl td { padding: 0 6px; height: 24px; text-align: right; white-space: nowrap; border-top: 1px solid var(--border-subtle); cursor: pointer; }
.rl tr.team td:first-child { box-shadow: inset 2px 0 0 var(--team); }
.rl tr.sel td { background: color-mix(in oklab, var(--fg) 10%, transparent); }
.rl tr:hover td { background: color-mix(in oklab, var(--muted) 70%, transparent); }
.rl td.c { text-align: left; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.kchip { display: inline-flex; align-items: baseline; gap: 5px; height: 28px; padding: 0 10px; border-radius: 999px; background: var(--card); font-size: 12px; white-space: nowrap; }
.kchip small { color: var(--muted-fg); font-size: 10.5px; }
.kchip b { font-weight: 700; }
.kchip.team { background: var(--team-bg); }

/* 타임라인 SVG */
svg.tl, svg.zm { display: block; width: 100%; }
svg.tl text, svg.zm text { font-family: var(--font); fill: var(--faint); font-size: 9.5px; }
.tl .cur, .zm .cur { stroke: var(--fg); stroke-width: 1.5; }
.tl .px { fill: none; stroke: var(--fg); stroke-width: 1.2; }
.tl .vol { fill: color-mix(in oklab, var(--muted-fg) 45%, transparent); }
.tl .vi { fill: var(--vi); opacity: .8; }
.tl .tmk { stroke: var(--team); stroke-width: 1; opacity: .8; }
.tl .sess { fill: color-mix(in oklab, var(--fg) 4%, transparent); }
.tl .axis { stroke: var(--border-subtle); }
.zm rect.a3b { fill: var(--up); } .zm rect.a3s { fill: var(--down); } .zm rect.a3t { fill: var(--team); } .zm rect.b6 { fill: var(--faint); opacity: .5; } .zm rect.r8 { fill: var(--vi); } .zm rect.oth { fill: var(--pill-on-fg); opacity: .6; }
.zm rect:hover { opacity: 1; stroke: var(--fg); stroke-width: .5; }

/* ── A: HTS 3단 ── */
.vA .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px minmax(0,1fr) 330px; gap: 10px; padding: 0 16px 10px; }
.vA .right { display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow: auto; }
.vA .right .panel { flex: none; }
.phone .vA .grid { display: flex; flex-direction: column; padding: 0 12px 10px; gap: 8px; }
.phone .vA .grid > .panel, .phone .vA .grid > .right { display: none; flex: 1; min-height: 0; }
.phone .vA .grid[data-pane="lad"] > .p-lad, .phone .vA .grid[data-pane="msg"] > .p-msg, .phone .vA .grid[data-pane="side"] > .right { display: flex; }
.pseg { display: none; padding: 0 12px 8px; }
.phone .pseg { display: flex; }
.pseg .seg { width: 100%; } .pseg .seg button { flex: 1; }

/* ── B: 타임라인 주인공 ── */
.vB .tlwrap { padding: 0 16px 8px; }
.phone .vB .tlwrap { padding: 0 12px 6px; }
.vB .tlcard { background: var(--card); border-radius: 14px; padding: 10px 12px 6px; }
.vB .tlhead { display: flex; align-items: baseline; gap: 10px; font-size: 11.5px; color: var(--muted-fg); margin-bottom: 4px; flex-wrap: wrap; }
.vB .tlhead b { color: var(--fg); font-size: 12.5px; }
.vB .tlhead .chips { margin-left: auto; }
.vB .tlhead .kchip { height: 22px; background: var(--muted); font-size: 11px; }
.vB .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px minmax(0,1fr); gap: 10px; padding: 0 16px 10px; }
.phone .vB .grid { display: flex; flex-direction: column; padding: 0 12px 10px; }
.phone .vB .grid > .panel { display: none; flex: 1; min-height: 0; }
.phone .vB .grid[data-pane="lad"] > .p-lad, .phone .vB .grid[data-pane="tab"] > .p-tab { display: flex; }
.tabs { display: flex; gap: 2px; margin-left: auto; }
.tabs button { font: inherit; font-size: 11.5px; font-weight: 600; border: 0; background: transparent; color: var(--muted-fg); padding: 4px 9px; border-radius: 8px; cursor: pointer; }
.tabs button.on { background: var(--muted); color: var(--fg); }
.p-tab .pb > div { display: none; } .p-tab .pb > div.on { display: block; }
.p-tab .pb > .t-msg.on { display: block; }

/* ── C: 전문 스트림 중심 ── */
.vC .col { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 0 16px 10px; width: 760px; margin: 0 auto; max-width: 100%; position: relative; }
.phone .vC .col { width: 100%; padding: 0 12px 10px; }
.vC .chips { padding: 0 2px; }
.vC .panel { flex: 1; }
.vC .dr { position: absolute; top: 0; right: 16px; bottom: 10px; width: 340px; background: var(--card); border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.35), 0 0 0 1px var(--border-subtle); display: flex; flex-direction: column; transform: translateX(110%); transition: transform .2s ease; z-index: 5; }
.vC .dr.open { transform: none; }
.phone .vC .dr { left: 0; right: 0; top: auto; bottom: 0; width: auto; height: 70%; border-radius: 16px 16px 0 0; transform: translateY(105%); }
.phone .vC .dr.open { transform: none; }
.vC .dr .pb { padding-bottom: 8px; }
.vC .dr .sect { border-top: 1px solid var(--border-subtle); }
.vC .dr .sect:first-child { border-top: 0; }
.vC .xb { margin-left: auto; font: inherit; border: 0; background: var(--muted); color: var(--fg); width: 24px; height: 24px; border-radius: 8px; cursor: pointer; }
.vC .sheet-grab { display: none; width: 36px; height: 4px; border-radius: 2px; background: var(--raised-2); margin: 8px auto 0; }
.phone .vC .sheet-grab { display: block; }
.hint { font-size: 11px; color: var(--faint); padding: 2px 4px; }

/* ── D: 종합 — 매집감지 3판 차트(타임라인) + HTS 3단 ── */
.f.desktop:has(.vD) { height: 880px; }
.vD .tlwrap { padding: 0 16px 8px; }
.phone .vD .tlwrap { padding: 0 12px 6px; }
.vD .tlcard { background: var(--card); border-radius: 14px; padding: 8px 10px 4px; position: relative; }
.vD .tlhead { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--muted-fg); margin-bottom: 2px; flex-wrap: wrap; }
.vD .tlhead b { color: var(--fg); font-size: 12.5px; }
.vD .tlhead .zoom { margin-left: auto; display: inline-flex; gap: 2px; }
.vD .tlhead .zoom button { font: inherit; font-size: 11px; font-weight: 600; border: 0; background: var(--muted); color: var(--fg); border-radius: 7px; padding: 2px 8px; cursor: pointer; }
.vD .tlhead .zoom button.on { background: var(--pill-on-bg); color: var(--pill-on-fg); }
svg.acc { display: block; width: 100%; cursor: grab; touch-action: pan-y; user-select: none; }
svg.acc.drag { cursor: grabbing; }
.acc text { font-family: var(--font); fill: var(--muted-fg); font-size: 10px; }
.acc text.ttl { fill: var(--muted-fg); font-size: 10px; font-weight: 600; }
.acc .grid { stroke: var(--border-subtle); stroke-dasharray: 2 3; }
.acc .axis { stroke: var(--border-subtle); }
.acc .pre { fill: color-mix(in oklab, var(--muted-fg) 10%, transparent); }
.acc .gapb { fill: color-mix(in oklab, var(--muted-fg) 14%, transparent); }
.acc .vib { fill: color-mix(in oklab, var(--vi) 22%, transparent); }
.acc .px { fill: none; stroke: var(--fg); stroke-width: 1.2; }
.acc .avg { fill: none; stroke: var(--up); stroke-width: 1.25; stroke-dasharray: 1 2; }
.acc .ob { fill: var(--up); fill-opacity: .55; stroke: var(--up); stroke-opacity: .9; cursor: pointer; }
.acc .os { fill: var(--down); fill-opacity: .55; stroke: var(--down); stroke-opacity: .9; cursor: pointer; }
.acc circle:hover { fill-opacity: .9; }
.acc .net { fill: none; stroke: var(--team); stroke-width: 2.2; }
.acc .pos { fill: none; stroke: var(--muted-fg); stroke-width: 1; stroke-opacity: .7; }
.acc .zero { stroke: var(--muted-fg); stroke-width: .8; }
.acc .bb { fill: var(--up); fill-opacity: .7; } .acc .bs { fill: var(--down); fill-opacity: .7; }
.acc .cur { stroke: var(--fg); stroke-width: 1.5; }
.acc .curlab { fill: var(--fg); } .acc .curtxt { fill: var(--bg); font-weight: 700; font-size: 10px; }
.acc .hov { stroke: var(--muted-fg); stroke-width: 1; stroke-dasharray: 3 3; pointer-events: none; }

function buildB(){
  return '<div class="vB body">'+headerHTML()+
    '<div class="tlwrap"><div class="tlcard"><div class="tlhead"><b>하루 타임라인</b><span>5분 거래대금 · 가격 · <span style="color:var(--vi)">VI</span> · <span class="team-c">팀 버스트</span></span><div class="chips" data-role="chips"></div></div><svg class="tl" data-role="tl"></svg><svg class="zm" data-role="zm"></svg></div></div>'+
    '<div class="pseg"><div class="seg" data-role="pane"><button data-p="lad" class="'+(st.pane==='lad'?'on':'')+'">호가</button><button data-p="tab" class="'+(st.pane!=='lad'?'on':'')+'">전문 · 버스트 · 팀</button></div></div>'+
    '<div class="grid" data-pane="'+(st.pane==='lad'?'lad':'tab')+'">'+
      '<div class="panel p-lad">'+ladderHeadHTML()+'<div class="pb" data-role="lad"></div></div>'+
      '<div class="panel p-tab"><div class="ph"><span data-role="tabtitle">전문 목록</span> <small data-role="msg-meta"></small><div class="tabs" data-role="tabs"><button data-tab="msg" class="'+(st.tab==='msg'?'on':'')+'">전문</button><button data-tab="burst" class="'+(st.tab==='burst'?'on':'')+'">버스트</button><button data-tab="team" class="'+(st.tab==='team'?'on':'')+'">팀</button></div><div class="seg" data-role="order" style="margin-left:8px"><button data-o="recv" class="'+(st.order==='recv'?'on':'')+'">수신순</button><button data-o="ex" class="'+(st.order==='ex'?'on':'')+'">거래소순</button></div></div>'+
      '<div class="pb"><div class="t-msg'+(st.tab==='msg'?' on':'')+'" data-role="msg"></div><div class="'+(st.tab==='burst'?'on':'')+'" data-role="burst"></div><div class="'+(st.tab==='team'?'on':'')+'" data-role="team"></div></div></div>'+
    '</div>'+transportHTML()+'</div>';
}
function buildC(){
  return '<div class="vC body">'+headerHTML()+
    '<div class="col"><div class="chips" data-role="chips"></div>'+
      '<div class="panel">'+msgHeadHTML()+'<div class="pb" data-role="msg"></div></div>'+
      '<aside class="dr'+(st.drawer?' open':'')+'"><div class="sheet-grab"></div><div class="ph">이 틱 <small data-role="lad-meta"></small>'+ladUnitSeg()+'<button class="xb" data-act="close" style="margin-left:6px">✕</button></div><div class="pb"><div class="sect" data-role="lad"></div><div class="sect"><div class="ph" style="border-bottom:0;padding-bottom:0">이 주문</div><div data-role="burst"></div></div><div class="sect"><div class="ph" style="border-bottom:0;padding-bottom:0">거래대금</div><div data-role="value"></div></div></div></aside>'+
      '<div class="hint">행을 누르면 그 틱의 호가창 · 주문 · 거래대금이 '+(st.w==='phone'?'아래에서':'오른쪽에')+' 열린다</div>'+
    '</div>'+transportHTML()+'</div>';
}
function build(){
  frame.className='f '+st.t+' '+st.w;
  frame.innerHTML=st.v==='a'?buildA():st.v==='b'?buildB():st.v==='c'?buildC():buildD();
  const acc=$('svg.acc',frame); if(acc) accBind(acc);
  $('#desc').innerHTML=DESC[st.v];
  $$('#nav [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===st.v));
  $$('#nav [data-w]').forEach(b=>b.classList.toggle('on',b.dataset.w===st.w));
  $$('#nav [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===st.t));
  $$('#nav [data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===st.mode));
  const dens=$('[data-role=dens]',frame); if(dens) densSVG(dens);
  render();
}
function render(){
  const i=st.cur, m=msgs[i];
  const set=(role,html)=>{ $$('[data-role='+role+']',frame).forEach(el=>el.innerHTML=html); };
  $('[data-role=t-recv]',frame).textContent=fT(m.recvUs);
  $('[data-role=t-ex]',frame).textContent='거래소 '+fT(m.exUs,true);
  $('[data-role=t-seq]',frame).textContent='seq '+fN(m.seq)+' · '+m.type;
  set('lad',ladderHTML(i)); set('lad-meta',ladderMeta(i)); set('msg',msgListHTML(i)); set('msg-meta',msgMeta(i));
  if($('[data-role=burst]',frame)) set('burst',burstHTML(i));
  if($('[data-role=value]',frame)) set('value',valueHTML(i));
  if($('[data-role=team]',frame)) set('team',teamHTML(i,false));
  if($('[data-role=chips]',frame)) set('chips',teamChipsHTML(i));
  const tl=$('[data-role=tl]',frame); if(tl){ tlSVG(tl,i); zmSVG($('[data-role=zm]',frame),i); }
  const acc=$('svg.acc',frame); if(acc){ accFollow(i); accSVG(acc,i); }
  const tt=$('[data-role=tabtitle]',frame); if(tt) tt.textContent=st.tab==='msg'?'전문 목록':st.tab==='burst'?'이 주문 · 체결 버스트':'팀 거래정보';
  const sl=$('[data-role=slider]',frame); const tus=st.order==='recv'?m.recvUs:m.exUs; sl.value=Math.round(tus/1000);
  const tin=$('[data-role=tin]',frame); if(document.activeElement!==tin) tin.value=fT(tus);
  $('[data-act=play]',frame).classList.toggle('on',st.playing); $('[data-act=play]',frame).textContent=st.playing?'❚❚':'▶';
  // 선택 행을 가운데로
  $$('[data-role=msg]',frame).forEach(box=>{ const row=$('tr.sel',box); if(row){ const sc=box.classList.contains('pb')?box:box.closest('.pb'); if(sc){ const top=row.offsetTop-sc.clientHeight/2+row.offsetHeight/2; sc.scrollTop=Math.max(0,top); } } });
}

// ───────── 이벤트 ─────────
$('#nav').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.v){ st.v=b.dataset.v; st.drawer=false; st.pane='msg'; } if(b.dataset.w){ st.w=b.dataset.w; } if(b.dataset.t) st.t=b.dataset.t;
  if(b.dataset.m){ st.mode=b.dataset.m; if(st.mode==='today'){ st.cur=idxAtPos(N-1); } }
  build(); });
frame.addEventListener('click',e=>{
  const row=e.target.closest('tr[data-i]'); if(row){ st.cur=+row.dataset.i; if(st.v==='c') st.drawer=true; $('.dr',frame)?.classList.toggle('open',st.drawer); render(); return; }
  const rr=e.target.closest('tr[data-run]'); if(rr){ const r=runs[+rr.dataset.run-1]; st.cur=r.pieces[r.pieces.length-1]; render(); return; }
  const zr=e.target.closest('svg.zm rect[data-i]'); if(zr){ st.cur=+zr.dataset.i; render(); return; }
  const tl=e.target.closest('svg.tl'); if(tl){ const r=tl.getBoundingClientRect(); const us=T(8)+(e.clientX-r.left)/r.width*12*H; jumpTime(us); return; }
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.z){ const z=b.dataset.z; if(z==='in') accZoom(0.5); else if(z==='out') accZoom(2); else if(z==='all'){ st.view={t0:T(8),t1:T(20)}; render(); } else { const r=z==='1m'?M:10*S; const m=msgs[st.cur]; const c=st.order==='recv'?m.recvUs:m.exUs; st.view=clampView(c-r/2,c+r/2); render(); } return; }
  if(b.dataset.u){ st.ladUnit=b.dataset.u; $$('[data-u]',frame).forEach(x=>x.classList.toggle('on',x.dataset.u===st.ladUnit)); render(); return; }
  if(b.dataset.ex){ st.ex=b.dataset.ex; $$('[data-ex]',frame).forEach(x=>x.classList.toggle('on',x.dataset.ex===st.ex)); return; }
  if(b.dataset.o){ st.order=b.dataset.o; $$('[data-o]',frame).forEach(x=>x.classList.toggle('on',x.dataset.o===st.order)); render(); return; }
  if(b.dataset.p){ st.pane=b.dataset.p; $$('[data-p]',frame).forEach(x=>x.classList.toggle('on',x.dataset.p===st.pane)); $('.grid',frame).dataset.pane=st.pane; render(); return; }
  if(b.dataset.tab){ st.tab=b.dataset.tab; $$('[data-tab]',frame).forEach(x=>x.classList.toggle('on',x.dataset.tab===st.tab)); const pb=$('.p-tab .pb',frame); [...pb.children].forEach((c,k)=>c.classList.toggle('on',['msg','burst','team'][k]===st.tab)); render(); return; }
  const act=b.dataset.act;
  if(act==='prev') step(-1); else if(act==='next') step(1); else if(act==='play') togglePlay();
  else if(act==='jump'){ const us=parseT($('[data-role=tin]',frame).value); if(us!=null) jumpTime(us); }
  else if(act==='end'){ st.cur=idxAtPos(N-1); render(); }
  else if(act==='close'){ st.drawer=false; $('.dr',frame).classList.remove('open'); }
});
frame.addEventListener('input',e=>{ if(e.target.dataset.role==='slider'){ jumpTime(+e.target.value*1000); } });
frame.addEventListener('change',e=>{ if(e.target.dataset.role==='slider') e.target.blur(); }); // 드래그 뒤 ← → 가 틱 이동으로 돌아오게
frame.addEventListener('keydown',e=>{ if(e.target.dataset.role==='tin'&&e.key==='Enter'){ const us=parseT(e.target.value); if(us!=null){ jumpTime(us); e.target.blur(); } } });
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(e.key==='ArrowLeft'){ e.preventDefault(); step(e.shiftKey?-10:-1); } else if(e.key==='ArrowRight'){ e.preventDefault(); step(e.shiftKey?10:1); } else if(e.key===' '){ e.preventDefault(); togglePlay(); } else if(e.key==='Escape'&&st.drawer){ st.drawer=false; $('.dr',frame)?.classList.remove('open'); }
  else if(st.v==='d'&&(e.key==='+'||e.key==='=')) accZoom(0.5); else if(st.v==='d'&&e.key==='-') accZoom(2); else if(st.v==='d'&&e.key==='0'){ st.view={t0:T(8),t1:T(20)}; render(); } });
function togglePlay(){ st.playing=!st.playing; if(timer){ clearInterval(timer); timer=null; } if(st.playing){ timer=setInterval(()=>{ if(posOf(st.cur)>=N-1){ togglePlay(); return; } step(1); },140); } render(); }
build();
</script>
</body>
</html>
