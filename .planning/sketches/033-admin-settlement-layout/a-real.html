<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sketch 033 · 3차 — 정산 화면 A안 · 예수금 기준</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #0c0c0f; color: #ddd; font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif; }
#nav { position: sticky; top: 0; z-index: 50; background: #0c0c0f; border-bottom: 1px solid #26262c; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 13px; }
#nav .g { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
#nav .l { color: #777; font-size: 12px; margin-right: 4px; }
#nav button { font: inherit; background: #1b1b20; color: #bbb; border: 1px solid #2a2a31; border-radius: 7px; padding: 5px 10px; cursor: pointer; }
#nav button:hover { border-color: #555; }
#nav button.on { background: #f2f2f2; color: #111; border-color: #f2f2f2; font-weight: 700; }
#desc { flex-basis: 100%; color: #9a9aa2; font-size: 12.5px; line-height: 1.65; }
#desc b { color: #eee; }
#stage { display: flex; flex-direction: column; align-items: center; gap: 48px; padding: 44px 12px 80px; }

.tk {
  --bg: #0a0a0a; --card: #151515; --muted: #2d2d2d; --hair: rgba(255,255,255,.06); --hair2: #3d3d3d;
  --fg: #fff; --mfg: #9e9e9e; --faint: #636363;
  --up: #f04251; --down: #3485fa; --primary: #3485fa; --warn: #e8a23a; --ok: #2bb8a6;
  font-variant-numeric: tabular-nums; word-break: keep-all; color: var(--fg); color-scheme: dark;
}
.tk.light {
  --bg: #fff; --card: #f9fafb; --muted: #f2f4f6; --hair: #f2f4f6; --hair2: #e5e8eb;
  --fg: #191f28; --mfg: #6b7684; --faint: #b0b8c1;
  --up: #f04452; --down: #3182f6; --primary: #3182f6; --warn: #c77d0a; --ok: #0e9484;
  color-scheme: light;
}
.f { width: 1040px; max-width: 100%; background: var(--bg); border-radius: 14px; box-shadow: 0 0 0 1px #2a2a30; padding: 22px 24px 30px; position: relative; }
.f.ph { width: 390px; padding: 16px 14px 24px; }
.cap { position: absolute; top: -24px; left: 4px; font-size: 12px; color: #888; white-space: nowrap; }
.cap b { color: #eee; }

.hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
.hd h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -.02em; }
.acts { display: flex; gap: 8px; }
.btn { font: inherit; font-size: 13px; font-weight: 600; border-radius: 10px; padding: 9px 14px; border: 0; cursor: pointer; background: var(--muted); color: var(--fg); transition: filter .15s; white-space: nowrap; }
.btn:hover { filter: brightness(1.12); }
.btn.pri { background: var(--primary); color: #fff; }
.btn.sm { font-size: 12.5px; padding: 6px 12px; border-radius: 8px; background: var(--card); box-shadow: 0 0 0 1px var(--hair2); }
.btn.dng { color: var(--up); }
.btn.pri.dng { background: var(--up); color: #fff; }
.btn:disabled { opacity: .4; cursor: default; filter: none; }

.card { background: var(--card); border: 1px solid var(--hair); border-radius: 16px; padding: 16px 18px; min-width: 0; }
.ph .card { padding: 14px 14px; }
.g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ph .g3, .ph .g2 { grid-template-columns: minmax(0, 1fr); }
.mt { margin-top: 12px; }
.sec { font-size: 15px; font-weight: 600; margin: 0 0 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 4px 10px; flex-wrap: wrap; }
.sec small { font-size: 12.5px; font-weight: 400; color: var(--mfg); }
.lab { font-size: 12.5px; color: var(--mfg); }
.dim { color: var(--mfg); }
.faint { color: var(--faint); }
.wn { color: var(--warn); }
.er { color: var(--up); }
.up { color: var(--up); }
.dn { color: var(--down); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 99px; margin-right: 6px; vertical-align: 1px; }

.pn { font-size: 14px; font-weight: 600; }
.big { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin: 2px 0 10px; white-space: nowrap; }
.big small { font-size: 14px; font-weight: 500; color: var(--mfg); margin-left: 3px; }
.kv { border-top: 1px solid var(--hair2); padding-top: 8px; }
.kv > div { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 4px 0; }
.kv > div > span:last-child { white-space: nowrap; }
.kv .k { color: var(--mfg); }
.kv .s { font-size: 12px; color: var(--faint); padding-top: 0; justify-content: flex-end; text-align: right; }
.kv .s > span:last-child { white-space: normal; }
.kv .tot { border-top: 1px solid var(--hair2); margin-top: 6px; padding-top: 9px; font-weight: 600; }

.pool { padding: 12px 0; border-top: 1px solid var(--hair2); }
.pool:first-of-type { border-top: 0; padding-top: 2px; }
.pool .t { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.pool .t b { font-size: 15px; font-weight: 600; }
.pool .t .v { font-size: 18px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
.pool .l3 { font-size: 13px; margin-top: 8px; line-height: 1.6; }

/* 계좌별 예수금 · 넣은 돈 · 수익 표 */
.at { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 5px 18px; align-items: baseline; font-size: 12.5px; margin: 8px 0; }
.ph .at, .dlg .at { gap: 5px 10px; font-size: 12px; }
.at > span { white-space: nowrap; text-align: right; }
.at > .n { text-align: left; color: var(--mfg); }
.at > .h { color: var(--faint); font-size: 11.5px; }
.at > .cm, .at > .nt, .at > .rt { grid-column: 1 / -1; white-space: normal; line-height: 1.5; }
.at > .cm { text-align: right; color: var(--mfg); border-top: 1px solid var(--hair2); padding-top: 6px; }
.at > .nt { text-align: left; color: var(--warn); font-size: 12px; }
.at > .rt { text-align: left; color: var(--faint); font-size: 12px; }

.tr2 > div { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; padding: 5px 0; }
.tr2 > div > b { white-space: nowrap; font-weight: 600; }
.tr2 .s { font-size: 12px; color: var(--faint); padding-top: 0; justify-content: flex-start; }
.tr2 .ln { border-top: 1px solid var(--hair2); margin-top: 4px; padding-top: 9px; }
.zero { margin-top: 10px; padding: 12px 14px; border-radius: 12px; background: var(--muted); font-size: 13px; color: var(--mfg); line-height: 1.5; }
.zero b { display: block; font-size: 18px; font-weight: 700; color: var(--fg); margin-top: 2px; letter-spacing: -.01em; }
.link { font: inherit; font-size: 12.5px; color: var(--primary); background: none; border: 0; padding: 0; cursor: pointer; font-weight: 500; }
.link:hover { text-decoration: underline; }

.seg { display: inline-flex; background: var(--muted); border-radius: 10px; padding: 3px; gap: 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg button { font: inherit; font-size: 13px; font-weight: 500; color: var(--mfg); background: none; border: 0; border-radius: 8px; padding: 6px 14px; cursor: pointer; white-space: nowrap; }
.seg button.on { background: var(--card); color: var(--fg); font-weight: 600; box-shadow: 0 0 0 1px var(--hair2); }
.ph .seg button { padding: 6px 10px; }

.row { display: grid; align-items: center; gap: 4px 12px; padding: 11px 4px; border-top: 1px solid var(--hair2); font-size: 13.5px; }
.list > .row:first-child { border-top: 0; }
.d { color: var(--mfg); font-size: 12.5px; white-space: nowrap; }
.chev { color: var(--faint); font-size: 11px; }
.sr { grid-template-columns: 56px 108px minmax(0, 1fr) auto 16px; grid-template-areas: "d nm per prof chev"; cursor: pointer; border-radius: 8px; }
.sr:hover, .lr:hover { background: var(--hair); }
.ph .sr { grid-template-columns: 52px minmax(0, 1fr) auto 16px; grid-template-areas: "d nm prof chev" "d per per per"; }
.sr .d { grid-area: d; } .sr .nm { grid-area: nm; font-weight: 600; } .sr .per { grid-area: per; font-size: 12.5px; }
.sr .prof1 { grid-area: prof; text-align: right; font-weight: 600; white-space: nowrap; } .sr .chev { grid-area: chev; }
.sub { background: var(--muted); border-radius: 12px; padding: 4px 14px; margin: 0 0 10px; }
.pr { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--hair2); font-size: 13px; }
.pr:first-child { border-top: 0; }
.pr .r { display: flex; gap: 12px; align-items: baseline; white-space: nowrap; }
/* 펼친 줄의 「적은 사람 · 시각」 · 예수금 반영 상태 */
.mr { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 10px; padding: 8px 0; border-top: 1px solid var(--hair2); font-size: 12.5px; }
.mr:first-child { border-top: 0; }
.mr > span:last-child { margin-left: auto; text-align: right; }
.ma { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; padding: 8px 0 10px; border-top: 1px solid var(--hair2); font-size: 12.5px; }
.lr { grid-template-columns: 56px 210px minmax(0, 1fr) auto 16px; grid-template-areas: "d fl wt amt chev"; cursor: pointer; border-radius: 8px; }
.ph .lr { grid-template-columns: 52px minmax(0, 1fr) auto 16px; grid-template-areas: "d fl amt chev" "d wt wt wt"; }
.lr .d { grid-area: d; } .lr .fl { grid-area: fl; font-weight: 600; min-width: 0; }
.lr .fl i { font-style: normal; color: var(--faint); font-weight: 400; margin: 0 2px; }
.lr .wt { grid-area: wt; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; min-width: 0; font-size: 12.5px; }
.lr .amt { grid-area: amt; text-align: right; font-weight: 600; white-space: nowrap; } .lr .chev { grid-area: chev; }
.tag { font-style: normal; font-size: 11.5px; font-weight: 500; padding: 2px 7px; border-radius: 6px; background: var(--muted); color: var(--mfg); white-space: nowrap; }
.tag.hg { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.tag.via { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.tag.nr { color: var(--up); background: color-mix(in srgb, var(--up) 14%, transparent); font-weight: 600; }
.empty { padding: 26px 0; text-align: center; color: var(--mfg); font-size: 13px; }

#sheet { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; padding: 16px; }
#sheet.open { display: flex; }
.dlg { width: 440px; max-width: 100%; max-height: 92vh; overflow: auto; background: var(--card); border-radius: 18px; padding: 20px 20px 18px; box-shadow: 0 0 0 1px var(--hair2), 0 20px 60px rgba(0,0,0,.5); }
.dlg h2 { font-size: 18px; font-weight: 700; margin: 0 0 14px; }
.fl2 { margin-bottom: 14px; }
.fl2 > .lab { display: block; margin-bottom: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chipb { font: inherit; font-size: 13px; font-weight: 500; color: var(--mfg); background: var(--muted); border: 1px solid transparent; border-radius: 99px; padding: 6px 12px; cursor: pointer; }
.chipb.on { color: var(--fg); border-color: var(--fg); font-weight: 600; }
.inp { font: inherit; font-size: 15px; color: var(--fg); background: var(--muted); border: 1px solid transparent; border-radius: 10px; padding: 10px 12px; width: 100%; outline: none; }
.inp:focus { border-color: var(--primary); }
.inp.bad { border-color: var(--up); }
.inrow { display: flex; align-items: center; gap: 8px; }
.inrow span { color: var(--mfg); font-size: 14px; white-space: nowrap; }
.profs { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin: 6px 0 2px; }
.profs small { font-size: 14px; font-weight: 500; color: var(--mfg); margin-left: 3px; }
.split { background: var(--muted); border-radius: 12px; padding: 4px 14px; }
.split > div { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--hair2); font-size: 14px; }
.split > div:first-child { border-top: 0; }
.split b { font-weight: 600; white-space: nowrap; }
.split .r { display: flex; align-items: center; gap: 10px; }
.sw { font: inherit; font-size: 12px; font-weight: 600; border-radius: 99px; padding: 4px 10px; border: 1px solid var(--hair2); background: none; color: var(--mfg); cursor: pointer; white-space: nowrap; }
.sw.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.msg { background: var(--muted); border-radius: 12px; padding: 12px 14px; font-size: 13.5px; line-height: 1.6; }
/* 「예수금에도 반영」 스위치 + 바뀔 값 미리 보기 */
.rf { background: var(--muted); border-radius: 12px; padding: 11px 14px 12px; margin-bottom: 14px; }
.rf .swr { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; font-weight: 600; }
.tg { flex: none; width: 44px; height: 26px; border-radius: 99px; border: 0; padding: 0; background: var(--hair2); position: relative; cursor: pointer; transition: background .15s; }
.tg::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 99px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
.tg.on { background: var(--primary); }
.tg.on::after { transform: translateX(18px); }
.pvl { font-size: 13px; margin-top: 8px; line-height: 1.5; }
.pvl b { font-weight: 600; }
.pvn { font-size: 12.5px; color: var(--mfg); margin-top: 6px; line-height: 1.5; }
.pvw { font-size: 12.5px; color: var(--warn); margin-top: 6px; line-height: 1.5; }
.dact { display: flex; gap: 8px; margin-top: 18px; }
.dact .btn { flex: 1; padding: 12px; font-size: 14px; }
</style>
</head>
<body>
<div id="nav">
  <div class="g"><span class="l">A안 · 3차 · 예수금 기준</span></div>
  <div class="g"><span class="l">폭</span>
    <button data-w="desk" class="on">데스크톱</button>
    <button data-w="ph">폰 390</button>
  </div>
  <div class="g"><span class="l">테마</span>
    <button data-th="dark" class="on">다크</button>
    <button data-th="light">라이트</button>
  </div>
  <div class="g"><span class="l">지금 시각</span>
    <button data-clk="open" class="on">장중 14:32</button>
    <button data-clk="closed">장 마감 뒤 20:40</button>
  </div>
  <div class="g"><span class="l">예수금 읽기</span>
    <button data-st="ok" class="on">정상</button>
    <button data-st="down">교보 서버 꺼짐</button>
    <button data-st="unset">교보 정근형 미설정</button>
  </div>
  <div id="desc"></div>
</div>
<div id="stage"></div>
<div id="sheet"></div>

<script>
// ── 실제 내역(2026-11-19 사용자 진술 · 만원 단위) ────────────────────
const TODAY = '2026-11-19';
const ME = 'hyunjoong@example.com';
const STALE_T = '어제 19:58';
const P = { H: '김현중', G: '정근형', J: '심쥬니' };
const PC = { H: '#2bb8a6', G: '#8b7cf6', J: '#d9902a' };
const ACC = [
  { id: 'kbG', label: 'KB 정근형', owner: 'G', pool: 'p1', br: 'kb' },
  { id: 'kyH', label: '교보 김현중', owner: 'H', pool: 'p1', br: 'ky' },
  { id: 'kyG', label: '교보 정근형', owner: 'G', pool: 'p1', br: 'ky' },
  { id: 'kbH', label: 'KB 김현중', owner: 'H', pool: 'p2', br: 'kb' },
];
const ACCM = Object.fromEntries(ACC.map((a) => [a.id, a]));
const POOL = {
  p1: { name: '현중 · 근형', ratio: { H: 50, G: 50 }, rt: '5 : 5' },
  // base = 이 금액을 넘는 수익부터 나눈다 · guard = 원금보장(손실을 떠안는 사람)
  p2: { name: '쥬니', ratio: { J: 40, H: 30, G: 30 }, rt: '4 : 3 : 3', base: 40000, guard: 'J' },
};
/** 계좌 예수금 — 어드민 계좌 메뉴가 보여 주는 값(D-03). 수익 = 예수금 − 넣은 돈(D-01). */
const DEP = { kbG: 84500, kyH: 68400, kyG: 2000, kbH: 37200 };
let SEQ = 0;
const nid = (p) => p + (++SEQ);
let SETTLES = [];
/** refl = 저장할 때 「예수금에도 반영」 을 켰는가 · pend = 매매 서버에 못 보낸 증감(계좌별). 처음 9건은 예수금을 안 건드린다(D-14). */
let LEDGER = [
  { date: '2025-12-31', kind: '출자', who: 'H', to: 'kbG', amt: 40000 },
  { date: '2025-12-31', kind: '출자', who: 'G', to: 'kbG', amt: 40000 },
  { date: '2026-08-10', kind: '계좌 옮김', from: 'kbG', to: 'kyH', amt: 30000, via: '법인 용역' },
  { date: '2026-09-10', kind: '출자', who: 'J', to: 'kbH', amt: 10000 },
  { date: '2026-09-10', kind: '계좌 옮김', from: 'kbG', to: 'kbH', amt: 10000, memo: '쥬니 묶음 원금' },
  { date: '2026-09-13', kind: '계좌 옮김', from: 'kbG', to: 'kbH', amt: 10000, memo: '쥬니 묶음 원금' },
  { date: '2026-09-13', kind: '계좌 옮김', from: 'kbG', to: 'kyH', amt: 40000 },
  { date: '2026-09-18', kind: '계좌 옮김', from: 'kbG', to: 'kbH', amt: 10000, memo: '쥬니 묶음 원금' },
  { date: '2026-11-01', kind: '계좌 옮김', from: 'kbG', to: 'kyG', amt: 2000 },
].map((t, i) => ({ id: 'i' + (i + 1), refl: false, pend: {}, ...t }));
const KINDS = ['수익 출금', '원금 회수', '출자', '계좌 옮김'];

// ── 상태 ────────────────────────────────────────────────────────────
const S = { th: 'dark', w: 'desk', clk: 'open', st: 'ok', aSeg: 'led', open: {}, lopen: {}, sheet: null };
const nowT = () => (S.clk === 'open' ? '14:32' : '20:40');
const stamp = () => `11/19 ${nowT()}`;
const mkt = () => S.clk === 'open'; // 08:00 ~ 20:00

// ── 계산 ────────────────────────────────────────────────────────────
const sum = (xs) => xs.reduce((a, b) => a + b, 0);
const sumBy = (by) => sum(Object.values(by).map((v) => v || 0));
const share = (pid, profit, p) => Math.round((profit * (POOL[pid].ratio[p] || 0)) / 100);
/** 화면이 읽은 예수금. null = 미설정. */
const dep = (id) => (S.st === 'unset' && id === 'kyG' ? null : DEP[id]);
/** 매매 서버에서 못 읽어 마지막으로 읽어 둔 값을 쓰는 계좌(D-04). 이 계좌에는 예수금도 못 보낸다. */
const stale = (id) => S.st === 'down' && ACCM[id].br === 'ky';
const tin = (id) => sum(LEDGER.filter((t) => t.to === id).map((t) => t.amt));
const tout = (id) => sum(LEDGER.filter((t) => t.from === id).map((t) => t.amt));
/** 넣은 돈 = 그 계좌로 들어온 돈 − 나간 돈. */
const put = (id) => tin(id) - tout(id);
const poolAcc = (pid) => ACC.filter((a) => a.pool === pid);
const poolOk = (pid) => poolAcc(pid).every((a) => dep(a.id) != null);
const cumProfit = (pid) => sum(poolAcc(pid).map((a) => (dep(a.id) || 0) - put(a.id)));
const settledSum = (pid) => sum(SETTLES.filter((s) => s.pool === pid).map((s) => s.profit));
/** 정산 전 수익 = 묶음 누적 수익 − 이미 확정한 정산 수익의 합. */
const openProfit = (pid) => cumProfit(pid) - settledSum(pid);
/** 나눌 수익 — 원금 기준(base)이 있는 묶음은 손실이면 0(회복할 때까지 이월). */

function draftTx(d) {
  const t = { date: d.date, kind: d.kind, amt: parseInt(String(d.amt).replace(/[^0-9]/g, ''), 10) || 0 };
  if (d.memo) t.memo = d.memo;
  if (d.kind === '계좌 옮김') { t.from = d.from; t.to = d.to; if (d.via === '법인 용역') t.via = d.via; }
  else if (d.kind === '출자') { t.who = d.who; t.to = d.to; }
  else { t.from = d.from; t.who = d.who; }
  return t;
}
/** 정산 확정 때 「바로 출금」 으로 만들 거래 줄(만원 미만 버림 · D-09). */
function outRows(s) {
  const pid = s.pool, d = dist(pid);
  return Object.keys(POOL[pid].ratio).filter((q) => s.out[q]).map((q) => ({ kind: '수익 출금', from: payAcc(pid, q), who: q, amt: Math.floor(share(pid, d, q)) }));
}
/** 「예수금에도 반영」 이 켜져 있을 때 바뀔 값. */
function pvHtml() {
  const s = S.sheet; if (!s) return '';
  let cur = {}, want = {};
  if (s.type === 'led') { cur = applied(s.old); want = eff(draftTx(s.d)); }
  else if (s.type === 'settle') want = addMap(outRows(s).map(eff));
  else if (s.type === 'del') cur = applied(s.t);
  else if (s.type === 'cancel') cur = addMap(LEDGER.filter((t) => t.settle === s.id).map(applied));
  if (!s.refl) return '<div class="pvn">예수금은 그대로 둬요</div>';
  return Object.entries(diff(cur, want)).map(([a, v]) => {
    const now = dep(a);
    return `<div class="pvl">${ACCM[a].label} 예수금 <span class="dim">${now == null ? '미설정' : fm(now)}</span> → <b>${fm((now || 0) + v)}</b></div>`;
  }).join('') + (mkt() ? '<div class="pvw">체결과 겹치면 어긋날 수 있어요</div>' : '');
}
const reflBox = () => `<div class="rf"><div class="swr"><span>예수금에도 반영</span><button class="tg ${S.sheet.refl ? 'on' : ''}" id="tg" data-act="refl" aria-label="예수금에도 반영"></button></div><div id="pv">${pvHtml()}</div></div>`;
const txLine = (t) => `${md(t.date)} · ${flowOf(t).replace(/<i>→<\/i>/, ' → ')} · ${t.kind} <b>${won(t.amt)}</b>`;

function sheetHtml() {
  const s = S.sheet;
  if (!s) return '';
  const tk = `tk ${S.th === 'light' ? 'light' : ''}`;
  const accChips = (k, cur) => `<div class="chips">${ACC.map((a) => `<button class="chipb ${a.id === cur ? 'on' : ''}" data-act="set" data-k="${k}" data-val="${a.id}">${a.label}</button>`).join('')}</div>`;
  if (s.type === 'settle') {
    const pid = s.pool, pl = POOL[pid], ok = poolOk(pid), prof = ok ? openProfit(pid) : 0, d = ok ? dist(pid) : 0, can = ok && d > 0, prev = settledSum(pid);
    const outs = can ? outRows(s) : [];
    return `<div class="dlg ${tk}"><h2>정산하기</h2>
      <div class="fl2"><span class="lab">정산 묶음</span><div class="chips">${Object.keys(POOL).map((k) => `<button class="chipb ${k === pid ? 'on' : ''}" data-act="spool" data-val="${k}">${POOL[k].name}</button>`).join('')}</div></div>
      <div class="fl2"><span class="lab">정산 전 수익 · 확정을 누른 순간의 예수금으로 정해요</span>
        <div class="profs ${ok ? cls(prof) : ''}">${ok ? sg(prof) : DASH}<small>원</small></div>
        ${accTable(accRows(pid), { cum: ok && prev ? { cum: cumProfit(pid), prev } : null, rt: `예수금 읽은 시각 오늘 ${nowT()}` })}
        ${mkt() ? '<div class="pvw">체결 중이라 값이 움직이고 있어요</div>' : ''}</div>
      ${can ? `<div class="fl2"><span class="lab">나누기 ${pl.rt} · 지금 뺄 사람만 「바로 출금」</span><div class="split">${Object.entries(pl.ratio).map(([p, r]) =>
        `<div><span>${dot(p)}${P[p]} <span class="dim">${r}%</span></span><span class="r"><b>${sg(share(pid, d, p))}</b><button class="sw ${s.out[p] ? 'on' : ''}" data-act="sout" data-p="${p}">바로 출금</button></span></div>`).join('')}</div>
        ${outs.length ? `<div class="pvn">뺄 계좌 — ${outs.map((o) => `${P[o.who]} ${ACCM[o.from].label}`).join(' · ')} · 금액은 만원 미만을 버리고 적어요</div>` : ''}</div>
      ${outs.length ? reflBox() : ''}
      <div class="fl2"><span class="lab">메모</span><input class="inp" data-f="memo" value="${s.memo || ''}"></div>`
      : `<div class="msg">${!ok ? '예수금이 설정되지 않은 계좌가 있어요. 계좌 메뉴에서 설정한 뒤 정산할 수 있어요.' : pl.base !== undefined ? `원금 ${won(pl.base)}까지 <b>${won(-prof)}</b> 남았습니다. 회복한 뒤부터 ${pl.rt} 로 나눕니다.` : '나눌 수익이 없습니다.'}</div>`}
      <div class="dact"><button class="btn" data-act="close">취소</button><button class="btn pri" data-act="settle-ok" ${can ? '' : 'disabled'}>정산 확정</button></div></div>`;
  }
  if (s.type === 'cancel') {
    const z = SETTLES.find((q) => q.id === s.id), rows = LEDGER.filter((t) => t.settle === s.id);
    const any = rows.some((t) => Object.values(applied(t)).some(Boolean));
    return `<div class="dlg ${tk}"><h2>정산 취소</h2>
      <div class="fl2"><div class="msg">${md(z.date)} ${POOL[z.pool].name} 정산 <b>${sg(z.profit)}</b> 을 취소해요. 이 수익은 「정산 전 수익」 으로 돌아가요.${rows.length ? ` 그날 「바로 출금」 ${rows.length}건도 함께 사라져요.` : ''}</div></div>
      ${any ? reflBox() : ''}
      <div class="dact"><button class="btn" data-act="close">닫기</button><button class="btn pri dng" data-act="cancel-ok">정산 취소</button></div></div>`;
  }
  if (s.type === 'del') {
    const any = Object.values(applied(s.t)).some(Boolean);
    return `<div class="dlg ${tk}"><h2>거래 지우기</h2>
      <div class="fl2"><div class="msg">${txLine(s.t)}<br><span class="dim">이 거래를 지워요. 넣은 돈 · 몫 계산에서 빠져요.</span></div></div>
      ${any ? reflBox() : ''}
      <div class="dact"><button class="btn" data-act="close">닫기</button><button class="btn pri dng" data-act="del-ok">지우기</button></div></div>`;
  }
  const d = s.d, bad = s.bad || {};
  let fields;
  if (d.kind === '계좌 옮김') {
    fields = `<div class="fl2"><span class="lab">보낸 계좌</span>${accChips('from', d.from)}</div>
      <div class="fl2"><span class="lab">받은 계좌</span>${accChips('to', d.to)}</div>
      <div class="fl2"><span class="lab">어떻게 옮겼나</span><div class="chips">${['계좌이체', '법인 용역'].map((v) => `<button class="chipb ${v === d.via ? 'on' : ''}" data-act="set" data-k="via" data-val="${v}">${v}</button>`).join('')}</div></div>`;
  } else if (d.kind === '출자') {
    fields = `<div class="fl2"><span class="lab">넣은 사람</span><div class="chips">${Object.keys(P).map((p) => `<button class="chipb ${p === d.who ? 'on' : ''}" data-act="set" data-k="who" data-val="${p}">${P[p]}</button>`).join('')}</div></div>
      <div class="fl2"><span class="lab">받은 계좌</span>${accChips('to', d.to)}</div>`;
  } else {
    fields = `<div class="fl2"><span class="lab">뺀 계좌</span>${accChips('from', d.from)}</div>
      <div class="fl2"><span class="lab">받는 사람</span><div class="chips">${Object.keys(P).map((p) => `<button class="chipb ${p === d.who ? 'on' : ''}" data-act="set" data-k="who" data-val="${p}">${P[p]}</button>`).join('')}</div></div>`;
  }
  return `<div class="dlg ${tk}"><h2>${s.old ? '거래 고치기' : '거래 기록'}</h2>
    <div class="fl2"><span class="lab">무슨 거래</span><div class="chips">${KINDS.map((k) => `<button class="chipb ${k === d.kind ? 'on' : ''}" data-act="set" data-k="kind" data-val="${k}">${k}</button>`).join('')}</div></div>
    ${fields}
    <div class="fl2"><span class="lab">금액</span><div class="inrow"><input class="inp ${bad.amt ? 'bad' : ''}" data-f="amt" inputmode="numeric" value="${d.amt || ''}" placeholder="0"><span>만원</span></div></div>
    <div class="fl2"><span class="lab">날짜</span><input class="inp ${bad.date ? 'bad' : ''}" type="date" data-f="date" value="${d.date}" max="${TODAY}"></div>
    <div class="fl2"><span class="lab">메모</span><input class="inp" data-f="memo" value="${d.memo || ''}"></div>
    ${reflBox()}
    <div class="dact"><button class="btn" data-act="close">취소</button><button class="btn pri" data-act="led-ok">저장</button></div></div>`;
}

// ── 그리기 ──────────────────────────────────────────────────────────
const DESC = '<b>A안 3차 — 수익 기준을 예수금으로 바꾸면서 달라지는 화면</b>. 숫자는 2차와 같습니다(예수금 8.45억 · 6.84억 · 0.2억 · 3.72억 + 이체 9건 → 지금 몫 전체 9억 2,450만 · 9억 2,450만 · 7,200만 · 「김현중 → 정근형 5,950만이면 맞음」). 새로 보이는 것: ① 「정산 전 수익」 카드 — 계좌별 <b>예수금 · 넣은 돈 · 수익</b> 표와 「예수금 읽은 시각」 ② 「거래 기록」 시트 — <b>날짜</b> 칸 · <b>「예수금에도 반영」 스위치</b>(오늘이면 켜짐 · 지난 날짜면 꺼짐)와 바뀔 값 미리 보기 · 장중 한 줄 ③ 계좌 거래 줄을 누르면 펼쳐져 <b>적은 사람 · 시각 · 예수금 반영 여부 · 고치기 · 지우기</b> ④ 「정산하기」 시트 — 계좌별 예수금과 읽은 시각 · 「바로 출금」 을 고르면 뺄 계좌와 예수금 스위치 ⑤ 정산 기록을 펼치면 <b>확정한 순간의 계좌 표 · 적은 사람 · 「정산 취소」</b>(묶음별 가장 최근 것만) ⑥ 위 「예수금 읽기」 단추 — <b>교보 서버 꺼짐</b>(마지막으로 읽은 값 표시 · 교보 계좌 거래를 저장하면 「예수금 미반영」 → 「다시 반영」) · <b>교보 정근형 미설정</b>(그 묶음 「—」 · 확정 잠김).<br><span style="color:#77777f">눌러 볼 순서 — 「정산하기」 → 현중 · 근형에서 한 사람 「바로 출금」 → 정산 확정 → 정산 기록 펼침 → 정산 취소 / 「거래 기록」 에서 금액을 넣고 날짜를 어제로 바꿔 보기 / 「교보 서버 꺼짐」 에서 교보 계좌가 낀 거래 저장 → 「정상」 으로 돌려 「다시 반영」. 「넣은 돈」 에 마우스를 올리면 들어온 돈 · 나간 돈이 보입니다. 버튼은 실제로 동작합니다.</span>';

function render() {
  const ph = S.w === 'ph';
  document.getElementById('stage').innerHTML = `<div class="f tk ${S.th === 'light' ? 'light' : ''} ${ph ? 'ph' : ''}"><div class="cap"><b>A 사람 먼저 · 3차 예수금 기준</b> · /admin/settlement · ${ph ? '폰 390' : '데스크톱 본문'}</div>${body()}</div>`;
  document.getElementById('desc').innerHTML = DESC;
}
function renderSheet() {
  const el = document.getElementById('sheet');
  el.innerHTML = sheetHtml();
  el.classList.toggle('open', !!S.sheet);
}

document.getElementById('nav').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.w) S.w = b.dataset.w;
  if (b.dataset.th) S.th = b.dataset.th;
  if (b.dataset.clk) S.clk = b.dataset.clk;
  if (b.dataset.st) S.st = b.dataset.st;
  b.parentElement.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
  render(); renderSheet();
});
document.addEventListener('input', (e) => {
  const f = e.target.dataset && e.target.dataset.f, s = S.sheet; if (!f || !s) return;
  if (s.type !== 'led') { s.memo = e.target.value; return; }
  s.d[f] = e.target.value;
  if (f === 'date') { // 스위치 기본값은 날짜로(D-11) — 반영했던 거래를 고칠 때는 켜 둔다
    s.refl = s.old && s.old.refl ? true : e.target.value === TODAY;
    const g = document.getElementById('tg'); if (g) g.classList.toggle('on', s.refl);
  }
  const pv = document.getElementById('pv'); if (pv) pv.innerHTML = pvHtml();
});
document.addEventListener('click', (e) => {
  if (e.target.id === 'sheet') { S.sheet = null; renderSheet(); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const { act, val, id, p, k } = b.dataset, s = S.sheet;
  if (act === 'aseg') S.aSeg = val;
  else if (act === 'hglist') S.aSeg = 'hg';
  else if (act === 'tog') S.open[id] = !S.open[id];
  else if (act === 'ltog') S.lopen[id] = !S.lopen[id];
  else if (act === 'settle') S.sheet = { type: 'settle', pool: 'p1', memo: '', out: {}, refl: true };
  else if (act === 'spool') { s.pool = val; s.out = {}; }
  else if (act === 'sout') s.out[p] = !s.out[p];
  else if (act === 'refl') s.refl = !s.refl;
  else if (act === 'led') S.sheet = { type: 'led', refl: true, d: { kind: '수익 출금', from: 'kbH', to: 'kyH', who: 'J', via: '계좌이체', amt: '', memo: '', date: TODAY } };
  else if (act === 'edit') {
    const t = LEDGER.find((x) => x.id === id);
    S.sheet = { type: 'led', old: t, refl: t.refl ? true : t.date === TODAY, d: { kind: t.kind, from: t.from || 'kbH', to: t.to || 'kyH', who: t.who || 'J', via: t.via || '계좌이체', amt: String(t.amt), memo: t.memo || '', date: t.date } };
  }
  else if (act === 'del') S.sheet = { type: 'del', t: LEDGER.find((x) => x.id === id), refl: true };
  else if (act === 'cancel') S.sheet = { type: 'cancel', id, refl: true };
  else if (act === 'set') { s.d[k] = val; s.bad = null; }
  else if (act === 'close') S.sheet = null;
  else if (act === 'retry') {
    const t = LEDGER.find((x) => x.id === id);
    for (const a of Object.keys(t.pend)) if (!stale(a)) { DEP[a] += t.pend[a]; delete t.pend[a]; }
  }
  else if (act === 'settle-ok') {
    const pid = s.pool, prof = dist(pid), sid = nid('s');
    const rows = outRows(s), snap = accRows(pid), cum = cumProfit(pid), prev = settledSum(pid); // 예수금을 고치기 전 값으로 남긴다(D-16)
    rows.forEach((r) => {
      const t = { id: nid('t'), date: TODAY, ...r, settle: sid, by: ME, at: stamp(), refl: s.refl, pend: {} };
      if (s.refl) t.pend = reconcile({}, eff(t));
      LEDGER.push(t);
    });
    SETTLES.unshift({ id: sid, date: TODAY, time: nowT(), pool: pid, profit: prof, cum, prev, snap, memo: s.memo, outs: rows.map((r) => r.who), by: ME, at: stamp() });
    S.open[sid] = true; S.aSeg = 'settle'; S.sheet = null;
  }
  else if (act === 'cancel-ok') {
    if (s.refl) LEDGER.filter((t) => t.settle === s.id).forEach((t) => reconcile(applied(t), {}));
    LEDGER = LEDGER.filter((t) => t.settle !== s.id);
    SETTLES = SETTLES.filter((z) => z.id !== s.id);
    S.sheet = null;
  }
  else if (act === 'del-ok') {
    if (s.refl) reconcile(applied(s.t), {});
    LEDGER = LEDGER.filter((t) => t !== s.t);
    S.sheet = null;
  }
  else if (act === 'led-ok') {
    const d = s.d, t = draftTx(d);
    const bad = { amt: !t.amt || (d.kind === '계좌 옮김' && d.from === d.to), date: !d.date || d.date > TODAY }; // 미래 날짜 불가(D-12)
    if (bad.amt || bad.date) { s.bad = bad; renderSheet(); return; }
    if (s.old) {
      const o = s.old;
      Object.assign(t, { id: o.id, by: o.by, at: o.at, eby: ME, eat: stamp(), refl: s.refl, pend: s.refl ? reconcile(applied(o), eff(t)) : {} });
      LEDGER[LEDGER.indexOf(o)] = t;
    } else {
      Object.assign(t, { id: nid('t'), by: ME, at: stamp(), refl: s.refl, pend: s.refl ? reconcile({}, eff(t)) : {} });
      LEDGER.push(t);
    }
    S.aSeg = S.aSeg === 'settle' ? 'led' : S.aSeg; S.sheet = null;
  }
  render(); renderSheet();
});

if (typeof window !== 'undefined' && window.innerWidth < 640) {
  S.w = 'ph';
  document.querySelectorAll('#nav [data-w]').forEach((x) => x.classList.toggle('on', x.dataset.w === 'ph'));
}
render();
</script>
</body>
</html>
