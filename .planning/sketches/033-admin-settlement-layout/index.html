<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sketch 033 — 어드민 정산 화면 뼈대 A/B/C</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #0c0c0f; color: #ddd; font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif; }
#nav { position: sticky; top: 0; z-index: 50; background: #0c0c0f; border-bottom: 1px solid #26262c; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 13px; }
#nav .g { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
#nav .l { color: #777; font-size: 12px; margin-right: 4px; }
#nav button { font: inherit; background: #1b1b20; color: #bbb; border: 1px solid #2a2a31; border-radius: 7px; padding: 5px 10px; cursor: pointer; }
#nav button:hover { border-color: #555; }
#nav button.on { background: #f2f2f2; color: #111; border-color: #f2f2f2; font-weight: 700; }
#desc { flex-basis: 100%; color: #9a9aa2; font-size: 12.5px; line-height: 1.65; }
#desc b { color: #eee; }
#stage { display: flex; flex-direction: column; align-items: center; gap: 48px; padding: 44px 12px 80px; }

/* 토큰 — 스케치 009 .f 블록(TDS 값 = globals.css) 재사용 */
.tk {
  --bg: #0a0a0a; --card: #151515; --muted: #2d2d2d; --hair: rgba(255,255,255,.06); --hair2: #3d3d3d;
  --fg: #fff; --mfg: #9e9e9e; --faint: #636363;
  --up: #f04251; --down: #3485fa; --primary: #3485fa; --warn: #e8a23a; --ok: #2bb8a6;
  font-variant-numeric: tabular-nums; word-break: keep-all; color: var(--fg);
}
.tk.light {
  --bg: #fff; --card: #f9fafb; --muted: #f2f4f6; --hair: #f2f4f6; --hair2: #e5e8eb;
  --fg: #191f28; --mfg: #6b7684; --faint: #b0b8c1;
  --up: #f04452; --down: #3182f6; --primary: #3182f6; --warn: #c77d0a; --ok: #0e9484;
}
.f { width: 1040px; max-width: 100%; background: var(--bg); border-radius: 14px; box-shadow: 0 0 0 1px #2a2a30; padding: 22px 24px 30px; position: relative; }
.f.ph { width: 390px; padding: 16px 14px 24px; }
.cap { position: absolute; top: -24px; left: 4px; font-size: 12px; color: #888; white-space: nowrap; }
.cap b { color: #eee; }

.hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
.hd h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -.02em; }
.acts { display: flex; gap: 8px; }
.btn { font: inherit; font-size: 13px; font-weight: 600; border-radius: 10px; padding: 9px 14px; border: 0; cursor: pointer; background: var(--muted); color: var(--fg); transition: filter .15s; white-space: nowrap; }
.btn:hover { filter: brightness(1.12); }
.btn.pri { background: var(--primary); color: #fff; }
.btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 8px; }
.btn.wide { width: 100%; padding: 11px 14px; }

.card { background: var(--card); border: 1px solid var(--hair); border-radius: 16px; padding: 16px 18px; min-width: 0; }
.ph .card { padding: 14px 14px; }
.g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ph .g3, .ph .g2 { grid-template-columns: minmax(0, 1fr); }
.mt { margin-top: 12px; }
.sec { font-size: 15px; font-weight: 600; margin: 0 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sec small { font-size: 12.5px; font-weight: 400; color: var(--mfg); }
.lab { font-size: 12.5px; color: var(--mfg); }
.dim { color: var(--mfg); }
.faint { color: var(--faint); }
.num { text-align: right; }
.up { color: var(--up); }
.dn { color: var(--down); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 99px; margin-right: 6px; vertical-align: 1px; }

/* 사람 카드 */
.pn { font-size: 14px; font-weight: 600; }
.big { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin: 2px 0 10px; }
.big small { font-size: 14px; font-weight: 500; color: var(--mfg); margin-left: 3px; }
.kv { border-top: 1px solid var(--hair2); padding-top: 8px; }
.kv > div { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 4px 0; }
.kv .k { color: var(--mfg); }
.kv .s { font-size: 12px; color: var(--faint); padding-top: 0; justify-content: flex-end; }

/* 현중 ↔ 근형 */
.tr2 > div { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; padding: 5px 0; }
.zero { margin-top: 10px; padding: 12px 14px; border-radius: 12px; background: var(--muted); font-size: 13px; color: var(--mfg); }
.zero b { display: block; font-size: 18px; font-weight: 700; color: var(--fg); margin-top: 2px; letter-spacing: -.01em; }
.link { font: inherit; font-size: 12.5px; color: var(--primary); background: none; border: 0; padding: 0; cursor: pointer; font-weight: 500; }

/* 묶음(풀) */
.pl-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.pl-h b { font-size: 16px; font-weight: 600; }
.ratio { font-size: 12.5px; color: var(--mfg); }
.prof { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin: 8px 0 2px; }
.bar { display: flex; gap: 3px; margin: 12px 0 12px; }
.bar > span { height: 44px; border-radius: 8px; padding: 6px 9px; font-size: 12px; line-height: 1.35; color: #fff; overflow: hidden; white-space: nowrap; min-width: 0; }
.bar > span b { display: block; font-size: 13px; font-weight: 600; }
.pline { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--hair2); font-size: 13.5px; }
.pline:first-of-type { border-top: 0; }
.pline .nm { font-weight: 600; min-width: 84px; }
.pline .sp { flex: 1; min-width: 0; font-size: 12.5px; color: var(--mfg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist { margin-top: 12px; border-top: 1px solid var(--hair2); padding-top: 4px; }

/* 세그먼트 · 탭 */
.seg { display: inline-flex; background: var(--muted); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { font: inherit; font-size: 13px; font-weight: 500; color: var(--mfg); background: none; border: 0; border-radius: 8px; padding: 6px 14px; cursor: pointer; }
.seg button.on { background: var(--card); color: var(--fg); font-weight: 600; box-shadow: 0 0 0 1px var(--hair2); }
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--hair2); margin: 14px 0 14px; font-size: 16px; font-weight: 600; overflow-x: auto; scrollbar-width: none; }
.tabs button { font: inherit; color: var(--mfg); background: none; border: 0; padding: 6px 0 10px; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--fg); border-bottom-color: var(--fg); }
.tabs small { font-size: 12.5px; font-weight: 500; color: var(--mfg); margin-left: 3px; }
.ph .tabs { gap: 18px; font-size: 15px; }
.strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.strip > div { background: var(--card); border: 1px solid var(--hair); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.strip .v { font-size: 18px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; white-space: nowrap; }
.ph .strip .v { font-size: 16px; }
.ph .strip .pn { font-size: 12.5px; }

/* 목록 행 */
.row { display: grid; align-items: center; gap: 4px 12px; padding: 11px 4px; border-top: 1px solid var(--hair2); font-size: 13.5px; }
.list > .row:first-child { border-top: 0; }
.sr { grid-template-columns: 50px 108px minmax(0, 1fr) 110px 116px 16px; grid-template-areas: "d nm per prof st chev"; cursor: pointer; border-radius: 8px; }
.sr:hover { background: var(--hair); }
.ph .sr { grid-template-columns: 44px minmax(0, 1fr) auto 16px; grid-template-areas: "d nm prof chev" "d per st st"; }
.sr .d { grid-area: d; } .sr .nm { grid-area: nm; font-weight: 600; } .sr .per { grid-area: per; font-size: 12.5px; }
.sr .prof1 { grid-area: prof; text-align: right; font-weight: 600; } .sr .st { grid-area: st; justify-self: end; } .sr .chev { grid-area: chev; color: var(--faint); font-size: 11px; }
.d { color: var(--mfg); font-size: 12.5px; }
.chip { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 99px; white-space: nowrap; }
.chip.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.chip.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.sub { background: var(--muted); border-radius: 12px; padding: 4px 14px; margin: 0 0 10px; }
.pr { display: grid; grid-template-columns: minmax(0, 1fr) 110px 110px 84px; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--hair2); font-size: 13px; }
.pr:first-child { border-top: 0; }
.ph .pr { grid-template-columns: minmax(0, 1fr) auto auto; }
.ph .pr .got { display: none; }
.pr .end { justify-self: end; }
.lr { grid-template-columns: 50px 104px minmax(0, 1fr) auto; grid-template-areas: "d ac wt amt"; }
.ph .lr { grid-template-columns: 44px minmax(0, 1fr) auto; grid-template-areas: "d ac amt" "d wt wt"; }
.lr .d { grid-area: d; } .lr .ac { grid-area: ac; font-weight: 600; } .lr .wt { grid-area: wt; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; min-width: 0; }
.lr .amt { grid-area: amt; text-align: right; font-weight: 600; white-space: nowrap; }
.tag { font-style: normal; font-size: 11.5px; font-weight: 500; padding: 2px 7px; border-radius: 6px; background: var(--muted); color: var(--mfg); white-space: nowrap; }
.tag.hg { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.tag.ln { color: var(--primary); background: color-mix(in srgb, var(--primary) 14%, transparent); }
.empty { padding: 26px 0; text-align: center; color: var(--mfg); font-size: 13px; }

/* 계좌 타일(C) */
.atiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.ph .atiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.atile { font: inherit; text-align: left; color: var(--fg); background: var(--card); border: 1px solid var(--hair); border-radius: 12px; padding: 10px 12px; cursor: pointer; min-width: 0; }
.atile.on { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.atile b { display: block; font-size: 13px; font-weight: 600; }
.atile span { font-size: 12.5px; color: var(--mfg); white-space: nowrap; }
.balline { font-size: 13px; color: var(--mfg); margin: 0 0 6px; line-height: 1.6; }
.balline b { color: var(--fg); font-weight: 600; }

/* 사람별 표(B · C) */
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { color: var(--mfg); font-weight: 500; font-size: 12.5px; text-align: right; padding: 8px 10px; white-space: nowrap; }
td { padding: 11px 10px; text-align: right; white-space: nowrap; border-top: 1px solid var(--hair2); }
th:first-child, td:first-child { text-align: left; padding-left: 4px; }
td:last-child { font-weight: 700; font-size: 15px; padding-right: 4px; } th:last-child { padding-right: 4px; }

/* 시트 */
#sheet { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; padding: 16px; }
#sheet.open { display: flex; }
.dlg { width: 440px; max-width: 100%; max-height: 92vh; overflow: auto; background: var(--card); border-radius: 18px; padding: 20px 20px 18px; box-shadow: 0 0 0 1px var(--hair2), 0 20px 60px rgba(0,0,0,.5); }
.dlg h2 { font-size: 18px; font-weight: 700; margin: 0 0 14px; }
.fl { margin-bottom: 14px; }
.fl > .lab { display: block; margin-bottom: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chipb { font: inherit; font-size: 13px; font-weight: 500; color: var(--mfg); background: var(--muted); border: 1px solid transparent; border-radius: 99px; padding: 6px 12px; cursor: pointer; }
.chipb.on { color: var(--fg); border-color: var(--fg); font-weight: 600; }
.inp { font: inherit; font-size: 15px; color: var(--fg); background: var(--muted); border: 1px solid transparent; border-radius: 10px; padding: 10px 12px; width: 100%; outline: none; }
.inp:focus { border-color: var(--primary); }
.inp.bad { border-color: var(--up); }
.inrow { display: flex; align-items: center; gap: 8px; }
.inrow span { color: var(--mfg); font-size: 14px; white-space: nowrap; }
.split { background: var(--muted); border-radius: 12px; padding: 4px 14px; }
.split > div { display: flex; justify-content: space-between; padding: 9px 0; border-top: 1px solid var(--hair2); font-size: 14px; }
.split > div:first-child { border-top: 0; }
.split b { font-weight: 600; }
.dact { display: flex; gap: 8px; margin-top: 18px; }
.dact .btn { flex: 1; padding: 12px; font-size: 14px; }
</style>
</head>
<body>
<div id="nav">
  <div class="g"><span class="l">안</span>
    <button data-v="A" class="on">A 사람 먼저 ★ 채택</button>
    <button data-v="B">B 묶음 먼저</button>
    <button data-v="C">C 탭으로 나눔</button>
    <button data-v="all">모두 보기</button>
  </div>
  <div class="g"><span class="l">폭</span>
    <button data-w="desk" class="on">데스크톱</button>
    <button data-w="ph">폰 390</button>
  </div>
  <div class="g"><span class="l">테마</span>
    <button data-th="dark" class="on">다크</button>
    <button data-th="light">라이트</button>
  </div>
  <div id="desc"></div>
</div>
<div id="stage"></div>
<div id="sheet"></div>

<script>
// ── 예시 자료(만원 단위) ─────────────────────────────────────────────
const TODAY = '2026-11-19';
const P = { H: '김현중', G: '정근형', J: '심쥬니' };
const PC = { H: '#2bb8a6', G: '#8b7cf6', J: '#d9902a' };
const ACC = [
  { id: 'kbG', label: 'KB 정근형', owner: 'G', pool: 'p1' },
  { id: 'kyH', label: '교보 김현중', owner: 'H', pool: 'p1' },
  { id: 'kbH', label: 'KB 김현중', owner: 'H', pool: 'p2' },
];
const ACCM = Object.fromEntries(ACC.map((a) => [a.id, a]));
const POOL = {
  p1: { name: '현중 · 근형', ratio: { H: 50, G: 50 }, rt: '5 : 5', cap: 80000 },
  p2: { name: '쥬니', ratio: { J: 40, H: 30, G: 30 }, rt: '4 : 3 : 3', cap: 40000 },
};
let OPEN = {
  p1: { from: '2026-11-01', by: { kbG: 1960, kyH: -340 } },
  p2: { from: '2026-11-01', by: { kbH: 1150 } },
};
let SETTLES = [
  { id: 's2', date: '2026-10-31', pool: 'p2', period: '10/1 ~ 10/31', by: { kbH: 2500 } },
  { id: 's1', date: '2026-10-31', pool: 'p1', period: '10/1 ~ 10/31', by: { kbG: 2840, kyH: 1320 } },
];
let LEDGER = [
  { date: '2026-10-01', acc: 'kbG', dir: 'in', amt: 40000, who: 'G', kind: '출자' },
  { date: '2026-10-01', acc: 'kyH', dir: 'in', amt: 40000, who: 'H', kind: '출자' },
  { date: '2026-10-01', acc: 'kbH', dir: 'in', amt: 15000, who: 'H', kind: '출자' },
  { date: '2026-10-01', acc: 'kbH', dir: 'in', amt: 15000, who: 'G', kind: '출자' },
  { date: '2026-10-01', acc: 'kbH', dir: 'in', amt: 10000, who: 'J', kind: '출자' },
  { date: '2026-11-03', acc: 'kbG', dir: 'out', amt: 2080, who: 'G', kind: '정산 지급', settle: 's1' },
  { date: '2026-11-03', acc: 'kbG', dir: 'out', amt: 760, who: 'H', kind: '정산 지급', settle: 's1' },
  { date: '2026-11-03', acc: 'kyH', dir: 'out', amt: 1320, who: 'H', kind: '정산 지급', settle: 's1' },
  { date: '2026-11-04', acc: 'kbH', dir: 'out', amt: 1000, who: 'J', kind: '정산 지급', settle: 's2' },
  { date: '2026-11-04', acc: 'kbH', dir: 'out', amt: 750, who: 'H', kind: '정산 지급', settle: 's2' },
  { date: '2026-11-12', acc: 'kyH', dir: 'out', amt: 500, who: 'H', kind: '미리 출금' },
];
const KINDS = ['정산 지급', '미리 출금', '원금 회수', '출자'];

// ── 계산 ────────────────────────────────────────────────────────────
const sum = (xs) => xs.reduce((a, b) => a + b, 0);
const sumBy = (by) => sum(Object.values(by));
const share = (pid, profit, p) => Math.round((profit * (POOL[pid].ratio[p] || 0)) / 100);
const paidOf = (sid, p) => sum(LEDGER.filter((t) => t.settle === sid && t.who === p && t.kind === '정산 지급').map((t) => t.amt));
const leftOf = (s, p) => share(s.pool, sumBy(s.by), p) - paidOf(s.id, p);
const remOf = (s) => sum(Object.keys(POOL[s.pool].ratio).map((p) => leftOf(s, p)));
function person(p) {
  const due = sum(SETTLES.filter((s) => POOL[s.pool].ratio[p]).map((s) => leftOf(s, p)));
  const open = {};
  for (const pid in OPEN) if (POOL[pid].ratio[p]) open[pid] = share(pid, sumBy(OPEN[pid].by), p);
  const openSum = sumBy(open);
  const adv = sum(LEDGER.filter((t) => t.who === p && t.kind === '미리 출금').map((t) => t.amt));
  return { due, open, openSum, adv, total: due + openSum - adv };
}
/** 김현중 ↔ 정근형 사이에 실제로 오간 돈 — 계좌 주인과 넣은/받은 사람이 다르고 둘 다 현중·근형일 때. */
function hgOf(t) {
  const o = ACCM[t.acc].owner;
  if (o === t.who || o === 'J' || t.who === 'J') return null;
  return t.dir === 'in' ? { from: t.who, to: o } : { from: o, to: t.who };
}
function hgSum() {
  const r = { GH: 0, HG: 0, nGH: 0, nHG: 0 };
  LEDGER.forEach((t) => { const x = hgOf(t); if (!x) return; const k = x.from + x.to; r[k] += t.amt; r['n' + k] += 1; });
  return r;
}
function accBal(id) {
  const tin = sum(LEDGER.filter((t) => t.acc === id && t.dir === 'in').map((t) => t.amt));
  const tout = sum(LEDGER.filter((t) => t.acc === id && t.dir === 'out').map((t) => t.amt));
  const prof = sum(SETTLES.map((s) => s.by[id] || 0)) + (OPEN[ACCM[id].pool].by[id] || 0);
  return { tin, tout, prof, bal: tin + prof - tout };
}

// ── 표기 ────────────────────────────────────────────────────────────
const won = (n) => { const a = Math.abs(n), e = Math.floor(a / 10000), m = a % 10000; return e ? `${e}억${m ? ' ' + m.toLocaleString() + '만' : ''}` : `${m.toLocaleString()}만`; };
const fm = (n) => (n === 0 ? '0' : (n < 0 ? '−' : '') + won(n));
const sg = (n) => (n === 0 ? '0' : (n > 0 ? '+' : '−') + won(n));
const cls = (n) => (n > 0 ? 'up' : n < 0 ? 'dn' : '');
const md = (d) => `${+d.slice(5, 7)}/${+d.slice(8, 10)}`;
const dot = (p) => `<i class="dot" style="background:${PC[p]}"></i>`;
const periodOf = (pid) => `${md(OPEN[pid].from)} ~ ${md(TODAY)}`;

// ── 조각 ────────────────────────────────────────────────────────────
function personCards() {
  return `<div class="g3">${Object.keys(P).map((p) => {
    const x = person(p);
    const subs = Object.entries(x.open).map(([pid, v]) => `${POOL[pid].name} ${sg(v)}`).join(' · ');
    return `<div class="card">
      <div class="pn">${dot(p)}${P[p]}</div>
      <div class="lab" style="margin-top:10px">받을 돈</div>
      <div class="big">${fm(x.total)}<small>원</small></div>
      <div class="kv">
        <div><span class="k">정산하고 아직 안 받은 돈</span><span>${fm(x.due)}</span></div>
        <div><span class="k">정산 전 수익 중 내 몫</span><span class="${cls(x.openSum)}">${sg(x.openSum)}</span></div>
        <div class="s"><span>${subs}</span></div>

};
const COMMON = '<span style="color:#77777f">세 안 모두 같은 예시 자료(만 단위 표기 · 실제는 원 단위) · 버튼이 실제로 동작합니다 — 「정산하기」 로 확정하면 기록에 쌓이고, 정산 기록을 펼쳐 「지급 기록」 을 누르거나 「거래 기록」 으로 출금을 적으면 받을 돈 · 이체 균형이 바로 바뀝니다. 수익 = 어드민 「매매손익」 의 계좌별 실현손익 합(가정).</span>';

  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.v) S.v = b.dataset.v;
  if (b.dataset.w) S.w = b.dataset.w;
  if (b.dataset.th) S.th = b.dataset.th;

document.addEventListener('input', (e) => {
  const f = e.target.dataset && e.target.dataset.f; if (!f || !S.sheet) return;
  if (S.sheet.type === 'settle') S.sheet.memo = e.target.value; else S.sheet.d[f] = e.target.value;
});
document.addEventListener('click', (e) => {
  if (e.target.id === 'sheet') { S.sheet = null; renderSheet(); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const { act, val, id, p, k, pool } = b.dataset;
  if (act === 'aseg') S.aSeg = val;
  else if (act === 'hglist') S.aSeg = 'hg';
  else if (act === 'ctab') S.cTab = val;
  else if (act === 'cacc') S.cAcc = val;
  else if (act === 'tog') S.open[id] = !S.open[id];
  else if (act === 'settle') S.sheet = { type: 'settle', pool: pool || 'p1', memo: '' };
  else if (act === 'spool') S.sheet.pool = val;
  else if (act === 'led') S.sheet = { type: 'led', d: { kind: '정산 지급', acc: 'kbH', who: 'G', settle: '', amt: '', memo: '' } };
  else if (act === 'pay') {
    const s = SETTLES.find((z) => z.id === id);
    const acc = ACC.filter((a) => a.pool === s.pool).find((a) => a.owner === p) || ACC.find((a) => a.pool === s.pool);
    S.sheet = { type: 'led', d: { kind: '정산 지급', acc: acc.id, who: p, settle: id, amt: String(leftOf(s, p)), memo: '' } };
  }
  else if (act === 'set') { S.sheet.d[k] = val; S.sheet.bad = false; }
  else if (act === 'close') S.sheet = null;
  else if (act === 'settle-ok') {
    const pid = S.sheet.pool, nid = 's' + (SETTLES.length + 1);
    SETTLES.unshift({ id: nid, date: TODAY, pool: pid, period: periodOf(pid), by: { ...OPEN[pid].by }, memo: S.sheet.memo });
    OPEN[pid] = { from: TODAY, by: Object.fromEntries(Object.keys(OPEN[pid].by).map((a) => [a, 0])) };
    S.open[nid] = true; S.sheet = null;
  }
  else if (act === 'led-ok') {
    const d = S.sheet.d, amt = parseInt(String(d.amt).replace(/[^0-9]/g, ''), 10);
    if (!amt) { S.sheet.bad = true; renderSheet(); return; }
    const t = { date: TODAY, acc: d.acc, dir: d.kind === '출자' ? 'in' : 'out', amt, who: d.who, kind: d.kind, memo: d.memo };
    if (d.kind === '정산 지급') {
      const ok = SETTLES.find((z) => z.id === d.settle && POOL[z.pool].ratio[d.who]);
      const fb = SETTLES.find((z) => POOL[z.pool].ratio[d.who] && leftOf(z, d.who) > 0);
      if (ok || fb) t.settle = (ok || fb).id;
    }
    LEDGER.push(t); S.sheet = null;
  }
  render(); renderSheet();
});

if (typeof window !== 'undefined' && window.innerWidth < 640) {
  S.w = 'ph';
  document.querySelectorAll('#nav [data-w]').forEach((x) => x.classList.toggle('on', x.dataset.w === 'ph'));
}
render();
</script>
