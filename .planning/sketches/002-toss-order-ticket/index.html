<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토스식 호가주문 v2</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="../themes/toss-dark.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #0c0c0f; color: #ddd; font-family: -apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif; }
#nav { position: sticky; top: 0; z-index: 50; background: #0c0c0f; border-bottom: 1px solid #26262c; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 13px; }
#nav .g { display: flex; gap: 4px; align-items: center; }
#nav .l { color: #777; font-size: 12px; margin-right: 4px; }
#nav button { font: inherit; background: #1b1b20; color: #bbb; border: 1px solid #2a2a31; border-radius: 7px; padding: 5px 10px; cursor: pointer; }
#nav button.on { background: #f2f2f2; color: #111; border-color: #f2f2f2; font-weight: 700; }
#nav button:disabled { opacity: .35; cursor: default; }
#desc { flex-basis: 100%; color: #9a9aa2; font-size: 12.5px; line-height: 1.6; }
#desc b { color: #eee; }
#stage { display: flex; justify-content: center; padding: 20px 12px 60px; overflow-x: auto; }

/* ── TDS 공식 토큰 (@toss/tds-colors 0.1.0) ── */
.f {
  --bg: #17171c; --band: #101013; --layer: #202027; --float: #2c2c35; --g200: #3c3c47; --g300: #4d4d59;
  --t900: #ffffff; --t800: #e4e4e5; --t600: #9e9ea4; --t500: #7e7e87; --t400: #62626d;
  --hair: #3c3c47; --red: #f04251; --blue: #3485fa; --green: #2fca73; --amber: #ffb13d;
  --red-box: rgba(240,66,81,.22); --blue-box: rgba(52,133,250,.22); --dim: rgba(0,0,0,.56);
  --kb-bg: #2b2b2e; --kb-key: #6b6b70;
  --font: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif;
}
.f.light {
  --bg: #ffffff; --band: #f2f4f6; --layer: #ffffff; --float: #f2f4f6; --g200: #e5e8eb; --g300: #d1d6db;
  --t900: #191f28; --t800: #333d4b; --t600: #6b7684; --t500: #8b95a1; --t400: #b0b8c1;
  --hair: #e5e8eb; --red: #f04452; --blue: #3182f6; --green: #03b26c; --amber: #ff9f1a;
  --red-box: #ffeeee; --blue-box: #e8f3ff; --dim: rgba(0,0,0,.2);
  --kb-bg: #d1d3d9; --kb-key: #ffffff;
}
.f { position: relative; flex: none; overflow: hidden; background: var(--bg); color: var(--t800); font-family: var(--font); -webkit-font-smoothing: antialiased; word-break: keep-all; font-variant-numeric: tabular-nums; box-shadow: 0 0 0 1px #2a2a30, 0 30px 80px rgba(0,0,0,.5); display: flex; }
.f.phone { width: 390px; height: 844px; border-radius: 30px; --kbh: 244px; }
.f.tablet { width: 768px; height: 1000px; border-radius: 24px; --kbh: 118px; }
.f.desktop { width: 1280px; height: 860px; border-radius: 12px; }
.side { display: none; }
.f.desktop .side { display: flex; flex-direction: column; gap: 2px; width: 240px; flex: none; padding: 18px 12px; background: var(--band); }
.side .brand { font-weight: 700; font-size: 17px; padding: 4px 10px 16px; color: var(--t900); }
.side a { padding: 9px 10px; border-radius: 10px; color: var(--t600); font-size: 15px; font-weight: 500; }
.side a.on { background: var(--float); color: var(--t900); font-weight: 600; }
.col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.hdr { display: flex; align-items: center; gap: 10px; padding: 12px 16px 0; }
.f.desktop .hdr { padding: 20px 24px 0; }
.hdr .back { font-size: 24px; color: var(--t800); }
.hdr .nm { font-size: 17px; font-weight: 600; color: var(--t900); }
.hdr .cd { font-size: 12px; color: var(--t600); background: var(--float); padding: 2px 7px; border-radius: 6px; }
.hdr .px { font-size: 17px; font-weight: 600; color: var(--red); margin-left: 4px; }
.hdr .sp { flex: 1; }
.hdr .hr { color: var(--red); font-size: 20px; }
.tabs { display: flex; gap: 18px; padding: 8px 16px 0; border-bottom: 1px solid var(--hair); }
.f.desktop .tabs { padding: 8px 24px 0; }
.tabs span { font-size: 17px; font-weight: 600; color: var(--t500); padding: 8px 0 10px; border-bottom: 2px solid transparent; }
.tabs span.on { color: var(--t900); border-bottom-color: var(--t900); }
.strip { display: flex; align-items: center; gap: 6px; padding: 8px 16px; font-size: 12px; color: var(--t600); }
.f.desktop .strip { padding: 10px 24px; }
.strip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
.strip .led { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--float); font-size: 11.5px; }
.strip .led i { width: 7px; height: 7px; border-radius: 50%; }
.strip .led b { color: var(--t800); font-weight: 600; }
.strip .sp { flex: 1; }
.strip .x { font-size: 11px; font-weight: 600; background: var(--float); border-radius: 999px; padding: 2px 8px; color: var(--t800); }
.wrap { flex: 1; min-height: 0; container: ob / inline-size; }
.f.desktop .wrap { padding: 0 24px; }
.body { height: 100%; display: grid; grid-template-columns: 42% 1fr; }
@container ob (min-width: 700px) { .body { grid-template-columns: 260px 1fr; } }
@container ob (min-width: 992px) { .body { grid-template-columns: 440px 1fr; } }

/* 호가 */
.lad { overflow-y: auto; border-right: 1px solid var(--hair); scrollbar-width: none; }
.lr { display: grid; grid-template-columns: 1fr auto; align-items: center; height: 48px; padding: 0 8px 0 14px; }
.lr .p b { display: block; font-size: 15px; font-weight: 500; line-height: 1.2; }
.lr .p small { font-size: 11.5px; }
.q { min-width: 44px; text-align: right; font-size: 13px; padding: 5px 8px; border-radius: 8px; }
.ask .q { background: var(--blue-box); color: var(--blue); }
.bid .q { background: var(--red-box); color: var(--red); }
.lr.cur { background: var(--float); }
.lr.cur .p b { font-weight: 700; }
.lr3 { display: none; }
@container ob (min-width: 992px) {
  .lr { display: none; }
  .lr3 { display: grid; grid-template-columns: 1fr 1.1fr 1fr; align-items: center; height: 40px; padding: 0 8px; }
  .lr3 .qa { justify-self: end; } .lr3 .qb { justify-self: start; }
  .lr3 .pc { text-align: center; font-size: 15px; font-weight: 500; }
  .lr3 .pc small { font-size: 11.5px; margin-left: 5px; }
  .lr3.cur .pc { background: var(--float); border-radius: 10px; font-weight: 700; padding: 5px 0; }
}
.midline { height: 1px; background: var(--hair); margin: 2px 0; }
.up { color: var(--red); } .dn { color: var(--blue); }

/* 패널 */
.pan { padding: 10px 12px 0 10px; display: flex; flex-direction: column; min-height: 0; }
@container ob (min-width: 700px) { .pan { padding: 12px 0 0 16px; } }
.pan-scroll { flex: 1; overflow-y: auto; scrollbar-width: none; padding-bottom: 14px; }
.seg { display: flex; background: var(--float); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { flex: 1; font: inherit; border: 0; background: transparent; color: var(--t600); font-size: 15px; font-weight: 600; height: 34px; border-radius: 10px; cursor: pointer; white-space: nowrap; }
.seg button.on { background: var(--g300); color: var(--t900); }
.f.light .seg button.on { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.seg.sm button { font-size: 13px; height: 28px; border-radius: 8px; }
.seg.sm { border-radius: 10px; padding: 2px; }
@container ob (min-width: 700px) { .only-narrow { display: none !important; } .top-segs { max-width: 320px; } }
.cols { display: grid; grid-template-columns: 1fr; gap: 10px; }
.cols > .c.hide-narrow { display: none; }
.side-h { display: none; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; margin: 10px 2px 0; color: var(--t900); }
.side-h i { width: 8px; height: 8px; border-radius: 50%; }
@container ob (min-width: 700px) { .cols { grid-template-columns: 1fr 1fr; } .side-h { display: flex; } .cols > .c.hide-narrow { display: block; } }
.grp { margin-top: 10px; border-radius: 16px; padding: 10px 10px 4px; background: var(--layer); }
.f.light .grp { background: #f9fafb; }
.grp-h { display: flex; align-items: center; gap: 8px; padding: 0 2px 2px; }
.grp-h .t { font-size: 15px; font-weight: 600; color: var(--t900); }
.grp-h .s { font-size: 12px; color: var(--t500); }
.grp-h .s.live { color: var(--green); }
.grp-h .sw { margin-left: auto; }
.grp.off .lrow { opacity: .45; }
.sw { width: 40px; height: 24px; border-radius: 999px; background: var(--g300); position: relative; cursor: pointer; flex: none; transition: background .15s; }
.sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
.sw.on { background: var(--blue); } .sw.on::after { transform: translateX(16px); }
.lrow { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 0 4px; min-height: 44px; cursor: pointer; border-radius: 10px; min-width: 0; }  /* 모든 행 44px — 토글 행도 같은 높이 */
.cols > .c, .pan { min-width: 0; }   /* 내용이 길어도 카드가 패널 밖으로 커지지 않게 — 안 맞으면 눈에 보이게 넘친다 */
.lrow:hover { background: color-mix(in srgb, var(--t900) 5%, transparent); }
.lrow .k { font-size: 14px; color: var(--t600); white-space: nowrap; }
.lrow .v { font-size: 15px; font-weight: 500; color: var(--t800); white-space: nowrap; }
.lrow .v::after { content: ' ›'; color: var(--t400); }
.lrow.flash .v { color: var(--blue); }
/* 데스크톱 인라인 편집 — 행 높이 그대로, 안내 문구 없음 */
.lrow.ied { box-shadow: inset 0 0 0 1.5px var(--blue); background: var(--float); cursor: text; }
.lrow.ied .v::after { content: none; }
.lrow.ied input { width: 9ch; background: none; border: 0; outline: 0; color: var(--t900); font: inherit; font-size: 15px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.lrow.ied input::selection { background: color-mix(in srgb, var(--blue) 35%, transparent); }
.lrow.ied .u { font-size: 15px; font-weight: 500; color: var(--t800); margin-left: 2px; }
.sheet .disp .n.sel { background: color-mix(in srgb, var(--blue) 32%, transparent); border-radius: 4px; }
/* 감시대상 행: 폰 = 라벨 없이 풀폭 세그먼트(B) · ≥700 = 라벨 왼쪽 + 토글 오른쪽 */
.lrow.watch { cursor: default; }
.lrow.watch:hover { background: transparent; }
.lrow.watch .k { display: none; }
.tog { display: flex; width: 100%; background: var(--g200); border-radius: 8px; padding: 2px; }
.tog button { flex: 1; font: inherit; border: 0; background: none; color: var(--t600); font-size: 14px; font-weight: 600; height: 32px; padding: 0 8px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
@container ob (min-width: 700px) {
  .lrow.watch .k { display: inline; }
  .tog { display: inline-flex; width: auto; }
  .tog button { flex: none; font-size: 13px; height: 26px; padding: 0 10px; }
}
.tog button.on { background: var(--g300); color: var(--t900); }
.f.light .tog button.on { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
/* 직접 주문 */
.box { background: var(--float); border-radius: 16px; padding: 12px 12px 12px 14px; margin-top: 8px; }
.box .h { display: flex; gap: 8px; font-size: 13px; color: var(--t500); align-items: center; }
.box .h .on { color: var(--t800); font-weight: 600; }
.box .h .bar { width: 1px; height: 10px; background: var(--g300); }
.box .vv { display: flex; align-items: center; margin-top: 6px; font-size: 17px; font-weight: 600; color: var(--t900); }
.box .vv .ph { color: var(--t400); font-weight: 500; }
.box .vv .st { margin-left: auto; display: flex; gap: 2px; }
.box .vv .st span { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; color: var(--t600); font-size: 20px; }
.pct { display: flex; justify-content: space-between; margin-top: 10px; font-size: 13px; color: var(--t500); }
.row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--t600); padding: 7px 2px; }
.row b { color: var(--t800); font-weight: 500; }
.total { text-align: right; padding: 6px 2px 10px; }
.total small { display: block; font-size: 14px; color: var(--t600); }
.total b { font-size: 22px; font-weight: 700; color: var(--t900); }
.cta { font: inherit; width: 100%; height: 56px; border: 0; border-radius: 16px; background: var(--red); color: #fff; font-size: 17px; font-weight: 600; cursor: pointer; margin-bottom: 14px; }
.ticket { max-width: 400px; }

/* 시트 (폰·태블릿) */
.dim { position: absolute; inset: 0; background: var(--dim); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
.sheet { position: absolute; left: 10px; right: 10px; bottom: 10px; background: var(--layer); border-radius: 28px; padding: 22px 20px 16px; transform: translateY(120%); transition: transform .25s ease, bottom .25s ease; z-index: 21; }
.f.light .sheet { background: #fff; }
.f.tablet .sheet { left: 50%; right: auto; width: 440px; margin-left: -220px; }
.f.open .dim { opacity: 1; pointer-events: auto; }
.f.open .sheet { transform: none; }
.sheet h3 { margin: 0 0 4px; font-size: 20px; font-weight: 700; color: var(--t900); }
.sheet p { margin: 0 0 14px; font-size: 14px; color: var(--t600); }
.sheet .disp { display: flex; align-items: baseline; gap: 4px; padding: 14px 16px; border-radius: 16px; background: var(--float); margin-bottom: 10px; }
.sheet .disp .n { font-size: 26px; font-weight: 700; color: var(--t900); min-height: 32px; }
.sheet .disp .n::after { content: ''; display: inline-block; width: 2px; height: 26px; background: var(--blue); margin-left: 2px; vertical-align: -3px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.sheet .disp .u { font-size: 18px; font-weight: 600; color: var(--t800); }
.sheet .disp .was { margin-left: auto; font-size: 12.5px; color: var(--t500); }
.chips { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.chips button { font: inherit; border: 0; background: var(--float); color: var(--t800); font-size: 13px; font-weight: 600; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer; }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin-bottom: 12px; }
.pad button { font: inherit; border: 0; background: transparent; color: var(--t900); font-size: 24px; font-weight: 500; height: 56px; border-radius: 12px; cursor: pointer; }
.pad button:active { background: var(--float); }
.btns { display: flex; gap: 8px; }
.btns button { flex: 1; font: inherit; height: 56px; border: 0; border-radius: 16px; font-size: 17px; font-weight: 600; cursor: pointer; }
.btns .b1 { background: var(--float); color: var(--t800); }
.btns .b2 { background: var(--blue); color: #fff; }
/* 시스템 키보드 시뮬레이션 */
.oskb { position: absolute; left: 0; right: 0; bottom: 0; background: var(--kb-bg); padding: 6px 6px 26px; transform: translateY(100%); transition: transform .25s ease; z-index: 22; }
.f.open.native .oskb { transform: none; }
.oskb .lbl { font-size: 10.5px; color: var(--t500); text-align: center; padding: 2px 0 5px; }
.oskb .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.oskb .grid button { font: inherit; border: 0; height: 46px; border-radius: 6px; background: var(--kb-key); color: var(--t900); font-size: 23px; line-height: 1; cursor: pointer; box-shadow: 0 1px 0 rgba(0,0,0,.35); }
.oskb .grid button small { display: block; font-size: 9px; letter-spacing: 2px; font-weight: 600; }
.oskb .grid button.fn { background: transparent; box-shadow: none; }
.f.tablet .oskb .grid { grid-template-columns: repeat(11, 1fr); }
.f.tablet .oskb .grid button { height: 52px; font-size: 20px; }
.f.open.native .sheet { bottom: calc(var(--kbh) + 10px); }
/* 수동주문 (D-19 진입 · D-20 필드 · D-11 버튼 · D-10 입력) */
.wide-only { display: none; }
.mtop { display: none; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 6px; }
@container ob (min-width: 700px) { .wide-only { display: block; } .mtop { display: flex; } .hide-wide { display: none !important; } }
@container ob (max-width: 699px) { .hide-narrow-all { display: none !important; } }
.mbtn { font: inherit; border: 0; background: var(--float); color: var(--t800); height: 32px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
.mkey { font-size: 12px; color: var(--t600); margin-right: auto; }
.box.tap { cursor: pointer; }
.box .tu { margin-left: 4px; font-size: 17px; font-weight: 600; color: var(--t900); }
.box .hint { font-size: 12px; color: var(--t500); }
.tin { flex: 0 1 auto; min-width: 1ch; width: auto; field-sizing: content; padding: 0; background: none; border: 0; outline: 0; color: var(--t900); font: inherit; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tin::placeholder { color: var(--t400); font-weight: 500; }
.btn2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.btn2.sm { margin-top: 8px; }
.obtn { font: inherit; border: 0; height: 48px; border-radius: 14px; font-size: 17px; font-weight: 600; color: #fff; cursor: pointer; }
.obtn.buy { background: var(--red); } .obtn.sell { background: var(--blue); }
.obtn.ghost { height: 38px; border-radius: 10px; font-size: 15px; background: var(--float); color: var(--t600); }
.obtn:disabled { opacity: .5; cursor: default; }
.fn { font-size: 12px; color: var(--t500); margin-top: 8px; text-align: center; }
.sheet .err { font-size: 12.5px; color: var(--red); min-height: 16px; margin: -4px 0 8px 2px; }
.btns .b2:disabled { opacity: .4; cursor: default; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div id="nav">
  <div class="g"><span class="l">폭</span><button data-w="phone" class="on">폰 390</button><button data-w="tablet">태블릿 768</button><button data-w="desktop">데스크톱 1280</button></div>
  <div class="g"><span class="l">입력 키보드</span><button data-k="custom" class="on">자체 키패드</button><button data-k="native">폰 시스템 키보드</button></div>
  <div class="g"><span class="l">테마</span><button data-t="dark" class="on">다크</button><button data-t="light">라이트</button></div>
  <div id="desc"></div>
</div>
<div id="stage"></div>

<script>
const BASE = 98000, CUR = 98100, UPPER = 127400;
const fmt = n => Number(n).toLocaleString('ko-KR');
const tick = p => p < 2000 ? 1 : p < 5000 ? 5 : p < 20000 ? 10 : p < 50000 ? 50 : p < 200000 ? 100 : p < 500000 ? 500 : 1000;
const pct = p => { const x = (p - BASE) / BASE * 100; return (x > 0 ? '+' : '') + x.toFixed(2) + '%'; };
const cls = p => p > BASE ? 'up' : p < BASE ? 'dn' : '';
const S = { w: 'phone', k: 'custom', t: 'dark', side: 'buy', manualOpen: false };

/* 그룹: [제목, 스위치(true/false) 또는 null(스위치 없는 가격 섹션), 상태문구, 필드[]] */
const FIELDS = {
  buy: [
    ['매수가격', null, '', [['매수가격', 127400, '원', '넣을 매수 주문 가격이에요'], ['주문금액', 100, '만원', '한 번에 넣을 금액이에요']]],
    ['매수주문', true, '감시 중', [['비교가격', 127400, '원', '이 가격의 잔량을 지켜봐요'], ['감시대상', '', '', '', 'watch'], ['잔량', 10000, '주', '잔량이 이 값보다 줄면 매수를 넣어요']]],
    ['한방체결', false, '꺼짐', [['호가변경', 3, '건', '호가가 이만큼 바뀌면 한 번에 체결해요'], ['한방가격', 127400, '원', '한방 체결 가격이에요']]],
  ],
  sell: [
    ['매도가격', null, '', [['매도가격', 126000, '원', '넣을 매도 주문 가격이에요'], ['매도비율', 100, '%', '보유 수량 중 매도할 비율이에요']]],

function inlineEdit(row) {
  const side = row.dataset.side, gi = +row.dataset.gi, fi = +row.dataset.fi, [k, v, u] = field(side, gi, fi);
  document.getElementById('PAN').innerHTML = panel();
  const r2 = document.querySelector(`.lrow[data-side="${side}"][data-gi="${gi}"][data-fi="${fi}"]`);
  r2.classList.add('ied');
  r2.innerHTML = `${kHtml(k)}<span class="v"><input value="${typeof v === 'number' ? fmt(v) : v}"><span class="u">${u}</span></span>`;
  const inp = r2.querySelector('input'); inp.focus(); inp.select();
  let done = false;
  const finish = (save) => {
    if (done) return; done = true;
    if (save) field(side, gi, fi)[1] = u === '' ? inp.value : (+inp.value.replace(/,/g, '') || 0);
    document.getElementById('PAN').innerHTML = panel();
    if (save) flashRow(side, gi, fi);
    // 다른 행을 누르며 blur 된 경우(pointerdown 에서 기록) → 그 행을 바로 편집 모드로 (한 번 클릭)
    if (NEXT) { const n = NEXT; NEXT = null; const nx = document.querySelector(`.lrow[data-side="${n.side}"][data-gi="${n.gi}"][data-fi="${n.fi}"]`); if (nx) inlineEdit(nx); }
  };
  const step = d => { const n = +inp.value.replace(/,/g, '') || 0; const t = u === '원' ? tick(d > 0 ? n : n - 1) : 1; inp.value = fmt(Math.max(0, n + d * t)); };
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') finish(true);
    else if (e.key === 'Escape') finish(false);
    else if (e.key === 'ArrowUp') { e.preventDefault(); step(1); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); step(-1); }
    else if (e.key === 'Tab') { e.preventDefault(); const nfi = fi + 1 < FIELDS[side][gi][3].length ? fi + 1 : null; finish(true); if (nfi !== null) { const nx = document.querySelector(`.lrow[data-side="${side}"][data-gi="${gi}"][data-fi="${nfi}"]`); if (nx) inlineEdit(nx); } }
  });
  inp.addEventListener('blur', () => finish(true));
}

document.addEventListener('click', e => {
  const t = e.target;
  const nb = t.closest('#nav button'); if (nb) { if (nb.dataset.w) S.w = nb.dataset.w; if (nb.dataset.k) S.k = nb.dataset.k; if (nb.dataset.t) S.t = nb.dataset.t; ED = null; return render(); }
  if (!t.closest('#F')) return;
  const sd = t.closest('.seg [data-side]'); if (sd) { S.side = sd.dataset.side; document.getElementById('PAN').innerHTML = panel(); return; }
  if (t.closest('.js-mopen')) { S.manualOpen = true; document.getElementById('PAN').innerHTML = panel(); return; }
  if (t.closest('.js-mclose')) { S.manualOpen = false; document.getElementById('PAN').innerHTML = panel(); return; }
  const tb = t.closest('.box.tap[data-tk]');
  if (tb) {                               // 터치: 수동주문 상자 → 같은 키패드 시트 (D-10)
    const key = tb.dataset.tk, [k, u, d] = TL[key];
    ED = { kind: 'ticket', key, unit: u, orig: T[key], buf: String(T[key]), meta: { k, u, d } };
    return showSheet();
  }
  const lp = t.closest('.lad [data-p]');  // 호가 클릭 → 수동주문 가격 채우기 (D-10 유지)
  if (lp && (S.side === 'manual' || S.manualOpen)) { T.price = +lp.dataset.p; document.getElementById('PAN').innerHTML = panel(); return; }
  const ob = t.closest('.js-order'); if (ob) { const o = ob.textContent; ob.textContent = '확인 창 →'; setTimeout(() => ob.textContent = o, 700); return; }
  const sw = t.closest('.sw'); if (sw) { const g = sw.closest('.grp'); sw.classList.toggle('on'); const on = sw.classList.contains('on'); g.classList.toggle('off', !on); const s = g.querySelector('.s'); s.textContent = on ? '감시 중' : '꺼짐'; s.classList.toggle('live', on); return; }
  const og = t.closest('.tog [data-w]');   // 매도/매수 잔량 접두 토글 — 즉시 반영, 시트 없음
  if (og) { W = og.dataset.w; const r = og.closest('.lrow'); document.getElementById('PAN').innerHTML = panel(); flashRow(r.dataset.side, +r.dataset.gi, +r.dataset.fi); return; }
  const row = t.closest('.lrow');
  if (row && !row.classList.contains('ied') && !row.classList.contains('watch')) {
    if (S.w === 'desktop') return inlineEdit(row);
    const side = row.dataset.side, gi = +row.dataset.gi, fi = +row.dataset.fi, [k, v, u, d] = field(side, gi, fi);
    ED = { kind: 'field', side, gi, fi, unit: u, orig: v, buf: String(v), meta: { k, u, d } };
    return showSheet();
  }
  if (t.closest('.js-close')) { ED = null; document.getElementById('F').classList.remove('open'); return; }
  if (t.closest('.js-ok') && ED && !t.closest('.js-ok').disabled) return commit();
  const ch = t.closest('[data-chip]'); if (ch && ED) { applyChip(ch.dataset.chip); ED.fresh = false; return paint(); }
  const key = t.closest('[data-key]'); if (key && ED && ED.unit !== '') {
    const k = key.dataset.key; if (!k) return;
    if (ED.fresh) { ED.fresh = false; ED.buf = (k === '⌫' || k === '00') ? '' : k; return paint(); }
    ED.buf = k === '⌫' ? ED.buf.slice(0, -1) : (ED.buf === '0' ? '' : ED.buf) + k;
    if (ED.buf.length > 9) ED.buf = ED.buf.slice(0, 9);
    return paint();
  }
});
/* 데스크톱 수동주문 상자: 직접 타이핑 (D-10) · ↑/↓ 한 호가(가격) / 1 */
document.addEventListener('input', e => {
  const i = e.target.closest('.tin'); if (!i) return;
  const n = i.value.replace(/[^\d]/g, ''); T[i.dataset.tk] = n === '' ? '' : +n;
  document.querySelectorAll('#F .ticket .amt').forEach(a => a.textContent = fmt((+T.price || 0) * (+T.qty || 0)) + '원');
});
document.addEventListener('focusin', e => { const i = e.target.closest('.tin'); if (i) i.select(); });  // 포커스 = 전체 선택
/* 인라인 편집 중 다른 행을 누르면: blur → 저장 → 재렌더 때문에 click 이 사라진다. pointerdown 에서 대상을 기록해 finish 가 이어받는다. */
let NEXT = null;
document.addEventListener('pointerdown', e => {
  if (S.w !== 'desktop' || !document.querySelector('#F .lrow.ied')) return;
  const r = e.target.closest('.lrow'); if (!r || r.classList.contains('ied') || r.classList.contains('watch')) return;
  NEXT = { side: r.dataset.side, gi: +r.dataset.gi, fi: +r.dataset.fi };
}, true);
document.addEventListener('keydown', e => {
  const i = e.target.closest('.tin'); if (!i) return;
  const key = i.dataset.tk, n = +String(T[key]).replace(/,/g, '') || 0;
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    e.preventDefault(); const d = e.key === 'ArrowUp' ? 1 : -1;
    const step = key === 'price' ? tick(d > 0 ? n : n - 1) : 1;
    T[key] = Math.max(0, n + d * step); i.value = fmt(T[key]); i.dispatchEvent(new Event('input', { bubbles: true }));
  }
  if (e.key === 'Enter') i.blur();
});
</script>
