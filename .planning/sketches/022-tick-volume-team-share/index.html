<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>틱뷰어 거래량 · 팀 비중 A/B/C</title>
<style>
  :root {
    --bg: #ffffff; --fg: #191f28; --fg-2: #333d4b; --muted: #f2f4f6; --muted-fg: #6b7684; --faint: #b0b8c1;
    --raised-2: #e5e8eb; --border: #f2f4f6; --border-subtle: #e5e8eb; --card: #ffffff; --popover: #ffffff;
    --popover-fg: #191f28; --primary: #3182f6; --up: #f04452; --down: #3182f6; --flat: #6b7684; --team: #a234c7;
    --vi: #d97706; --accum-shade: rgba(107,118,132,.10); --accum-gap: rgba(107,118,132,.07); --vol: #c4cad1; --page: #f2f4f6;
  }
  :root[data-theme="dark"] {
    --bg: #0a0a0a; --fg: #ffffff; --fg-2: #e4e4e4; --muted: #2d2d2d; --muted-fg: #9e9e9e; --faint: #636363;
    --raised-2: #3d3d3d; --border: rgba(255,255,255,.06); --border-subtle: #3d3d3d; --card: #151515; --popover: #2d2d2d;
    --popover-fg: #ffffff; --up: #f04251; --down: #3485fa; --flat: #9e9e9e; --team: #c353e5; --vi: #ffb020;
    --accum-shade: rgba(255,255,255,.07); --accum-gap: rgba(255,255,255,.04); --vol: #4a4f56; --page: #0a0a0a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--fg); font: 14px/1.45 Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; align-items: center; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--border-subtle); flex-wrap: wrap; }
  .bar b { margin-right: 8px; }
  .seg { display: inline-flex; background: var(--muted); border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: transparent; color: var(--muted-fg); padding: 4px 12px; border-radius: 999px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .seg button.on { background: var(--card); color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  body.phone .wrap { max-width: 390px; padding: 16px 0; }
  h3.sec { margin: 8px 0 -4px; font-size: 15px; }
  .variant { background: var(--card); border-radius: 16px; padding: 14px 16px 16px; }
  .vt { font-weight: 700; font-size: 15px; margin: 0 0 2px; }
  .vd { color: var(--muted-fg); font-size: 12.5px; margin: 0 0 10px; }
  .chart { position: relative; border: 1px solid var(--border-subtle); border-radius: 12px; padding: 4px 0; }
  .chart svg { display: block; width: 100%; font-variant-numeric: tabular-nums; }
  .tip { position: absolute; pointer-events: none; background: var(--popover); color: var(--popover-fg); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 4px 8px; font-size: 11px; line-height: 1.45; box-shadow: 0 4px 12px rgba(0,0,0,.12); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  body.phone .cards { grid-template-columns: 1fr; }
  .acard { border: 1px solid var(--border-subtle); border-radius: 12px; overflow: hidden; background: var(--card); }
  .acard .hd { display: flex; align-items: baseline; gap: 8px; border-bottom: 1px solid var(--border-subtle); padding: 9px 12px; }
  .acard .hd h4 { margin: 0; font-size: 12.5px; }
  .acard .hd small { font-size: 11px; color: var(--muted-fg); font-family: ui-monospace, monospace; }
  .acard .bd { padding: 10px 12px 12px; }
  .big { font-size: 20px; font-weight: 600; font-family: ui-monospace, monospace; line-height: 1.2; }
  dl { margin: 8px 0 0; display: grid; gap: 0 12px; font-size: 11.5px; }
  dt { font-size: 10.5px; color: var(--muted-fg); }
  dd { margin: 0; font-weight: 600; font-family: ui-monospace, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .up { color: var(--up); } .team { color: var(--team); } .mf { color: var(--muted-fg); font-weight: 400; }
  .teamline { margin-top: 4px; font-size: 12px; color: var(--team); font-weight: 600; font-family: ui-monospace, monospace; }
  .teamline span { color: var(--muted-fg); font-weight: 400; }
  .meter { margin-top: 8px; height: 6px; border-radius: 99px; background: var(--muted); overflow: hidden; display: flex; }
  .meter i { display: block; height: 100%; }
  .mcap { margin-top: 4px; display: flex; justify-content: space-between; font-size: 11px; color: var(--muted-fg); font-family: ui-monospace, monospace; }
  .mcap b { color: var(--team); }
  .note { color: var(--muted-fg); font-size: 12px; padding: 0 4px 24px; line-height: 1.6; }
</style>
</head>
<body>
<div class="bar">
  <b>틱뷰어 거래량 · 팀 비중</b>
  <span class="seg" id="theme"><button class="on" data-v="light">라이트</button><button data-v="dark">다크</button></span>
  <span class="seg" id="width"><button class="on" data-v="desk">데스크톱</button><button data-v="phone">폰 390</button></span>
</div>
<div class="wrap" id="wrap"></div>
<script>
// ── 가짜 하루치(KRX · 08:00~20:00 · 1분 720점 — 실제는 A3 마다 · 픽셀 열 솎음) ──────────
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const N = 720, T0 = 8 * 60;
const px = [], vol = [], tb = [], ts = [];
let p = 16200;
for (let k = 0; k < N; k++) {
  const m = T0 + k;
  const open = m >= 540 && m < 930, after = m >= 960;
  const drift = (k >= 150 && k < 200) ? 6 : (k >= 300 && k < 340) ? -4.5 : 0;
  p = Math.round((p + drift + (rnd() - 0.5) * 20) / 10) * 10; px.push(m < 510 ? null : p);
  let v = 0;
  if (m === 539) v = 250000;
  else if (m >= 510 && m < 540) v = 0;
  else if (open) v = (38000 * Math.exp(-(k - 60) / 90) + 6000 + rnd() * 5000) * ((k >= 150 && k < 200) ? 2.4 : 1);
  else if (after) v = 800 + rnd() * 1500;
  vol.push(Math.round(v));
  let b = 0, s = 0;
  if (k >= 140 && k < 210 && rnd() < 0.5) b = v * (0.1 + rnd() * 0.3);
  if (k >= 290 && k < 340 && rnd() < 0.5) s = v * (0.08 + rnd() * 0.25);
  if (k === 95 || k === 250) b = v * 0.3;
  tb.push(Math.round(b)); ts.push(Math.round(s));
}
const cumV = [], cumB = [], cumS = [], cumA = [];
const SHARES = 21_500_000, BASE = 15_600, MCAP = SHARES * BASE;
vol.reduce((a, v, k) => (cumV[k] = a + v), 0); vol.reduce((a, v, k) => (cumA[k] = a + v * (px[k] || 15600)), 0); tb.reduce((a, v, k) => (cumB[k] = a + v), 0); ts.reduce((a, v, k) => (cumS[k] = a + v), 0);
const hm = (k) => { const m = T0 + k; return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; };
const fq = (v) => v.toLocaleString('ko-KR');
const famt = (v) => v >= 1e8 ? `${(v / 1e8).toFixed(v >= 1e10 ? 0 : 1)}억` : `${Math.round(v / 1e4).toLocaleString('ko-KR')}만`;
const fman = (v) => v >= 1e4 ? `${fq(Math.round(v / 1e4))}만` : fq(v);
const pct = (v) => `${(v * 100).toFixed(1)}%`;
const lastPx = px.filter(Boolean).at(-1);
const HOVER = 215;
const first = cumV.findIndex((v) => v > 0);

// ── 그리기 ───────────────────────────────────────────────────────────
function chart(variant, phone) {
  const W = phone ? 358 : 1036, L = phone ? 46 : 52, R = 52, xr = W - R, pw = xr - L;
  const H1 = phone ? 72 : 104, H2 = phone ? 36 : 50, H3 = phone ? 28 : 40, H4 = phone ? 36 : 50, GAP = 7, TOP = phone ? 0 : 7;
  const y1a = TOP, y1b = y1a + H1, y2a = y1b + GAP, y2b = y2a + H2, y3a = y2b + GAP, y3b = y3a + H3;
  const y4a = y3b + GAP, y4b = y4a + H4, bottom = y4b, H = bottom + 15;
  const x = (k) => L + (k / N) * pw;
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" font-size="11">`;
  s += `<rect x="${x(0)}" y="${y1a}" width="${x(60) - x(0)}" height="${bottom - y1a}" fill="var(--accum-shade)"/>`;
  s += `<rect x="${x(450)}" y="${y1a}" width="${x(480) - x(450)}" height="${bottom - y1a}" fill="var(--accum-gap)"/>`;
  for (let h = 9; h <= 20; h += phone ? 3 : 1) { const xx = x((h - 8) * 60); s += `<line x1="${xx}" x2="${xx}" y1="${y1a}" y2="${bottom}" stroke="var(--border-subtle)"/><text x="${xx}" y="${H - 3}" text-anchor="middle" fill="var(--muted-fg)">${h}</text>`; }
  [y1b, y2b, y3b, y4b].forEach((yy) => (s += `<line x1="${L}" x2="${xr}" y1="${yy}" y2="${yy}" stroke="var(--border-subtle)"/>`));
  // ① 가격
  const pv = px.filter(Boolean), pmn = Math.min(...pv), pmx = Math.max(...pv), pad = (pmx - pmn) * 0.08;
  const yp = (v) => y1a + 3 + ((pmx + pad - v) / (pmx - pmn + 2 * pad)) * (H1 - 6);
  let d = ''; px.forEach((v, k) => { if (v) d += `${d ? 'L' : 'M'}${x(k).toFixed(1)},${yp(v).toFixed(1)}`; });
  s += `<path d="${d}" fill="none" stroke="var(--fg-2)" stroke-width="1.25"/>`;
  [160, 185, 310].forEach((k, i) => { s += `<circle cx="${x(k)}" cy="${yp(px[k])}" r="${4 + i}" fill="${i === 2 ? 'var(--down)' : 'var(--up)'}" fill-opacity=".55" stroke="${i === 2 ? 'var(--down)' : 'var(--up)'}"/>`; });
  s += `<text x="${L - 4}" y="${yp(pmx) + 4}" text-anchor="end" fill="var(--muted-fg)">${fq(pmx)}</text><text x="${L - 4}" y="${yp(pmn) + 4}" text-anchor="end" fill="var(--muted-fg)">${fq(pmn)}</text>`;
  // ② 순매수 계단
  let net = 0; const nets = tb.map((b, k) => (net += (b - ts[k]) * (px[k] || p)));
  const nmx = Math.max(0, ...nets), nmn = Math.min(0, ...nets), yn = (v) => y2a + 3 + ((nmx - v) / (nmx - nmn || 1)) * (H2 - 6);
  d = `M${L},${yn(0)}`; nets.forEach((v, k) => (d += `H${x(k + 1).toFixed(1)}V${yn(v).toFixed(1)}`));
  s += `<line x1="${L}" x2="${xr}" y1="${yn(0)}" y2="${yn(0)}" stroke="var(--faint)" stroke-dasharray="2 3"/><path d="${d}" fill="none" stroke="var(--team)" stroke-width="1.75"/>`;
  s += `<text x="${xr + 4}" y="${y2a + 9}" fill="var(--team)">${famt(nmx)}</text>`;
  // ③ 10분 팀 매수/매도(지금 그대로)
  const cw = pw / 72, bw = Math.max(1.5, cw * 0.42), bv = [], sv = [];
  for (let k = 0; k < 72; k++) { let b = 0, q = 0; for (let i = k * 10; i < k * 10 + 10; i++) { b += tb[i] * (px[i] || p); q += ts[i] * (px[i] || p); } bv.push(b); sv.push(q); }
  const bmx = Math.max(...bv, ...sv);
  for (let k = 0; k < 72; k++) {
    const hb = (bv[k] / bmx) * (H3 - 2), hs = (sv[k] / bmx) * (H3 - 2), x0 = L + k * cw;
    if (hb) s += `<rect x="${x0 + 1}" y="${y3b - hb}" width="${bw}" height="${hb}" fill="var(--up)" fill-opacity=".7"/>`;
    if (hs) s += `<rect x="${x0 + 2 + bw}" y="${y3b - hs}" width="${bw}" height="${hs}" fill="var(--down)" fill-opacity=".7"/>`;
  }
  s += `<text x="${xr + 4}" y="${y3a + 9}" fill="var(--muted-fg)">${famt(bmx)}</text>`;
  // ④ 누적 거래량 · 누적 팀 비중 · 시총 대비 거래대금
  const vh = y4b - y4a - 4, V = cumV[N - 1], yv = (v) => y4b - (v / V) * vh;
  const A = cumA[N - 1], ya = (v) => y4b - (v / A) * vh, turn = cumA.map((v) => v / MCAP);
  const sh = cumV.map((v, k) => (v > 0 ? (cumB[k] + cumS[k]) / v : null));
  const shB = cumV.map((v, k) => (v > 0 ? cumB[k] / v : null)), shS = cumV.map((v, k) => (v > 0 ? cumS[k] / v : null));
  const shMx = Math.max(...sh.filter((v) => v !== null));
  const area = (arr, yf, fill, op) => { let a = `M${x(first)},${y4b}`; for (let k = first; k < N; k++) a += `L${x(k + 1).toFixed(1)},${yf(arr[k]).toFixed(1)}`; return `<path d="${a}L${xr},${y4b}Z" fill="${fill}" fill-opacity="${op}"/>`; };
  const line = (arr, yf, stroke, sw, dash) => { let a = ''; for (let k = first; k < N; k++) if (arr[k] !== null) a += `${a ? 'L' : 'M'}${x(k + 1).toFixed(1)},${yf(arr[k]).toFixed(1)}`; return `<path d="${a}" fill="none" stroke="${stroke}" stroke-width="${sw}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`; };
  let ys;
  if (variant === 'A') {
    const top = Math.max(0.05, Math.ceil(shMx * 20) / 20); ys = (v) => y4b - (v / top) * vh;
    s += area(cumA, ya, 'var(--vol)', 0.55) + line(sh, ys, 'var(--team)', 1.75);
    s += `<text x="${L - 4}" y="${y4a + 9}" text-anchor="end" fill="var(--muted-fg)">${pct(turn[N - 1])}</text><text x="${L - 4}" y="${y4b - 1}" text-anchor="end" fill="var(--muted-fg)">0%</text>`;
    s += `<text x="${xr + 4}" y="${y4a + 9}" fill="var(--team)">${Math.round(top * 100)}%</text><text x="${xr + 4}" y="${y4b - 1}" fill="var(--team)">0%</text>`;
  } else if (variant === 'B') {
    const top = Math.max(0.05, Math.ceil(Math.max(shMx, turn[N - 1]) * 20) / 20); ys = (v) => y4b - (v / top) * vh;
    s += area(cumV, yv, 'var(--vol)', 0.55) + line(turn, ys, 'var(--vi)', 1.5) + line(sh, ys, 'var(--team)', 1.75);
    s += `<text x="${L - 4}" y="${y4a + 9}" text-anchor="end" fill="var(--muted-fg)">${fman(V)}</text>`;
    s += `<text x="${xr + 4}" y="${y4a + 9}" fill="var(--fg-2)">${Math.round(top * 100)}%</text><text x="${xr + 4}" y="${y4b - 1}" fill="var(--fg-2)">0%</text>`;
  } else {
    const top = Math.max(0.05, Math.ceil(shMx * 20) / 20); ys = (v) => y4b - (v / top) * vh;
    s += area(cumA, ya, 'var(--vol)', 0.35) + line(shB, ys, 'var(--up)', 1.25) + line(shS, ys, 'var(--down)', 1.25) + line(sh, ys, 'var(--team)', 1.75);
    s += `<text x="${L - 4}" y="${y4a + 9}" text-anchor="end" fill="var(--muted-fg)">${pct(turn[N - 1])}</text><text x="${L - 4}" y="${y4b - 1}" text-anchor="end" fill="var(--muted-fg)">0%</text>`;
    s += `<text x="${xr + 4}" y="${y4a + 9}" fill="var(--team)">${Math.round(top * 100)}%</text><text x="${xr + 4}" y="${y4b - 1}" fill="var(--team)">0%</text>`;
  }
  // 커서
  const cx = x(HOVER + 1);
  s += `<line x1="${cx}" x2="${cx}" y1="${y1a}" y2="${bottom}" stroke="var(--fg)" stroke-width="1"/>`;
  s += `<circle cx="${cx}" cy="${ys(sh[HOVER])}" r="3" fill="var(--team)" stroke="var(--card)"/>`;
  if (variant === 'B') s += `<circle cx="${cx}" cy="${ys(turn[HOVER])}" r="3" fill="var(--vi)" stroke="var(--card)"/>`;
  if (!phone) {
    s += `<g font-weight="600"><text x="${L + 4}" y="${y1a + 11}" fill="var(--fg-2)">가격 · <tspan fill="var(--up)">팀 평단</tspan> · 팀 주문 원(≥500만)</text>`;
    s += `<text x="${L + 4}" y="${y2a + 10}" fill="var(--team)">당일 팀 순매수</text><text x="${L + 4}" y="${y3a + 10}" fill="var(--fg-2)">10분 팀 매수 / 매도</text>`;
    if (variant === 'A') s += `<text x="${L + 4}" y="${y4a + 10}" fill="var(--fg-2)">누적 거래대금(회색 · 왼쪽 축 = 시총 대비 %) · <tspan fill="var(--team)">누적 팀 비중 %(오른쪽 축)</tspan></text>`;
    if (variant === 'B') s += `<text x="${L + 4}" y="${y4a + 10}" fill="var(--fg-2)">누적 거래량(회색 · 왼쪽 축) · <tspan fill="var(--vi)">거래대금 시총 대비 %</tspan> · <tspan fill="var(--team)">누적 팀 비중 %</tspan>(오른쪽 축 공용)</text>`;
    if (variant === 'C') s += `<text x="${L + 4}" y="${y4a + 10}" fill="var(--fg-2)">누적 거래대금(옅은 회색 · 왼쪽 축 = 시총 대비 %) · <tspan fill="var(--team)">팀 비중</tspan> · <tspan fill="var(--up)">매수</tspan> · <tspan fill="var(--down)">매도</tspan> %(오른쪽 축)</text>`;
    s += '</g>';
  }
  s += '</svg>';
  const k = HOVER;
  const tip = `<div class="tip" style="left:${(cx + 12) / W * 100}%;top:${y4a - 74}px">${hm(k + 1)}까지 · 누적 거래량 ${fq(cumV[k])}주<br/>거래대금 ${famt(cumA[k])} · 시총 대비 <b style="color:var(--vi)">${pct(turn[k])}</b><br/>팀 ${fq(cumB[k] + cumS[k])}주 · <b style="color:var(--team)">${pct(sh[k])}</b><br/>매수 ${fq(cumB[k])} (${pct(shB[k])}) · 매도 ${fq(cumS[k])} (${pct(shS[k])})</div>`;
  return `<div class="chart">${s}${tip}</div>`;
}

// ── 거래대금 카드 ─────────────────────────────────────────────────────
const CV = vol.reduce((a, v, k) => a + v * (px[k] || 16000), 0);
const BV = tb.reduce((a, v, k) => a + v * (px[k] || 16000), 0), SV = ts.reduce((a, v, k) => a + v * (px[k] || 16000), 0);
const CQ = vol.reduce((a, b) => a + b, 0);
function card(kind) {
  const share = (BV + SV) / CV;
  let mid = '', cols = 3, extra = '';
  const tv = `시총 대비 ${pct(CV / MCAP)}`;
  if (kind === 1) mid = `<div class="teamline"><span style="color:var(--vi);font-weight:600">${tv}</span> · 팀 ${famt(BV + SV)} ${pct(share)} <span>(매수 ${famt(BV)} · 매도 ${famt(SV)})</span></div>`;
  if (kind === 2) { cols = 5; extra = `<div><dt>시총 대비</dt><dd style="color:var(--vi)">${pct(CV / MCAP)}</dd></div><div><dt>팀 비중</dt><dd class="team">${pct(share)}</dd></div>`; }
  if (kind === 3) mid = `<div class="meter"><i style="width:${(BV / CV) * 100}%;background:var(--up)"></i><i style="width:${(SV / CV) * 100}%;background:var(--down)"></i></div><div class="mcap"><span>팀 <b>${famt(BV + SV)} · ${pct(share)}</b></span><span>매수 ${pct(BV / CV)} · 매도 ${pct(SV / CV)}</span></div><div class="mcap"><span style="color:var(--vi)">${tv}</span><span>시총 ${famt(MCAP)}</span></div>`;
  return `<div class="acard"><div class="hd"><h4>거래대금</h4><small>A3 15:19:58.412 기준</small></div><div class="bd">
    <div class="big">${famt(CV)}</div>${mid}
    <dl style="grid-template-columns:repeat(${cols},minmax(0,1fr))"><div><dt>현재가</dt><dd class="up">${fq(lastPx)}</dd></div><div><dt>등락률</dt><dd class="up">+3.84%</dd></div><div><dt>누적 거래량</dt><dd>${fq(CQ)}</dd></div>${extra}</dl></div></div>`;
}

const VARIANTS = [
  { id: 'A', t: 'A · 회색 영역 = 누적 거래대금(축 = 시총 대비 %) + 팀 비중 선', d: '회색 영역 하나가 거래대금과 시총 대비 %를 겸함(시총 = 기준가 × 상장주식수 고정이라 모양이 같다) · 보라 선 = 누적 팀 비중(오른쪽 축). 누적 거래량 숫자는 툴팁. 선 2개로 가장 조용함.' },
  { id: 'B', t: 'B · 회색 영역 = 누적 거래량 + % 선 2개(시총 대비 주황 · 팀 비중 보라)', d: '거래량 영역은 주 단위(왼쪽 축) 그대로 두고, 시총 대비 거래대금 % 와 팀 비중 % 를 오른쪽 공용 축 선 2개로. 두 % 범위가 크게 다르면(회전율 80% vs 팀 5%) 한쪽이 납작해짐.' },
  { id: 'C', t: 'C · A + 팀 매수 · 매도 비중 선', d: 'A 에 매수 비중(빨강) · 매도 비중(파랑) 선을 더함 · 회색은 옅게. 사서 비중을 올리는지 · 팔아서 올리는지가 갈려 보임.' },
];
function render() {
  const phone = document.body.classList.contains('phone');
  let h = VARIANTS.map((v) => `<section class="variant"><p class="vt">${v.t}</p><p class="vd">${v.d}</p>${chart(v.id, phone)}</section>`).join('');
  h += `<h3 class="sec">거래대금 카드 — 시총 대비 · 팀 비중(커서까지 누적)</h3><div class="cards">
    <section class="variant"><p class="vt">① 큰 숫자 밑 한 줄</p><p class="vd">시총 대비 · 팀 거래대금 · 비중 · 매수/매도 금액</p>${card(1)}</section>
    <section class="variant"><p class="vt">② 칸 추가 「시총 대비」 · 「팀 비중」</p><p class="vd">기존 3칸 옆에 % 두 칸 · 가장 조용함(폰은 줄바꿈)</p>${card(2)}</section>
    <section class="variant"><p class="vt">③ 비중 막대</p><p class="vd">얇은 막대(빨강 매수 · 파랑 매도) + 금액 · % · 아래 시총 대비</p>${card(3)}</section></div>`;
  document.getElementById('wrap').innerHTML = h + `<p class="note">공통: 누적은 A3 하나마다 쌓는다(10분 칸 없음 · 확대해도 정확) — 그림은 지금 가격 선처럼 픽셀 열마다 솎음. 세로 줄 = 현재 틱 커서 · 마우스를 대면 위 툴팁(그 시각까지 누적 거래량 · 팀 수량 · 비중 · 매수/매도). 10분 팀 매수/매도 판은 그대로 둔다. 시총 = 기준가(전일 종가) × 상장주식수(종목 마스터 · 현재 값) — 그날 안에서 고정이라 시총 대비 % 는 누적 거래대금에 비례. 팀 = 지금 차트와 같은 판정(팀 주문의 체결 조각 · 단일가 제외) — 거래량은 단일가 포함 그 거래소 전체. 카드 비중 = 커서까지 팀 체결 금액 ÷ 누적 거래대금.</p>`;
}
for (const id of ['theme', 'width']) document.getElementById(id).addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll(`#${id} button`).forEach((x) => x.classList.toggle('on', x === b));
  if (id === 'theme') document.documentElement.dataset.theme = b.dataset.v; else document.body.classList.toggle('phone', b.dataset.v === 'phone');
  render();
});
render();
</script>
</body>
</html>
