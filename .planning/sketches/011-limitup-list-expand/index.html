<style>

.more { all: unset; cursor: pointer; font-size: 13px; color: var(--blue); font-weight: 600; margin-top: 12px; display: inline-block; }
.more:hover { text-decoration: underline; }

#toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); background: #2c2c35; color: #fff; font-size: 13px; padding: 10px 16px; border-radius: 12px; opacity: 0; transition: all .2s; z-index: 99; pointer-events: none; }
#toast.show { opacity: 1; transform: translateX(-50%); }

<script src="data.js"></script>
<script>
/* ───────────── 데이터 ─────────────
   덕우전자 · 엑시온그룹 · 형지글로벌 = workers/limitup-sync/tests/fixtures/export/20261002 실데이터.
   에스제이그룹 = 사용자 스크린샷(사실 문장) 기준 근사 합성 — 곡선 모양만 근사. */
const KST = (h, m, s) => h * 3600 + m * 60 + s;
function sjSynth() {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const upper = 1965, base = 1512, elo = KST(9,0,0), fu = KST(9,6,54.413), ehi = Math.ceil(fu + 60);
  const entrySer = [];
  for (let s = elo; s <= ehi; s += 2) {
    let px = null;
    if (s >= KST(9,2,18)) px = s < KST(9,4,40) ? 1936 + Math.round((rnd() - .5) * 20) : s < fu ? 1900 + Math.round(rnd() * 60) : 1965;
    let wall = s < KST(9,2,18) ? 1.5e7 + rnd() * 2e7 : s < KST(9,4,40) ? 0 : s < KST(9,6,20) ? 2e7 + rnd() * 3e7 : s < fu ? 7.756e7 : 0;
    if (Math.abs(s - KST(9,1,50)) < 3) wall = 8e7;
    entrySer.push([s, px, Math.round(wall)]);
  }
  const lo = Math.floor(fu) - 20, hi = KST(15,30,25) + 20, lockSer = [];
  for (let s = lo; s <= hi; s += 60) {
    const q = s < fu ? 0 : s < KST(9,7,20) ? 2.7e8 + (s - fu) / 26 * 2.1e8 : 4.6e8 - (s - KST(9,7,20)) / 23000 * 0.5e8 + (rnd() - .5) * 1e7;
    lockSer.push([s, Math.round(q), s < fu ? 0 : 1]);
  }
  const day = [];
  for (let s = KST(9,0,0); s <= KST(15,30,0); s += 60) day.push([s, s < KST(9,2,18) ? null : s < fu ? 1930 : 1965, s < fu ? 0 : 4.5e8]);
  const F = (t, id, text, v, src = '실측') => ({ ev: 0, t, id, text, v, src });
  return {
    isin: 'KR7306040008', code: '306040', name: '에스제이그룹', base, upper, close: 1965, closeRet: 0, detect: 20,
    t20: KST(9,2,18.63), t25: KST(9,2,18.63), fu, wallClearS: 0,
    locks: [{ id: 1, start: fu, end: KST(15,30,25), dur: 23010.6, broke: false, outcome: '유지', q0: 0 }],
    facts: [
      F(KST(9,2,18.63), 'entry_threshold', '09:02:18.630 등락률 20% 첫 도달 — 현재가 1,936원', { pct: 20, px: 1936 }),
      F(fu, 'burst_wall', '09:06:54.413 매수 39,478주 버스트(3조각·0.539ms, 7,756만) — 매도벽 7,756만→0만', { krw: 77560000, wall_from: 77560000, wall_to: 0 }),
      F(fu, 'first_upper', '09:06:54.413 첫 상한가 체결 1,965원 — 직전 매도벽 9,719만', { px: 1965, wall_krw: 97190000 }),
      F(fu, 'member_entry_buy', '진입 1분 매수 창구 상위: 키움증권 89.1% · 신한증권 7.8% · 하나증권 3.1%', { m1: '키움증권', s1: 89.1, m2: '신한증권', s2: 7.8, m3: '하나증권', s3: 3.1 }, '추정(분 단위)'),
      { ev: 1, t: fu, id: 'lock_start', text: '09:06:54.413 잠김 1 시작 — 잔량 0주(0만)', v: { lock_id: 1, q_krw: 0 }, src: '실측' },
      { ev: 1, t: fu + .002, id: 'big_new', text: '09:06:54.415 상한가 매수 신규 135,030주(2.7억) — 잔량 0→135,030', v: { krw: 2.7e8 }, src: '실측' },
      { ev: 1, t: KST(9,6,58.466), id: 'big_new', text: '09:06:58.466 상한가 매수 신규 23,056주(4,531만) — 잔량 193,398→216,454', v: { krw: 4.531e7 }, src: '실측' },
      { ev: 1, t: KST(9,7,20.149), id: 'q_max', text: '09:07:20.149 잠김 1 최대 잔량 245,628주(4.8억)', v: { krw: 4.8e8 }, src: '실측' },
      { ev: 1, t: KST(15,30,25), id: 'lock_hold', text: '잠김 1 종가까지 유지 — 23010.6초', v: {}, src: '실측' },
    ],
    entryWin: [elo, ehi], entrySer, lockWin: [lo, hi], lockSer, day,
  };
}
const ALL = [...window.LU_DATA, sjSynth()];
const SHOWN = ALL.filter((d) => d.fu != null).sort((a, b) => a.fu - b.fu);   // 상한가 미도달 제외
const EXCLUDED = ALL.filter((d) => d.fu == null);

/* ───────────── 표기 ───────────── */
const pad = (n) => String(n).padStart(2, '0');
const clock = (s, ms = false) => { const t = Math.floor(s); const base = `${pad(Math.floor(t / 3600))}:${pad(Math.floor(t / 60) % 60)}:${pad(t % 60)}`; return ms ? base + '.' + String(Math.round((s - t) * 1000)).padStart(3, '0') : base; };
const hm = (s) => clock(s).slice(0, 5);
const won = (n) => Math.round(n).toLocaleString('ko-KR') + '원';
const krw = (n) => Math.abs(n) >= 1e8 ? (n / 1e8).toFixed(1) + '억' : Math.round(n / 1e4).toLocaleString('ko-KR') + '만';
const dur = (s) => s >= 3600 ? `${Math.floor(s / 3600)}시간 ${Math.floor(s / 60) % 60}분` : s >= 60 ? `${Math.floor(s / 60)}분 ${Math.round(s % 60)}초` : `${s.toFixed(1)}초`;
const stripTime = (t) => t.replace(/^\d\d:\d\d:\d\d\.\d{3}\s/, '');

const state = { v: 'A', w: 'desktop', b: '20', open: new Set([SHOWN[0].isin]), hl: null, bSel: {}, cMore: new Set() };

/* ───────────── 사건 목록(번호 = 차트 마커 = 사실 문장) ───────────── */
function eventsOf(d) {
  const ev = [];
  const priceAt = (s) => { let best = null; for (const p of d.entrySer) { if (p[0] > s + 1) break; if (p[1] != null) best = p[1]; } return best; };
  const b = state.b;
  const lock = d.locks[0];
  for (const f of d.facts) {
    const e = { t: f.t, fact: f, lane: f.ev === 0 ? 'entry' : 'lock' };
    switch (f.id) {
      case 'entry_threshold':
        if (b === '25') continue;
        Object.assign(e, { short: `${f.v.pct}% 도달`, val: won(f.v.px), y: f.v.px, key: true, color: 'amber' }); break;
      case 'burst_wall': Object.assign(e, { short: `매수 버스트 ${krw(f.v.krw)}`, val: `매도벽 ${krw(f.v.wall_from)}→${krw(f.v.wall_to)}`, y: priceAt(f.t) }); break;
      case 'first_upper': Object.assign(e, { short: '첫 상한가 체결', val: won(f.v.px), y: f.v.px, key: true, color: 'red' }); break;
      case 'member_entry_buy': Object.assign(e, { window: [d.fu - 60, d.fu], noMark: true, label: `상한가 직전 1분 매수 창구 (${clock(d.fu - 60)}~${clock(d.fu)})` }); break;
      case 'lock_start': Object.assign(e, { short: `잠김 ${f.v.lock_id} 시작`, val: krw(f.v.q_krw), key: true, color: 'red' }); break;
      case 'big_new': Object.assign(e, { short: `매수 신규 +${krw(f.v.krw)}` }); break;
      case 'big_cancel': Object.assign(e, { short: `매수 취소 −${krw(f.v.krw)}`, color: 'blue' }); break;
      case 'q_max': Object.assign(e, { short: `최대 잔량 ${krw(f.v.krw)}` }); break;
      case 'lock_break': Object.assign(e, { short: '깨짐', val: `${won(f.v.px)} · ${f.v.dur_s}초 유지`, key: true, color: 'blue' }); break;
      case 'lock_hold': Object.assign(e, { short: '종가까지 유지', val: dur(lock.dur), key: true, color: 'red', t: lock.end }); break;
      case 'member_prebreak_sell': Object.assign(e, { window: [lock.end - 60, lock.end], noMark: true, label: `깨짐 직전 1분 매도 창구 (${clock(lock.end - 60)}~${clock(lock.end)})` }); break;
    }
    ev.push(e);
  }
  if (b !== '20' && d.t25 != null) {
    const same = d.t25 <= d.t20 + 1;
    ev.push({ t: d.t25, lane: 'entry', short: '25% 도달', val: won(priceAt(d.t25) ?? d.base * 1.25), y: priceAt(d.t25), key: b === '25', color: 'amber',
      synth: `${clock(d.t25, true)} 등락률 25% 첫 도달${same ? ' — 20%와 같은 순간(갭 상승)' : ''}` });
  }
  ev.sort((a, c) => a.t - c.t || (a.noMark ? 1 : 0) - (c.noMark ? 1 : 0));
  let n = 0;
  for (const e of ev) if (!e.noMark) e.n = ++n;
  return ev;
}
const NUM = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫';

/* ───────────── 차트 ───────────── */
function lane(d, kind, W, opts = {}) {
  const ev = eventsOf(d).filter((e) => e.lane === kind || (kind === 'entry' && e.window && e.fact?.id === 'member_entry_buy') || (kind === 'lock' && e.window && e.fact?.id === 'member_prebreak_sell'));
  const [lo, hi] = kind === 'entry' ? d.entryWin : d.lockWin;
  const ser = kind === 'entry' ? d.entrySer : d.lockSer;
  const phone = state.w === 'phone';
  const marks = ev.filter((e) => !e.noMark && e.t >= lo - 1 && e.t <= hi + 1);
  // 라벨 띠: 겹치면 아래 줄로(최대 3줄) — 그 이상은 번호만
  const rows = [], placed = [];
  const x = (s) => 40 + (Math.min(Math.max(s, lo), hi) - lo) / (hi - lo) * (W - 56);
  for (const m of marks) {
    const label = phone ? '' : `${clock(m.t)} ${m.short}${m.val && m.key ? ' · ' + m.val : ''}`;
    const w = phone ? 18 : label.length * 6.4 + 30;
    let r = 0; while (r < 3 && rows[r] != null && rows[r] > x(m.t) - 4) r++;
    if (r === 3) { placed.push({ m, label: '', row: -1 }); continue; }
    let lx = Math.min(x(m.t) - 6, W - w - 4);
    if (rows[r] != null) lx = Math.max(lx, rows[r] + 4);
    rows[r] = lx + w; placed.push({ m, label, row: r, lx, w });
  }
  const band = 18 + 20 * Math.max(1, rows.length);
  const H = band + (kind === 'entry' ? 190 : 120) + 24;
  const top = band + 6, bot = H - 24;
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
  // 창 음영(상한가 직전 1분 · 깨짐 직전 1분)
  for (const e of ev.filter((e) => e.window)) {
    const x0 = x(e.window[0]), x1 = x(e.window[1]);
    svg += `<rect x="${x0}" y="${top}" width="${Math.max(2, x1 - x0)}" height="${bot - top}" fill="rgba(52,133,250,.12)"/>`;
    svg += `<text x="${x0 + 3}" y="${bot - 6}" font-size="10.5" fill="#7fb0ff">${e.fact.id === 'member_entry_buy' ? '상한가 직전 1분' : '깨짐 직전 1분'}</text>`;
  }
  if (kind === 'entry') {
    const pTop = top, pBot = top + 112, wTop = top + 128, wBot = bot;
    const refs = ser.map((p) => p[1]).filter((v) => v != null);
    const lines = [{ v: d.upper, label: `상한가 ${won(d.upper)}`, c: '#f04251', dash: '' }];
    if (state.b !== '25') lines.push({ v: Math.round(d.base * 1.2), label: `등락률 20% (탐지 기준) ${won(d.base * 1.2)}`, c: '#ffb13d', dash: '4 4' });
    if (state.b !== '20') lines.push({ v: Math.round(d.base * 1.25), label: `등락률 25% ${won(d.base * 1.25)}`, c: '#ffb13d', dash: '2 5' });
    const mn = Math.min(...refs, ...lines.map((l) => l.v)), mx = Math.max(...refs, ...lines.map((l) => l.v));
    const py = (v) => pBot - (v - mn) / ((mx - mn) || 1) * (pBot - pTop);
    // 축 캡션
    svg += `<text x="4" y="${pTop + 10}" font-size="10.5" fill="#7e7e87">가격</text><text x="4" y="${wTop + 14}" font-size="10.5" fill="#7e7e87">매도벽</text>`;
    for (const l of lines) {
      const up = l.label.startsWith('상한가');
      svg += `<line x1="40" x2="${W - 16}" y1="${py(l.v)}" y2="${py(l.v)}" stroke="${l.c}" stroke-opacity=".7" stroke-dasharray="${l.dash}"/>`;
      svg += `<text x="${up ? W - 18 : 44}" y="${py(l.v) + (up ? -4 : 13)}" font-size="11" text-anchor="${up ? 'end' : 'start'}" fill="${l.c}">${l.label}</text>`;
    }
    let path = '', pen = false;
    for (const p of ser) { if (p[1] == null) { pen = false; continue; } path += `${pen ? 'L' : 'M'}${x(p[0]).toFixed(1)},${py(p[1]).toFixed(1)}`; pen = true; }
    svg += `<path d="${path}" fill="none" stroke="#e4e4e5" stroke-width="1.6"/>`;
    const wmax = Math.max(...ser.map((p) => p[2] ?? 0), 1);
    const wy = (v) => wBot - v / wmax * (wBot - wTop);
    let wp = `M${x(ser[0][0])},${wBot}`; for (const p of ser) wp += `L${x(p[0]).toFixed(1)},${wy(p[2] ?? 0).toFixed(1)}`; wp += `L${x(ser.at(-1)[0])},${wBot}Z`;
    svg += `<path d="${wp}" fill="rgba(158,158,164,.22)" stroke="#9e9ea4" stroke-width="1"/>`;
    svg += `<text x="44" y="${wTop - 3}" font-size="10.5" fill="#7e7e87">상한가까지 남은 매도벽 · 최대 ${krw(wmax)}</text>`;
    for (const pl of placed) pl.m.py = pl.m.y != null ? py(pl.m.y) : py(d.upper);
  } else {
    const ref = 1e9;
    const qmax = Math.max(...ser.map((p) => p[1] ?? 0), 1);
    const ymax = Math.max(qmax * 1.12, qmax < ref * .5 ? qmax * 1.12 : ref * 1.05);
    const qy = (v) => bot - v / ymax * (bot - top);
    if (ref <= ymax) { svg += `<line x1="40" x2="${W - 16}" y1="${qy(ref)}" y2="${qy(ref)}" stroke="#ffb13d" stroke-opacity=".6" stroke-dasharray="4 4"/><text x="${W - 18}" y="${qy(ref) - 4}" font-size="11" text-anchor="end" fill="#ffb13d">기준 10억</text>`; }
    else svg += `<text x="${W - 18}" y="${top + 10}" font-size="10.5" text-anchor="end" fill="#7e7e87">기준 10억은 축 밖(최대 ${krw(qmax)})</text>`;
    for (const l of d.locks) { const x0 = x(l.start), x1 = x(l.end); svg += `<rect x="${x0}" y="${top}" width="${Math.max(2, x1 - x0)}" height="${bot - top}" fill="rgba(240,66,81,.07)"/>`; }
    let qp = `M${x(ser[0][0])},${bot}`; for (const p of ser) qp += `L${x(p[0]).toFixed(1)},${qy(p[1] ?? 0).toFixed(1)}`; qp += `L${x(ser.at(-1)[0])},${bot}Z`;
    svg += `<path d="${qp}" fill="rgba(240,66,81,.16)" stroke="#f04251" stroke-width="1.4"/>`;
    svg += `<text x="4" y="${top + 10}" font-size="10.5" fill="#7e7e87">잔량</text>`;
    const qAt = (s) => { let best = 0; for (const p of ser) { if (p[0] > s + .5) break; best = p[1] ?? 0; } return best; };
    for (const pl of placed) pl.m.py = qy(pl.m.fact?.v?.krw && pl.m.fact.id === 'q_max' ? pl.m.fact.v.krw : qAt(pl.m.t));
  }
  // 시각 눈금
  for (let i = 0; i < 4; i++) { const s = lo + (hi - lo) * i / 3; svg += `<text x="${x(s)}" y="${H - 6}" font-size="10.5" fill="#7e7e87" text-anchor="${i === 0 ? 'start' : i === 3 ? 'end' : 'middle'}">${(hi - lo) < 600 ? clock(s) : hm(s)}</text>`; }
  // 마커 + 라벨 띠 + 지시선
  for (const pl of placed) {
    const m = pl.m, mx = x(m.t), my = m.py;
    const col = m.color === 'red' ? '#f04251' : m.color === 'blue' ? '#3485fa' : m.color === 'amber' ? '#ffb13d' : '#e4e4e5';
    const hl = state.hl === `${d.isin}:${m.n}`;
    if (pl.row >= 0) {
      const ly = 14 + pl.row * 20;
      svg += `<line x1="${mx}" x2="${mx}" y1="${ly + 6}" y2="${my}" stroke="${col}" stroke-opacity="${hl ? .9 : .35}" stroke-dasharray="2 3"/>`;
      svg += `<g data-mk="${d.isin}:${m.n}" style="cursor:pointer"><rect x="${pl.lx}" y="${ly - 9}" width="${pl.w}" height="17" rx="8.5" fill="${hl ? '#3c3c47' : '#2c2c35'}"/>`;
      svg += `<circle cx="${pl.lx + 9}" cy="${ly - .5}" r="7" fill="${m.key ? '#fff' : '#4d4d59'}"/><text x="${pl.lx + 9}" y="${ly + 3}" font-size="10" font-weight="700" text-anchor="middle" fill="${m.key ? '#17171c' : '#fff'}">${m.n}</text>`;
      svg += `<text x="${pl.lx + 21}" y="${ly + 3.5}" font-size="11" fill="${m.key ? '#fff' : '#bdbdc2'}" font-weight="${m.key ? 600 : 400}">${pl.label}</text></g>`;
    }
    svg += `<circle data-mk="${d.isin}:${m.n}" cx="${mx}" cy="${my}" r="${hl ? 6 : m.key ? 4.5 : 3.5}" fill="${col}" stroke="#17171c" stroke-width="1.5" style="cursor:pointer"/>`;
    if (pl.row < 0) svg += `<text x="${mx}" y="${my - 8}" font-size="10.5" font-weight="700" text-anchor="middle" fill="${col}">${m.n}</text>`;
  }
  return svg + '</svg>';
}

function dayChart(d, W) {
  const H = 150, top = 22, bot = H - 22, lo = KST(9, 0, 0), hi = KST(15, 30, 0);
  const x = (s) => 8 + (Math.min(Math.max(s, lo), hi) - lo) / (hi - lo) * (W - 16);

  for (const l of d.locks) s += `<rect x="${x(l.start)}" y="${top}" width="${Math.max(3, x(l.end) - x(l.start))}" height="${bot - top}" fill="${l.broke ? 'rgba(52,133,250,.14)' : 'rgba(240,66,81,.12)'}"/>`;

  const b20 = d.base * 1.2; s += `<line x1="8" x2="${W - 8}" y1="${py(b20)}" y2="${py(b20)}" stroke="#ffb13d" stroke-opacity=".6" stroke-dasharray="4 4"/><text x="10" y="${py(b20) - 4}" font-size="11" fill="#ffb13d">20%</text>`;
  let p = '', pen = false; for (const q of d.day) { if (q[1] == null) { pen = false; continue; } p += `${pen ? 'L' : 'M'}${x(q[0]).toFixed(1)},${py(q[1]).toFixed(1)}`; pen = true; }

function spark(d, W = 140, H = 28) {
  const lo = KST(9, 0, 0), hi = KST(15, 30, 0), x = (s) => (s - lo) / (hi - lo) * W;
  const m = Math.max(...d.day.map((p) => p[2] ?? 0), 1);

/* ───────────── 공통 조각 ───────────── */

const qMax = (d) => { const f = d.facts.find((f) => f.id === 'q_max'); return f ? f.v.krw : null; };
const memTop = (d) => { const f = d.facts.find((f) => f.id === 'member_entry_buy'); return f ? `${f.v.m1} ${f.v.s1}%` : '—'; };

function storyLine(d) {

function factList(d, ev) {

function memberBars(d) {

    { k: `첫 상한가 체결 · 20% 뒤 +${dur(d.fu - d.t20)}`, v: clock(d.fu), s: won(d.upper) + ` · 직전 매도벽 ${krw(d.facts.find((f) => f.id === 'first_upper')?.v.wall_krw ?? 0)}` },
    { k: '잠김 최대 잔량', v: qMax(d) != null ? krw(qMax(d)) : '—', s: (() => { const f = d.facts.find((f) => f.id === 'q_max'); return f ? clock(f.t) : ''; })() },
    { k: '결과', v: l ? (l.broke ? `${dur(l.dur)} 만에 깨짐` : '종가까지 유지') : '잠김 없음', s: l ? (l.broke ? `${won(l.breakPx)} · 종가 ${(d.closeRet * 100).toFixed(1)}%` : dur(l.dur)) : '' },
  ];
  let h = `<div class="steps">${steps.map((s, i) => `<div class="step"><div class="k">${s.k}</div><div class="v">${s.v}</div><div class="s">${s.s}</div>${s.after && i < 3 ? `<span class="after">${s.after}</span>` : ''}</div>`).join('')}</div>`;
  h += `<div class="lane-h"><b>하루 가격</b><span>09:00~15:30 · 빨간 면 = 잠김 · 파란 면 = 깨진 잠김 · ● 20% 도달 / 첫 상한가 / 깨짐</span></div>${dayChart(d, W)}`;
  const more = state.cMore.has(d.isin);
  h += `<button class="more" data-more="${d.isin}">${more ? '자세히 닫기 ▴' : '자세히 — 상한가 도달까지 · 잠김 구간 차트 · 사실 문장 ▾'}</button>`;
  if (more) h += `<div style="margin-top:6px">${detailA(d, W).replace(/<div class="story">[\s\S]*?<\/div>/, '')}</div>`;
  return h;
}

/* ───────────── 페이지 ───────────── */
function render() {
  const phone = state.w === 'phone';
  const W = phone ? 390 - 28 - 28 : 1120 - 64 - 36;
  const rows = SHOWN.map((d) => {
    const open = state.open.has(d.isin);
    const det = !open ? '' : state.v === 'A' ? detailA(d, W) : state.v === 'B' ? detailB(d, W) : detailC(d, W);
    const qm = qMax(d);
    return `<div class="lrow${open ? ' open' : ''}" data-isin="${d.isin}">
      <button class="rbtn" data-toggle="${d.isin}">
        <span class="c-nm nm"><b>${d.name}</b><span>${d.code} · 상한가 ${won(d.upper)}</span></span>
        <span class="c-tag">${outcomeTag(d)}</span>
        <span class="c-fu num">${clock(d.fu)}</span>
        <span class="c-spark">${spark(d, phone ? 330 : 220)}</span>
        <span class="c-q num">${qm != null ? krw(qm) : '—'}</span>
        <span class="c-mem num" style="font-size:13px">${memTop(d)}</span>
        <span class="c-meta">첫 상한가 ${clock(d.fu)} · 최대 ${qm != null ? krw(qm) : '—'} · 직전 1분 매수 ${memTop(d)}</span>
        <span class="chev">▾</span>
      </button>
      <div class="body"><div class="inner">${det}</div></div>
    </div>`;
  }).join('');
  const kept = SHOWN.filter((d) => d.locks.at(-1) && !d.locks.at(-1).broke).length;
  const broke = SHOWN.filter((d) => d.locks.at(-1)?.broke).length;
  document.getElementById('stage').innerHTML = `
  <div class="f ${state.w}">
    <nav class="side">
      <div class="brand">GH Radar</div>
      <a><span class="ic">⌂</span>홈</a><a><span class="ic">⌕</span>검색</a><a><span class="ic">⚡</span>트레이딩</a>
      <a class="grp on"><span class="ic">📈</span>분석</a>
      <a class="sub">상한가 보고서</a>
      <a class="sub new">AI 애널리스트</a>
      <a><span class="ic">◉</span>My page</a>
    </nav>
    <div class="col"><div class="main">
      <div class="phead"><h1>상한가 보고서</h1><span class="sub">평일 밤 21:20쯤 그날 보고서가 올라와요</span><span class="sp"></span>
        <span class="datepill"><button data-toast="이전 날짜">‹</button><span>10/02 (금)</span><button data-toast="다음 날짜">›</button></span></div>
      <div class="kpis">
        <div class="kpi"><div class="k">상한가 도달</div><div class="v">${SHOWN.length}<small>종목</small></div></div>
        <div class="kpi"><div class="k">종가까지 유지</div><div class="v">${kept}<small>종목</small></div></div>
        <div class="kpi"><div class="k">깨짐</div><div class="v">${broke}<small>종목</small></div></div>
        <div class="kpi"><div class="k">어제 D+1 시가</div><div class="v">—</div></div>
      </div>
      <div class="excl">상한가에 닿지 않은 ${EXCLUDED.length}종목(${EXCLUDED.map((d) => d.name).join(' · ')})은 목록에서 뺐어요 · 첫 상한가 시각 순</div>
      <div class="list">
        <div class="lhead"><span>종목</span><span>결과</span><span>첫 상한가</span><span>잔량 (09:00~15:30)</span><span>최대 잔량</span><span>직전 1분 매수 1위</span><span></span></div>
        ${rows}
      </div>
      <div style="font-size:12px;color:var(--t500)">↓ 아래로 창구 지문표 · 어제 결과(지금과 같음 — 목업 생략)</div>
    </div></div>
  </div>`;
  const desc = {
    A: '<b>A 번호 연결</b> — 행을 누르면 그 자리에서 펼쳐짐(한 번에 하나). 한 줄 요약 → 두 차트(상한가 도달까지 · 잠김 구간) → 오른쪽 사실 문장. 차트 위 라벨 띠의 ①②③과 사실 문장 번호가 같고, 둘 중 하나에 마우스를 올리면 서로 강조. 파란 면 = 「상한가 직전 1분」(옛 「진입 1분」).',
    B: '<b>B 타임라인 우선</b> — 펼치면 왼쪽에 사건 세로 타임라인(사건 사이 간격 +N분 표시), 오른쪽에 차트 하나. 사건을 누르면 차트가 그 사건 구간(상한가 도달까지 / 잠김)으로 바뀌고 해당 번호가 강조. 여러 행 동시에 펼침 가능.',
    C: '<b>C 요약 카드 먼저</b> — 펼치면 4단계 카드(20% 도달 → 첫 상한가 → 최대 잔량 → 결과)와 하루 가격 차트 하나만. 「자세히」를 한 번 더 누르면 A의 두 차트 + 사실 문장이 열림. 여러 행 동시에 펼침 가능.',
  };
  document.getElementById('desc').innerHTML = desc[state.v] + ' &nbsp;·&nbsp; 데이터: 덕우전자 · 엑시온그룹 = 10/02 실데이터(픽스처), 에스제이그룹 = 스크린샷 사실 문장 기준 근사. 사이드바 「AI 애널리스트」 = 분석 하위로 이동(요청 1).';
}

/* ───────────── 상호작용 ───────────── */
const toast = (t) => { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('show'), 1400); };
document.getElementById('nav').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const g = b.parentElement; g.querySelectorAll('button').forEach((x) => x.classList.remove('on')); b.classList.add('on');
  if (b.dataset.v) { state.v = b.dataset.v; if (state.v === 'A' && state.open.size > 1) state.open = new Set([[...state.open][0]]); }
  if (b.dataset.w) state.w = b.dataset.w;
  if (b.dataset.b) state.b = b.dataset.b;
  state.hl = null; render();
});
document.getElementById('stage').addEventListener('click', (e) => {
  const t = e.target.closest('[data-toggle],[data-bsel],[data-more],[data-toast],[data-mk]'); if (!t) return;
  if (t.dataset.toggle) {
    const id = t.dataset.toggle;
    if (state.open.has(id)) state.open.delete(id); else { if (state.v === 'A') state.open.clear(); state.open.add(id); }
    state.hl = null;
  } else if (t.dataset.bsel) { const [i, n] = t.dataset.bsel.split(':'); state.bSel[i] = +n; }
  else if (t.dataset.more) { const i = t.dataset.more; state.cMore.has(i) ? state.cMore.delete(i) : state.cMore.add(i); }
  else if (t.dataset.toast) { toast(t.dataset.toast + ' (목업)'); return; }
  else if (t.dataset.mk && state.v === 'B') { const [i, n] = t.dataset.mk.split(':'); state.bSel[i] = +n; }
  render();
});
document.getElementById('stage').addEventListener('mouseover', (e) => {
  if (state.v === 'B') return;
  const t = e.target.closest('[data-mk],[data-fk]');
  const key = t ? (t.dataset.mk ?? t.dataset.fk) : null;
  if (key && key.endsWith(':')) return;
  if (key === state.hl) return;
  state.hl = key;
  document.querySelectorAll('.fact').forEach((f) => f.classList.toggle('hl', f.dataset.fk === key));
  document.querySelectorAll('circle[data-mk]').forEach((c) => { const on = c.dataset.mk === key; c.setAttribute('r', on ? 6.5 : c.dataset.r0 ?? (c.dataset.r0 = c.getAttribute('r'))); if (!on && c.dataset.r0) c.setAttribute('r', c.dataset.r0); });
  document.querySelectorAll('g[data-mk] rect').forEach((r) => r.setAttribute('fill', r.parentElement.dataset.mk === key ? '#4d4d59' : '#2c2c35'));
});
render();
</script>
</body>
</html>
