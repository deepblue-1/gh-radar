<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>날짜 달력 피커 A/B/C</title>
<style>
  :root {
    --bg: #ffffff; --fg: #191f28; --fg-2: #333d4b; --muted: #f2f4f6; --muted-fg: #6b7684; --faint: #b0b8c1;
    --raised-2: #e5e8eb; --border: #f2f4f6; --border-subtle: #e5e8eb; --card: #ffffff; --popover: #ffffff;
    --popover-fg: #191f28; --primary: #3182f6; --primary-fg: #ffffff; --up: #f04452; --down: #3182f6; --r: 10px;
    --page: #f2f4f6;
  }
  :root[data-theme="dark"] {
    --bg: #0a0a0a; --fg: #ffffff; --fg-2: #e4e4e4; --muted: #2d2d2d; --muted-fg: #9e9e9e; --faint: #636363;
    --raised-2: #3d3d3d; --border: rgba(255,255,255,.06); --border-subtle: #3d3d3d; --card: #151515; --popover: #2d2d2d;
    --popover-fg: #ffffff; --primary: #3485fa; --primary-fg: #ffffff; --up: #f04251; --down: #3485fa; --page: #0a0a0a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--fg); font: 14px/1.45 Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; align-items: center; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--border-subtle); flex-wrap: wrap; }
  .bar b { margin-right: 8px; }
  .seg { display: inline-flex; background: var(--muted); border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: transparent; color: var(--muted-fg); padding: 4px 12px; border-radius: 999px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .seg button.on { background: var(--card); color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; padding: 16px; max-width: 1240px; margin: 0 auto; }
  body.phone .grid { grid-template-columns: 390px; justify-content: center; }
  .variant { background: var(--card); border-radius: 16px; padding: 14px 16px 18px; min-height: 520px; position: relative; }
  .vt { font-weight: 700; font-size: 15px; margin: 0 0 2px; }
  .vd { color: var(--muted-fg); font-size: 12.5px; margin: 0 0 14px; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .head h2 { margin: 0; font-size: 17px; }
  .pill { display: inline-flex; align-items: center; background: var(--muted); border-radius: 999px; padding: 4px; position: relative; }
  .arrow { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 999px; border: 0; background: transparent; color: var(--muted-fg); font-size: 14px; cursor: pointer; }
  .arrow:hover { background: var(--raised-2); }
  .label { border: 0; background: transparent; color: var(--fg); font: inherit; font-weight: 600; font-size: 13px; padding: 4px 8px; border-radius: 999px; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; font-variant-numeric: tabular-nums; }
  .label:hover, .label.open { background: var(--raised-2); }
  .label .cv { font-size: 10px; color: var(--muted-fg); }
  .pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 3; width: 296px; background: var(--popover); color: var(--popover-fg); border: 1px solid var(--border-subtle); border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 12px; }
  .mh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .mh span { font-weight: 700; font-size: 14px; }
  .mh button { width: 28px; height: 28px; border: 0; border-radius: 999px; background: transparent; color: var(--fg-2); cursor: pointer; }
  .mh button:hover { background: var(--muted); }
  .mh button:disabled { color: var(--faint); cursor: default; background: transparent; }
  .wk, .days { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
  .wk div { font-size: 11px; color: var(--muted-fg); padding: 4px 0; }
  .wk div:first-child { color: var(--up); } .wk div:last-child { color: var(--down); }
  .d { height: 36px; display: grid; place-items: center; position: relative; }
  .d button { width: 34px; height: 34px; border-radius: 999px; border: 0; background: transparent; font: inherit; font-size: 13px; color: var(--fg); cursor: pointer; font-variant-numeric: tabular-nums; }
  .d button:hover { background: var(--muted); }
  .d button:disabled { color: var(--faint); cursor: default; background: transparent; }
  .d button.sel { background: var(--primary); color: var(--primary-fg); font-weight: 700; }
  .d button.today::after { content: ""; position: absolute; bottom: 3px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 99px; background: var(--primary); }
  .d button.sel.today::after { background: var(--primary-fg); }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-subtle); }
  .foot small { color: var(--muted-fg); font-size: 11.5px; }
  .tbtn { border: 0; background: var(--muted); color: var(--fg); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--border-subtle); }
  .chips .cap { width: 100%; color: var(--muted-fg); font-size: 11.5px; }
  .chip { border: 0; background: var(--muted); color: var(--fg); border-radius: 999px; padding: 5px 10px; font: inherit; font-size: 12.5px; cursor: pointer; font-variant-numeric: tabular-nums; }
  .chip.sel { background: var(--primary); color: var(--primary-fg); font-weight: 700; }
  .list { max-height: 320px; overflow: auto; margin: -4px -4px 0; padding: 4px; }
  .list h4 { margin: 10px 0 6px; font-size: 12.5px; color: var(--muted-fg); font-weight: 600; position: sticky; top: -4px; background: var(--popover); padding: 2px 0; }
  .list h4:first-child { margin-top: 0; }
  .list .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .body-ph { margin-top: 12px; display: grid; gap: 8px; }
  .body-ph div { height: 44px; background: var(--muted); border-radius: 10px; opacity: .6; }
  body.phone .pop { right: -40px; }
  .note { color: var(--muted-fg); font-size: 12px; text-align: center; padding: 0 16px 24px; }
</style>
</head>
<body>
<div class="bar">
  <b>날짜 달력 피커</b>
  <span class="seg" id="theme"><button class="on" data-v="light">라이트</button><button data-v="dark">다크</button></span>
  <span class="seg" id="width"><button class="on" data-v="desk">데스크톱</button><button data-v="phone">폰 390</button></span>
</div>
<div class="grid" id="grid"></div>
<p class="note">가운데 날짜 글자를 누르면 열려요(목업은 처음부터 열어 둠). 회색 날 = 보고서 없는 날(주말 · 휴장 · 미적재) — 누를 수 없음. ‹ › 는 지금처럼 보고서 있는 앞뒤 날로.</p>
<script>
const TODAY = '20261103';
const HOL = new Set(['20260924', '20260925', '20261009']);
const DATES = [];
for (let t = Date.UTC(2026, 7, 3); t <= Date.UTC(2026, 10, 3); t += 864e5) {
  const d = new Date(t); const w = d.getUTCDay();
  const ymd = d.toISOString().slice(0, 10).replace(/-/g, '');
  if (w !== 0 && w !== 6 && !HOL.has(ymd)) DATES.push(ymd);
}
DATES.reverse(); // 최신 먼저(API 와 같은 순서)
const HAS = new Set(DATES);
const WK = ['일', '월', '화', '수', '목', '금', '토'];
const lab = (ymd) => { const d = new Date(Date.UTC(+ymd.slice(0,4), +ymd.slice(4,6)-1, +ymd.slice(6,8))); return `${ymd.slice(4,6)}/${ymd.slice(6,8)} (${WK[d.getUTCDay()]})`; };
const nav = (cur) => { let p = null, n = null; for (const x of DATES) { if (x < cur && (!p || x > p)) p = x; if (x > cur && (!n || x < n)) n = x; } return { p, n }; };

const VARIANTS = [
  { id: 'A', t: 'A · 월 달력', d: '한 달 그리드 · 보고서 있는 날만 누름 · 고른 날 파란 원 · 오늘 점 · 아래 「최신」 버튼' },
  { id: 'B', t: 'B · 월 달력 + 최근 칩', d: 'A 에 최근 보고서 5개 칩을 붙임 — 가까운 날은 칩 한 번, 먼 날은 달력' },
  { id: 'C', t: 'C · 날짜 목록(달력 없음)', d: '보고서 있는 날만 월별로 묶은 칩 목록 · 스크롤 — 빈 날이 아예 안 보임' },
];
const st = {}; VARIANTS.forEach((v) => (st[v.id] = { sel: '20261030', ym: '202610', open: true }));

function cal(v) {
  const s = st[v.id]; const y = +s.ym.slice(0, 4), m = +s.ym.slice(4, 6);
  const first = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(); const nd = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const minYm = DATES[DATES.length - 1].slice(0, 6), maxYm = DATES[0].slice(0, 6);
  let h = `<div class="mh"><button data-a="pm" ${s.ym <= minYm ? 'disabled' : ''}>‹</button><span>${y}년 ${m}월</span><button data-a="nm" ${s.ym >= maxYm ? 'disabled' : ''}>›</button></div>`;
  h += `<div class="wk">${WK.map((w) => `<div>${w}</div>`).join('')}</div><div class="days">`;
  for (let i = 0; i < first; i++) h += '<div class="d"></div>';
  for (let dd = 1; dd <= nd; dd++) {
    const ymd = `${y}${String(m).padStart(2, '0')}${String(dd).padStart(2, '0')}`;
    const cls = [ymd === s.sel ? 'sel' : '', ymd === TODAY ? 'today' : ''].join(' ');
    h += `<div class="d"><button class="${cls}" data-go="${ymd}" ${HAS.has(ymd) ? '' : 'disabled'} aria-label="${lab(ymd)}">${dd}</button></div>`;
  }
  return h + '</div>';
}
function popOf(v) {
  const s = st[v.id];
  if (v.id === 'A') return cal(v) + `<div class="foot"><small>보고서 있는 날만 고를 수 있어요</small><button class="tbtn" data-go="${DATES[0]}">최신</button></div>`;
  if (v.id === 'B') return cal(v) + `<div class="chips"><span class="cap">최근 보고서</span>${DATES.slice(0, 5).map((x) => `<button class="chip ${x === s.sel ? 'sel' : ''}" data-go="${x}">${lab(x)}</button>`).join('')}</div>`;
  const by = {}; for (const x of DATES) (by[x.slice(0, 6)] ??= []).push(x);
  return `<div class="list">${Object.keys(by).map((ym) => `<h4>${ym.slice(0, 4)}년 ${+ym.slice(4)}월</h4><div class="row">${by[ym].map((x) => `<button class="chip ${x === s.sel ? 'sel' : ''}" data-go="${x}">${+x.slice(6)}일 ${WK[new Date(Date.UTC(+x.slice(0,4), +x.slice(4,6)-1, +x.slice(6))).getUTCDay()]}</button>`).join('')}</div>`).join('')}</div>`;
}
function render() {
  document.getElementById('grid').innerHTML = VARIANTS.map((v) => {
    const s = st[v.id]; const { p, n } = nav(s.sel);
    return `<section class="variant" data-v="${v.id}"><p class="vt">${v.t}</p><p class="vd">${v.d}</p>
      <div class="head"><h2>상한가 보고서</h2>
        <div class="pill"><button class="arrow" data-go="${p ?? ''}" ${p ? '' : 'disabled'} aria-label="이전 보고서">‹</button>
          <button class="label ${s.open ? 'open' : ''}" data-a="tog">${lab(s.sel)} <span class="cv">▾</span></button>
          <button class="arrow" data-go="${n ?? ''}" ${n ? '' : 'disabled'} aria-label="다음 보고서">›</button>
          ${s.open ? `<div class="pop">${popOf(v)}</div>` : ''}
        </div></div>
      <div class="body-ph"><div></div><div></div><div></div><div></div></div></section>`;
  }).join('');
}
document.getElementById('grid').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const v = b.closest('.variant').dataset.v; const s = st[v];
  if (b.dataset.go) { s.sel = b.dataset.go; s.ym = s.sel.slice(0, 6); s.open = false; }
  else if (b.dataset.a === 'tog') { s.open = !s.open; s.ym = s.sel.slice(0, 6); }
  else if (b.dataset.a === 'pm' || b.dataset.a === 'nm') {
    let y = +s.ym.slice(0, 4), m = +s.ym.slice(4) + (b.dataset.a === 'nm' ? 1 : -1);
    if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } s.ym = `${y}${String(m).padStart(2, '0')}`;
  }
  render();
});
for (const id of ['theme', 'width']) document.getElementById(id).addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll(`#${id} button`).forEach((x) => x.classList.toggle('on', x === b));
  if (id === 'theme') document.documentElement.dataset.theme = b.dataset.v; else document.body.classList.toggle('phone', b.dataset.v === 'phone');
});
render();
</script>
</body>
</html>
