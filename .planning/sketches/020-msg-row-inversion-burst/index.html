<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sketch 020 — 전문 목록 행 · 뒤집힘 표현 · 버스트 묶음</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #0c0c0f; color: #ddd; font-family: -apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif; }
#nav { position: sticky; top: 0; z-index: 50; background: #0c0c0f; border-bottom: 1px solid #26262c; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 13px; }
#nav .g { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
#nav .l { color: #777; font-size: 12px; margin-right: 4px; }
#nav button { font: inherit; background: #1b1b20; color: #bbb; border: 1px solid #2a2a31; border-radius: 7px; padding: 5px 10px; cursor: pointer; }
#nav button.on { background: #f2f2f2; color: #111; border-color: #f2f2f2; font-weight: 700; }
#desc { flex-basis: 100%; color: #9a9aa2; font-size: 12.5px; line-height: 1.6; }
#desc b { color: #eee; }
#stage { display: flex; justify-content: center; padding: 20px 12px 60px; overflow-x: auto; }

/* gh-radar globals.css 실제 토큰 (라이트 / 다크) — 019 와 같은 사본 */
.f {
  --bg:#ffffff; --surface:#f2f4f6; --card:#ffffff; --muted:#f2f4f6; --raised-2:#e5e8eb; --fg:#191f28; --fg-2:#333d4b; --muted-fg:#6b7684; --faint:#b0b8c1;
  --border-subtle:#e5e8eb; --up:#f04452; --down:#3182f6; --up-bg:#ffeeee; --down-bg:#e8f1ff; --flat:#6b7684; --team:#a234c7; --team-bg:#f9f0fc;
  --vi:#d97706; --vi-bg:#fff4e6; --pill-on-bg:#e8f3ff; --pill-on-fg:#1b64da; --primary:#3182f6; --primary-fg:#fff;
  --font:'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif;
  background: var(--surface); color: var(--fg); font-family: var(--font); -webkit-font-smoothing: antialiased;
  border-radius: 14px; box-shadow: 0 0 0 1px #2a2a30, 0 30px 80px rgba(0,0,0,.5); flex: none; overflow: hidden; display: flex; flex-direction: column;
}
.f.dark { --bg:#0a0a0a; --surface:#0a0a0a; --card:#151515; --muted:#2d2d2d; --raised-2:#3d3d3d; --fg:#ffffff; --fg-2:#e4e4e4; --muted-fg:#9e9e9e; --faint:#636363;
  --border-subtle:#3d3d3d; --up:#f04251; --down:#3485fa; --up-bg:rgba(240,66,81,.16); --down-bg:rgba(52,133,250,.16); --flat:#9e9e9e; --team:#c353e5; --team-bg:rgba(174,61,209,.16);
  --vi:#ffb020; --vi-bg:rgba(255,176,32,.16); --pill-on-bg:#4e4e4e; --pill-on-fg:#fff; --primary:#3485fa; }
.f.phone { width: 390px; height: 800px; }
.f.desktop { width: 1280px; height: 800px; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--flat); } .mf { color: var(--muted-fg); } .team-c { color: var(--team); }
.num { font-variant-numeric: tabular-nums; }

/* 머리 */
.hdr { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 16px 8px; }
.phone .hdr { padding: 10px 12px 6px; gap: 6px 10px; }
.hdr h1 { margin: 0; font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.phone .hdr h1 { font-size: 15px; }
.src { display: inline-flex; align-items: center; background: var(--muted); color: var(--muted-fg); border-radius: 6px; padding: 2px 8px; font-size: 11px; white-space: nowrap; font-weight: 500; }
.pill { font: inherit; font-size: 12.5px; font-weight: 600; background: var(--card); color: var(--fg); border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.seg { display: inline-flex; background: var(--muted); border-radius: 999px; padding: 2px; }
.seg button { font: inherit; font-size: 11.5px; font-weight: 600; border: 0; background: transparent; color: var(--fg-2); border-radius: 999px; padding: 4px 10px; cursor: pointer; transition: all .15s; }
.seg button.on { background: var(--pill-on-bg); color: var(--pill-on-fg); }
.clock { margin-left: auto; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.phone .clock { margin-left: 0; flex-basis: 100%; }
.clock b { font-size: 22px; font-weight: 700; letter-spacing: -.2px; }
.phone .clock b { font-size: 19px; }
.clock span { font-size: 11.5px; color: var(--muted-fg); }

/* 슬라이더 카드 (019 D 자리 — 머리와 패널 사이) */
.tr { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: var(--card); border-radius: 14px; margin: 0 16px 8px; flex-wrap: wrap; }
.phone .tr { margin: 0 12px 6px; padding: 6px 10px; gap: 8px; }
.ib { font: inherit; width: 32px; height: 32px; border-radius: 10px; border: 0; background: var(--muted); color: var(--fg); cursor: pointer; font-size: 15px; font-weight: 700; transition: all .15s; }
.ib:hover { background: var(--raised-2); }
.ib.on { background: var(--primary); color: var(--primary-fg); }
.sl { position: relative; flex: 1 1 200px; height: 34px; min-width: 0; }
.sl input { position: absolute; left: 0; right: 0; bottom: 2px; width: 100%; margin: 0; -webkit-appearance: none; appearance: none; background: transparent; height: 20px; cursor: pointer; }
.sl input::-webkit-slider-runnable-track { height: 3px; background: var(--raised-2); border-radius: 2px; }
.sl input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--fg); margin-top: -5.5px; box-shadow: 0 0 0 3px var(--card); }
.ax { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; font-size: 9.5px; color: var(--faint); pointer-events: none; }
.tin { font: inherit; font-size: 12.5px; width: 118px; height: 32px; border-radius: 10px; border: 1px solid var(--border-subtle); background: var(--bg); color: var(--fg); padding: 0 10px; font-variant-numeric: tabular-nums; }
.tin:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
.tb { font: inherit; font-size: 12px; font-weight: 600; height: 32px; border-radius: 10px; border: 0; background: var(--muted); color: var(--fg); padding: 0 12px; cursor: pointer; }
.tb.xs { height: 22px; font-size: 10.5px; padding: 0 8px; border-radius: 7px; }
.tb.xs.vi { color: var(--vi); background: var(--vi-bg); }
.kb { font-size: 10.5px; color: var(--faint); white-space: nowrap; }
.phone .kb { display: none; }

/* 패널 */
.body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px minmax(0,1fr) 330px; gap: 10px; padding: 0 16px 10px; }
.phone .grid { display: flex; flex-direction: column; padding: 0 12px 10px; }
.phone .grid > .p-lad, .phone .grid > .right { display: none; }
.panel { background: var(--card); border-radius: 14px; display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.phone .panel.p-msg { flex: 1; }
.p-lad { background: transparent; box-shadow: inset 0 0 0 1px var(--border-subtle); color: var(--faint); align-items: center; justify-content: center; text-align: center; font-size: 11.5px; line-height: 1.7; padding: 16px; }
.p-lad b { color: var(--muted-fg); font-weight: 600; display: block; }
.ph { display: flex; align-items: center; gap: 8px; padding: 9px 12px; font-size: 12.5px; font-weight: 700; border-bottom: 1px solid var(--border-subtle); flex: none; flex-wrap: wrap; }
.ph small { font-weight: 500; color: var(--muted-fg); font-size: 11px; }
.ph .seg { margin-left: auto; }
.ph .seg button { padding: 3px 9px; font-size: 11px; }
.ph .fixed { margin-left: auto; font-size: 10.5px; font-weight: 500; color: var(--muted-fg); background: var(--muted); border-radius: 999px; padding: 3px 9px; }
.ph .tools { display: inline-flex; gap: 4px; }
.pb { flex: 1; min-height: 0; overflow: auto; }
.right { display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow: auto; }
.right .panel { flex: none; }

/* 전문 목록 (ATMParser 식 행 = 전문 하나) */
table.msg { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.msg th { font-size: 10.5px; font-weight: 600; color: var(--muted-fg); background: var(--muted); padding: 5px 8px; text-align: left; position: sticky; top: 0; white-space: nowrap; z-index: 1; }
.msg td { height: 28px; padding: 0 8px; white-space: nowrap; border-top: 1px solid var(--border-subtle); cursor: pointer; }
.phone .msg td, .phone .msg th { padding: 0 6px; }
.phone .msg th { padding: 5px 6px; }
.msg tr:hover td { background: color-mix(in oklab, var(--muted) 70%, transparent); }
.msg tr.sel td { background: color-mix(in oklab, var(--fg) 12%, transparent); }
.msg tr.sel:not(.grp):not(.sum) td:first-child { box-shadow: inset 3px 0 0 var(--fg); }
.msg tr.runb td { background: color-mix(in oklab, var(--team) 8%, transparent); }
.msg tr.runb.sel td { background: color-mix(in oklab, var(--fg) 12%, transparent); }
.msg td.t { color: var(--muted-fg); font-size: 11px; }
.msg td.t b { color: var(--fg); font-weight: 600; }
.msg td.t.dim b { color: var(--muted-fg); font-weight: 500; }
.msg td.s { color: var(--muted-fg); font-size: 10.5px; }
.msg td.d { overflow: hidden; text-overflow: ellipsis; max-width: 0; width: 100%; }
.badge { display: inline-flex; align-items: center; height: 17px; border-radius: 4px; padding: 0 5px; font-size: 9.5px; font-weight: 700; border: 1px solid transparent; vertical-align: middle; }
.bA3 { background: var(--muted); color: var(--fg); }
.bB6 { background: transparent; color: var(--muted-fg); border-color: var(--border-subtle); }
.bB9 { background: var(--team-bg); color: var(--team); }
.bR8 { background: var(--vi-bg); color: var(--vi); }
.bC3 { background: var(--pill-on-bg); color: var(--pill-on-fg); }
.chip { display: inline-flex; align-items: center; height: 16px; border-radius: 4px; padding: 0 5px; font-size: 9.5px; font-weight: 700; margin-left: 6px; vertical-align: middle; }
.chip.team { background: var(--team-bg); color: var(--team); }
.chip.norm { background: var(--muted); color: var(--muted-fg); }
.chip.auct { background: var(--vi-bg); color: var(--vi); }
.chip.close { background: transparent; color: var(--muted-fg); border: 1px dashed var(--border-subtle); margin-left: 0; margin-right: 6px; }
.inv { color: var(--vi); font-size: 10px; margin-left: 6px; font-weight: 600; }
.buy { color: var(--up); font-weight: 600; } .sellc { color: var(--down); font-weight: 600; }
.tm { box-shadow: inset 2px 0 0 var(--team); }

/* 조각 번호 배지 (C 주력 · B 펼침 보조) */
.idx { display: inline-flex; align-items: center; height: 16px; border-radius: 4px; padding: 0 4px; font-size: 9.5px; font-weight: 700; margin-left: 4px; vertical-align: middle; font-variant-numeric: tabular-nums; }
.idx.team { background: var(--team-bg); color: var(--team); }
.idx.norm { background: var(--muted); color: var(--muted-fg); }
.idx.dim { background: transparent; color: var(--faint); border: 1px solid var(--border-subtle); }

/* 주문 묶음 — 레일 · 묶음 꼬리 · 요약 행 · 거래소순 자리 */
.msg tr.team { --rail: var(--team); } .msg tr.norm { --rail: var(--faint); }
.msg tr.grp td:first-child, .msg tr.gft td:first-child, .msg tr.sum td:first-child, .msg tr.ghost.grp td:first-child { box-shadow: inset 3px 0 0 var(--rail); }
.msg tr.grp:not(.first) td, .msg tr.gft td, .msg tr.grp.inb td { border-top-color: transparent; }
.msg tr.gft td { height: 22px; font-size: 10.5px; color: var(--muted-fg); padding-left: 14px; }
.msg tr.gft td .chip { margin-left: 4px; }
.msg tr.sum td { font-weight: 600; }
.msg tr.sum.team td { background: color-mix(in oklab, var(--team) 5%, transparent); }
.msg tr.sum.sel td { background: color-mix(in oklab, var(--fg) 12%, transparent); }
.caret { font: inherit; width: 16px; height: 16px; border: 0; background: transparent; color: var(--muted-fg); cursor: pointer; padding: 0; margin-right: 2px; font-size: 11px; vertical-align: middle; }
.caret:hover { color: var(--fg); }
.msg tr.ghost td { height: 22px; font-size: 10.5px; color: var(--vi); border-top: 1px dashed color-mix(in oklab, var(--vi) 60%, transparent); background: color-mix(in oklab, var(--vi) 6%, transparent); }
.msg tr.ghost td.t { color: var(--vi); }
.msg tr.ghost td b { color: var(--vi); }
.msg tr.disp td.s { color: var(--vi); font-weight: 700; }

/* 이 주문 카드 (019 그대로) */
.card { padding: 12px; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
.kv .k { font-size: 10.5px; color: var(--muted-fg); }
.kv .v { font-size: 15px; font-weight: 700; line-height: 1.25; }
.kv .v small { font-size: 11px; color: var(--muted-fg); font-weight: 500; }
.sub { font-size: 11px; color: var(--muted-fg); line-height: 1.5; margin-top: 8px; }
.shape { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; }
.shape .chip { margin-left: 0; height: 18px; font-size: 10.5px; }
table.rl { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 8px; }
.rl th { font-size: 10px; color: var(--muted-fg); font-weight: 600; text-align: right; padding: 3px 6px; border-bottom: 1px solid var(--border-subtle); }
.rl th:first-child, .rl td:first-child { text-align: left; }
.rl td { padding: 0 6px; height: 24px; text-align: right; white-space: nowrap; border-top: 1px solid var(--border-subtle); cursor: pointer; }
.rl tr.team td:first-child { box-shadow: inset 2px 0 0 var(--team); }
.rl tr.sel td { background: color-mix(in oklab, var(--fg) 10%, transparent); }
.rl tr:hover td { background: color-mix(in oklab, var(--muted) 70%, transparent); }
.rl td.c { text-align: left; }
.empty { padding: 20px; color: var(--muted-fg); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<div id="nav">
  <div class="g"><span class="l">버스트 묶음</span><button data-v="a" class="on">A · 행 그룹(레일 + 꼬리) ★ 채택</button><button data-v="b">B · 요약 행 접기</button><button data-v="c">C · 배지(평평한 행)</button></div>
  <div class="g"><span class="l">뒤집힘 표현</span><button data-r="1">1 · 토글만</button><button data-r="2">2 · 행 안 표시만</button><button data-r="3" class="on">3 · 둘 다 ★ 채택</button></div>
  <div class="g"><span class="l">폭</span><button data-w="desktop" class="on">데스크톱 1280</button><button data-w="phone">폰 390</button></div>
  <div class="g"><span class="l">테마</span><button data-t="dark" class="on">다크</button><button data-t="light">라이트</button></div>
  <div id="desc"></div>
</div>
<div id="stage"><div class="f dark desktop" id="frame"></div></div>

<script id="data">
// ───────── 데이터 생성 — 019 와 같은 하루(한선엔지니어링 101360 · 2026-10-22 · KRX G1) + 09:07:5x 17,100 벽 70조각 주문 하나 ─────────
function rng(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const R = rng(20261022);
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const US=1e6, S=US, M=60*US, H=3600*US;
const T=(h,m=0,s=0,ms=0)=>((h*3600+m*60+s)*1000+ms)*1000;
const BASE=15550, TICK=50, UPPER=20200;
const MEMBERS=['교보','한국','유진','신한','NH'], MW=[.34,.22,.18,.14,.12];
const msgs=[], runs=[];
let seq=1180000, price=BASE, cum=0, cumBuy=0, cumQty=0, ask1=BASE+TICK, runId=0;
const qmem=new Map();
function qty(px){ if(!qmem.has(px)) qmem.set(px, ri(300,7000)); let q=qmem.get(px); q=Math.max(50, Math.round(q*(0.86+R()*0.28))); qmem.set(px,q); return q; }
function makeBook(){ const asks=[],bids=[]; for(let i=0;i<10;i++){ asks.push({px:ask1+TICK*i,qty:qty(ask1+TICK*i)}); bids.push({px:ask1-TICK*(i+1),qty:qty(ask1-TICK*(i+1))}); } return {asks,bids}; }
function pushB6(exUs,recvUs,run){ const b=makeBook(); msgs.push({type:'B6',exUs,recvUs,seq:++seq,asks:b.asks,bids:b.bids,run:run==null?null:run}); }
let lastA3Recv=0; // 같은 멀티캐스트 그룹(A3) 안에서는 수신 순서가 보존된다 — 뒤집힘은 그룹 사이(A3 ↔ B6)에서만
function pushA3(exUs,recvUs,px,q,bs,zz,run,last){ recvUs=Math.max(recvUs,lastA3Recv+ri(3,40)); lastA3Recv=recvUs; cum+=px*q; cumQty+=q; if(bs==='2') cumBuy+=px*q; msgs.push({type:'A3',exUs,recvUs,seq:++seq,px,qty:q,bs,zz,ask1:zz?0:ask1,bid1:zz?0:ask1-TICK,cum,cumBuy,cumQty,run:run==null?null:run,last:!!last}); price=px; return recvUs; }
let nextB9=T(9,0,40), nextC3=T(9,2), teamBuyQty=0, teamSellQty=0;
const memBuy=[0,0,0,0,0], memSell=[0,0,0,0,0], retailB=[0,0,0,0,0], retailS=[0,0,0,0,0];
let prog=0;
function pushB9(){
  for(let i=0;i<5;i++){ retailB[i]+=ri(0,600); retailS[i]+=ri(0,500);
    memBuy[i]=Math.max(memBuy[i], Math.round(teamBuyQty*MW[i]*(0.95+R()*0.1))+retailB[i]);
    memSell[i]=Math.max(memSell[i], Math.round(teamSellQty*MW[i]*(0.95+R()*0.1))+retailS[i]); }
  msgs.push({type:'B9',exUs:nextB9,recvUs:nextB9+60,seq:++seq,buy:memBuy.slice(),sell:memSell.slice()});
  nextB9+=ri(50,70)*S;
}
function pushC3(){ prog+=ri(-3000,6000)*10000; msgs.push({type:'C3',exUs:nextC3,recvUs:nextC3+60,seq:++seq,prog}); nextC3+=ri(100,140)*S; }
function timers(t){ const END=T(15,30); while(true){ const b=nextB9<=t&&nextB9<=END, c=nextC3<=t&&nextC3<=END; if(!b&&!c) break; if(b&&(!c||nextB9<=nextC3)) pushB9(); else pushC3(); } }
function target(us){
  const L=(a,b,x0,x1)=>a+(b-a)*Math.min(1,Math.max(0,(us-x0)/(x1-x0)));
  if(us<T(9)) return BASE; if(us<T(9,2,41)) return L(BASE,16300,T(9),T(9,2,41));
  if(us<T(9,4,41)) return 16300; if(us<T(9,8)) return L(16350,17100,T(9,4,41),T(9,8));
  if(us<T(9,10)) return L(17100,16900,T(9,8),T(9,10));
  return 16850+300*Math.sin((us-T(9,10))/(48*M))+150*Math.sin((us-T(9,10))/(11*M));
}
// 주문 하나 = 같은 종목 A3 msg_seq 연속(+1) · bs 동일 · 뒤에 B6 하나 (krx-a3-zero-quote.md §2) · 마지막 아닌 조각은 0/0
function emitRun(exUs, bs, shape, pl, invert, invGapUs){
  const id=++runId; const levels=new Set(pl.map(p=>p.px)).size;
  let t=exUs, recvLast=0; const pieces=[];
  pl.forEach((p,i)=>{ if(i) t+=ri(20,180); recvLast=pushA3(t,t+ri(80,400),p.px,p.q,bs,p.zz,id,i===pl.length-1); pieces.push(msgs.length-1); });
  const lastPx=pl[pl.length-1].px;
  if(bs==='2') ask1=(levels>1||R()<0.35)?lastPx+TICK:lastPx; else ask1=(levels>1||R()<0.35)?lastPx:lastPx+TICK;
  ask1=Math.max(BASE-TICK*2, Math.min(UPPER, ask1));
  const bt=t+ri(30,300); let brecv=Math.max(bt+ri(80,400),recvLast+ri(5,60)), inverted=false;
  if(invert){ brecv=recvLast-(invGapUs||ri(1000,30000)); inverted=true; }
  pushB6(bt,brecv,id);
  const q=pl.reduce((a,p)=>a+p.q,0), v=pl.reduce((a,p)=>a+p.q*p.px,0);
  const team=shape==='SMP'||shape==='ZZ';
  if(team){ if(bs==='2') teamBuyQty+=q; else teamSellQty+=q; }
  runs.push({id,bs,shape,team,pieces,qty:q,value:v,levels,startUs:exUs,endUs:t,closeIdx:msgs.length-1,inverted,px:lastPx,firstPx:pl[0].px,n:pl.length});
  return bt;
}
function genRun(exUs, teamBias){

function rowHTML(r,i,selRun){
  if(r.k==='f'){ const x=r.run, {dur,px}=runSummary(x); const d=disp[x.closeIdx]; let tail=''; if(d&&markers()) tail=st.order==='recv'?' · <span class="inv" style="margin-left:0">닫는 B6 ↕ '+fGap(d.gap)+' 먼저 수신(위 '+d.jumped+'행)</span>':' · <span class="inv" style="margin-left:0">닫는 B6 는 수신 '+fGap(d.gap)+' 먼저 ↕</span>';
    return '<tr class="gft '+(x.team?'team':'norm')+(selRun===x.id?' runb':'')+'" data-run="'+x.id+'"><td colspan="4" class="num">┗ '+x.n+'조각 '+x.levels+'단 · '+fN(x.qty)+'주 · '+fKRW(x.value)+' · '+fGap(dur)+shapeChip(x,true)+tail+'</td></tr>'; }
  if(r.k==='g'){ const m=msgs[r.idx], d=disp[r.idx]; return '<tr class="ghost'+(r.grp?' grp '+(r.run.team?'team':'norm')+(r.inb?' inb':''):'')+'" data-i="'+r.idx+'"><td class="t">⋯</td><td><span class="badge b'+m.type+'" style="opacity:.6">'+m.type+'</span></td><td class="s num">'+fSeq(m.seq)+'</td><td class="d">거래소순 자리 — 이 B6 는 <b>'+fGap(d.gap)+' 먼저</b> 수신돼 위 '+d.jumped+'행에 있음</td></tr>'; }
  if(r.k==='s'){ const x=r.run, f=msgs[x.pieces[0]], l=msgs[x.pieces[x.n-1]]; const {dur,px}=runSummary(x); const t=st.order==='recv'?f.recvUs:f.exUs;
    const sel=r.members.some(mm=>mm.k==='m'&&mm.idx===i)||(!r.open&&x.pieces.includes(i)); const d=disp[x.closeIdx]; let tail=''; if(d&&markers()&&!r.open) tail='<span class="inv">↕ 닫는 B6 '+fGap(d.gap)+' 먼저</span>';
    return '<tr class="sum '+(x.team?'team':'norm')+(sel&&!r.open?' sel':'')+(selRun===x.id?' runb':'')+'" data-run="'+x.id+'"><td class="t num"><button class="caret" data-tog="'+x.id+'" title="조각 '+(r.open?'접기':'펼치기')+'">'+(r.open?'▾':'▸')+'</button>'+timeHTML(t)+'</td><td><span class="badge bA3">A3</span><span class="idx '+(x.team?'team':'norm')+'">×'+x.n+'</span></td><td class="s num">'+fSeq(f.seq)+'~'+String(l.seq).slice(-3)+'</td><td class="d"><b class="num '+pxCls(x.px)+'">'+px+'</b> <span class="num '+(x.bs==='2'?'buy':'sellc')+'">'+(x.bs==='2'?'+':'−')+fN(x.qty)+'</span> <span class="mf">'+(x.bs==='2'?'매수':'매도')+(x.levels>1?' · '+x.levels+'단':'')+' · '+fGap(dur)+'</span>'+shapeChip(x,true)+'<span class="mf"> · '+fKRW(x.value)+'</span>'+tail+'</td></tr>'; }
  const m=msgs[r.idx], run=m.run!=null?runs[m.run-1]:null, d=disp[r.idx];
  const cls=[r.idx===i?'sel':'', selRun!=null&&m.run===selRun?'runb':'', r.grp?'grp '+(r.run.team?'team':'norm'):'', r.first?'first':'', r.inb?'inb':'', d&&markers()?'disp':''].join(' ');
  const dimT=r.grp&&!r.first&&m.type==='A3'&&st.v==='a';
  const badges=st.v==='c'?idxBadge(m,r.run):st.v==='b'&&r.inb?idxBadge(m,r.run,'dim'):'';
  return '<tr class="'+cls+'" data-i="'+r.idx+'"><td class="t num'+(dimT?' dim':'')+(st.v==='c'&&run&&run.team?' tm':'')+'">'+timeHTML(st.order==='recv'?m.recvUs:m.exUs)+'</td><td><span class="badge b'+m.type+'">'+m.type+'</span>'+badges+'</td><td class="s num">'+fSeq(m.seq)+(d&&markers()?' <span class="inv" style="margin-left:2px">↕</span>':'')+'</td><td class="d">'+descHTML(m,r)+'</td></tr>';
}
function msgListHTML(i){
  const sel=msgs[i]; const selRun=(sel.type==='A3'||sel.type==='B6')?sel.run:null;
  let h='<table class="msg"><thead><tr><th>'+(st.order==='recv'?'수신':'거래소')+' 시각</th><th>종류</th><th>seq</th><th>내용</th></tr></thead><tbody>';
  for(const r of buildRows(i)) h+=rowHTML(r,i,selRun);
  return h+'</tbody></table>';
}
function msgMeta(){ return fN(N)+'건 · 주문 '+fN(multiRuns)+'묶음(2조각+) · 역전 '+dispCount+'건 · '+(st.order==='recv'?'수신순':'msg_seq 순'); }

function burstHTML(i){
  const m=msgs[i]; let r=null;
  if((m.type==='A3'||m.type==='B6')&&m.run!=null) r=runs[m.run-1]; else if(lastRun[i]>=0) r=runs[lastRun[i]];
  let h='<div class="card">';
  if(m.type==='A3'&&m.bs==='0') h+='<div class="shape"><span class="chip auct">단일가 체결</span></div><div class="sub">단일가 체결은 주문 묶기 · 공격 방향 분류 대상이 아니다(team-flow 규칙 3).</div>';
  else if(!r) h+='<div class="empty">아직 체결 주문 없음</div>';
  else { const dur=r.endUs-r.startUs; const cl=msgs[r.closeIdx]; const d=disp[r.closeIdx];
    h+='<div class="shape">'+shapeChip(r)+'<span class="num '+(r.bs==='2'?'buy':'sellc')+'">'+(r.bs==='2'?'매수':'매도')+'</span></div>'+
      '<div class="kv" style="margin-top:10px"><div><div class="k">조각 · 단</div><div class="v num">'+r.n+'조각 <small>'+r.levels+'단</small></div></div><div><div class="k">수량</div><div class="v num">'+fN(r.qty)+'<small>주</small></div></div>'+
      '<div><div class="k">금액</div><div class="v num">'+fKRW(r.value)+'</div></div><div><div class="k">지속</div><div class="v num">'+(dur>=1000?(dur/1000).toFixed(1)+'<small>ms</small>':dur+'<small>µs</small>')+'</div></div></div>'+
      '<div class="sub">seq '+fN(msgs[r.pieces[0]].seq)+(r.n>1?'~'+fN(msgs[r.pieces[r.n-1]].seq):'')+' · 닫는 B6 '+fN(cl.seq)+(d?' <span class="inv">↕ 닫는 B6 가 마지막 조각보다 '+fGap(d.gap)+' 먼저 수신</span>':'')+'</div>'; }
  const lr=lastRun[i]; if(lr>=0){ h+='<table class="rl"><thead><tr><th>시각</th><th>구분</th><th>조각</th><th>수량</th><th>금액</th><th>모양</th></tr></thead><tbody>';
    for(let k=lr;k>Math.max(-1,lr-10);k--){ const x=runs[k]; h+='<tr class="'+(x.team?'team':'')+(r&&x.id===r.id?' sel':'')+'" data-run="'+x.id+'"><td class="c num">'+fT(x.startUs)+'</td><td class="'+(x.bs==='2'?'buy':'sellc')+'">'+(x.bs==='2'?'매수':'매도')+'</td><td class="num">'+x.n+(x.inverted?' <span class="inv" style="margin-left:1px">↕</span>':'')+'</td><td class="num">'+fN(x.qty)+'</td><td class="num">'+fKRW(x.value)+'</td><td>'+shapeChip(x,true)+'</td></tr>'; }
    h+='</tbody></table>'; }
  return h+'</div>';
}

function render(){
  const i=st.cur, m=msgs[i];
  $('[data-role=t-recv]',frame).textContent=fT(m.recvUs);
  $('[data-role=t-ex]',frame).textContent='거래소 '+fT(m.exUs,true);
  $('[data-role=t-seq]',frame).textContent='seq '+fN(m.seq)+' · '+m.type;
  $('[data-role=msg]',frame).innerHTML=msgListHTML(i); $('[data-role=msg-meta]',frame).textContent=msgMeta();
  $('[data-role=burst]',frame).innerHTML=burstHTML(i);
  const sl=$('[data-role=slider]',frame); const tus=st.order==='recv'?m.recvUs:m.exUs; sl.value=Math.round(tus/1000);
  const tin=$('[data-role=tin]',frame); if(document.activeElement!==tin) tin.value=fT(tus);
  const pb=$('[data-act=play]',frame); pb.classList.toggle('on',st.playing); pb.textContent=st.playing?'❚❚':'▶';
  const box=$('[data-role=msg]',frame), row=$('tr.sel',box); if(row){ box.scrollTop=Math.max(0,row.offsetTop-box.clientHeight/2+row.offsetHeight/2); }
}

// ── 이벤트 ──
$('#nav').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.v) st.v=b.dataset.v; if(b.dataset.r){ st.r=b.dataset.r; st.order=st.r==='2'?'recv':'ex'; } if(b.dataset.w) st.w=b.dataset.w; if(b.dataset.t) st.t=b.dataset.t;
  build(); });
frame.addEventListener('click',e=>{
  const tg=e.target.closest('button[data-tog]'); if(tg){ const id=+tg.dataset.tog; if(st.open.has(id)) st.open.delete(id); else st.open.add(id); render(); return; }
  const row=e.target.closest('tr[data-i]'); if(row){ st.cur=+row.dataset.i; render(); return; }
  const rr=e.target.closest('tr[data-run]'); if(rr){ const r=runs[+rr.dataset.run-1]; st.cur=r.pieces[r.n-1]; render(); return; }
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.o){ st.order=b.dataset.o; $$('[data-o]',frame).forEach(x=>x.classList.toggle('on',x.dataset.o===st.order)); render(); return; }
  if(b.dataset.ex){ st.ex=b.dataset.ex; $$('[data-ex]',frame).forEach(x=>x.classList.toggle('on',x.dataset.ex===st.ex)); return; }
  const act=b.dataset.act;
  if(act==='prev') step(-1); else if(act==='next') step(1); else if(act==='play') togglePlay();
  else if(act==='jump'){ const us=parseT($('[data-role=tin]',frame).value); if(us!=null) jumpTime(us); }
  else if(act==='nextdisp') nextDisp();
  else if(act==='toggleall'){ st.allOpen=!st.allOpen; st.open.clear(); b.textContent=st.allOpen?'전부 접기':'전부 펼치기'; render(); }
});
frame.addEventListener('input',e=>{ if(e.target.dataset.role==='slider') jumpTime(+e.target.value*1000); });
frame.addEventListener('change',e=>{ if(e.target.dataset.role==='slider') e.target.blur(); });
frame.addEventListener('keydown',e=>{ if(e.target.dataset.role==='tin'&&e.key==='Enter'){ const us=parseT(e.target.value); if(us!=null){ jumpTime(us); e.target.blur(); } } });
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(e.key==='ArrowLeft'){ e.preventDefault(); step(e.shiftKey?-10:-1); } else if(e.key==='ArrowRight'){ e.preventDefault(); step(e.shiftKey?10:1); } else if(e.key===' '){ e.preventDefault(); togglePlay(); }
  else if(e.key==='Enter'&&st.v==='b'){ const r=runOfMsg(msgs[st.cur]); if(r){ if(st.open.has(r.id)) st.open.delete(r.id); else st.open.add(r.id); render(); } } });
function togglePlay(){ st.playing=!st.playing; if(timer){ clearInterval(timer); timer=null; } if(st.playing){ timer=setInterval(()=>{ if(posOf(st.cur)>=N-1){ togglePlay(); return; } step(1); },140); } render(); }
build();
</script>
</body>
</html>
