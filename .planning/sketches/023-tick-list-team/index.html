<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>틱뷰어 목록 팀 열 A/B/C</title>
<style>
  :root { --bg:#fff; --fg:#191f28; --fg-2:#333d4b; --muted:#f2f4f6; --muted-fg:#6b7684; --faint:#b0b8c1; --border-subtle:#e5e8eb; --card:#fff; --up:#f04452; --down:#3182f6; --team:#a234c7; --team-bg:#f6ebfa; --up-bg:#fdecee; --pill-on-bg:#191f28; --pill-on-fg:#fff; --page:#f2f4f6; }
  :root[data-theme="dark"] { --bg:#0a0a0a; --fg:#fff; --fg-2:#e4e4e4; --muted:#2d2d2d; --muted-fg:#9e9e9e; --faint:#636363; --border-subtle:#3d3d3d; --card:#151515; --up:#f04251; --down:#3485fa; --team:#c353e5; --team-bg:#2e1a36; --up-bg:#3a1a1d; --pill-on-bg:#fff; --pill-on-fg:#000; --page:#0a0a0a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--page); color:var(--fg); font:14px/1.45 Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif; }
  .bar { position:sticky; top:0; z-index:5; display:flex; gap:8px; align-items:center; padding:10px 16px; background:var(--bg); border-bottom:1px solid var(--border-subtle); flex-wrap:wrap; }
  .seg { display:inline-flex; background:var(--muted); border-radius:999px; padding:3px; }
  .seg button { border:0; background:transparent; color:var(--muted-fg); padding:4px 12px; border-radius:999px; font:inherit; font-size:12.5px; cursor:pointer; }
  .seg button.on { background:var(--card); color:var(--fg); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .wrap { max-width:1000px; margin:0 auto; padding:16px; display:grid; gap:18px; }
  body.phone .wrap { max-width:390px; padding:16px 8px; }
  .vt { font-weight:700; font-size:15px; margin:0 0 2px; } .vd { color:var(--muted-fg); font-size:12.5px; margin:0 0 10px; }
  .card { background:var(--card); border-radius:14px; overflow:hidden; }
  .hd { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--border-subtle); font-size:12.5px; font-weight:700; }
  .hd small { font-size:11px; font-weight:500; color:var(--muted-fg); }
  .sort { margin-left:auto; display:inline-flex; background:var(--muted); border-radius:999px; padding:2px; }
  .sort span { padding:3px 10px; border-radius:999px; font-size:11px; font-weight:600; color:var(--fg-2); }
  .sort span.on { background:var(--pill-on-bg); color:var(--pill-on-fg); }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th { background:var(--muted); padding:6px 12px; font-size:10.5px; font-weight:600; color:var(--muted-fg); white-space:nowrap; text-align:right; }
  th:first-child { text-align:left; }
  td { height:40px; border-top:1px solid var(--border-subtle); padding:0 12px; white-space:nowrap; text-align:right; font-variant-numeric:tabular-nums; }
  td:first-child { text-align:left; }
  td b { font-weight:600; } td small { font-size:11px; color:var(--muted-fg); margin-left:6px; }
  .up { color:var(--up); } .down { color:var(--down); } .mf { color:var(--muted-fg); } .bold { font-weight:700; }
  .tag { display:inline-flex; height:18px; align-items:center; border-radius:5px; padding:0 6px; font-size:10px; font-weight:700; margin-right:4px; }
  .accum { background:var(--team-bg); color:var(--team); } .u15 { background:var(--up-bg); color:var(--up); }
  .sub { display:block; font-size:11px; color:var(--muted-fg); margin:2px 0 0 0 !important; }
  .stack b { display:block; font-weight:700; } .stack span { display:block; font-size:10.5px; color:var(--muted-fg); }
  .src { text-align:left; } .chev { width:24px; color:var(--faint); padding-left:0; }
  body.phone .dsk { display:none; } body:not(.phone) .ph { display:none; }
  .tl { font-size:11px; margin-top:2px; display:block; }
  .note { color:var(--muted-fg); font-size:12px; line-height:1.6; padding:0 4px 24px; }
</style>
</head>
<body>
<div class="bar"><b>틱뷰어 목록 — 팀 당일순매수 · 누적순매수 · 당일손익</b>
  <span class="seg" id="theme"><button class="on" data-v="light">라이트</button><button data-v="dark">다크</button></span>
  <span class="seg" id="width"><button class="on" data-v="desk">데스크톱</button><button data-v="phone">폰 390</button></span>
</div>
<div class="wrap" id="wrap"></div>
<script>
const R = [
  { n:'에코앤드림', c:'101360', ex:'KRX', rate:29.9, src:['accum','up15'], day:1_560_000_000, cum:4_520_000_000, pnl:184_000_000 },
  { n:'한양디지텍', c:'078350', ex:'KRX', rate:24.5, src:['up15'], day:-312_000_000, cum:null, pnl:-21_500_000 },
  { n:'에코앤드림', c:'101360', ex:'NXT', rate:15.6, src:['up15'], day:89_000_000, cum:4_520_000_000, pnl:6_200_000 },
  { n:'티에스이', c:'131290', ex:'KRX', rate:8.1, src:['accum'], day:0, cum:-1_230_000_000, pnl:0 },
  { n:'SK하이닉스', c:'000660', ex:'KRX', rate:1.8, src:['accum'], day:null, cum:780_000_000, pnl:null },
];
const amt = (v) => { if (v === null) return '—'; if (v === 0) return '0'; const a = Math.abs(v), s = v > 0 ? '+' : '−'; return s + (a >= 1e8 ? (a/1e8).toFixed(a >= 1e10 ? 0 : 2).replace(/\.?0+$/,'') + '억' : Math.round(a/1e4).toLocaleString('ko-KR') + '만'); };
const tone = (v) => v === null || v === 0 ? 'mf' : v > 0 ? 'up' : 'down';
const tags = (r) => r.src.map((s) => `<span class="tag ${s === 'accum' ? 'accum' : 'u15'}">${s === 'accum' ? '매집감지' : '15%↑'}</span>`).join('') + (r.ex === 'NXT' ? '<span class="tag" style="background:var(--pill-on-bg);color:var(--pill-on-fg)">NXT</span>' : '');
const head = (sorts) => `<div class="hd">10/30 격자 종목 <small>5종목 · 매집감지 등록 + 15%↑ 자동</small><span class="sort">${sorts.map((s, i) => `<span class="${i === 0 ? 'on' : ''}">${s}</span>`).join('')}</span></div>`;
const name = (r) => `<b>${r.n}</b><small>${r.c} · ${r.ex}</small>`;
const rate = (r) => `<td class="bold ${tone(r.rate)}">+${r.rate.toFixed(1)}%</td>`;

function A() {
  return `<div class="card">${head(['등락률순','순매수순','손익순','이름순'])}<table><thead><tr><th>종목</th><th>등락률</th><th>당일순매수</th><th>누적순매수</th><th>당일손익</th><th class="dsk" style="text-align:left">출처</th><th class="chev"></th></tr></thead><tbody>${
    R.map((r) => `<tr><td>${name(r)}</td>${rate(r)}<td class="bold ${tone(r.day)}">${amt(r.day)}</td><td class="${tone(r.cum)}">${amt(r.cum)}</td><td class="bold ${tone(r.pnl)}">${amt(r.pnl)}</td><td class="dsk src">${tags(r)}</td><td class="chev">›</td></tr>`).join('')}</tbody></table></div>`;
}
function B() {
  return `<div class="card">${head(['등락률순','순매수순','손익순','이름순'])}<table><thead><tr><th>종목</th><th>등락률</th><th class="dsk">당일순매수</th><th class="dsk">누적순매수</th><th class="dsk">당일손익</th><th class="dsk" style="text-align:left">출처</th><th class="chev"></th></tr></thead><tbody>${
    R.map((r) => `<tr><td>${name(r)}<span class="ph tl">순매수 <b class="${tone(r.day)}">${amt(r.day)}</b> · 누적 <span class="${tone(r.cum)}">${amt(r.cum)}</span> · 손익 <b class="${tone(r.pnl)}">${amt(r.pnl)}</b></span></td>${rate(r)}<td class="dsk bold ${tone(r.day)}">${amt(r.day)}</td><td class="dsk ${tone(r.cum)}">${amt(r.cum)}</td><td class="dsk bold ${tone(r.pnl)}">${amt(r.pnl)}</td><td class="dsk src">${tags(r)}</td><td class="chev">›</td></tr>`).join('')}</tbody></table></div>`;
}
function C() {
  return `<div class="card">${head(['등락률순','순매수순','손익순','이름순'])}<table><thead><tr><th>종목</th><th>등락률</th><th>팀 순매수 <span style="font-weight:400">(누적)</span></th><th>당일손익</th><th class="dsk" style="text-align:left">출처</th><th class="chev"></th></tr></thead><tbody>${
    R.map((r) => `<tr><td>${name(r)}</td>${rate(r)}<td class="stack"><b class="${tone(r.day)}">${amt(r.day)}</b><span>누적 ${amt(r.cum)}</span></td><td class="bold ${tone(r.pnl)}">${amt(r.pnl)}</td><td class="dsk src">${tags(r)}</td><td class="chev">›</td></tr>`).join('')}</tbody></table></div>`;
}
const V = [
  ['A · 열 3개(폰에서도 그대로)', '등락률 뒤에 당일순매수 · 누적순매수 · 당일손익 열. 폰은 출처 칩만 숨기고 숫자 3열 유지(좁으면 글자 작아짐). 정렬에 「순매수순 · 손익순」 추가.', A],
  ['B · 데스크톱 열 3개 · 폰은 이름 밑 한 줄', '데스크톱은 A 와 같음. 폰은 열을 숨기고 종목명 아래 「순매수 +15.6억 · 누적 +45.2억 · 손익 +1.84억」 한 줄(행 높이 커짐).', B],
  ['C · 순매수 칸 하나에 당일/누적 2단 + 손익 열', '「팀 순매수」 칸 위 = 당일(굵게) · 아래 = 누적(작게) · 옆에 당일손익. 열이 2개라 폰에서도 덜 빽빽.', C],
];
function render() {
  document.getElementById('wrap').innerHTML = V.map(([t, d, f]) => `<section><p class="vt">${t}</p><p class="vd">${d}</p>${f()}</section>`).join('') +
    `<p class="note">공통: 값은 밤 격자 변환 때 계산(상세 「팀 거래정보」 카드와 같은 숫자) · 오늘 장중 목록은 20:10 승격 전까지 「—」 · 누적순매수 = 매집감지 등록 종목의 이월 포함 포지션(미등록 「—」) · NXT 행 당일 값은 그 거래소 팀만, 누적은 KRX+NXT 합산 포지션. 0 은 「0」, 모름은 「—」. 금액 +빨강 / −파랑.</p>`;
}
for (const id of ['theme','width']) document.getElementById(id).addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; document.querySelectorAll(`#${id} button`).forEach((x) => x.classList.toggle('on', x === b)); if (id === 'theme') document.documentElement.dataset.theme = b.dataset.v; else document.body.classList.toggle('phone', b.dataset.v === 'phone'); });
render();
</script>
</body>
</html>
