  return `${WARN}
    <div class="two">
      <div><div class="sec-h"><b>등락 구간별 팀 · 거래원 순매수</b><span class="new">새로</span><span>단위 억 · 하루 합계 = 상한가 가격 제외</span></div>${matrix('band')}
        <p class="cap">색 진하기 = 다섯 창구 안에서 크기. 팀 열은 색 없음(출처가 달라 한 눈금에 섞지 않는다).</p></div>
      <div>${daySection()}</div>
    </div>
    <div class="sec-h"><b>10분마다 팀 · 거래원 순매수</b><span class="new">새로</span><span>단위 억 · 보라 띠 = 팀 최대 매집 창</span></div>
    ${open ? matrix('bucket') : ''}
    <button class="toggle" data-tg="1">${open ? '▴ 10분 거래원 표 접기' : '▾ 10분 거래원 표 보기 (39행)'}</button>
    <p class="cap">지금 화면의 구간 막대 · 10분 막대(팀)는 이 표 위에 그대로 둔다 — 목업에선 생략.</p>`;
}

function renderC() {
  const all = ['팀', ...MEMBERS];
  const mem = MEMBERS.map(series);
  const mxBand = Math.max(...mem.flatMap((x) => x.band).filter((v) => v !== null).map(Math.abs));
  const mxBk = Math.max(...mem.flatMap((x) => x.bucket).filter((v) => v !== null).map(Math.abs));
  const t = series('팀');
  const tBand = Math.max(...t.band.map(Math.abs)), tBk = Math.max(...t.bucket.map(Math.abs));
  const panels = all.map((m) => {
    const s = series(m); const tot = m === '팀' ? D.bands.find((b) => b.label === '하루 합계').net_val : sumKnown(s.band.slice(0, -1));
    return `<div class="p${m === '팀' ? ' team' : ''}"><h4>${m === '팀' ? '팀(체결 모양)' : m}<em class="${tone(tot)}">${tot === null ? '모름' : eok(tot)}</em></h4>${bandBars(s.band, m === '팀' ? tBand : mxBand, true)}</div>`;
  }).join('');
  const strips = all.map((m) => {
    const s = series(m); const tot = sumKnown(s.bucket);
    return `<div class="strip${m === '팀' ? ' team' : ''}"><span class="nm">${m}</span>${bucketCols(s.bucket, m === '팀' ? tBk : mxBk, 34)}<span class="vl ${tone(tot)}">${tot === null ? '—' : eok(tot)}</span></div>`;
  }).join('');
  return `${WARN}
    <div class="sec-h"><b>등락 구간별 순매수 — 팀 · 다섯 창구</b><span class="new">새로</span><span>위에서부터 ${BANDS.map((b) => b.label).join(' · ')} · 머리 숫자 = 상한가 가격 제외 합</span></div>
    <div class="sm">${panels}</div>
    <p class="cap">다섯 창구는 한 눈금, 팀은 자기 눈금(출처가 다르다).</p>
    <div class="two"><div>
    <div class="sec-h"><b>10분마다 순매수 — 팀 · 다섯 창구</b><span class="new">새로</span><span>시간축 공통 · 오른쪽 = 하루 합(모르는 칸 있으면 —)</span></div>
    <div class="strips">${strips}</div>
    <div class="strip"><span></span>${axis()}<span></span></div>${legend()}
    </div><div>${daySection()}</div></div>`;
}

let V = 'A', W = 'desktop', SEL = '팀', OPEN = false;
function render() {
  document.getElementById('desc').innerHTML = DESC[V];
  const fr = document.getElementById('frame'); fr.className = `f ${W}`;
  const head = `<div class="row-h"><b>${D.name}</b><span>${D.code} · 10/14</span><span class="tag">상한가</span><span style="flex:1"></span><span>팀 순매수 <b class="${tone(D.team_net)}" style="font-size:14px">${eok(D.team_net)}</b></span></div>`;
  const sum = `<ol class="sum">${D.summary.slice(0, 2).map((l) => `<li>${l}</li>`).join('')}<li class="dim">… (지금 화면 요약 그대로)</li></ol>`;
  const body = V === 'A' ? renderA(SEL) : V === 'B' ? renderB(OPEN) : renderC();
  document.getElementById('main').innerHTML = `${head}<div class="inner">${sum}${body}</div>
    <p class="cap" style="text-align:center;margin-top:10px">실데이터: 천일고속 2026-10-14 — 팀 = export 그대로, 거래원 = 맥 parquet B9 로 위 방식대로 계산한 값(gh-trade 확정 규칙 전 시안).</p>`;
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.v) { V = t.dataset.v; document.querySelectorAll('[data-v]').forEach((b) => b.classList.toggle('on', b === t)); }
  if (t.dataset.w) { W = t.dataset.w; document.querySelectorAll('[data-w]').forEach((b) => b.classList.toggle('on', b === t)); }
  if (t.dataset.chip) SEL = t.dataset.chip;
  if (t.dataset.tg) OPEN = !OPEN;
  render();
});
render();
</script>
</body>
</html>
