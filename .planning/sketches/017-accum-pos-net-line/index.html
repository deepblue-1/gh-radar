<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sketch 017 — 매집감지 누적 판 · 포지션 순매수(이월 포함) 선</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #0c0c0f; color: #ddd; font-family: -apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif; }
#nav { position: sticky; top: 0; z-index: 50; background: #0c0c0f; border-bottom: 1px solid #26262c; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 13px; }
#nav .g { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
#nav .l { color: #777; font-size: 12px; margin-right: 4px; }
#nav button { font: inherit; background: #1b1b20; color: #bbb; border: 1px solid #2a2a31; border-radius: 7px; padding: 5px 10px; cursor: pointer; }
#nav button.on { background: #f2f2f2; color: #111; border-color: #f2f2f2; font-weight: 700; }
#desc { flex-basis: 100%; color: #9a9aa2; font-size: 12.5px; line-height: 1.6; }
#desc b { color: #eee; }
#stage { display: flex; justify-content: center; padding: 20px 12px 60px; overflow-x: auto; }

/* gh-radar globals.css 실제 토큰 (라이트 / 다크) */
.f {
  --bg:#ffffff; --card:#ffffff; --muted:#f2f4f6; --fg:#191f28; --fg-2:#333d4b; --muted-fg:#6b7684; --faint:#b0b8c1;
  --border-subtle:#e5e8eb; --up:#f04452; --down:#3182f6; --team:#a234c7; --accum-carry:#a16207; --accum-shade:rgba(0,0,0,.035);
  --font:'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif;
  background: var(--bg); color: var(--fg); font-family: var(--font); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  border-radius: 14px; box-shadow: 0 0 0 1px #2a2a30, 0 30px 80px rgba(0,0,0,.5); padding: 16px; flex: none;
}
.f.dark { --bg:#0a0a0a; --card:#151515; --muted:#1f1f1f; --fg:#ffffff; --fg-2:#e4e4e4; --muted-fg:#9e9e9e; --faint:#636363;
  --border-subtle:#3d3d3d; --up:#f04251; --down:#3485fa; --team:#c353e5; --accum-carry:#ffd43b; --accum-shade:rgba(255,255,255,.04); }
.f.phone { width: 390px; }
.f.desktop { width: 980px; }
.stock { margin-bottom: 26px; }
.stock h3 { margin: 0 0 2px; font-size: 16px; font-weight: 700; }
.stock .meta { font-size: 12px; color: var(--muted-fg); margin-bottom: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted-fg); margin: 6px 0 8px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.sw { display: inline-block; width: 12px; height: 0; border-top: 2px solid; }
.sw.dot { border-top-style: dotted; }
.chartbox { position: relative; }
svg { display: block; width: 100%; height: auto; font-size: 11px; font-family: var(--font); }
.tip { position: absolute; pointer-events: none; background: var(--fg); color: var(--bg); font-size: 12px; padding: 5px 8px; border-radius: 6px; white-space: nowrap; display: none; transform: translate(-50%, -100%); }
.note { font-size: 12px; color: var(--muted-fg); line-height: 1.6; margin-top: 4px; }
</style>
</head>
<body>
<div id="nav">
  <div class="g"><span class="l">변형</span><button data-v="A" class="on">A 같은 축 · 호박 실선</button><button data-v="B">B 같은 축 · 포지션 주인공</button><button data-v="C">C 축 분리(좌 포지션 · 우 그날)</button></div>
  <div class="g"><span class="l">폭</span><button data-w="phone" class="on">폰 390</button><button data-w="desktop">데스크톱</button></div>
  <div class="g"><span class="l">테마</span><button data-t="light" class="on">라이트</button><button data-t="dark">다크</button></div>
  <div id="desc"></div>
</div>
<div id="stage"><div id="frame" class="f phone"></div></div>

<script>
const DESC = {
  A: '<b>A 같은 축 · 호박 실선</b> — 지금 「순매수 누적」(보라 계단, 그날 0부터)은 그대로, 위에 <b>포지션 순매수(이월 포함)</b> 를 이월 색(호박) 실선으로 겹친다. 축 하나(억) — 두 값을 바로 비교. 이월분이 크면 보라 계단이 납작해진다.',
  B: '<b>B 같은 축 · 포지션 주인공</b> — WinForms 상세 차트처럼 포지션 순매수를 굵은 보라 실선(주인공)으로, 그날 누적은 얇은 회색 계단(보조)으로 내린다. 목록 · KPI 의 「등록 후 순매수」 와 같은 값이 눈에 먼저 들어온다.',
  C: '<b>C 축 분리</b> — 포지션 순매수(호박)는 왼쪽 축, 그날 누적(보라)은 오른쪽 축. 이월분이 커도 두 선 모양이 다 살지만, 두 선의 높이를 서로 비교하면 안 된다(축이 다름).',
};
const HOUR = 3600e3, MIN = 60e3;
const T0 = 8 * HOUR, T1 = 20 * HOUR;
const hm = (t) => { const h = Math.floor(t / HOUR), m = Math.floor((t % HOUR) / MIN); return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`; };
const eok = (v, d = 1) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d) + '억';

// 가상 데이터 — 억 단위
function rnd(seed) { let s = seed; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }
function walk(seed, from, to, start, drift, vol, step = 3 * MIN) {
  const r = rnd(seed); const t = [], v = []; let x = start;
  for (let tt = from; tt <= to; tt += step) { x += drift + (r() - 0.5) * vol; t.push(tt); v.push(+x.toFixed(2)); }
  return { t, v };
}
const STOCKS = [
  { name: '흥구석유', meta: '10/20 등록 · 이월 D+3 · 장중 청산(숨김) → 13:40 재등장 · 마감 매집중', build() {
      const day = walk(7, 9 * HOUR, 19.5 * HOUR, 0, 0.012, 0.6);
      // 포지션: 06:00 스냅샷 12.4억에서 시작 → 장중 움직임 = 그날 누적의 우리 체결 제외분 + 이월
      const pos = { t: [6 * HOUR + 0.5 * MIN], v: [12.4], cyc: [3] };
      day.t.forEach((t, i) => {
        const val = +(12.4 + day.v[i] * 0.92).toFixed(2);
        if (t > 11.2 * HOUR && t < 13.67 * HOUR) return; // 숨김 구간(행 없음)
        pos.t.push(t); pos.v.push(val); pos.cyc.push(3);
      });
      return { day, pos, marks: [{ t: 11.2 * HOUR, kind: 'end', label: '청산 11:12' }, { t: 13.67 * HOUR, kind: 'reg', label: '재등장 13:40 · 3' }] };
  }},
  { name: '금호전기', meta: '그날 등록 09:42 · 14:05 매집 종료(end 4) → 15:10 새 등록(사이클 +1)', build() {
      const day = walk(21, 9 * HOUR, 19.5 * HOUR, 0, 0.004, 0.9);
      const pos = { t: [], v: [], cyc: [] };
      day.t.forEach((t, i) => {
        if (t >= 9.7 * HOUR && t <= 14.08 * HOUR) { pos.t.push(t); pos.v.push(+(day.v[i] - day.v[13] + 1.1).toFixed(2)); pos.cyc.push(1); }
        if (t >= 15.17 * HOUR) { pos.t.push(t); pos.v.push(+(day.v[i] - day.v[69] + 1.0).toFixed(2)); pos.cyc.push(2); }
      });
      return { day, pos, marks: [{ t: 9.7 * HOUR, kind: 'reg', label: '등록 09:42 · 1' }, { t: 14.08 * HOUR, kind: 'end', label: '매집 종료 14:05' }, { t: 15.17 * HOUR, kind: 'reg', label: '등록 15:10 · 2' }] };
  }},
];

let state = { v: 'A', w: 'phone', t: 'light' };

function render() {
  document.getElementById('desc').innerHTML = DESC[state.v];
  const frame = document.getElementById('frame');
  frame.className = `f ${state.w} ${state.t === 'dark' ? 'dark' : ''}`;
  const W = state.w === 'phone' ? 358 : 948, L = 12, R = state.v === 'C' ? 56 : 56, LC = state.v === 'C' ? 52 : 12;
  frame.innerHTML = STOCKS.map((s, si) => {
    const d = s.build();
    const left = LC, right = W - R, H = 150, top = 22, bot = 22, ph = H - top - bot;
    const x = (t) => left + ((Math.max(T0, t) - T0) / (T1 - T0)) * (right - left);
    const allDay = [0, ...d.day.v], allPos = [0, ...d.pos.v];
    let yD, yP, ticksD, ticksP;
    const mk = (arr) => { const mn = Math.min(...arr), mx = Math.max(...arr); const sp = mx - mn || 1; return { mn, mx, y: (c) => top + ((mx - c) / sp) * ph }; };
    if (state.v === 'C') { const a = mk(allDay), b = mk(allPos); yD = a.y; yP = b.y; ticksD = [a.mn, 0, a.mx]; ticksP = [b.mn, b.mx]; }
    else { const a = mk([...allDay, ...allPos]); yD = a.y; yP = a.y; ticksD = [a.mn, 0, a.mx]; ticksP = []; }
    // 그날 누적 계단
    let dd = `M${x(d.day.t[0])},${yD(0)}`; d.day.t.forEach((t, i) => { dd += `H${x(t)}V${yD(d.day.v[i])}`; }); dd += `H${x(T1)}`;
    // 포지션 선 — 사이클 바뀌거나 15분 이상 비면 끊음
    let dp = ''; d.pos.t.forEach((t, i) => {
      const brk = i === 0 || d.pos.cyc[i] !== d.pos.cyc[i - 1] || t - d.pos.t[i - 1] > 15 * MIN;
      dp += brk ? `M${x(t)},${yP(d.pos.v[i])}` : `H${x(t)}V${yP(d.pos.v[i])}`;
    });
    const dayStyle = state.v === 'B'
      ? `stroke="var(--muted-fg)" stroke-width="1" stroke-opacity=".7"`
      : `stroke="var(--team)" stroke-width="1.5"`;
    const posStyle = state.v === 'B'
      ? `stroke="var(--team)" stroke-width="2.2"`
      : `stroke="var(--accum-carry)" stroke-width="2"`;
    const posColor = state.v === 'B' ? 'var(--team)' : 'var(--accum-carry)';
    const dayColor = state.v === 'B' ? 'var(--muted-fg)' : 'var(--team)';
    const hours = [8, 10, 12, 14, 16, 18, 20];
    const marks = d.marks.map((m) => `<line x1="${x(m.t)}" x2="${x(m.t)}" y1="${top}" y2="${top + ph}" stroke="${m.kind === 'reg' ? 'var(--team)' : 'var(--muted-fg)'}" stroke-width="1" ${m.kind === 'end' ? 'stroke-dasharray="3 3"' : ''}/>`).join('');
    const axisR = ticksD.map((c) => `<text x="${right + 6}" y="${yD(c) + 3}" fill="${dayColor}">${eok(c)}</text>`).join('');
    const axisL = ticksP.map((c) => `<text x="${left - 6}" y="${yP(c) + 3}" fill="${posColor}" text-anchor="end">${eok(c)}</text>`).join('');
    const dayLabel = state.v === 'B' ? '그날 순매수 누적(0부터)' : '순매수 누적(그날 0부터)';
    const posLabel = '포지션 순매수(이월 포함)';
    const legend = state.v === 'B'
      ? `<span><i class="sw" style="border-color:var(--team);border-top-width:3px"></i>${posLabel}</span><span><i class="sw" style="border-color:var(--muted-fg)"></i>${dayLabel}</span>`
      : `<span><i class="sw" style="border-color:var(--team)"></i>${dayLabel}</span><span><i class="sw" style="border-color:var(--accum-carry);border-top-width:3px"></i>${posLabel}</span>`;
    const head = state.v === 'B' ? `<text x="${left}" y="12" fill="var(--team)" font-weight="600">포지션 순매수 · 그날 누적</text>` : `<text x="${left}" y="12" fill="var(--team)" font-weight="600">순매수 누적 · <tspan fill="var(--accum-carry)">포지션(이월 포함)</tspan></text>`;
    return `<div class="stock"><h3>${s.name}</h3><div class="meta">${s.meta}</div>
      <div class="legend">${legend}<span><i class="sw" style="border-color:var(--team);width:2px;height:10px;border-top:0;border-left:2px solid var(--team)"></i>등록</span><span><i class="sw" style="width:0;height:10px;border-top:0;border-left:2px dashed var(--muted-fg)"></i>청산·종료</span></div>
      <div class="chartbox" data-i="${si}"><svg viewBox="0 0 ${W} ${H}" data-i="${si}">
        ${head}
        <line x1="${left}" x2="${right}" y1="${yD(0)}" y2="${yD(0)}" stroke="var(--faint)" stroke-dasharray="2 3"/>
        ${marks}
        <path d="${dd}" fill="none" ${dayStyle} stroke-linejoin="round"/>
        <path d="${dp}" fill="none" ${posStyle} stroke-linejoin="round"/>
        ${axisR}${axisL}
        ${hours.map((h) => `<text x="${x(h * HOUR)}" y="${H - 6}" fill="var(--muted-fg)" text-anchor="middle">${String(h).padStart(2,'0')}</text>`).join('')}
        <line class="cross" x1="0" x2="0" y1="${top}" y2="${top + ph}" stroke="var(--fg-2)" stroke-width=".6" style="display:none"/>
        <rect x="${left}" y="${top}" width="${right - left}" height="${ph}" fill="transparent"/>
      </svg><div class="tip"></div></div>
      ${si === 0 ? '<div class="note">툴팁: 「HH:MM · 순매수 누적 ±X.XX억 · 포지션 순매수 ±Y.YY억(이월 포함)」 — 숨김(청산) 구간은 포지션 값 없음 → 「포지션 — (청산 · 숨김 추적)」.</div>' : ''}
    </div>`;
  }).join('');
  // 툴팁
  frame.querySelectorAll('.chartbox').forEach((box) => {
    const i = +box.dataset.i, d = STOCKS[i].build(), svg = box.querySelector('svg'), tip = box.querySelector('.tip'), cross = svg.querySelector('.cross');
    const vb = svg.viewBox.baseVal;
    svg.addEventListener('mousemove', (e) => {
      const r = svg.getBoundingClientRect(), sx = vb.width / r.width, px = (e.clientX - r.left) * sx;
      const left = state.v === 'C' ? 52 : 12, right = vb.width - 56;
      if (px < left || px > right) { tip.style.display = 'none'; cross.style.display = 'none'; return; }
      const t = T0 + ((px - left) / (right - left)) * (T1 - T0);
      const at = (ts, vs) => { let k = -1; for (let j = 0; j < ts.length; j++) if (ts[j] <= t) k = j; return k; };
      const kd = at(d.day.t, d.day.v), kp = at(d.pos.t, d.pos.v);
      const hidden = kp < 0 || t - d.pos.t[kp] > 15 * MIN;
      const dayTxt = kd < 0 ? '순매수 누적 0.00억' : `순매수 누적 ${eok(d.day.v[kd], 2)}`;
      const posTxt = hidden ? '포지션 —' : `포지션 순매수 ${eok(d.pos.v[kp], 2)}(이월 포함)`;
      tip.textContent = `${hm(t)} · ${dayTxt} · ${posTxt}`;
      tip.style.left = `${(px / sx)}px`; tip.style.top = `18px`; tip.style.display = 'block';
      cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.style.display = 'block';
    });
    svg.addEventListener('mouseleave', () => { tip.style.display = 'none'; cross.style.display = 'none'; });
  });
}
document.querySelectorAll('#nav button').forEach((b) => b.addEventListener('click', () => {
  const k = b.dataset.v ? 'v' : b.dataset.w ? 'w' : 't';
  state[k] = b.dataset[k];
  b.parentElement.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
  render();
}));
render();
</script>
</body>
</html>
