<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>매집 목록 필터 줄</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #0c0c0f; color: #ddd; font-family: -apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif; }
#nav { position: sticky; top: 0; z-index: 50; background: #0c0c0f; border-bottom: 1px solid #26262c; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 13px; }
#nav .g { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
#nav .l { color: #777; font-size: 12px; margin-right: 4px; }
#nav button { font: inherit; background: #1b1b20; color: #bbb; border: 1px solid #2a2a31; border-radius: 7px; padding: 5px 10px; cursor: pointer; }
#nav button.on { background: #f2f2f2; color: #111; border-color: #f2f2f2; font-weight: 700; }
#desc { flex-basis: 100%; color: #9a9aa2; font-size: 12.5px; line-height: 1.6; }
#desc b { color: #eee; }
#stage { display: flex; justify-content: center; padding: 20px 12px 60px; overflow-x: auto; }

.f {
  --bg:#ffffff; --surface:#f2f4f6; --card:#ffffff; --muted:#f2f4f6; --raised-2:#e5e8eb; --fg:#191f28; --fg-2:#333d4b; --muted-fg:#6b7684; --faint:#b0b8c1;
  --border-subtle:#e5e8eb; --up:#f04452; --down:#3182f6; --flat:#6b7684; --team:#a234c7; --team-bg:#f9f0fc;
  --accum-sell:#c2410c; --accum-sell-bg:#fff4e6; --accum-carry:#a16207; --accum-carry-bg:#fef9e7;
  --new-bg:#fff6d9; --new-bd:#ffd257; --pill-on-bg:#e8f3ff; --pill-on-fg:#1b64da; --primary:#3182f6; --primary-fg:#fff; --input:#ffffff;
  --font:'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif;
  background: var(--surface); color: var(--fg); font-family: var(--font); -webkit-font-smoothing: antialiased;
  border-radius: 14px; box-shadow: 0 0 0 1px #2a2a30, 0 30px 80px rgba(0,0,0,.5); padding: 16px; flex: none;
}
.f.dark { --bg:#0a0a0a; --surface:#0a0a0a; --card:#151515; --muted:#2d2d2d; --raised-2:#3d3d3d; --fg:#ffffff; --fg-2:#e4e4e4; --muted-fg:#9e9e9e; --faint:#636363;
  --border-subtle:#3d3d3d; --up:#f04251; --down:#3485fa; --flat:#9e9e9e; --team:#c353e5; --team-bg:rgba(174,61,209,.16);
  --accum-sell:#ff9f43; --accum-sell-bg:rgba(255,159,67,.16); --accum-carry:#ffd43b; --accum-carry-bg:rgba(255,212,59,.16);
  --new-bg:#3a3014; --new-bd:#6d5a1d; --pill-on-bg:#4e4e4e; --pill-on-fg:#fff; --primary:#3485fa; --input:#1f1f1f; }
.f.phone { width: 390px; }
.f.desktop { width: 1200px; }
.mono { font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--flat); } .faint { color: var(--faint); } .mf { color: var(--muted-fg); }
.cap { font-size: 12px; color: var(--muted-fg); margin: 0 2px 8px; line-height: 1.5; }

.wb { background: var(--card); border-radius: 16px; overflow: visible; position: relative; }
.strip { display: flex; align-items: center; gap: 8px; padding: 10px; min-width: 0; }
.lab { font-size: 12px; font-weight: 700; flex: none; display: flex; gap: 6px; align-items: baseline; }
.lab small { font-size: 10px; color: var(--muted-fg); font-weight: 500; }
.lab .out { font-size: 10px; font-weight: 600; color: var(--muted-fg); background: var(--muted); border-radius: 4px; padding: 1px 5px; }
.chips { display: flex; gap: 6px; overflow-x: auto; flex: 1; min-width: 0; padding-bottom: 2px; scrollbar-width: thin; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; border-radius: 999px; padding: 0 10px 0 8px; font-size: 12px; white-space: nowrap; background: var(--muted); flex: none; }
.chip b { font-weight: 600; } .chip .n { font-weight: 700; } .chip .k { font-size: 10px; color: var(--muted-fg); margin-right: -3px; }
.btn { height: 26px; border-radius: 12px; border: 0; background: var(--muted); color: var(--fg); font: inherit; font-size: 11px; font-weight: 600; padding: 0 10px; flex: none; white-space: nowrap; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.btn.on { background: var(--pill-on-bg); color: var(--pill-on-fg); }
.btn .cnt { font-size: 10px; opacity: .8; }
.badge { display: inline-flex; align-items: center; height: 16px; border-radius: 4px; padding: 0 4px; font-size: 9px; font-weight: 700; flex: none; }
.b1 { background: var(--team-bg); color: var(--team); } .b2 { background: var(--accum-sell-bg); color: var(--accum-sell); }
.b3 { background: var(--muted); color: var(--muted-fg); } .bc { background: var(--accum-carry-bg); color: var(--accum-carry); }

/* 필터 줄 */
.fbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 10px; font-size: 11px; color: var(--muted-fg); }
.fbar.thin { padding: 0 10px 8px; }
.fg { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.fg .t { font-weight: 600; color: var(--fg-2); margin-right: 2px; }
.fg input { width: 52px; height: 24px; border-radius: 6px; border: 1px solid var(--border-subtle); background: var(--input); color: var(--fg); font: inherit; font-size: 11px; text-align: right; padding: 0 6px; font-variant-numeric: tabular-nums; }
.fg input::placeholder { color: var(--faint); }
.ck { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; color: var(--fg-2); cursor: pointer; }
.ck input { margin: 0; }
.fout { margin-left: auto; white-space: nowrap; }
.fout b { color: var(--fg-2); }

/* 팝오버(B) */
.pop { position: absolute; right: 10px; top: 46px; z-index: 5; background: var(--card); border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.18), 0 0 0 1px var(--border-subtle); padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; font-size: 11px; color: var(--muted-fg); width: 280px; }
.pop .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pop .foot { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border-subtle); padding-top: 8px; }

.tblwrap { border-top: 1px solid var(--border-subtle); overflow-x: auto; }
table.lt { width: 100%; border-collapse: collapse; font-size: 12px; }
.lt th { font-size: 11px; font-weight: 600; color: var(--muted-fg); white-space: nowrap; padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--border-subtle); }
.lt td { height: 36px; padding: 0 8px; white-space: nowrap; border-bottom: 1px solid var(--border-subtle); }
.lt .r { text-align: right; }
.lt tr.ended td, .lt tr.ended td * { color: var(--muted-fg) !important; }
.lt tr.outrow td { opacity: .45; }
.lt .nm { font-weight: 600; } .lt .cd { font-size: 11px; color: var(--muted-fg); margin-left: 4px; }
.lt .sub { display: block; font-size: 10px; color: var(--muted-fg); line-height: 1.3; }
.lt .two { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.25; padding: 3px 0; }
.lt .two small { font-size: 10px; color: var(--muted-fg); font-weight: 400; }
.add { height: 26px; border-radius: 12px; border: 0; background: var(--muted); color: var(--fg); font: inherit; font-size: 11px; font-weight: 600; padding: 0 10px; }
.x { color: var(--muted-fg); padding-left: 6px; }
.empty { padding: 14px 10px; font-size: 12px; color: var(--muted-fg); }
</style>
</head>
<body>
<div id="nav">
  <div class="g"><span class="l">필터 줄</span><button data-v="A" class="on">A 펼친 표 위 한 줄</button><button data-v="B">B 「필터」 버튼 → 작은 창</button><button data-v="C">C 칩 아래 늘 보이는 줄</button></div>
  <div class="g"><span class="l">표</span><button data-o="1" class="on">펼침</button><button data-o="0">접힘</button></div>
  <div class="g"><span class="l">폭</span><button data-w="phone" class="on">폰 390</button><button data-w="desktop">데스크톱</button></div>
  <div class="g"><span class="l">테마</span><button data-t="light" class="on">라이트</button><button data-t="dark">다크</button></div>
  <div id="desc"></div>
</div>
<div id="stage"><div id="frame" class="f phone"></div></div>

<script>
const DESC = {
  A: '<b>A 펼친 표 위 한 줄</b> — 「더보기」로 표를 펼치면 표 바로 위에 「등락률 [15]~[ ]%  당일 순매수 [1]~[ ]억  ☐전부 보기 · 필터 밖 N」 한 줄. 표를 접어도 필터는 칩에 그대로 걸리고, 「매집」 글자 옆 작은 「필터 밖 N」이 그걸 알린다. 폰에서는 두 칸 묶음이 줄을 바꿔 두 줄이 된다(gh-trade 필터 줄과 같은 동작).',
  B: '<b>B 「필터」 버튼 → 작은 창</b> — 「매집」 줄 오른쪽 「더보기」 앞에 「필터 · N 숨김」 버튼. 누르면 작은 창이 떠 칸을 고친다. 표 펼침과 무관하게 늘 같은 자리. 화면은 가장 조용하지만 값을 보려면 한 번 눌러야 한다.',
  C: '<b>C 칩 아래 늘 보이는 줄</b> — 표를 접어도 칩 줄 바로 아래 얇은 필터 줄이 늘 보인다. 값이 한눈에 보이지만 작업대 위쪽 높이가 한 줄(폰은 두 줄) 늘어난다.',
};
const NUM = new Intl.NumberFormat('ko-KR');
const n = (v) => NUM.format(Math.round(v));
const tone = (v) => (v > 0 ? 'up' : v < 0 ? 'down' : 'flat');
const eok = (v) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1) + '억';
const pct = (v) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(2) + '%';

const ROWS = [
  { nm: '금호전기', cd: '001210', px: 2530, rate: 18.20, st: 1, carry: 0, cum: 3.82, day: 3.82, avg: 2415, at: '13:40:55' },
  { nm: '에이프로젠', cd: '007460', px: 1086, rate: 22.40, st: 1, carry: 0, cum: 2.08, day: 2.08, avg: 1021, at: '13:36:20' },
  { nm: '흥구석유', cd: '024060', px: 14650, rate: 16.32, st: 1, carry: 3, cum: 18.62, day: 2.41, avg: 14280, at: '13:42:10' },
  { nm: '대성창투', cd: '027830', px: 3185, rate: 29.90, st: 1, carry: 1, cum: 6.21, day: 1.12, avg: 3120, at: '13:38:02' },
  { nm: '동양철관', cd: '008970', px: 1412, rate: 12.17, st: 1, carry: 5, cum: 9.84, day: 1.60, avg: 1288, at: '13:31:47' },
  { nm: '우진비앤지', cd: '018620', px: 2265, rate: 15.30, st: 2, carry: 0, cum: 1.21, day: 0.62, avg: 2210, at: '13:25:40' },
  { nm: '이니텍', cd: '053350', px: 6240, rate: 4.79, st: 1, carry: 0, cum: 1.65, day: 0.40, avg: 6105, at: '09:14:03' },
  { nm: '한국ANKOR유전', cd: '152550', px: 798, rate: 17.04, st: 2, carry: 1, cum: 4.92, day: -1.34, avg: 812, at: '13:29:11' },
  { nm: '써니전자', cd: '004770', px: 3410, rate: 19.59, st: 3, carry: 0, cum: 1.84, day: 1.84, avg: 3220, at: '11:05:41' },
];
const STATE = { 1: '매집중', 2: '매도중', 3: '청산' };
let S = { v: 'A', o: '1', w: 'phone', t: 'light', all: false, popOpen: true };
const F = { rMin: 15, dMin: 1 };
const pass = (r) => r.rate >= F.rMin && r.day >= F.dMin;

function filterGroups() {
  return `<span class="fg"><span class="t">등락률</span><input value="15" placeholder="최소">~<input placeholder="최대">%</span>
    <span class="fg"><span class="t">당일 순매수</span><input value="1" placeholder="최소">~<input placeholder="최대">억</span>`;
}
function allCk() { return `<label class="ck"><input type="checkbox" data-all ${S.all ? 'checked' : ''}>전부 보기</label>`; }
function outText(cnt) { return S.all ? `필터 밖 <b>${cnt}</b> · 흐리게 표시` : `필터 밖 <b>${cnt}</b>`; }

function render() {
  const phone = S.w === 'phone';
  const out = ROWS.filter((r) => !pass(r));
  const shown = S.all ? ROWS : ROWS.filter(pass);
  const chips = shown.filter((r) => r.st !== 3);
  const open = S.o === '1';

  const chipHtml = chips.map((r) => `<span class="chip"><b>${r.nm}</b><span class="k">당일</span><span class="n mono ${tone(r.day)}">${eok(r.day)}</span><span class="badge b${r.st}">${STATE[r.st]}</span>${r.carry ? `<span class="badge bc">D+${r.carry}</span>` : ''}</span>`).join('');

  const labOut = S.v === 'B' ? '' : (out.length && !S.all ? `<span class="out" title="필터 밖 ${out.length}종목 숨김">필터 밖 ${out.length}</span>` : '');
  const filterBtn = S.v === 'B' ? `<button class="btn ${S.popOpen ? 'on' : ''}" data-pop>필터${out.length && !S.all ? ` <span class="cnt">· ${out.length} 숨김</span>` : ''}</button>` : '';

  const strip = `<section class="strip"><div class="lab">매집<small>KB120</small>${labOut}</div>
    <div class="chips">${chipHtml || '<span class="mf" style="font-size:12px;align-self:center">필터를 통과한 종목이 없어요</span>'}</div>
    ${filterBtn}<button class="btn" data-more>${open ? '접기' : '더보기'}</button></section>`;

  const pop = S.v === 'B' && S.popOpen ? `<div class="pop">
      <div class="row">${filterGroups().split('</span>\n')[0]}</span></div>
      <div class="row"><span class="fg"><span class="t">당일 순매수</span><input value="1" placeholder="최소">~<input placeholder="최대">억</span></div>
      <div class="foot">${allCk()}<span>${outText(out.length)}</span></div></div>` : '';

  const barA = `<div class="fbar">${filterGroups()}${allCk()}<span class="fout">${outText(out.length)}</span></div>`;
  const barC = `<div class="fbar thin">${filterGroups()}${allCk()}<span class="fout">${outText(out.length)}</span></div>`;

  const head = phone
    ? '<tr><th>종목</th><th class="r">현재가</th><th class="r">등락률</th><th class="r">당일 순매수</th><th>상태</th><th></th></tr>'
    : '<tr><th>종목</th><th class="r">현재가</th><th class="r">등락률</th><th class="r">당일 순매수</th><th class="r">NXT 순매수</th><th>상태</th><th class="r">평단(당일)</th><th class="r">수익률</th><th>갱신</th><th></th></tr>';
  const body = shown.map((r) => {
    const cls = [r.st === 3 ? 'ended' : '', S.all && !pass(r) ? 'outrow' : ''].join(' ');
    const name = `<span class="nm">${r.nm}</span>${phone ? `<span class="sub mono">${r.at} · 평단 ${n(r.avg)}</span>` : `<span class="cd mono">${r.cd}</span>`}`;
    const stc = `<span style="display:inline-flex;gap:4px"><span class="badge b${r.st}">${STATE[r.st]}</span>${r.carry ? `<span class="badge bc">이월 D+${r.carry}</span>` : ''}</span>`;
    const act = `<span style="display:inline-flex;align-items:center;justify-content:flex-end">${r.st === 3 ? '' : '<button class="add">추가</button>'}<span class="x">✕</span></span>`;
    const dn = `<span class="two"><b class="mono ${tone(r.day)}">${eok(r.day)}</b><small class="mono">누적 ${eok(r.cum)}</small></span>`;
    const common = `<td>${name}</td><td class="r mono ${tone(r.rate)}">${n(r.px)}</td><td class="r"><b class="mono ${tone(r.rate)}">${pct(r.rate)}</b></td><td class="r">${dn}</td>`;
    return phone
      ? `<tr class="${cls}">${common}<td>${stc}</td><td class="r">${act}</td></tr>`
      : `<tr class="${cls}">${common}<td class="r mono flat">${eok(0)}</td><td>${stc}</td><td class="r mono">${n(r.avg)}</td><td class="r mono ${tone(r.px / r.avg - 1)}">${pct((r.px / r.avg - 1) * 100)}</td><td class="mono">${r.at}</td><td class="r">${act}</td></tr>`;
  }).join('');
  const table = shown.length ? `<div class="tblwrap" style="border-top:0"><table class="lt"><thead>${head}</thead><tbody>${body}</tbody></table></div>` : '<div class="empty">필터를 통과한 종목이 없어요 — 「전부 보기」로 숨긴 종목을 볼 수 있어요</div>';

  let inner = strip;
  if (S.v === 'C') inner += barC;
  if (open) inner += `<div style="border-top:1px solid var(--border-subtle)">${S.v === 'A' ? barA : ''}${table}</div>`;
  inner += pop;

  document.getElementById('frame').className = `f ${S.w} ${S.t === 'dark' ? 'dark' : ''}`;
  document.getElementById('frame').innerHTML = `<p class="cap">기본 필터: 등락률 15% 이상 · 당일 순매수 1억 이상 — 예시 9종목 중 ${out.length}종목이 필터 밖(청산 행 포함 판정). 「전부 보기」를 눌러 보세요.${S.v === 'B' ? ' 「필터」 버튼으로 작은 창을 열고 닫습니다.' : ''}</p><div class="wb">${inner}</div>`;
  document.getElementById('desc').innerHTML = DESC[S.v];
  for (const b of document.querySelectorAll('#nav button')) {
    const [k, v] = Object.entries(b.dataset)[0];
    b.classList.toggle('on', S[k] === v);
  }
}
document.getElementById('nav').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const [k, v] = Object.entries(b.dataset)[0]; S[k] = v; render();
});
document.getElementById('frame').addEventListener('click', (e) => {
  if (e.target.matches('[data-all]')) { S.all = e.target.checked; render(); return; }
  if (e.target.closest('[data-more]')) { S.o = S.o === '1' ? '0' : '1'; render(); return; }
  if (e.target.closest('[data-pop]')) { S.popOpen = !S.popOpen; render(); }
});
render();
</script>
</body>
</html>
