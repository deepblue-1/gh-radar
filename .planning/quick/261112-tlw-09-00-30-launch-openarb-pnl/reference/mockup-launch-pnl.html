<script>
// 숫자 = 2026-11-12 KB120 실제 체결을 gh-trade 개장차익 화면과 같은 식으로 계산한 값(계좌 · 사용자만 가짜).
// 손익 = 매도금액 − 매수평균 × 매도수량 − 왕복 비용 0.22% · 잔여 = 매수 체결 − 매도 체결(자동으로 못 판 수량).
const fmt = (n) => n.toLocaleString('ko-KR');
const won = (n) => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n));
const cls = (n) => (n > 0 ? 'up' : n < 0 ? 'down' : 'dim');
const DIR = { 1: 'KRX 매수 → NXT 매도', 2: 'NXT 매수 → KRX 매도' };
const ROWS = {
  Q: [
    { name: '리노공업', code: '058470', dir: 1, bq: 161, bp: 52263, sq: 161, sp: 52700, pnl: 51812 },
    { name: '유진테크', code: '084370', dir: 1, bq: 328, bp: 81213, sq: 328, sp: 80088, pnl: -427197 },
    { name: '아스테라시스', code: '450950', dir: 2, bq: 1618, bp: 4985, sq: 1443, sp: 5110, pnl: 164737 },
  ],
  K: [
    { name: '두산에너빌리티', code: '034020', dir: 1, bq: 1071, bp: 46643, sq: 1071, sp: 47100, pnl: 378812 },
  ],
};
const MK = [['Q', '코스닥'], ['K', '코스피']];
const HEAD = {
  Q: { n: 8, ok: 6, bad: 1, oth: 1, off: '−20,139µs', retry: 1, next: '고정 −245µs' },
  K: { n: 7, ok: 5, bad: 2, oth: 0, off: '−20,152µs', retry: 0, next: '고정 −245µs' },
};
const ACC = '123-45-7101', USER = 'ezmesya';
const sumOf = (rows) => rows.reduce((a, r) => a + r.pnl, 0);
const residOf = (r) => r.bq - r.sq;

// 지금 화면의 주문(조각) 표 — 열은 실제와 같고 줄만 줄였다.
const PIECES = {
  Q: [
    { wire: 0, key: 'A · 0', fire: 'A 09:00:27 KRX→', us: '−3,020', res: '접수', t: '09:00:27.031', row: ROWS.Q[0], side: 'buy', px: 52300, q: '161/161', no: '0000412' },
    { wire: 1, key: 'A · 1', fire: 'A 09:00:27 KRX→', us: '−3,011', res: '접수', t: '09:00:27.034', row: ROWS.Q[1], side: 'buy', px: 81300, q: '328/328', no: '0000413' },
    { wire: 0, key: 'N · 0', fire: 'N 09:00:30 NXT→', us: '−20,139', res: '접수', t: '09:00:30.046', row: ROWS.Q[2], side: 'buy', px: 5000, q: '1,618/1,618', no: '0000488' },
    { wire: 1, key: 'N · 1', fire: 'N 09:00:30 NXT→', us: '−20,131', res: '515', t: '09:00:30.047', row: { name: '에코프로비엠', code: '247540' }, side: 'buy', px: 151200, q: '40/0', no: '—' },
    { wire: 2, key: 'N · 2', fire: 'N 09:00:30 NXT→', us: '−20,122', res: '접수', t: '09:00:30.051', row: ROWS.Q[0], side: 'sell', px: 52700, q: '161/161', no: '0000490' },
  ],
  K: [
    { wire: 0, key: 'A · 0', fire: 'A 09:00:27 KRX→', us: '−3,018', res: '접수', t: '09:00:27.049', row: ROWS.K[0], side: 'buy', px: 46700, q: '1,071/1,071', no: '0000409' },
    { wire: 0, key: 'N · 0', fire: 'N 09:00:30 NXT→', us: '−20,152', res: '515', t: '09:00:30.044', row: { name: '삼성전기', code: '009150' }, side: 'buy', px: 142500, q: '30/0', no: '—' },
    { wire: 1, key: 'N · 1', fire: 'N 09:00:30 NXT→', us: '−20,144', res: '접수', t: '09:00:30.084', row: ROWS.K[0], side: 'sell', px: 47100, q: '1,071/1,071', no: '0000491' },
  ],
};

const DESC = {
  A: '<b>A</b> — 코스닥 · 코스피 묶음마다 지금 주문 표 <b>위에</b> 「종목별 손익」 표가 하나 더 생깁니다. 종목 한 줄 = 매수부터 매도까지 한 묶음(gh-trade 개장차익 화면과 같은 단위). 폰에서 옆으로 밀지 않아도 보이게 <b>손익 · 잔여를 종목 바로 옆</b>에 둡니다. 위 카드에도 「손익」 한 줄.',
  B: '<b>B</b> — 표를 늘리지 않고, 지금 주문 표의 <b>매수 줄</b>에 「매도 체결 · 손익 · 잔여」 칸 3개를 붙입니다(매도 줄 · 거부 줄은 「—」). 한 표로 끝나지만 폰에서는 옆으로 밀어야 손익이 보이고, NXT 매수 → KRX 매도처럼 매도가 이 표에 없는 종목은 매수 줄에서만 확인합니다. 위 카드에도 「손익」 한 줄.',
  C: '<b>C</b> — 맨 위에 그 서버 하루 <b>「개장차익 손익」 한 장</b>(합계 큰 글씨 + 종목 목록). 코스닥 · 코스피를 한 목록으로 합쳐 손익만 빨리 봅니다. 아래 카드 · 주문 표는 지금 그대로.',
};

const state = { v: 'A', w: 'phone', t: 'dark' };

function headCard(m, label, withPnl) {
  const h = HEAD[m], rows = ROWS[m], s = sumOf(rows);
  const resid = rows.filter((r) => residOf(r) > 0).length;
  return `<div class="hcard">
    <div class="t">KB120 ${label}<small>${h.n}조각 · N·A</small></div>
    <div class="row"><span>결과</span><b><span class="cnt"><span class="ok">접수 ${h.ok}</span><span class="bad">거부 ${h.bad}</span><span class="oth">기타 ${h.oth}</span></span></b></div>
    <div class="row"><span>오프셋 (발사 기준)</span><b>${h.off}</b></div>
    <div class="row"><span>재전송</span><b>${h.retry}회</b></div>
    <div class="row"><span>다음 오프셋</span><b>${h.next}</b></div>
    ${withPnl ? `<div class="row new"><span>손익</span><b><span class="pnl ${cls(s)}">${won(s)}원</span> <span class="dim" style="font-weight:500">· ${rows.length}종목${resid ? ` · 잔여 ${resid}` : ''}</span></b></div>` : ''}
  </div>`;
}

function pnlTable(m) {
  const rows = ROWS[m], s = sumOf(rows);
  return `<div class="tbl"><table>
    <thead><tr><th>종목</th><th class="n">손익</th><th class="n">잔여</th><th>방향</th><th class="n">매수 체결</th><th class="n">매도 체결</th><th>계좌</th><th>사용자</th></tr></thead>
    <tbody>${rows.map((r) => `<tr>
      <td><b>${r.name}</b> <span class="dim">${r.code}</span></td>
      <td class="n"><span class="pnl ${cls(r.pnl)}">${won(r.pnl)}</span></td>
      <td class="n">${residOf(r) > 0 ? `<span class="resid">${fmt(residOf(r))}주</span>` : '<span class="dim">0</span>'}</td>
      <td class="dim">${DIR[r.dir]}</td>
      <td class="n">${fmt(r.bq)}주 <span class="dim">· 평균 ${fmt(r.bp)}</span></td>
      <td class="n">${fmt(r.sq)}주 <span class="dim">· 평균 ${fmt(r.sp)}</span></td>
      <td class="dim">${ACC}</td><td class="dim">${USER}</td></tr>`).join('')}
      <tr class="tot"><td>합계</td><td class="n"><span class="pnl ${cls(s)}">${won(s)}</span></td><td colspan="6"></td></tr>
    </tbody></table></div>`;
}

function piecesTable(m, extra) {
  const seen = new Set();
  return `<div class="tbl"><table>
    <thead><tr><th class="n">wire</th><th>키 · idx</th><th>발사</th><th class="n">송신 µs</th><th>결과</th><th>응답 시각</th><th>종목</th><th>구분</th><th class="n">가격</th><th class="n">수량/체결</th>
      ${extra ? '<th class="n newcol">매도 체결</th><th class="n newcol">손익</th><th class="n newcol">잔여</th>' : ''}
      <th>계좌</th><th>사용자</th><th>주문번호</th><th>체결 순번</th></tr></thead>
    <tbody>${PIECES[m].map((p) => {
      const r = p.row, has = p.side === 'buy' && r.pnl !== undefined && !seen.has(r.code);
      if (has) seen.add(r.code);
      const ex = !extra ? '' : has
        ? `<td class="n newcol">${fmt(r.sq)}주 <span class="dim">· 평균 ${fmt(r.sp)}</span></td><td class="n newcol"><span class="pnl ${cls(r.pnl)}">${won(r.pnl)}</span></td><td class="n newcol">${residOf(r) > 0 ? `<span class="resid">${fmt(residOf(r))}주</span>` : '<span class="dim">0</span>'}</td>`
        : '<td class="n newcol dim">—</td><td class="n newcol dim">—</td><td class="n newcol dim">—</td>';
      return `<tr><td class="n">${p.wire}</td><td class="dim">${p.key}</td><td class="dim">${p.fire}</td><td class="n">${p.us}</td>
        <td><span class="pill ${p.res === '접수' ? 'ok' : 'bad'}">${p.res}</span></td><td class="dim">${p.t}</td>
        <td><b>${r.name}</b> <span class="dim">${r.code}</span></td><td class="${p.side}">${p.side === 'buy' ? '매수' : '매도'}</td>
        <td class="n">${fmt(p.px)}</td><td class="n">${p.q}</td>${ex}
        <td class="dim">${ACC}</td><td class="dim">${USER}</td><td class="dim">${p.no}</td><td class="dim">${p.res === '접수' ? '1번째 · 앞 0주' : '—'}</td></tr>`;
    }).join('')}</tbody></table></div>`;
}

function summaryCard() {
  const all = [...ROWS.Q.map((r) => ({ ...r, mk: '코스닥' })), ...ROWS.K.map((r) => ({ ...r, mk: '코스피' }))].sort((a, b) => b.pnl - a.pnl);
  const s = sumOf(all), resid = all.filter((r) => residOf(r) > 0);
  return `<div class="sum">
    <div class="top"><span class="k">개장차익 손익 · KB120</span><span class="v ${cls(s)}">${won(s)}원</span></div>
    <div class="meta">${all.length}종목 · 매수부터 매도까지 끝난 수량 기준${resid.length ? ` · <span style="color:var(--warn);font-weight:600">잔여 ${resid.length}종목 ${fmt(resid.reduce((a, r) => a + residOf(r), 0))}주</span>` : ''}</div>
    <div>${all.map((r) => `<div class="li">
      <div class="nm"><b>${r.name} <span class="dim" style="font-weight:500;font-size:12px">${r.code} · ${r.mk}</span></b>
        <span>${DIR[r.dir]} · 매수 ${fmt(r.bq)}주 평균 ${fmt(r.bp)} → 매도 ${fmt(r.sq)}주 평균 ${fmt(r.sp)}</span></div>
      <div class="r"><span class="pnl ${cls(r.pnl)}">${won(r.pnl)}</span>${residOf(r) > 0 ? `<span class="resid">잔여 ${fmt(residOf(r))}주</span>` : `<small>${ACC}</small>`}</div>
    </div>`).join('')}</div>
  </div>`;
}

function render() {
  const { v, w, t } = state;
  const groups = MK.map(([m, label]) => `<div class="grp">
      <div class="gh">KB120 ${label}<small>${PIECES[m].length}조각 · wire 순</small></div>
      ${v === 'A' ? `<div class="sub">종목별 손익</div>${pnlTable(m)}<div class="sub">주문</div>` : ''}
      ${piecesTable(m, v === 'B')}
    </div>`).join('');
  document.getElementById('stage').innerHTML = `<div class="f ${w} ${t === 'dark' ? 'dark' : ''}">
    <div class="side"><div class="brand">gh-radar</div><a>스캐너</a><a>상따</a><a class="cur">러쉬주문</a><a>틱뷰어</a></div>
    <div class="col"><div class="main">
      <div class="phead"><h1>러쉬주문</h1></div>
      <div class="srvchips"><span class="on">KB120</span><span>교보119</span><span>교보112</span></div>
      <div class="tabs"><span class="on">주문 내역</span><span>경계 지도</span></div>
      <div class="ctl"><div class="datepill"><i>‹</i><span>11.12 (목)</span><i>›</i></div><div class="seg"><span>16:00</span><span class="on">09:00:30</span></div></div>
      ${v === 'C' ? summaryCard() : ''}
      <div class="heads">${MK.map(([m, label]) => headCard(m, label, v !== 'C')).join('')}</div>
      ${groups}
      <div class="foot">손익 = 매도금액 − 매수 평균가 × 매도 수량 − 왕복 비용 0.22% (gh-trade 개장차익 화면과 같은 식). 잔여 = 자동으로 팔지 못하고 남은 수량 — 직접 판 수량은 세지 않습니다. 16:00 화면에는 손익이 없습니다.</div>
    </div></div>
  </div>`;
  document.getElementById('desc').innerHTML = DESC[v];
  for (const b of document.querySelectorAll('#nav button')) {
    const on = (b.dataset.v && b.dataset.v === v) || (b.dataset.w && b.dataset.w === w) || (b.dataset.t && b.dataset.t === t);
    b.classList.toggle('on', Boolean(on));
  }
}

document.getElementById('nav').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.v) state.v = b.dataset.v;
  if (b.dataset.w) state.w = b.dataset.w;
  if (b.dataset.t) state.t = b.dataset.t;
  render();
});
render();
</script>
</body>
</html>
