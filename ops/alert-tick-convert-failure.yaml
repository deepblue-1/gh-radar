displayName: gh-radar-tick-convert-failure
documentation:
  content: |
    Cloud Run Job `gh-radar-tick-convert` 의 실행 실패를 감지 — 틱 격자 변환 실패(Phase 37 D-02 · D-03 · D-04).
    nightly(Scheduler 23:30 · 01:30 KST) — 날짜 하나가 실패해도(깨진 원본 · RPC 오류 · 업로드 · 메타 실패) 다른 날짜와 90일 purge 는 진행하고, 실패 날짜 · purge 실패가 있으면 종료 1. 실패 날짜는 ok 기록이 없어 다음 실행이 다시 고른다(catch-up 10일).
    request(server 요청 변환) — 업로드 · 메타 · 통독 실패 종목이 있으면 종료 1(그 종목은 failed 로 닫힌다).
    종료 0(알림 아님) — NO_RECORDS · NOT_UPLOADED · NO_OBJECTS · 시간 예산으로 미룬 날짜(`deferred=n`).
    사유 확인: `gcloud logging read 'resource.labels.job_name="gh-radar-tick-convert" AND jsonPayload.msg:"tick-convert"' --limit 50`
    실행 기록: Supabase `tick_convert_runs`(date · exchange · mode · ok · error) — 같은 날짜가 매일 실패하면 원본(gs://gh-trade-tick-archive/raw/<krx|nxt>/<D>/)을 확인한다.
    수동 재실행: `bash scripts/smoke-tick-convert.sh <YYYYMMDD>`
  mimeType: text/markdown
conditions:
  - displayName: tick-convert failed execution count > 0
    conditionThreshold:
      filter: |
        resource.type = "cloud_run_job"
        AND resource.labels.job_name = "gh-radar-tick-convert"
        AND metric.type = "run.googleapis.com/job/completed_execution_count"
        AND metric.labels.result = "failed"
      comparison: COMPARISON_GT
      thresholdValue: 0
      duration: 0s
      aggregations:
        - alignmentPeriod: 300s
          perSeriesAligner: ALIGN_SUM
combiner: OR
enabled: true
notificationChannels:
  - "${NOTIFICATION_CHANNEL_ID}"
alertStrategy:
  autoClose: 1800s
