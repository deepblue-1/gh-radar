displayName: gh-radar-intraday-sync-failure
documentation:
  content: |
    Cloud Run Job `gh-radar-intraday-sync` 의 실행 실패를 감지.
    DATA-02 (Phase 09.1) — 10분 윈도우 실패 3건 이상 시 알림 (quick 261016-miy — 매분 잡이라 단발 실패는 자가 회복).
    원인 추정: 60s task timeout (가장 흔함 — 매분 잡이라 단발 실패는 다음 분에 자가 회복) / 키움 401 (token/credential) / 429 (rate limit) / MIN_EXPECTED 가드 위반 / Supabase 장애.
  mimeType: text/markdown
conditions:
  - displayName: intraday-sync failed executions >= 3 in 10m
    conditionThreshold:
      filter: |
        resource.type = "cloud_run_job"
        AND resource.labels.job_name = "gh-radar-intraday-sync"
        AND metric.type = "run.googleapis.com/job/completed_execution_count"
        AND metric.labels.result = "failed"
      comparison: COMPARISON_GT
      thresholdValue: 2
      duration: 0s
      aggregations:
        - alignmentPeriod: 600s
          perSeriesAligner: ALIGN_SUM
combiner: OR
enabled: true
notificationChannels:
  - "${NOTIFICATION_CHANNEL_ID}"
alertStrategy:
  autoClose: 1800s
