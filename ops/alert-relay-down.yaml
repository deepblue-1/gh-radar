displayName: gh-radar-relay-down
documentation:
  content: |
    DMA relay(`https://dma.jx1.io/healthz`) 가 응답하지 않는다.
    RELAY-03 (Phase 15) — uptime check `gh-radar-relay-healthz` 의 5분 성공률이 **0.9 미만**이면 알림.

    **relay 가 죽으면 호가창·주문 경로가 통째로 멈춘다.** 장중이면 즉시 대응한다.

    ## 먼저 한 줄로 범위를 좁힌다

    ```
    curl -s -w '\n%{http_code}\n' https://dma.jx1.io/healthz
    ```

    | 결과 | 의미 | 아래 어디로 |
    |---|---|---|
    | 응답 없음 / 연결 실패 | TLS 관문(Caddy)·DNS·방화벽·VM | 1, 5, 6 |
    | 503 `{"vpn":false}` | **회선(VPN) 단절** | 2 |
    | 503 `{"vpn":true,"dma":false}` | 회선은 정상, 게이트웨이/세션 문제 | 3, 7 |
    | 200 `{"status":"ok"}` | 이미 복구됨 (일시적 실패) | 아래 "오탐" 참조 |

    `vpn` 은 **회선 실측**이다 (2026-09-06 변경). 게이트웨이와 같은 사내망 대역(10.41.0.0/16)의
    주소를 가진 인터페이스가 있는지를 본다 — 접속자가 0명이어도 VPN 단절을 즉시 잡는다.
    KB 사내망으로 프로브를 보내지 않으므로(D-27) 이 값은 로컬 사실만 반영한다.

    ## 원인 추정

    1. **Caddy(TLS 관문) 정지** — 443 이 안 열려 healthz 자체가 응답하지 않는다.
       `systemctl is-active caddy; systemctl is-enabled caddy` / `journalctl -u caddy -n 50`.
       복구는 `sudo systemctl enable --now caddy`.
       ⚠️ **2026-09-06 실장애 원인 1순위였다.** `startup.sh` 의 `systemctl disable --now caddy`
       (최초 부팅 시 DNS 확인 전 기동 방지 — ACME rate limit, T-15-13)가, 메타데이터 갱신 후
       `google_metadata_script_runner startup` 재실행 때 살아 있던 관문을 껐다. 지금은
       "이미 active/enabled 면 건드리지 않는다" 가드가 있지만, **옛 스크립트가 담긴
       메타데이터로 재실행하면 같은 일이 다시 난다** — 재실행 전 `infra/relay/startup.sh` 를
       먼저 올렸는지 확인할 것.

    2. **VPN 터널 단절** — healthz 가 `{"vpn":false}`.
       `systemctl is-active openconnect@kb` / `journalctl -u openconnect@kb -n 50` / `ip -br addr`.
       - `openconnect@kb` 는 **자동 기동 등록됨**(enabled)이고, `kbvpn-watchdog.timer` 가
         10분마다 "active 가 아니면 켠다". 즉 대부분 사람 손 없이 10분 안에 복구된다.
       - 그래도 안 올라오면 워치독의 **시간당 1회 제한**(`/run/kbvpn-watchdog.last`)이나
         유닛의 `StartLimitBurst=5/1h` 에 걸린 것이다. **두 제한은 KB 계정 잠금을 막는 장치이니
         풀지 말 것.** 강제로 올리려면 `systemctl reset-failed openconnect@kb && systemctl start openconnect@kb`
         를 **1회만** 하고 로그로 원인을 먼저 확인한다.
       - `journalctl -t kbvpn-watchdog` 로 워치독이 무엇을 했는지 본다.
       - 인증 만료: 세션 인증은 발급 시점 기준 약 2주다(`Session authentication will expire at ...`).

    3. **KB 게이트웨이 다운 / 로그인 거부** — healthz 가 `{"vpn":true,"dma":false}`.
       터널은 살아 있는데 `10.41.1.120:9100` 이 거부하거나 세션이 Ready 로 못 간다.
       VM 에서 `timeout 5 bash -c 'cat < /dev/null > /dev/tcp/10.41.1.120/9100'` 로 도달성만 본다.
       relay 로그의 `session_rejected` 는 **자격증명·계좌 권한 문제**이며 자동 재시도하지 않는다
       (재시도하면 KB 계정이 잠긴다 — T-15-10). 사람이 원인을 고쳐야 복구된다.

    4. **relay 가 잘못된 주소를 보고 있음** — 로그에 `connect ECONNREFUSED 127.0.0.1:9100`.
       배포 때 `DMA_HOST` 를 빠뜨리면 스크립트 기본값(로컬 mock)으로 뜬다.
       `sudo docker inspect gh-radar-relay --format '{{range .Config.Env}}{{println .}}{{end}}' | grep DMA_HOST`.
       실서버로 다시: `DMA_HOST=10.41.1.120 bash scripts/deploy-relay.sh`.
       (배포 요약이 실제 컨테이너 값을 출력하고 mock 이면 경고한다 — 2026-09-06 추가.)

    5. **컨테이너 OOM** — e2-micro 는 1GB 다. `--memory` 상한 덕에 컨테이너만 죽고 재시작되지만
       재시작 루프면 압박이다. `dmesg | grep -i oom` / `docker stats --no-stream`.
       합계가 700MB 를 상시 넘으면 e2-small 로 머신타입 변경 (D-07 허용).

    6. **Caddy 인증서 만료** — uptime check 가 `validate-ssl` 이라 인증서 문제도 여기서 잡힌다.
       `journalctl -u caddy -n 50`. 챌린지는 TLS-ALPN-01 고정이며 포트 80 은 영구 차단이다.

    7. **VM 재부팅** — `radar-gw` 상태 확인. 컨테이너는 재시작 정책으로, VPN·Caddy·워치독은
       전부 `enabled` 라 자동으로 돌아온다(2026-09-06 이후). 안 돌아오면 그 자체가 이상 신호다.

    검증: `bash scripts/smoke-relay.sh` → 실패 항목이 위 어디인지 지목한다.

    ## 임계값과 오탐

    임계값은 **0.9** 다 (2026-09-06 에 1.0 에서 낮춤). 1.0 은 "검사 1건이라도 실패하면" 이라
    지점 한 곳의 순간 실패까지 전부 울렸고, 수십 초 만에 자동 해제되는 발생/해제 쌍이
    반복돼 알림 피로가 쌓였다. 실측 분포가 그 둘을 뚜렷이 가른다:

    | 성공률 | 정체 |
    |---|---|
    | 0.983 ~ 0.994 | 검사 지점 1~2곳의 순간 실패 — **오탐** |
    | 0.045 | 전 지점 실패 — 전면 장애 |

    대가: **한 지점에서만 지속 실패하는 상황은 이제 안 울린다.** 대개 그 지점 쪽 네트워크
    문제이지 우리 서비스 장애가 아니라 감수한 것이다. 특정 지역에서만 접속이 안 된다는
    제보가 오면 Cloud Monitoring 의 uptime check 상세에서 지점별 결과를 직접 본다.

    ## 설계 메모

    relay `/healthz` 는 **degraded 를 HTTP 503 으로 내린다** (RESEARCH A7). 200 으로 내리면서
    본문에만 degraded 를 적으면 uptime check 는 본문을 보지 않으므로 컨테이너가 살아 있는 채
    게이트웨이만 죽은 상태가 영원히 감지되지 않는다.

    relay 의 게이트웨이 재접속에는 **시도 상한이 없다** (2026-09-06, D-16 완화).
    1→2→4→8→16→30초 뒤 30초 간격으로 계속 시도하므로, VPN 이 몇 시간 뒤에 돌아와도
    relay 는 스스로 복구된다. 10회를 넘기면 로그가 `error` 로 승격된다.
  mimeType: text/markdown
conditions:
  - displayName: relay uptime check failing
    conditionThreshold:
      filter: |
        metric.type = "monitoring.googleapis.com/uptime_check/check_passed"
        AND resource.type = "uptime_url"
        AND resource.label.host = "dma.jx1.io"
      comparison: COMPARISON_LT
      # 1.0 → 0.9 (2026-09-06). 1.0 은 "검사 1건이라도 실패하면" 이라 지점 한 곳의 순간
      # 실패까지 전부 울렸다. 실측 분포가 뚜렷하다: 오탐 0.983~0.994 / 실장애 0.045.
      # 0.9 는 그 사이를 가른다 — 노이즈는 죽고 전면 장애는 그대로 잡힌다.
      thresholdValue: 0.9
      duration: 300s
      aggregations:
        - alignmentPeriod: 300s
          perSeriesAligner: ALIGN_FRACTION_TRUE
          crossSeriesReducer: REDUCE_MEAN
          groupByFields:
            - resource.label.host
combiner: OR
enabled: true
notificationChannels:
  - "${NOTIFICATION_CHANNEL_ID}"
alertStrategy:
  autoClose: 1800s
